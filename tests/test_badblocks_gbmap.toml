# Test persistent bad-block tracking in the gbmap
#
# Bad blocks are recorded as BMBAD ranges in the gbmap, so these only run
# with LFS3_GBMAP. These are internal tests so they can look at the gbmap
# directly.
after = [
    'test_gbmap',
    'test_badblocks',
]
ifdef = 'LFS3_GBMAP'
in = 'lfs3.c'

defines.FORMAT_BLOCK_COUNT = 3

code = '''
// count erase and prog attempts per block, emubd's wear doesn't count
// failed erases or progs
#define TEST_BBG_MAX 4096

static uint32_t test_bbg_erases[TEST_BBG_MAX];
static uint32_t test_bbg_progs[TEST_BBG_MAX];

// also count erases after a block first fails
static bool test_bbg_failed[TEST_BBG_MAX];
static uint32_t test_bbg_afters[TEST_BBG_MAX];

// with a filesystem to watch, also count erases and progs of blocks
// littlefs already knows are bad, these should never happen
static lfs3_t *test_bbg_lfs3 = NULL;
static bool test_bbg_known[TEST_BBG_MAX];
static uint32_t test_bbg_retries;

static void test_bbg_learn(void) {
    if (test_bbg_lfs3) {
        for (lfs3_size_t i = 0; i < test_bbg_lfs3->gbmap.badq.count; i++) {
            test_bbg_known[test_bbg_lfs3->gbmap.badq.blocks[i]] = true;
        }
    }
}

static int test_bbg_prog(const struct lfs3_cfg *cfg, lfs3_block_t block,
        lfs3_off_t off, const void *buffer, lfs3_size_t size) {
    test_bbg_learn();
    test_bbg_retries += test_bbg_known[block];
    test_bbg_progs[block] += 1;
    int err = lfs3_emubd_prog(cfg, block, off, buffer, size);
    if (err == LFS3_ERR_CORRUPT) {
        test_bbg_failed[block] = true;
    }
    return err;
}

static int test_bbg_erase(const struct lfs3_cfg *cfg, lfs3_block_t block) {
    test_bbg_learn();
    test_bbg_retries += test_bbg_known[block];
    test_bbg_erases[block] += 1;
    test_bbg_afters[block] += test_bbg_failed[block];
    int err = lfs3_emubd_erase(cfg, block);
    if (err == LFS3_ERR_CORRUPT) {
        test_bbg_failed[block] = true;
    }
    return err;
}

// copy a config, counting erases and progs from now on
static void test_bbg_wrap(struct lfs3_cfg *cfg, const struct lfs3_cfg *cfg_) {
    assert(cfg_->block_count <= TEST_BBG_MAX);
    *cfg = *cfg_;
    cfg->prog = test_bbg_prog;
    cfg->erase = test_bbg_erase;
    memset(test_bbg_erases, 0, sizeof(test_bbg_erases));
    memset(test_bbg_progs, 0, sizeof(test_bbg_progs));
    test_bbg_lfs3 = NULL;
    memset(test_bbg_known, 0, sizeof(test_bbg_known));
    test_bbg_retries = 0;
    memset(test_bbg_failed, 0, sizeof(test_bbg_failed));
    memset(test_bbg_afters, 0, sizeof(test_bbg_afters));
}

// is this block marked bad in the gbmap?
static bool test_bbg_isbad(lfs3_t *lfs3, lfs3_block_t block) {
    lfs3_stag_t tag = lfs3_gbmap_lookupnext(lfs3, &lfs3->gbmap.b, block,
            NULL, NULL, NULL);
    assert(tag >= 0);
    return tag == LFS3_TAG_BMBAD;
}

// find which blocks the filesystem uses
static void test_bbg_inuse(lfs3_t *lfs3, bool *inuse) {
    memset(inuse, 0, lfs3->block_count);
    lfs3_trv_t trv;
    int err = lfs3_trv_open(lfs3, &trv, LFS3_T_RDONLY);
    assert(!err);
    while (true) {
        struct lfs3_tinfo tinfo;
        err = lfs3_trv_read(lfs3, &trv, &tinfo);
        assert(!err || err == LFS3_ERR_NOENT);
        if (err == LFS3_ERR_NOENT) {
            break;
        }
        inuse[tinfo.block] = true;
    }
    err = lfs3_trv_close(lfs3, &trv);
    assert(!err);
}

// count the blocks a traversal finds, the same way lfs3_fs_usage does
static lfs3_block_t test_bbg_trvcount(lfs3_t *lfs3) {
    lfs3_block_t count = 0;
    lfs3_trv_t trv;
    int err = lfs3_trv_open(lfs3, &trv, LFS3_T_RDONLY);
    assert(!err);
    while (true) {
        struct lfs3_tinfo tinfo;
        err = lfs3_trv_read(lfs3, &trv, &tinfo);
        assert(!err || err == LFS3_ERR_NOENT);
        if (err == LFS3_ERR_NOENT) {
            break;
        }
        count += 1;
    }
    err = lfs3_trv_close(lfs3, &trv);
    assert(!err);
    return count;
}

// start watching a mounted filesystem, only marks on disk survive a
// remount
static void test_bbg_watch(lfs3_t *lfs3) {
    for (lfs3_block_t b = 0; b < lfs3->block_count; b++) {
        test_bbg_known[b] = test_bbg_isbad(lfs3, b);
    }
    test_bbg_lfs3 = lfs3;
}

static void test_bbg_unwatch(void) {
    test_bbg_lfs3 = NULL;
}

// no block marked bad should be in use
static void test_bbg_ckinuse(lfs3_t *lfs3) {
    bool *inuse = malloc(lfs3->block_count);
    test_bbg_inuse(lfs3, inuse);
    for (lfs3_block_t b = 0; b < lfs3->block_count; b++) {
        assert(!(inuse[b] && test_bbg_isbad(lfs3, b)));
    }
    free(inuse);
}

// mark any pending bad blocks and write the gbmap to disk
static void test_bbg_sync(lfs3_t *lfs3) {
    int err = lfs3_alloc_ckpoint(lfs3);
    assert(!err);
    err = lfs3_alloc_syncgbmap(lfs3);
    assert(!err);
}

// mark a block bad the way a driver that records bad blocks would
static void test_bbg_setbad(lfs3_t *lfs3, lfs3_block_t block) {
    int err = lfs3_alloc_ckpoint(lfs3);
    assert(!err);
    err = lfs3_gbmap_set(lfs3, &lfs3->gbmap.b, block, LFS3_TAG_BMBAD, NULL);
    assert(!err);
    lfs3->gbmap.next = 0;
}

// write a file of pseudo-random data
static void test_bbg_write(lfs3_t *lfs3, const char *name,
        uint32_t seed, lfs3_size_t size) {
    lfs3_file_t file;
    int err = lfs3_file_open(lfs3, &file, name,
            LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_TRUNC);
    assert(!err);
    uint32_t prng = seed;
    for (lfs3_size_t i = 0; i < size; i += 64) {
        uint8_t buf[64];
        lfs3_size_t d = lfs3_min(64, size - i);
        for (lfs3_size_t j = 0; j < d; j++) {
            buf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_ssize_t d_ = lfs3_file_write(lfs3, &file, buf, d);
        assert(d_ == (lfs3_ssize_t)d);
    }
    err = lfs3_file_close(lfs3, &file);
    assert(!err);
}

// make a file's data block go bad while we append to it, this leaves
// a bad block we can't mark until it's released
static lfs3_block_t test_bbg_badappend(lfs3_t *lfs3,
        const struct lfs3_cfg *cfg, const char *name,
        const uint8_t *buf, lfs3_size_t size) {
    lfs3_file_t file;
    int err = lfs3_file_open(lfs3, &file, name,
            LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL);
    assert(!err);
    lfs3_ssize_t d = lfs3_file_write(lfs3, &file, buf, size);
    assert(d == (lfs3_ssize_t)size);
    err = lfs3_file_sync(lfs3, &file);
    assert(!err);

    lfs3_bid_t bid;
    lfs3_bid_t weight;
    lfs3_bptr_t bptr;
    err = lfs3_file_lookupnext(lfs3, &file, size-1,
            &bid, &weight, &bptr);
    assert(!err);
    assert(lfs3_bptr_isbptr(&bptr));
    lfs3_block_t block = lfs3_bptr_block(&bptr);
    err = lfs3_emubd_mkbad(cfg, block);
    assert(!err);

    // this appends to our bad block
    d = lfs3_file_write(lfs3, &file, buf, 64);
    assert(d == 64);
    err = lfs3_file_close(lfs3, &file);
    assert(!err);
    return block;
}

// a simple model, each file is a prefix of a pseudo-random stream
#define TEST_BBG_FILES 64

typedef struct test_bbg_sim {
    uint32_t seeds[TEST_BBG_FILES];
    lfs3_size_t sizes[TEST_BBG_FILES];
    bool exists[TEST_BBG_FILES];
} test_bbg_sim_t;

// append to a file, continuing its stream
static void test_bbg_append(lfs3_t *lfs3, const char *name,
        uint32_t seed, lfs3_size_t off, lfs3_size_t size) {
    lfs3_file_t file;
    int err = lfs3_file_open(lfs3, &file, name,
            LFS3_O_WRONLY | LFS3_O_APPEND);
    assert(!err);
    uint32_t prng = seed;
    for (lfs3_size_t i = 0; i < off; i++) {
        TEST_PRNG(&prng);
    }
    for (lfs3_size_t i = 0; i < size; i += 64) {
        uint8_t buf[64];
        lfs3_size_t d = lfs3_min(64, size - i);
        for (lfs3_size_t j = 0; j < d; j++) {
            buf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_ssize_t d_ = lfs3_file_write(lfs3, &file, buf, d);
        assert(d_ == (lfs3_ssize_t)d);
    }
    err = lfs3_file_close(lfs3, &file);
    assert(!err);
}

// check a file of pseudo-random data
static void test_bbg_read(lfs3_t *lfs3, const char *name,
        uint32_t seed, lfs3_size_t size) {
    lfs3_file_t file;
    int err = lfs3_file_open(lfs3, &file, name, LFS3_O_RDONLY);
    assert(!err);
    assert(lfs3_file_size(lfs3, &file) == (lfs3_soff_t)size);
    uint32_t prng = seed;
    for (lfs3_size_t i = 0; i < size; i += 64) {
        uint8_t buf[64];
        lfs3_size_t d = lfs3_min(64, size - i);
        lfs3_ssize_t d_ = lfs3_file_read(lfs3, &file, buf, d);
        assert(d_ == (lfs3_ssize_t)d);
        for (lfs3_size_t j = 0; j < d; j++) {
            assert(buf[j] == 'a' + (TEST_PRNG(&prng) % 26));
        }
    }
    err = lfs3_file_close(lfs3, &file);
    assert(!err);
}

// plan the next step of a workload, updating the model
enum test_bbg_kind {
    TEST_BBG_WRITE,
    TEST_BBG_APPEND,
    TEST_BBG_REMOVE,
};

typedef struct test_bbg_op {
    int kind;
    lfs3_size_t x;
    uint32_t seed;
    lfs3_size_t off;
    lfs3_size_t size;
} test_bbg_op_t;

static test_bbg_op_t test_bbg_plan(uint32_t *prng, test_bbg_sim_t *sim,
        lfs3_size_t n, lfs3_size_t size) {
    assert(n <= TEST_BBG_FILES);
    test_bbg_op_t op;
    uint32_t r = TEST_PRNG(prng) % 4;
    op.x = TEST_PRNG(prng) % n;
    op.seed = TEST_PRNG(prng);
    // append to existing files, but not forever
    op.kind = (r == 2) ? TEST_BBG_REMOVE
            : (r == 3
                    && sim->exists[op.x]
                    && sim->sizes[op.x] < 4*size)
                ? TEST_BBG_APPEND
                : TEST_BBG_WRITE;

    if (op.kind == TEST_BBG_WRITE) {
        op.off = 0;
        op.size = size;
        sim->seeds[op.x] = op.seed;
        sim->sizes[op.x] = size;
        sim->exists[op.x] = true;
    } else if (op.kind == TEST_BBG_APPEND) {
        op.seed = sim->seeds[op.x];
        op.off = sim->sizes[op.x];
        op.size = lfs3_max(size/4, 1);
        sim->sizes[op.x] += op.size;
    } else {
        sim->exists[op.x] = false;
    }
    return op;
}

static void test_bbg_apply(lfs3_t *lfs3, const test_bbg_op_t *op) {
    char name[256];
    sprintf(name, "f%03x", (unsigned)op->x);
    if (op->kind == TEST_BBG_WRITE) {
        test_bbg_write(lfs3, name, op->seed, op->size);
    } else if (op->kind == TEST_BBG_APPEND) {
        test_bbg_append(lfs3, name, op->seed, op->off, op->size);
    } else {
        int err = lfs3_remove(lfs3, name);
        assert(!err || err == LFS3_ERR_NOENT);
    }
}

// does a file match a pseudo-random stream?
static bool test_bbg_cmp(lfs3_t *lfs3, const char *name,
        uint32_t seed, lfs3_size_t size) {
    lfs3_file_t file;
    int err = lfs3_file_open(lfs3, &file, name, LFS3_O_RDONLY);
    assert(!err);
    uint32_t prng = seed;
    bool eq = true;
    for (lfs3_size_t i = 0; i < size; i += 64) {
        uint8_t buf[64];
        lfs3_size_t d = lfs3_min(64, size - i);
        lfs3_ssize_t d_ = lfs3_file_read(lfs3, &file, buf, d);
        assert(d_ == (lfs3_ssize_t)d);
        for (lfs3_size_t j = 0; j < d; j++) {
            eq &= (buf[j] == 'a' + (TEST_PRNG(&prng) % 26));
        }
    }
    err = lfs3_file_close(lfs3, &file);
    assert(!err);
    return eq;
}

// does the disk match our model? asserts on anything that isn't a
// mismatch
static bool test_bbg_ck(lfs3_t *lfs3, const test_bbg_sim_t *sim,
        lfs3_size_t n) {
    for (lfs3_size_t x = 0; x < n; x++) {
        char name[256];
        sprintf(name, "f%03x", (unsigned)x);
        struct lfs3_info info;
        int err = lfs3_stat(lfs3, name, &info);
        assert(!err || err == LFS3_ERR_NOENT);
        if (sim->exists[x] != !err) {
            return false;
        }
        if (err) {
            continue;
        }
        if (info.size != sim->sizes[x]
                || !test_bbg_cmp(lfs3, name,
                    sim->seeds[x], sim->sizes[x])) {
            return false;
        }
    }

    return true;
}
'''


## Reading bad blocks

# test that the allocator never hands out a block marked bad, from the
# gbmap or from the lookahead buffer
[cases.test_badblocks_gbmap_alloc_skip]
# LOOKAHEAD=false => allocate from the gbmap
# LOOKAHEAD=true  => allocate from the lookahead buffer
defines.LOOKAHEAD = [false, true]
defines.LOOKAHEAD_SIZE = [1, 16]
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR | LFS3_F_GBMAP, CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    // mark a lone block, a run of blocks, and the last block bad
    bool *inuse = malloc(BLOCK_COUNT);
    bool *bad = calloc(BLOCK_COUNT, 1);
    test_bbg_inuse(&lfs3, inuse);
    lfs3_block_t marks[] = {
        BLOCK_COUNT/4,
        BLOCK_COUNT/2, BLOCK_COUNT/2+1, BLOCK_COUNT/2+2,
        BLOCK_COUNT-1,
    };
    for (lfs3_size_t i = 0; i < sizeof(marks)/sizeof(marks[0]); i++) {
        assert(!inuse[marks[i]]);
        test_bbg_setbad(&lfs3, marks[i]);
        bad[marks[i]] = true;
    }
    lfs3_alloc_syncgbmap(&lfs3) => 0;

    // remount so the marks come from disk
    lfs3_unmount(&lfs3) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
    for (lfs3_block_t b = 0; b < BLOCK_COUNT; b++) {
        assert(test_bbg_isbad(&lfs3, b) == bad[b]);
    }

    // allocate until we run out of blocks
    lfs3_alloc_ckpoint(&lfs3) => 0;
    test_bbg_inuse(&lfs3, inuse);
    if (LOOKAHEAD) {
        lfs3.gbmap.known = 0;
        lfs3.gbmap.next = 0;
    }
    bool *seen = calloc(BLOCK_COUNT, 1);
    lfs3_block_t count = 0;
    while (true) {
        lfs3_sblock_t block = lfs3_alloc(&lfs3, 0);
        assert(block >= 0 || block == LFS3_ERR_NOSPC);
        if (block == LFS3_ERR_NOSPC) {
            break;
        }

        // never a bad block, and never twice
        assert(!bad[block]);
        assert(!seen[block]);
        assert(!inuse[block]);
        seen[block] = true;
        count += 1;
    }

    // the lookahead buffer should find every free block
    lfs3_block_t nfree = 0;
    for (lfs3_block_t b = 0; b < BLOCK_COUNT; b++) {
        nfree += !inuse[b] && !bad[b];
    }
    assert(count <= nfree);
    assert(!LOOKAHEAD || count == nfree);

    free(inuse);
    free(bad);
    free(seen);
    lfs3_unmount(&lfs3) => 0;
'''

# test that blocks marked bad are never erased or programmed by a normal
# workload, that the marks survive repopulation and remounts, and that
# lfs3_fs_usage counts them
[cases.test_badblocks_gbmap_reading]
defines.LOOKGBMAP_THRESH = ['0', 'BLOCK_COUNT/4']
defines.LOOKAHEAD_SIZE = [1, 16]
defines.N = 8
defines.SIZE = '2*BLOCK_SIZE'
defines.CYCLES = 32
code = '''
    struct lfs3_cfg cfg;
    test_bbg_wrap(&cfg, CFG);

    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR | LFS3_F_GBMAP, &cfg) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;
    lfs3_block_t usage = lfs3_fs_usage(&lfs3);

    // mark every 7th free block bad
    bool *inuse = malloc(BLOCK_COUNT);
    bool *bad = calloc(BLOCK_COUNT, 1);
    test_bbg_inuse(&lfs3, inuse);
    lfs3_block_t nbad = 0;
    for (lfs3_block_t b = BLOCK_COUNT/8; b < BLOCK_COUNT; b += 7) {
        if (!inuse[b]) {
            test_bbg_setbad(&lfs3, b);
            bad[b] = true;
            nbad += 1;
        }
    }
    lfs3_alloc_syncgbmap(&lfs3) => 0;
    lfs3_unmount(&lfs3) => 0;

    // write and rewrite files, this wraps the allocator around the disk
    // a couple times
    memset(test_bbg_erases, 0, sizeof(test_bbg_erases));
    memset(test_bbg_progs, 0, sizeof(test_bbg_progs));
    for (lfs3_size_t c = 0; c < CYCLES; c++) {
        lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;
        for (lfs3_size_t i = 0; i < N; i++) {
            char name[256];
            sprintf(name, "file%03d", i);
            test_bbg_write(&lfs3, name, c*N + i, SIZE);
        }
        for (lfs3_size_t i = 0; i < N; i++) {
            char name[256];
            sprintf(name, "file%03d", i);
            test_bbg_read(&lfs3, name, c*N + i, SIZE);
        }

        // marks should be unchanged
        for (lfs3_block_t b = 0; b < BLOCK_COUNT; b++) {
            assert(test_bbg_isbad(&lfs3, b) == bad[b]);
        }

        // and lfs3_fs_usage should count them
        assert(lfs3_fs_usage(&lfs3)
                == (lfs3_sblock_t)(test_bbg_trvcount(&lfs3) + nbad));
        lfs3_unmount(&lfs3) => 0;
    }

    // we should have written to most blocks, but never a bad one
    lfs3_block_t written = 0;
    for (lfs3_block_t b = 0; b < BLOCK_COUNT; b++) {
        if (bad[b]) {
            assert(test_bbg_erases[b] == 0);
            assert(test_bbg_progs[b] == 0);
        } else {
            written += (test_bbg_erases[b] > 0);
        }
    }
    assert(written >= (BLOCK_COUNT - nbad) / 2);

    // a read-only mount should be happy with the marks, and not write
    memset(test_bbg_erases, 0, sizeof(test_bbg_erases));
    memset(test_bbg_progs, 0, sizeof(test_bbg_progs));
    lfs3_mount(&lfs3, LFS3_M_RDONLY, &cfg) => 0;
    for (lfs3_size_t i = 0; i < N; i++) {
        char name[256];
        sprintf(name, "file%03d", i);
        test_bbg_read(&lfs3, name, (CYCLES-1)*N + i, SIZE);
    }
    lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
    assert(lfs3_fs_usage(&lfs3)
            == (lfs3_sblock_t)(test_bbg_trvcount(&lfs3) + nbad));
    assert(lfs3_fs_usage(&lfs3) > (lfs3_sblock_t)(usage + nbad));
    lfs3_unmount(&lfs3) => 0;
    for (lfs3_block_t b = 0; b < BLOCK_COUNT; b++) {
        assert(test_bbg_erases[b] == 0);
        assert(test_bbg_progs[b] == 0);
    }

    free(inuse);
    free(bad);
'''

# test that a block marked bad while still in use keeps its mark when we
# repopulate the gbmap, and is never reused once released
[cases.test_badblocks_gbmap_reading_inuse]
# GC=false => repopulate in lfs3_alloc_ckpoint
# GC=true  => repopulate incrementally in lfs3_fs_gc
defines.GC = [false, true]
defines.GC_FLAGS = 'LFS3_GC_LOOKAHEAD'
defines.GC_STEPS = -1
defines.SIZE = 'BLOCK_SIZE'
if = 'LFS3_IFDEF_GC(true, !GC)'
code = '''
    struct lfs3_cfg cfg;
    test_bbg_wrap(&cfg, CFG);

    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR | LFS3_F_GBMAP, &cfg) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;

    // write a file, and mark its data block bad
    test_bbg_write(&lfs3, "spider", 42, SIZE);
    lfs3_trv_t trv;
    lfs3_trv_open(&lfs3, &trv, LFS3_T_RDONLY) => 0;
    lfs3_block_t block = -1;
    while (true) {
        struct lfs3_tinfo tinfo;
        int err = lfs3_trv_read(&lfs3, &trv, &tinfo);
        assert(!err || err == LFS3_ERR_NOENT);
        if (err == LFS3_ERR_NOENT) {
            break;
        }
        if (tinfo.btype == LFS3_BTYPE_DATA) {
            block = tinfo.block;
        }
    }
    lfs3_trv_close(&lfs3, &trv) => 0;
    assert(block != (lfs3_block_t)-1);
    test_bbg_setbad(&lfs3, block);
    lfs3_alloc_syncgbmap(&lfs3) => 0;

    // repopulate the gbmap, this finds the block in use, but should
    // keep the mark
    for (int i = 0; i < 2; i++) {
        // shrink the known window to force a repopulation, gc prefers
        // the lookahead buffer if the gbmap is nearly empty
        lfs3.gbmap.known = (GC) ? BLOCK_COUNT/2 : 0;
        lfs3.gbmap.next = 0;
        if (GC) {
            #ifdef LFS3_GC
            lfs3_fs_unck(&lfs3, LFS3_GC_LOOKAHEAD) => 0;
            lfs3_fs_gc(&lfs3) => 0;
            #endif
        } else {
            lfs3_alloc_ckpoint(&lfs3) => 0;
        }
        assert(lfs3.gbmap.known > BLOCK_COUNT/2);
        assert(test_bbg_isbad(&lfs3, block));
        lfs3_alloc_syncgbmap(&lfs3) => 0;
    }

    // the data should still be readable
    test_bbg_read(&lfs3, "spider", 42, SIZE);

    // release the block, and write enough to wrap around the disk
    lfs3_remove(&lfs3, "spider") => 0;
    memset(test_bbg_erases, 0, sizeof(test_bbg_erases));
    memset(test_bbg_progs, 0, sizeof(test_bbg_progs));
    for (lfs3_size_t c = 0; c < 4; c++) {
        for (lfs3_size_t i = 0; i < 8; i++) {
            char name[256];
            sprintf(name, "file%03d", i);
            test_bbg_write(&lfs3, name, c*8 + i, 2*BLOCK_SIZE);
        }
        lfs3_unmount(&lfs3) => 0;
        lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;
    }

    // still bad, and never touched
    assert(test_bbg_isbad(&lfs3, block));
    assert(test_bbg_erases[block] == 0);
    assert(test_bbg_progs[block] == 0);
    lfs3_unmount(&lfs3) => 0;
'''


## Recording bad blocks

# test that blocks that fail an erase or prog are marked bad, and are
# never erased or programmed again, in this mount or after a remount
[cases.test_badblocks_gbmap_recording]
# MANUAL blocks never fail on their own, so nothing should be marked
defines.BADBLOCK_BEHAVIOR = [
    'LFS3_EMUBD_BADBLOCK_PROGERROR',
    'LFS3_EMUBD_BADBLOCK_ERASEERROR',
    'LFS3_EMUBD_BADBLOCK_READERROR',
    'LFS3_EMUBD_BADBLOCK_PROGNOOP',
    'LFS3_EMUBD_BADBLOCK_ERASENOOP',
    'LFS3_EMUBD_BADBLOCK_PROGFLIP',
    'LFS3_EMUBD_BADBLOCK_MANUAL',
]
# we need prog checking to detect read errors and silent errors
defines.CKPROGS = 'BADBLOCK_BEHAVIOR >= LFS3_EMUBD_BADBLOCK_READERROR'
# INUSE=false => blocks go bad before we use them
# INUSE=true  => blocks go bad while in use
defines.INUSE = [false, true]
defines.BADBLOCKS = [1, 3]
defines.N = 16
defines.SIZE = ['BLOCK_SIZE/2', '2*BLOCK_SIZE']
defines.STEPS = 512
defines.SEED = 'range(2)'
if = [
    'LFS3_IFDEF_CKPROGS(true, !CKPROGS)',
    # a live block that can't be read is a different test
    '!INUSE || BADBLOCK_BEHAVIOR != LFS3_EMUBD_BADBLOCK_READERROR',
]
code = '''
    struct lfs3_cfg cfg;
    test_bbg_wrap(&cfg, CFG);
    uint32_t flags = (CKPROGS) ? LFS3_IFDEF_CKPROGS(LFS3_M_CKPROGS, -1) : 0;

    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR | LFS3_F_GBMAP | flags, &cfg) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR | flags, &cfg) => 0;
    test_bbg_watch(&lfs3);

    bool *bad = calloc(BLOCK_COUNT, 1);
    bool *inuse = malloc(BLOCK_COUNT);
    bool *marked = malloc(BLOCK_COUNT);
    uint32_t *erases = calloc(BLOCK_COUNT, sizeof(uint32_t));
    uint32_t *progs = calloc(BLOCK_COUNT, sizeof(uint32_t));

    // pick some free blocks to go bad, spread over the disk
    uint32_t prng = SEED;
    if (!INUSE) {
        test_bbg_inuse(&lfs3, inuse);
        for (lfs3_size_t i = 0; i < BADBLOCKS; i++) {
            lfs3_block_t b = FORMAT_BLOCK_COUNT
                    + (TEST_PRNG(&prng) % (BLOCK_COUNT-FORMAT_BLOCK_COUNT));
            if (!inuse[b] && !bad[b]) {
                lfs3_emubd_mkbad(CFG, b) => 0;
                bad[b] = true;
            }
        }
    }

    test_bbg_sim_t sim;
    memset(&sim, 0, sizeof(sim));
    lfs3_size_t nfailed = 0;
    for (lfs3_size_t s = 0; s < STEPS; s++) {
        // pick some in-use blocks to go bad
        if (INUSE && s == STEPS/4) {
            test_bbg_inuse(&lfs3, inuse);
            for (lfs3_size_t i = 0; i < BADBLOCKS; i++) {
                lfs3_block_t b = 2 + (TEST_PRNG(&prng) % (BLOCK_COUNT-2));
                while (!inuse[b] || bad[b]) {
                    b = 2 + ((b-2 + 1) % (BLOCK_COUNT-2));
                }
                lfs3_emubd_mkbad(CFG, b) => 0;
                bad[b] = true;
            }
        }

        test_bbg_op_t op = test_bbg_plan(&prng, &sim, N, SIZE);
        test_bbg_apply(&lfs3, &op);
        test_bbg_ckinuse(&lfs3);

        // remount every now and then, only marks on disk should
        // survive this
        if (s % (STEPS/8) == STEPS/8-1) {
            assert(test_bbg_ck(&lfs3, &sim, N));

            // repopulate, so bad blocks no longer in use are marked,
            // twice since a commit may release bad blocks
            for (int i = 0; i < 2; i++) {
                lfs3.gbmap.known = 0;
                test_bbg_sync(&lfs3);
            }
            test_bbg_ckinuse(&lfs3);
            test_bbg_inuse(&lfs3, inuse);
            for (lfs3_block_t b = 0; b < BLOCK_COUNT; b++) {
                // only bad blocks should be marked bad
                assert(!test_bbg_isbad(&lfs3, b) || bad[b]);

                // any block that failed in this mount should be marked
                // bad, unless still in use, but silent errors may go
                // unnoticed
                bool failed = bad[b]
                        && ((BADBLOCK_BEHAVIOR
                                == LFS3_EMUBD_BADBLOCK_ERASEERROR)
                            ? test_bbg_erases[b] > erases[b]
                            : test_bbg_progs[b] > progs[b]);
                if (failed
                        && BADBLOCK_BEHAVIOR
                            <= LFS3_EMUBD_BADBLOCK_READERROR) {
                    assert(test_bbg_isbad(&lfs3, b) || inuse[b]);
                }
                nfailed += failed;
                marked[b] = test_bbg_isbad(&lfs3, b);
            }

            test_bbg_unwatch();
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR | flags, &cfg) => 0;
            test_bbg_watch(&lfs3);
            for (lfs3_block_t b = 0; b < BLOCK_COUNT; b++) {
                assert(test_bbg_isbad(&lfs3, b) == marked[b]);
            }
            memcpy(erases, test_bbg_erases, BLOCK_COUNT*sizeof(uint32_t));
            memcpy(progs, test_bbg_progs, BLOCK_COUNT*sizeof(uint32_t));
        }
    }

    // we should never retry a block we know is bad
    assert(test_bbg_retries == 0);
    // and we should have found some bad blocks
    assert(nfailed > 0
            || BADBLOCK_BEHAVIOR == LFS3_EMUBD_BADBLOCK_MANUAL);
    if (BADBLOCK_BEHAVIOR == LFS3_EMUBD_BADBLOCK_MANUAL) {
        for (lfs3_block_t b = 0; b < BLOCK_COUNT; b++) {
            assert(!test_bbg_isbad(&lfs3, b));
        }
    }

    assert(test_bbg_ck(&lfs3, &sim, N));
    lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
    lfs3_unmount(&lfs3) => 0;

    free(bad);
    free(inuse);
    free(marked);
    free(erases);
    free(progs);
'''


# test mdir blocks going bad while in use
#
# an mdir that can't append to its block compacts into its other block,
# so the bad block stays in use until the mdir next compacts, which
# should relocate instead of erasing the bad block again
[cases.test_badblocks_gbmap_recording_mdir]
defines.BADBLOCK_BEHAVIOR = [
    'LFS3_EMUBD_BADBLOCK_PROGERROR',
    'LFS3_EMUBD_BADBLOCK_ERASEERROR',
]
defines.N = 64
defines.SIZE = 64
defines.STEPS = 1024
defines.BADBLOCKS = [1, 3]
code = '''
    struct lfs3_cfg cfg;
    test_bbg_wrap(&cfg, CFG);

    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR | LFS3_F_GBMAP, &cfg) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;

    // create enough small files to need more than one mdir
    uint32_t seeds[N];
    for (lfs3_size_t i = 0; i < N; i++) {
        char name[256];
        sprintf(name, "a_rather_long_file_name_to_fill_mdirs_%03d", i);
        seeds[i] = i;
        test_bbg_write(&lfs3, name, seeds[i], SIZE);
    }

    // make the first block of some mdirs go bad, but not the mroot
    // anchor
    lfs3_trv_t trv;
    lfs3_trv_open(&lfs3, &trv, LFS3_T_RDONLY) => 0;
    lfs3_size_t count = 0;
    bool prev = false;
    while (count < BADBLOCKS) {
        struct lfs3_tinfo tinfo;
        int err = lfs3_trv_read(&lfs3, &trv, &tinfo);
        assert(!err || err == LFS3_ERR_NOENT);
        if (err == LFS3_ERR_NOENT) {
            break;
        }
        if (tinfo.btype == LFS3_BTYPE_MDIR && tinfo.block >= 2 && !prev) {
            lfs3_emubd_mkbad(CFG, tinfo.block) => 0;
            count += 1;
            prev = true;
        } else {
            prev = false;
        }
    }
    lfs3_trv_close(&lfs3, &trv) => 0;
    assert(count > 0);
    test_bbg_watch(&lfs3);

    // keep rewriting our files
    uint32_t prng = 42;
    for (lfs3_size_t s = 0; s < STEPS; s++) {
        lfs3_size_t i = TEST_PRNG(&prng) % N;
        char name[256];
        sprintf(name, "a_rather_long_file_name_to_fill_mdirs_%03d", i);
        seeds[i] = TEST_PRNG(&prng);
        test_bbg_write(&lfs3, name, seeds[i], SIZE);
        test_bbg_ckinuse(&lfs3);
    }

    // we should never retry a block we know is bad
    assert(test_bbg_retries == 0);

    // every block that failed should be marked, unless still in use
    for (int i = 0; i < 2; i++) {
        lfs3.gbmap.known = 0;
        test_bbg_sync(&lfs3);
    }
    bool *inuse = malloc(BLOCK_COUNT);
    test_bbg_inuse(&lfs3, inuse);
    lfs3_block_t marked = 0;
    for (lfs3_block_t b = 0; b < BLOCK_COUNT; b++) {
        if (test_bbg_failed[b]) {
            assert(test_bbg_isbad(&lfs3, b) || inuse[b]);
        }
        marked += test_bbg_isbad(&lfs3, b);
    }
    assert(marked > 0);
    free(inuse);

    test_bbg_unwatch();
    lfs3_unmount(&lfs3) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;
    for (lfs3_size_t i = 0; i < N; i++) {
        char name[256];
        sprintf(name, "a_rather_long_file_name_to_fill_mdirs_%03d", i);
        test_bbg_read(&lfs3, name, seeds[i], SIZE);
    }
    lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
    lfs3_unmount(&lfs3) => 0;
'''


## The bad-block API

# test lfs3_fs_mkbad, lfs3_fs_mkgood and lfs3_fs_nextbad
[cases.test_badblocks_gbmap_api]
defines.N = 8
defines.SIZE = '2*BLOCK_SIZE'
defines.CYCLES = 32
code = '''
    struct lfs3_cfg cfg;
    test_bbg_wrap(&cfg, CFG);

    // without a gbmap there is nowhere to put bad blocks
    lfs3_t lfs3;
    #ifndef LFS3_YES_GBMAP
    lfs3_format(&lfs3, LFS3_F_RDWR, &cfg) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;
    lfs3_fs_mkbad(&lfs3, BLOCK_COUNT/2) => LFS3_ERR_NOTSUP;
    lfs3_fs_mkgood(&lfs3, BLOCK_COUNT/2) => LFS3_ERR_NOTSUP;
    lfs3_fs_nextbad(&lfs3, 0) => LFS3_ERR_NOENT;
    lfs3_unmount(&lfs3) => 0;
    #endif

    lfs3_format(&lfs3, LFS3_F_RDWR | LFS3_F_GBMAP, &cfg) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;
    lfs3_fs_nextbad(&lfs3, 0) => LFS3_ERR_NOENT;

    // out of range and the mroot anchor can't be marked
    lfs3_fs_mkbad(&lfs3, 0) => LFS3_ERR_INVAL;
    lfs3_fs_mkbad(&lfs3, 1) => LFS3_ERR_INVAL;
    lfs3_fs_mkbad(&lfs3, BLOCK_COUNT) => LFS3_ERR_INVAL;
    lfs3_fs_mkbad(&lfs3, -1) => LFS3_ERR_INVAL;
    lfs3_fs_mkgood(&lfs3, 0) => LFS3_ERR_INVAL;
    lfs3_fs_mkgood(&lfs3, 1) => LFS3_ERR_INVAL;
    lfs3_fs_mkgood(&lfs3, BLOCK_COUNT) => LFS3_ERR_INVAL;

    // neither can in-use blocks
    test_bbg_write(&lfs3, "spider", 42, SIZE);
    bool *inuse = malloc(BLOCK_COUNT);
    test_bbg_inuse(&lfs3, inuse);
    for (lfs3_block_t b = 2; b < BLOCK_COUNT; b++) {
        if (inuse[b]) {
            lfs3_fs_mkbad(&lfs3, b) => LFS3_ERR_BUSY;
        }
    }
    lfs3_fs_nextbad(&lfs3, 0) => LFS3_ERR_NOENT;

    // mark a few free blocks bad
    lfs3_block_t marks[] = {
        BLOCK_COUNT/4,
        BLOCK_COUNT/2, BLOCK_COUNT/2+1,
        BLOCK_COUNT-1,
    };
    lfs3_size_t nmarks = sizeof(marks)/sizeof(marks[0]);
    lfs3_block_t usage = lfs3_fs_usage(&lfs3);
    for (lfs3_size_t i = 0; i < nmarks; i++) {
        assert(!inuse[marks[i]]);
        lfs3_fs_mkbad(&lfs3, marks[i]) => 0;
        // twice is fine
        lfs3_fs_mkbad(&lfs3, marks[i]) => 0;
    }
    assert(lfs3_fs_usage(&lfs3) == (lfs3_sblock_t)(usage + nmarks));

    // mkbad writes the gbmap
    struct lfs3_fsinfo fsinfo;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(!(fsinfo.flags & LFS3_I_BADBLOCKS));

    for (int remount = 0; remount < 2; remount++) {
        if (remount) {
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;
        }

        // find our marks
        lfs3_block_t b = 0;
        for (lfs3_size_t i = 0; i < nmarks; i++) {
            lfs3_sblock_t b_ = lfs3_fs_nextbad(&lfs3, b);
            assert(b_ == (lfs3_sblock_t)marks[i]);
            b = b_+1;
        }
        lfs3_fs_nextbad(&lfs3, b) => LFS3_ERR_NOENT;
        lfs3_fs_nextbad(&lfs3, BLOCK_COUNT) => LFS3_ERR_NOENT;
    }

    // marked blocks should never be used
    memset(test_bbg_erases, 0, sizeof(test_bbg_erases));
    memset(test_bbg_progs, 0, sizeof(test_bbg_progs));
    for (lfs3_size_t c = 0; c < CYCLES; c++) {
        for (lfs3_size_t i = 0; i < N; i++) {
            char name[256];
            sprintf(name, "file%03d", i);
            test_bbg_write(&lfs3, name, c*N + i, SIZE);
        }
    }
    for (lfs3_size_t i = 0; i < nmarks; i++) {
        assert(test_bbg_erases[marks[i]] == 0);
        assert(test_bbg_progs[marks[i]] == 0);
    }

    // clear a mark, this block should be used again
    lfs3_fs_mkgood(&lfs3, marks[0]) => 0;
    // twice is fine
    lfs3_fs_mkgood(&lfs3, marks[0]) => 0;
    // clearing a block that isn't bad does nothing
    lfs3_fs_mkgood(&lfs3, marks[0]+1) => 0;
    lfs3_fs_nextbad(&lfs3, 0) => marks[1];
    lfs3_unmount(&lfs3) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;
    lfs3_fs_nextbad(&lfs3, 0) => marks[1];

    for (lfs3_size_t c = 0; c < CYCLES; c++) {
        for (lfs3_size_t i = 0; i < N; i++) {
            char name[256];
            sprintf(name, "file%03d", i);
            test_bbg_write(&lfs3, name, c*N + i, SIZE);
        }
    }
    assert(test_bbg_erases[marks[0]] > 0);
    for (lfs3_size_t i = 1; i < nmarks; i++) {
        assert(test_bbg_erases[marks[i]] == 0);
        assert(test_bbg_progs[marks[i]] == 0);
    }
    test_bbg_read(&lfs3, "spider", 42, SIZE);
    lfs3_unmount(&lfs3) => 0;

    // a read-only mount can still find bad blocks
    lfs3_mount(&lfs3, LFS3_M_RDONLY, &cfg) => 0;
    lfs3_fs_nextbad(&lfs3, 0) => marks[1];
    lfs3_unmount(&lfs3) => 0;
    free(inuse);
'''

# test that LFS3_I_BADBLOCKS tells us when bad blocks are on disk, and
# that lfs3_fs_nextbad finds bad blocks before they're on disk
[cases.test_badblocks_gbmap_api_ibadblocks]
defines.BADBLOCK_BEHAVIOR = [
    'LFS3_EMUBD_BADBLOCK_PROGERROR',
    'LFS3_EMUBD_BADBLOCK_ERASEERROR',
]
defines.SIZE = 'BLOCK_SIZE'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR | LFS3_F_GBMAP, CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
    struct lfs3_fsinfo fsinfo;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(!(fsinfo.flags & LFS3_I_BADBLOCKS));

    // make the next free block bad
    lfs3_alloc_ckpoint(&lfs3) => 0;
    lfs3_sblock_t bad = lfs3_alloc_findfree(&lfs3, NULL);
    assert(bad >= 2);
    lfs3_emubd_mkbad(CFG, bad) => 0;

    // write until we find it
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "spider",
            LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
    uint8_t wbuf[SIZE];
    memset(wbuf, 'a', SIZE);
    lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
    lfs3_file_flush(&lfs3, &file) => 0;

    // either we know about it, or it's already on disk
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(!(fsinfo.flags & LFS3_I_BADBLOCKS)
            == test_bbg_isbad(&lfs3, bad));
    lfs3_fs_nextbad(&lfs3, 0) => bad;

    // the next commit should fix that
    lfs3_file_close(&lfs3, &file) => 0;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(!(fsinfo.flags & LFS3_I_BADBLOCKS));
    lfs3_fs_nextbad(&lfs3, 0) => bad;

    lfs3_unmount(&lfs3) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(!(fsinfo.flags & LFS3_I_BADBLOCKS));
    lfs3_fs_nextbad(&lfs3, 0) => bad;
    lfs3_fs_nextbad(&lfs3, bad+1) => LFS3_ERR_NOENT;

    // a block going bad while in use can't be marked until the next
    // commit releases it
    if (BADBLOCK_BEHAVIOR == LFS3_EMUBD_BADBLOCK_PROGERROR) {
        lfs3_block_t inuse = test_bbg_badappend(&lfs3, CFG, "tarantula",
                wbuf, SIZE/2);

        // we know about it, but haven't marked it yet
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert(fsinfo.flags & LFS3_I_BADBLOCKS);
        lfs3_fs_nextbad(&lfs3, inuse) => inuse;
        assert(!test_bbg_isbad(&lfs3, inuse));

        // it should be marked within a few commits
        for (int i = 0;; i++) {
            assert(i < 3);
            char name[256];
            sprintf(name, "dir%d", i);
            lfs3_mkdir(&lfs3, name) => 0;
            lfs3_fs_stat(&lfs3, &fsinfo) => 0;
            if (!(fsinfo.flags & LFS3_I_BADBLOCKS)) {
                break;
            }
        }
        assert(test_bbg_isbad(&lfs3, inuse));

        lfs3_unmount(&lfs3) => 0;
        lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
        lfs3_block_t lo = lfs3_min(bad, inuse);
        lfs3_block_t hi = lfs3_max(bad, inuse);
        lfs3_fs_nextbad(&lfs3, 0) => lo;
        lfs3_fs_nextbad(&lfs3, lo+1) => hi;
        lfs3_fs_nextbad(&lfs3, hi+1) => LFS3_ERR_NOENT;
        uint8_t rbuf[SIZE];
        lfs3_file_open(&lfs3, &file, "tarantula", LFS3_O_RDONLY) => 0;
        lfs3_file_read(&lfs3, &file, rbuf, SIZE) => SIZE/2+64;
        assert(memcmp(rbuf, wbuf, SIZE/2+64) == 0);
        lfs3_file_close(&lfs3, &file) => 0;
    }

    lfs3_unmount(&lfs3) => 0;
'''


## Interactions

# test that lfs3_fs_gc and lfs3_fs_ck mark pending bad blocks and write
# them to disk
[cases.test_badblocks_gbmap_gc]
defines.BADBLOCK_BEHAVIOR = [
    'LFS3_EMUBD_BADBLOCK_PROGERROR',
    'LFS3_EMUBD_BADBLOCK_PROGNOOP',
]
# we need prog checking to detect silent errors
defines.CKPROGS = 'BADBLOCK_BEHAVIOR >= LFS3_EMUBD_BADBLOCK_READERROR'
# GC=false => lfs3_fs_ck
# GC=true  => lfs3_fs_gc
defines.GC = [false, true]
defines.GC_FLAGS = 0
defines.GC_STEPS = [1, -1]
defines.SIZE = 'BLOCK_SIZE'
if = [
    'LFS3_IFDEF_CKPROGS(true, !CKPROGS)',
    'LFS3_IFDEF_GC(true, !GC)',
    'GC || GC_STEPS == 1',
]
code = '''
    uint32_t flags = (CKPROGS) ? LFS3_IFDEF_CKPROGS(LFS3_M_CKPROGS, -1) : 0;
    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR | LFS3_F_GBMAP | flags, CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR | flags, CFG) => 0;

    // write a file, and make its data block go bad while we append,
    // syncing releases it
    uint8_t wbuf[SIZE];
    memset(wbuf, 'a', SIZE);
    lfs3_block_t bad = test_bbg_badappend(&lfs3, CFG, "spider",
            wbuf, SIZE/2);
    struct lfs3_fsinfo fsinfo;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags & LFS3_I_BADBLOCKS);
    assert(!test_bbg_isbad(&lfs3, bad));

    // gc/ck should mark it and write it to disk
    if (GC) {
        #ifdef LFS3_GC
        for (lfs3_block_t i = 0;; i++) {
            assert(i < 4);
            lfs3_fs_gc(&lfs3) => 0;
            lfs3_fs_stat(&lfs3, &fsinfo) => 0;
            if (!(fsinfo.flags & LFS3_I_BADBLOCKS)) {
                break;
            }
        }
        #endif
    } else {
        lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert(!(fsinfo.flags & LFS3_I_BADBLOCKS));
    }
    assert(test_bbg_isbad(&lfs3, bad));

    lfs3_unmount(&lfs3) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR | flags, CFG) => 0;
    assert(test_bbg_isbad(&lfs3, bad));
    lfs3_fs_nextbad(&lfs3, 0) => bad;
    uint8_t rbuf[SIZE];
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "spider", LFS3_O_RDONLY) => 0;
    lfs3_file_read(&lfs3, &file, rbuf, SIZE) => SIZE/2+64;
    assert(memcmp(rbuf, wbuf, SIZE/2+64) == 0);
    lfs3_file_close(&lfs3, &file) => 0;
    lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
    lfs3_unmount(&lfs3) => 0;
'''

# test that pre-erasing records blocks it fails to erase, and keeps
# going
[cases.test_badblocks_gbmap_preerase]
# MODE=0 => pre-erase with lfs3_fs_gc
# MODE=1 => pre-erase with LFS3_M_PREERASE
defines.MODE = [0, 1]
defines.BADBLOCK_BEHAVIOR = [
    'LFS3_EMUBD_BADBLOCK_ERASEERROR',
    'LFS3_EMUBD_BADBLOCK_READERROR',
]
defines.GC_FLAGS = 'LFS3_IFDEF_PREERASE(LFS3_GC_PREERASE, 0)'
defines.GC_PREERASE_COUNT = -1
# we need prog checking to detect read errors
defines.CKPROGS = 'BADBLOCK_BEHAVIOR >= LFS3_EMUBD_BADBLOCK_READERROR'
defines.N = 16
defines.SIZE = 'BLOCK_SIZE'
if = [
    'LFS3_IFDEF_GC(true, MODE != 0)',
    'LFS3_IFDEF_CKPROGS(true, !CKPROGS)',
]
ifdef = ['LFS3_REVPERTURB', 'LFS3_PREERASE']
code = '''
    struct lfs3_cfg cfg;
    test_bbg_wrap(&cfg, CFG);
    uint32_t flags = (CKPROGS) ? LFS3_IFDEF_CKPROGS(LFS3_M_CKPROGS, -1) : 0;

    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR | LFS3_F_REVPERTURB | LFS3_F_GBMAP | flags,
            &cfg) => 0;

    // make every other free block bad, so pre-erasing finds many more
    // bad blocks than we can remember at once
    lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;
    bool *inuse = malloc(BLOCK_COUNT);
    test_bbg_inuse(&lfs3, inuse);
    lfs3_unmount(&lfs3) => 0;
    bool *bad = calloc(BLOCK_COUNT, 1);
    for (lfs3_block_t b = 3; b < BLOCK_COUNT; b += 2) {
        if (!inuse[b]) {
            lfs3_emubd_mkbad(CFG, b) => 0;
            bad[b] = true;
        }
    }

    lfs3_mount(&lfs3,
            LFS3_M_RDWR
                | LFS3_M_REVPERTURB
                | flags
                | ((MODE == 1) ? LFS3_M_PREERASE : 0),
            &cfg) => 0;
    struct lfs3_fsinfo fsinfo;
    #ifdef LFS3_GC
    if (MODE == 0) {
        // gc should keep going until it reaches its target
        for (lfs3_block_t i = 0;; i++) {
            assert(i < 4*BLOCK_COUNT);
            lfs3_fs_gc(&lfs3) => 0;
            lfs3_fs_stat(&lfs3, &fsinfo) => 0;
            if (!(fsinfo.flags & LFS3_I_PREERASE)) {
                break;
            }
        }
    }
    #endif
    assert(lfs3.gbmap.preeraser.count > 1);

    // mark anything left, gc stops once it's done pre-erasing
    lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA) => 0;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(!(fsinfo.flags & LFS3_I_BADBLOCKS));

    // every bad block we tried should be marked, and only those
    lfs3_block_t marked = 0;
    for (lfs3_block_t b = 0; b < BLOCK_COUNT; b++) {
        if (test_bbg_isbad(&lfs3, b)) {
            assert(bad[b]);
            assert(test_bbg_erases[b] == 1);
            marked += 1;
        } else {
            assert(!bad[b] || test_bbg_erases[b] == 0);
        }
    }
    assert(marked > LFS3_BADQ_SIZE);

    // and never used again
    memset(test_bbg_erases, 0, sizeof(test_bbg_erases));
    memset(test_bbg_progs, 0, sizeof(test_bbg_progs));
    for (lfs3_size_t i = 0; i < N; i++) {
        char name[256];
        sprintf(name, "spider%03d", i);
        test_bbg_write(&lfs3, name, i, SIZE);
    }
    lfs3_unmount(&lfs3) => 0;

    lfs3_mount(&lfs3, LFS3_M_RDONLY, &cfg) => 0;
    for (lfs3_size_t i = 0; i < N; i++) {
        char name[256];
        sprintf(name, "spider%03d", i);
        test_bbg_read(&lfs3, name, i, SIZE);
    }
    for (lfs3_block_t b = 0; b < BLOCK_COUNT; b++) {
        if (test_bbg_isbad(&lfs3, b)) {
            assert(test_bbg_erases[b] == 0);
            assert(test_bbg_progs[b] == 0);
        }
    }
    lfs3_unmount(&lfs3) => 0;
    free(inuse);
    free(bad);
'''

# test that growing the filesystem keeps bad blocks bad
[cases.test_badblocks_gbmap_grow]
defines.BLOCK_COUNT = 'DISK_SIZE/BLOCK_SIZE'
defines.OLD_BLOCK_COUNT = 'BLOCK_COUNT/2'
defines.N = 8
defines.SIZE = '2*BLOCK_SIZE'
defines.CYCLES = 32
code = '''
    struct lfs3_cfg cfg;
    test_bbg_wrap(&cfg, CFG);
    cfg.block_count = OLD_BLOCK_COUNT;

    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR | LFS3_F_GBMAP, &cfg) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;
    // mark a block bad, and the last block, so grow can't extend a
    // free range
    lfs3_fs_mkbad(&lfs3, OLD_BLOCK_COUNT/2) => 0;
    lfs3_fs_mkbad(&lfs3, OLD_BLOCK_COUNT-1) => 0;
    lfs3_unmount(&lfs3) => 0;

    // grow
    cfg.block_count = BLOCK_COUNT;
    lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;
    lfs3_fs_grow(&lfs3, BLOCK_COUNT) => 0;
    lfs3_fs_nextbad(&lfs3, 0) => OLD_BLOCK_COUNT/2;
    lfs3_fs_nextbad(&lfs3, OLD_BLOCK_COUNT/2+1) => OLD_BLOCK_COUNT-1;
    lfs3_fs_nextbad(&lfs3, OLD_BLOCK_COUNT) => LFS3_ERR_NOENT;

    // the new blocks should be used, but not the bad ones
    memset(test_bbg_erases, 0, sizeof(test_bbg_erases));
    memset(test_bbg_progs, 0, sizeof(test_bbg_progs));
    for (lfs3_size_t c = 0; c < CYCLES; c++) {
        for (lfs3_size_t i = 0; i < N; i++) {
            char name[256];
            sprintf(name, "file%03d", i);
            test_bbg_write(&lfs3, name, c*N + i, SIZE);
        }
        lfs3_unmount(&lfs3) => 0;
        lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;
    }
    for (lfs3_size_t i = 0; i < N; i++) {
        char name[256];
        sprintf(name, "file%03d", i);
        test_bbg_read(&lfs3, name, (CYCLES-1)*N + i, SIZE);
    }
    lfs3_block_t grown = 0;
    for (lfs3_block_t b = OLD_BLOCK_COUNT; b < BLOCK_COUNT; b++) {
        grown += (test_bbg_erases[b] > 0);
    }
    assert(grown > 0);
    assert(test_bbg_erases[OLD_BLOCK_COUNT/2] == 0);
    assert(test_bbg_progs[OLD_BLOCK_COUNT/2] == 0);
    assert(test_bbg_erases[OLD_BLOCK_COUNT-1] == 0);
    assert(test_bbg_progs[OLD_BLOCK_COUNT-1] == 0);
    lfs3_fs_nextbad(&lfs3, 0) => OLD_BLOCK_COUNT/2;
    lfs3_fs_nextbad(&lfs3, OLD_BLOCK_COUNT/2+1) => OLD_BLOCK_COUNT-1;
    lfs3_fs_nextbad(&lfs3, OLD_BLOCK_COUNT) => LFS3_ERR_NOENT;
    lfs3_unmount(&lfs3) => 0;
'''

# test that removing the gbmap forgets bad blocks, and that a new gbmap
# starts without any
[cases.test_badblocks_gbmap_rmgbmap]
defines.SIZE = 'BLOCK_SIZE'
ifndef = 'LFS3_YES_GBMAP'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR | LFS3_F_GBMAP, CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
    lfs3_fs_mkbad(&lfs3, BLOCK_COUNT/2) => 0;

    // find another bad block, but don't mark it yet
    uint8_t wbuf[SIZE];
    memset(wbuf, 'a', SIZE);
    test_bbg_badappend(&lfs3, CFG, "spider", wbuf, SIZE/2);
    struct lfs3_fsinfo fsinfo;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags & LFS3_I_BADBLOCKS);

    // removing the gbmap forgets them
    lfs3_fs_rmgbmap(&lfs3) => 0;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(!(fsinfo.flags & LFS3_I_BADBLOCKS));
    lfs3_fs_nextbad(&lfs3, 0) => LFS3_ERR_NOENT;
    lfs3_fs_mkbad(&lfs3, BLOCK_COUNT/2) => LFS3_ERR_NOTSUP;
    lfs3_unmount(&lfs3) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
    lfs3_fs_nextbad(&lfs3, 0) => LFS3_ERR_NOENT;

    // and a new gbmap starts without bad blocks
    lfs3_fs_mkgbmap(&lfs3) => 0;
    lfs3_fs_nextbad(&lfs3, 0) => LFS3_ERR_NOENT;
    lfs3_unmount(&lfs3) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
    lfs3_fs_nextbad(&lfs3, 0) => LFS3_ERR_NOENT;

    // but we can still mark bad blocks
    lfs3_fs_mkbad(&lfs3, BLOCK_COUNT/2) => 0;
    lfs3_fs_nextbad(&lfs3, 0) => BLOCK_COUNT/2;
    lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
    lfs3_unmount(&lfs3) => 0;
'''


## Bad blocks under power-loss, overflow, wear-out, and read-only

# test power-loss while finding and marking bad blocks
#
# after every power-loss the filesystem should match our model, and no
# block marked bad should be in use, the worst a power-loss can do is
# forget a bad block
[cases.test_badblocks_gbmap_pl_fuzz]
defines.POWERLOSS_BEHAVIOR = [
    'LFS3_EMUBD_POWERLOSS_ATOMIC',
    'LFS3_EMUBD_POWERLOSS_SOMEBITS',
    'LFS3_EMUBD_POWERLOSS_MOSTBITS',
    'LFS3_EMUBD_POWERLOSS_OOO',
]
defines.BADBLOCK_BEHAVIOR = [
    'LFS3_EMUBD_BADBLOCK_PROGERROR',
    'LFS3_EMUBD_BADBLOCK_ERASEERROR',
    'LFS3_EMUBD_BADBLOCK_READERROR',
    'LFS3_EMUBD_BADBLOCK_PROGNOOP',
    'LFS3_EMUBD_BADBLOCK_ERASENOOP',
]
# we need prog checking to detect read errors and silent errors
defines.CKPROGS = 'BADBLOCK_BEHAVIOR >= LFS3_EMUBD_BADBLOCK_READERROR'
# MIDBAD makes a block in use go bad halfway through
defines.MIDBAD = [false, true]
defines.N = 8
defines.SIZE = 'BLOCK_SIZE/2'
defines.OPS = 32
defines.SEED = 'range(4)'
fuzz = 'SEED'
reentrant = true
if = [
    'LFS3_IFDEF_CKPROGS(true, !CKPROGS)',
    # a live block that can't be read is a different test
    '!MIDBAD || BADBLOCK_BEHAVIOR != LFS3_EMUBD_BADBLOCK_READERROR',
]
code = '''
    uint32_t flags = (CKPROGS) ? LFS3_IFDEF_CKPROGS(LFS3_M_CKPROGS, -1) : 0;
    // format once per test
    lfs3_t lfs3;
    int err = lfs3_mount(&lfs3, LFS3_M_RDWR | flags, CFG);
    if (err) {
        // make some free blocks bad, emubd keeps these across power-loss
        uint32_t prng = SEED;
        for (lfs3_size_t i = 0; i < 8; i++) {
            lfs3_block_t b = FORMAT_BLOCK_COUNT
                    + (TEST_PRNG(&prng) % (BLOCK_COUNT-FORMAT_BLOCK_COUNT));
            lfs3_emubd_mkbad(CFG, b) => 0;
        }

        lfs3_format(&lfs3, LFS3_F_RDWR | LFS3_F_GBMAP | flags, CFG) => 0;
        lfs3_mount(&lfs3, LFS3_M_RDWR | flags, CFG) => 0;
    }

    // no block marked bad should ever be in use
    test_bbg_ckinuse(&lfs3);

    // how many steps have we completed?
    lfs3_size_t s = 0;
    lfs3_file_t state;
    lfs3_file_open(&lfs3, &state, "state",
            LFS3_O_RDWR | LFS3_O_CREAT) => 0;
    lfs3_ssize_t d = lfs3_file_read(&lfs3, &state, &s, sizeof(s));
    assert(d == 0 || d == sizeof(s));

    // rebuild our model
    test_bbg_sim_t sim;
    memset(&sim, 0, sizeof(sim));
    uint32_t prng = SEED;
    for (lfs3_size_t i = 0; i < s; i++) {
        test_bbg_plan(&prng, &sim, N, SIZE);
    }

    // the disk should be before or after our next step
    if (!test_bbg_ck(&lfs3, &sim, N)) {
        assert(s < OPS);
        test_bbg_plan(&prng, &sim, N, SIZE);
        assert(test_bbg_ck(&lfs3, &sim, N));
        s += 1;
        lfs3_file_rewind(&lfs3, &state) => 0;
        lfs3_file_write(&lfs3, &state, &s, sizeof(s)) => sizeof(s);
        lfs3_file_sync(&lfs3, &state) => 0;
    }

    for (; s < OPS; s++) {
        // make a block in use go bad halfway through
        if (MIDBAD && s == OPS/2) {
            bool *inuse = malloc(BLOCK_COUNT);
            test_bbg_inuse(&lfs3, inuse);
            uint32_t prng_ = SEED;
            lfs3_block_t b = 2 + (TEST_PRNG(&prng_) % (BLOCK_COUNT-2));
            while (!inuse[b]) {
                b = 2 + ((b-2 + 1) % (BLOCK_COUNT-2));
            }
            lfs3_emubd_mkbad(CFG, b) => 0;
            free(inuse);
        }

        test_bbg_op_t op = test_bbg_plan(&prng, &sim, N, SIZE);
        test_bbg_apply(&lfs3, &op);
        test_bbg_ckinuse(&lfs3);

        // update our state
        lfs3_size_t s_ = s+1;
        lfs3_file_rewind(&lfs3, &state) => 0;
        lfs3_file_write(&lfs3, &state, &s_, sizeof(s_)) => sizeof(s_);
        lfs3_file_sync(&lfs3, &state) => 0;
    }
    lfs3_file_close(&lfs3, &state) => 0;

    // mark anything pending
    lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
    test_bbg_ckinuse(&lfs3);

    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR | flags, CFG) => 0;
        }

        test_bbg_ckinuse(&lfs3);
        assert(test_bbg_ck(&lfs3, &sim, N));
        lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
    }

    lfs3_unmount(&lfs3) => 0;
'''

# test more blocks going bad at once than we can remember
#
# we forget the oldest, but should find them again the next time we try
# them, until every bad block is marked
[cases.test_badblocks_gbmap_overflow]
defines.BADBLOCK_BEHAVIOR = [
    'LFS3_EMUBD_BADBLOCK_PROGERROR',
    'LFS3_EMUBD_BADBLOCK_ERASEERROR',
]
defines.BADBLOCKS = ['LFS3_BADQ_SIZE+1', '4*LFS3_BADQ_SIZE']
defines.N = 8
defines.SIZE = '2*BLOCK_SIZE'
defines.CYCLES = 128
code = '''
    struct lfs3_cfg cfg;
    test_bbg_wrap(&cfg, CFG);

    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR | LFS3_F_GBMAP, &cfg) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;

    // make a run of free blocks bad where we allocate next, so we find
    // them all at once
    bool *inuse = malloc(BLOCK_COUNT);
    bool *bad = calloc(BLOCK_COUNT, 1);
    test_bbg_inuse(&lfs3, inuse);
    lfs3_alloc_ckpoint(&lfs3) => 0;
    lfs3_sblock_t b = lfs3_alloc_findfree(&lfs3, NULL);
    assert(b >= 2);
    for (lfs3_size_t i = 0; i < BADBLOCKS;) {
        if (b >= 2 && !inuse[b]) {
            lfs3_emubd_mkbad(CFG, b) => 0;
            bad[b] = true;
            i += 1;
        }
        b = (b + 1) % BLOCK_COUNT;
    }

    // this should keep working
    for (lfs3_size_t c = 0; c < CYCLES; c++) {
        for (lfs3_size_t i = 0; i < N; i++) {
            char name[256];
            sprintf(name, "file%03d", i);
            test_bbg_write(&lfs3, name, c*N + i, SIZE);
        }
    }

    // every bad block should be marked by now
    for (int i = 0; i < 2; i++) {
        lfs3.gbmap.known = 0;
        test_bbg_sync(&lfs3);
    }
    test_bbg_ckinuse(&lfs3);
    for (lfs3_block_t b_ = 0; b_ < BLOCK_COUNT; b_++) {
        assert(test_bbg_isbad(&lfs3, b_) == bad[b_]);

        // each forgotten bad block is tried once more
        if (bad[b_]) {
            uint32_t tries = (BADBLOCK_BEHAVIOR
                        == LFS3_EMUBD_BADBLOCK_ERASEERROR)
                    ? test_bbg_erases[b_]
                    : test_bbg_progs[b_];
            assert(tries > 0);
            assert(tries <= (BADBLOCKS+LFS3_BADQ_SIZE-1) / LFS3_BADQ_SIZE);
        }
    }

    lfs3_unmount(&lfs3) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;
    for (lfs3_block_t b_ = 0; b_ < BLOCK_COUNT; b_++) {
        assert(test_bbg_isbad(&lfs3, b_) == bad[b_]);
    }
    for (lfs3_size_t i = 0; i < N; i++) {
        char name[256];
        sprintf(name, "file%03d", i);
        test_bbg_read(&lfs3, name, (CYCLES-1)*N + i, SIZE);
    }
    lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
    lfs3_unmount(&lfs3) => 0;
    free(inuse);
    free(bad);
'''

# test wearing out the disk, with bad-block tracking a block that fails
# should be erased at most once more, and we should still get ~2x the
# lifetime from 2x the blocks
[cases.test_badblocks_gbmap_exhaustion]
defines.ERASE_CYCLES = 10
defines.BLOCK_RECYCLES = 4
defines.BADBLOCK_BEHAVIOR = [
    'LFS3_EMUBD_BADBLOCK_PROGERROR',
    'LFS3_EMUBD_BADBLOCK_ERASEERROR',
]
defines.N = 4
defines.SIZE = ['BLOCK_SIZE/8', 'BLOCK_SIZE']
defines.SEED = 42
code = '''
    // run our test twice, once with 1/2 the storage, once with 2/2 the
    // storage
    uint32_t run_bc[2] = {BLOCK_COUNT/2, BLOCK_COUNT};
    uint32_t run_ops[2] = {0, 0};
    for (int run = 0; run < 2; run++) {
        // clear any wear from the previous run
        for (lfs3_block_t b = 0; b < BLOCK_COUNT; b++) {
            lfs3_emubd_setwear(CFG, b, 0) => 0;
        }

        struct lfs3_cfg cfg;
        test_bbg_wrap(&cfg, CFG);
        cfg.block_count = run_bc[run];

        lfs3_t lfs3;
        lfs3_format(&lfs3, LFS3_F_RDWR | LFS3_F_GBMAP, &cfg) => 0;
        lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;

        // rewrite files until the disk wears out
        uint32_t prng = SEED;
        for (;; run_ops[run]++) {
            char name[256];
            sprintf(name, "file%03x", (unsigned)(TEST_PRNG(&prng) % N));
            uint8_t wbuf[SIZE];
            for (lfs3_size_t j = 0; j < SIZE; j++) {
                wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
            }

            lfs3_file_t file;
            int err = lfs3_file_open(&lfs3, &file, name,
                    LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_TRUNC);
            assert(!err || err == LFS3_ERR_NOSPC);
            if (err) {
                break;
            }
            lfs3_ssize_t d = lfs3_file_write(&lfs3, &file, wbuf, SIZE);
            assert(d == SIZE || d == LFS3_ERR_NOSPC);
            if (d == LFS3_ERR_NOSPC) {
                lfs3_file_close(&lfs3, &file) => 0;
                break;
            }
            err = lfs3_file_close(&lfs3, &file);
            assert(!err || err == LFS3_ERR_NOSPC);
            if (err) {
                break;
            }
        }

        // a block that failed should be erased at most once more, the
        // mroot anchor can't move so is exempt
        lfs3_block_t dead = 0;
        for (lfs3_block_t b = 2; b < run_bc[run]; b++) {
            assert(test_bbg_afters[b] <= 1);
            dead += test_bbg_failed[b];
        }
        assert(dead > 0);
        lfs3_unmount(&lfs3) => 0;

        printf("run %d, %dx%d, %d ec: %d ops, %d dead\n",
                run,
                (int)BLOCK_SIZE,
                run_bc[run],
                (int)ERASE_CYCLES,
                run_ops[run],
                dead);
    }

    // check that we increased the lifetime by ~2x, with ~10% error
    printf("lifetime: %d -> %d (x%.2f)\n",
            run_ops[0],
            run_ops[1],
            (double)run_ops[1] / (double)run_ops[0]);
    assert(run_ops[1]*110/100 > 2*run_ops[0]);
'''

# test that read-only mounts never write, even with bad blocks on disk
# and bad blocks found while reading
[cases.test_badblocks_gbmap_rdonly]
defines.BADBLOCK_BEHAVIOR = [
    'LFS3_EMUBD_BADBLOCK_READERROR',
    'LFS3_EMUBD_BADBLOCK_READFLIP',
    'LFS3_EMUBD_BADBLOCK_MANUAL',
]
defines.N = 8
defines.SIZE = 'BLOCK_SIZE'
code = '''
    struct lfs3_cfg cfg;
    test_bbg_wrap(&cfg, CFG);

    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR | LFS3_F_GBMAP, &cfg) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;
    for (lfs3_size_t i = 0; i < N; i++) {
        char name[256];
        sprintf(name, "spider%03d", i);
        test_bbg_write(&lfs3, name, i, SIZE);
    }
    lfs3_fs_mkbad(&lfs3, BLOCK_COUNT-1) => 0;

    // make every third block in use go bad, but not the mroot anchor
    bool *inuse = malloc(BLOCK_COUNT);
    test_bbg_inuse(&lfs3, inuse);
    lfs3_unmount(&lfs3) => 0;
    for (lfs3_block_t b = 2; b < BLOCK_COUNT; b++) {
        if (inuse[b] && b % 3 == 0) {
            lfs3_emubd_mkbad(CFG, b) => 0;
        }
    }
    if (BADBLOCK_BEHAVIOR == LFS3_EMUBD_BADBLOCK_MANUAL) {
        lfs3_emubd_flip(CFG) => 0;
    }

    // mounting read-only shouldn't write, whatever we find
    memset(test_bbg_erases, 0, sizeof(test_bbg_erases));
    memset(test_bbg_progs, 0, sizeof(test_bbg_progs));
    int err = lfs3_mount(&lfs3, LFS3_M_RDONLY, &cfg);
    assert(!err || err == LFS3_ERR_CORRUPT);
    if (!err) {
        for (lfs3_size_t i = 0; i < N; i++) {
            char name[256];
            sprintf(name, "spider%03d", i);
            lfs3_file_t file;
            err = lfs3_file_open(&lfs3, &file, name, LFS3_O_RDONLY);
            assert(!err || err == LFS3_ERR_CORRUPT);
            if (err) {
                continue;
            }
            uint8_t rbuf[SIZE];
            lfs3_ssize_t d = lfs3_file_read(&lfs3, &file, rbuf, SIZE);
            assert(d == SIZE || d == LFS3_ERR_CORRUPT);
            lfs3_file_close(&lfs3, &file) => 0;
        }

        err = lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA);
        assert(!err || err == LFS3_ERR_CORRUPT);
        lfs3_sblock_t usage = lfs3_fs_usage(&lfs3);
        assert(usage > 0 || usage == LFS3_ERR_CORRUPT);
        lfs3_sblock_t bad = lfs3_fs_nextbad(&lfs3, 0);
        assert(bad == BLOCK_COUNT-1 || bad == LFS3_ERR_CORRUPT);

        // nothing to mark
        struct lfs3_fsinfo fsinfo;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert(!(fsinfo.flags & LFS3_I_BADBLOCKS));
        assert(lfs3.gbmap.badq.count == 0);
        lfs3_unmount(&lfs3) => 0;
    }

    for (lfs3_block_t b = 0; b < BLOCK_COUNT; b++) {
        assert(test_bbg_erases[b] == 0);
        assert(test_bbg_progs[b] == 0);
    }
    free(inuse);
'''

# test marking a factory bad-block table after format, before anything
# is written
#
# format only writes the mroot anchor and gbmap root, and puts the root on
# the first block after the anchor that erases and programs, so this
# keeps every other listed block from ever being erased
[cases.test_badblocks_gbmap_factory]
defines.BADBLOCK_BEHAVIOR = [
    'LFS3_EMUBD_BADBLOCK_PROGERROR',
    'LFS3_EMUBD_BADBLOCK_ERASEERROR',
]
defines.N = 8
defines.SIZE = '2*BLOCK_SIZE'
defines.CYCLES = 32
code = '''
    struct lfs3_cfg cfg;
    test_bbg_wrap(&cfg, CFG);

    // our factory bad-block table, blocks 2 and 3 are where format would
    // put the gbmap root
    bool *bad = calloc(BLOCK_COUNT, 1);
    for (lfs3_block_t b = 3; b < BLOCK_COUNT; b += 5) {
        lfs3_emubd_mkbad(CFG, b) => 0;
        bad[b] = true;
    }
    lfs3_emubd_mkbad(CFG, 2) => 0;
    bad[2] = true;
    lfs3_emubd_mkbad(CFG, 7) => 0;
    bad[7] = true;

    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR | LFS3_F_GBMAP, &cfg) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;
    // format tried blocks 2 and 3 once each, the device refusing them
    for (lfs3_block_t b = 2; b < 4; b++) {
        assert(test_bbg_erases[b] == 1);
        assert(test_bbg_progs[b] <= 1);
        test_bbg_erases[b] = 0;
        test_bbg_progs[b] = 0;
    }
    for (lfs3_block_t b = 0; b < BLOCK_COUNT; b++) {
        if (bad[b]) {
            lfs3_fs_mkbad(&lfs3, b) => 0;
        }
    }

    for (lfs3_size_t c = 0; c < CYCLES; c++) {
        for (lfs3_size_t i = 0; i < N; i++) {
            char name[256];
            sprintf(name, "file%03d", i);
            test_bbg_write(&lfs3, name, c*N + i, SIZE);
        }
        lfs3_unmount(&lfs3) => 0;
        lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;
    }

    // our listed blocks should never be erased or programmed
    lfs3_block_t b_ = 0;
    for (lfs3_block_t b = 0; b < BLOCK_COUNT; b++) {
        if (bad[b]) {
            assert(test_bbg_erases[b] == 0);
            assert(test_bbg_progs[b] == 0);
            lfs3_fs_nextbad(&lfs3, b_) => b;
            b_ = b+1;
        }
    }
    lfs3_fs_nextbad(&lfs3, b_) => LFS3_ERR_NOENT;
    for (lfs3_size_t i = 0; i < N; i++) {
        char name[256];
        sprintf(name, "file%03d", i);
        test_bbg_read(&lfs3, name, (CYCLES-1)*N + i, SIZE);
    }
    lfs3_unmount(&lfs3) => 0;
    free(bad);
'''

# test that blocks that fail a read or a check are listed as suspect, in
# RAM only, without writing, and are not marked bad
[cases.test_badblocks_gbmap_suspect]
defines.BADBLOCK_BEHAVIOR = [
    'LFS3_EMUBD_BADBLOCK_READERROR',
    'LFS3_EMUBD_BADBLOCK_MANUAL',
]
defines.RDONLY = [false, true]
# how many data blocks go bad
defines.DAMAGED = [1, 'LFS3_SUSPECTS_SIZE', 'LFS3_SUSPECTS_SIZE+2']
defines.N = 'LFS3_SUSPECTS_SIZE+2'
defines.SIZE = 'BLOCK_SIZE'
code = '''
    struct lfs3_cfg cfg;
    test_bbg_wrap(&cfg, CFG);

    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR | LFS3_F_GBMAP, &cfg) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;

    // files with one data block each
    lfs3_block_t blocks[N];
    for (lfs3_size_t i = 0; i < N; i++) {
        char name[256];
        sprintf(name, "spider%03d", i);
        test_bbg_write(&lfs3, name, i, SIZE);

        lfs3_file_t file;
        lfs3_file_open(&lfs3, &file, name, LFS3_O_RDONLY) => 0;
        lfs3_bid_t bid;
        lfs3_bid_t weight;
        lfs3_bptr_t bptr;
        lfs3_file_lookupnext(&lfs3, &file, 0, &bid, &weight, &bptr) => 0;
        assert(lfs3_bptr_isbptr(&bptr));
        blocks[i] = lfs3_bptr_block(&bptr);
        lfs3_file_close(&lfs3, &file) => 0;
    }
    lfs3_unmount(&lfs3) => 0;

    // damage some of them
    for (lfs3_size_t i = 0; i < DAMAGED; i++) {
        lfs3_emubd_mkbad(CFG, blocks[i]) => 0;
    }
    if (BADBLOCK_BEHAVIOR == LFS3_EMUBD_BADBLOCK_MANUAL) {
        lfs3_emubd_flip(CFG) => 0;
    }

    // check each file, finding the damage shouldn't write anything
    memset(test_bbg_erases, 0, sizeof(test_bbg_erases));
    memset(test_bbg_progs, 0, sizeof(test_bbg_progs));
    lfs3_mount(&lfs3, (RDONLY) ? LFS3_M_RDONLY : LFS3_M_RDWR, &cfg) => 0;
    lfs3_fs_nextsuspect(&lfs3, 0) => LFS3_ERR_NOENT;
    for (lfs3_size_t i = 0; i < N; i++) {
        char name[256];
        sprintf(name, "spider%03d", i);
        lfs3_file_t file;
        lfs3_file_open(&lfs3, &file, name, LFS3_O_RDONLY) => 0;
        lfs3_file_ck(&lfs3, &file, LFS3_CK_CKDATA)
                => (i < DAMAGED) ? LFS3_ERR_CORRUPT : 0;
        lfs3_file_close(&lfs3, &file) => 0;
    }
    for (lfs3_block_t b = 0; b < BLOCK_COUNT; b++) {
        assert(test_bbg_erases[b] == 0);
        assert(test_bbg_progs[b] == 0);
    }

    // we should remember the most recent damaged blocks
    bool *suspect = calloc(BLOCK_COUNT, 1);
    for (lfs3_size_t i = 0; i < DAMAGED; i++) {
        suspect[blocks[i]] = i + LFS3_SUSPECTS_SIZE >= DAMAGED;
    }
    lfs3_block_t count = 0;
    for (lfs3_block_t b = 0;; b++) {
        lfs3_sblock_t b_ = lfs3_fs_nextsuspect(&lfs3, b);
        assert(b_ >= 0 || b_ == LFS3_ERR_NOENT);
        if (b_ == LFS3_ERR_NOENT) {
            break;
        }
        assert(suspect[b_]);
        count += 1;
        b = b_;
    }
    assert(count == lfs3_min(DAMAGED, LFS3_SUSPECTS_SIZE));

    // suspect isn't bad
    lfs3_fs_nextbad(&lfs3, 0) => LFS3_ERR_NOENT;
    struct lfs3_fsinfo fsinfo;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(!(fsinfo.flags & LFS3_I_BADBLOCKS));

    // and suspects only live in RAM
    lfs3_unmount(&lfs3) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDONLY, &cfg) => 0;
    lfs3_fs_nextsuspect(&lfs3, 0) => LFS3_ERR_NOENT;
    for (lfs3_size_t i = DAMAGED; i < N; i++) {
        char name[256];
        sprintf(name, "spider%03d", i);
        test_bbg_read(&lfs3, name, i, SIZE);
    }
    lfs3_unmount(&lfs3) => 0;
    free(suspect);
'''
