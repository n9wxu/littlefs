# test what happens if we find an unknown config
[cases.test_mount_incompat_unknown_config]
# unknown configs before, between, and after our known configs, and with
# the reserved subtype bit 7 set
defines.CONFIG = [
    '0x00', '0x01', '0x30', '0x32', '0x33', '0x3b', '0x42', '0x7f',
    '0x80', '0xff',
]
in = 'lfs3.c'
code = '''
    // create a superblock
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;

    // create an unknown config
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
    lfs3_mdir_commit(&lfs3, &lfs3.mroot, LFS3_RATTRS(
            LFS3_RATTR(3, LFS3_TAG_CONFIG + (CONFIG & 0x7f), 0,
                LFS3_FROM_DATA),
            LFS3_RATTR_ARG(strlen("oh no!")),
            LFS3_RATTR_ARG("oh no!"),
            LFS3_RATTR_NULL)) => 0;
    lfs3_block_t block = lfs3.mroot.r.blocks[0];
    lfs3_unmount(&lfs3) => 0;

    // we can't write tags with bit 7 set, so set it on disk, and fix
    // the last 4 data bytes so the tag+data checksum, and so the
    // commit, still matches, crc32c is linear so this is a 32x32
    // system over GF(2)
    if (CONFIG & 0x80) {
        uint8_t *buf = malloc(BLOCK_SIZE);
        CFG->read(CFG, block, 0, buf, BLOCK_SIZE) => 0;

        // find our tag, ignoring the valid bit
        lfs3_size_t off = 0;
        lfs3_size_t found = 0;
        for (lfs3_size_t i = 0; i+4+6 <= BLOCK_SIZE; i++) {
            if ((buf[i] & 0x7f) == (LFS3_TAG_CONFIG >> 8)
                    && buf[i+1] == (CONFIG & 0x7f)
                    && buf[i+2] == 0
                    && buf[i+3] == 6
                    && memcmp(&buf[i+4], "oh no!", 6) == 0) {
                off = i;
                found += 1;
            }
        }
        assert(found == 1);

        uint8_t x[4+6];
        memcpy(x, &buf[off], 4+6);
        x[0] &= 0x7f;
        uint32_t target = lfs3_crc32c(0, x, 4+6);
        x[1] |= 0x80;
        memset(&x[6], 0, 4);
        uint32_t base = lfs3_crc32c(0, x, 4+6);

        // what each bit of the last 4 bytes changes
        uint32_t cols[32];
        uint32_t sels[32];
        for (int k = 0; k < 32; k++) {
            x[6 + k/8] ^= 1 << (k%8);
            cols[k] = lfs3_crc32c(0, x, 4+6) ^ base;
            x[6 + k/8] ^= 1 << (k%8);
            sels[k] = (uint32_t)1 << k;
        }

        // gauss-jordan, until cols[k] = 1 << k
        for (int k = 0; k < 32; k++) {
            int p = k;
            while (p < 32 && !(cols[p] & ((uint32_t)1 << k))) {
                p += 1;
            }
            assert(p < 32);
            LFS3_SWAP(uint32_t, &cols[k], &cols[p]);
            LFS3_SWAP(uint32_t, &sels[k], &sels[p]);
            for (int j = 0; j < 32; j++) {
                if (j != k && (cols[j] & ((uint32_t)1 << k))) {
                    cols[j] ^= cols[k];
                    sels[j] ^= sels[k];
                }
            }
        }

        uint32_t fix = 0;
        for (int k = 0; k < 32; k++) {
            if ((target ^ base) & ((uint32_t)1 << k)) {
                fix ^= sels[k];
            }
        }
        for (int k = 0; k < 32; k++) {
            if (fix & ((uint32_t)1 << k)) {
                x[6 + k/8] ^= 1 << (k%8);
            }
        }
        assert(lfs3_crc32c(0, x, 4+6) == target);

        x[0] |= buf[off] & 0x80;
        memcpy(&buf[off], x, 4+6);
        CFG->erase(CFG, block) => 0;
        CFG->prog(CFG, block, 0, buf, BLOCK_SIZE) => 0;
        free(buf);
    }

    // mount should now fail
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => LFS3_ERR_NOTSUP;
    lfs3_mount(&lfs3, LFS3_M_RDONLY, CFG) => LFS3_ERR_NOTSUP;
'''

# test what happens if we find an unknown file type
[cases.test_mount_incompat_unknown_type]
in = 'lfs3.c'
code = '''
    // create a superblock
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;

    // create some files
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "a",
            LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
    lfs3_file_write(&lfs3, &file,
            "hi a!", strlen("hi a!")) => strlen("hi a!");
    lfs3_file_close(&lfs3, &file) => 0;
    lfs3_file_open(&lfs3, &file, "b",
            LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
    lfs3_file_write(&lfs3, &file,
            "oh no!", strlen("oh no!")) => strlen("oh no!");
    lfs3_file_close(&lfs3, &file) => 0;
    lfs3_file_open(&lfs3, &file, "c",
            LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
    lfs3_file_write(&lfs3, &file,
            "hi c!", strlen("hi c!")) => strlen("hi c!");
    lfs3_file_close(&lfs3, &file) => 0;
    lfs3_unmount(&lfs3) => 0;

    // change a file's type to something unknown
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
    const char *path = "b";
    lfs3_mdir_t mdir;
    lfs3_did_t did;
    lfs3_mtree_pathlookup(&lfs3, &path,
            &mdir, &did) => LFS3_TAG_REG;
    lfs3_mdir_commit(&lfs3, &mdir, LFS3_RATTRS(
            LFS3_RATTR(3, LFS3_tag_MASK8 | (LFS3_TAG_NAME + 0x13), 0,
                LFS3_FROM_NAME),
            LFS3_RATTR_ARG(did),
            LFS3_RATTR_ARG(path),
            LFS3_RATTR_NULL)) => 0;
    lfs3_unmount(&lfs3) => 0;

    // mount
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    // our file should appear as an unknown type
    struct lfs3_info info;
    lfs3_stat(&lfs3, "b", &info) => 0;
    assert(strcmp(info.name, "b") == 0);
    assert(info.type == LFS3_TYPE_UNKNOWN);
    assert(info.size == 0);

    lfs3_dir_t dir;
    lfs3_dir_open(&lfs3, &dir, "/") => 0;
    lfs3_dir_read(&lfs3, &dir, &info) => 0;
    assert(strcmp(info.name, ".") == 0);
    assert(info.type == LFS3_TYPE_DIR);
    assert(info.size == 0);
    lfs3_dir_read(&lfs3, &dir, &info) => 0;
    assert(strcmp(info.name, "..") == 0);
    assert(info.type == LFS3_TYPE_DIR);
    assert(info.size == 0);
    lfs3_dir_read(&lfs3, &dir, &info) => 0;
    assert(strcmp(info.name, "a") == 0);
    assert(info.type == LFS3_TYPE_REG);
    assert(info.size == strlen("hi a!"));
    lfs3_dir_read(&lfs3, &dir, &info) => 0;
    assert(strcmp(info.name, "b") == 0);
    assert(info.type == LFS3_TYPE_UNKNOWN);
    assert(info.size == 0);
    lfs3_dir_read(&lfs3, &dir, &info) => 0;
    assert(strcmp(info.name, "c") == 0);
    assert(info.type == LFS3_TYPE_REG);
    assert(info.size == strlen("hi c!"));
    lfs3_dir_read(&lfs3, &dir, &info) => LFS3_ERR_NOENT;
    lfs3_dir_close(&lfs3, &dir) => 0;

    // open/mkdir should error
    lfs3_file_open(&lfs3, &file, "b",
            LFS3_O_RDONLY) => LFS3_ERR_NOTSUP;
    lfs3_file_open(&lfs3, &file, "b",
            LFS3_O_WRONLY | LFS3_O_CREAT) => LFS3_ERR_NOTSUP;

    lfs3_mkdir(&lfs3, "b") => LFS3_ERR_EXIST;

    lfs3_unmount(&lfs3) => 0;
'''

