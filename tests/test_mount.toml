    lfs3_mdir_commit(&lfs3, &lfs3.mroot, LFS3_RATTRS(
            LFS3_RATTR(3, LFS3_TAG_WCOMPAT, 0, LFS3_FROM_DATA),
            LFS3_RATTR_ARG(sizeof(wcompat_buf)),
            LFS3_RATTR_ARG(wcompat_buf),
            LFS3_RATTR_NULL)) => 0;
