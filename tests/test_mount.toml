    // mount should now fail
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => LFS3_ERR_NOTSUP;

    // but we _can_ mount readonly
    lfs3_mount(&lfs3, LFS3_M_RDONLY, CFG) => 0;
    lfs3_unmount(&lfs3) => 0;
'''

