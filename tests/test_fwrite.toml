        lfs3_file_write(&lfs3, &file, &wbuf[i_], chunk_) => chunk_;

        // sync?
        if (SYNC) {
            lfs3_file_sync(&lfs3, &file) => 0;
        }

        // remount?
        if (REMOUNT) {
            lfs3_file_close(&lfs3, &file) => 0;
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
            lfs3_file_open(&lfs3, &file, "hello", LFS3_O_WRONLY) => 0;
        }
