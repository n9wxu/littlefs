    uint32_t prng = 42;
    for (lfs3_size_t i = 0; i < SIZE; i++) {
        wbuf[i] = 'a' + (TEST_PRNG(&prng) % 26);
    }
    for (lfs3_size_t i = 0; i < SIZE; i += CHUNK) {
        lfs3_file_write(&lfs3, &file, &wbuf[i], lfs3_min(CHUNK, SIZE-i))
                => lfs3_min(CHUNK, SIZE-i);

        // sync?
        if (SYNC) {
            lfs3_file_sync(&lfs3, &file) => 0;
