# test that appends respect the file limit, appends ignore pos
[cases.test_fwrite_append_fbig]
defines.LIMIT = [
    '2*FCACHE_SIZE',
    'BLOCK_SIZE/2',
    '2*BLOCK_SIZE',
]
defines.SIZE = [
    'FCACHE_SIZE/2',
    '2*FCACHE_SIZE',
    'BLOCK_SIZE/2',
    '2*BLOCK_SIZE',
]
defines.MODE = ['LFS3_O_WRONLY', 'LFS3_O_RDWR']
if = [
    'SIZE <= LIMIT',
    # this just saves testing time
    'LIMIT <= 4*1024*FRAGMENT_SIZE',
]
code = '''
    struct lfs3_cfg cfg = *CFG;
    cfg.file_limit = LIMIT;
    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR, &cfg) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;

    // simulate our file in ram
    uint8_t sim[LIMIT];
    uint32_t prng = 42;
    for (lfs3_size_t i = 0; i < LIMIT; i++) {
        sim[i] = 'a' + (TEST_PRNG(&prng) % 26);
    }

    // create a file, seeking to the file limit shouldn't prevent
    // appends
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "hello",
            MODE | LFS3_O_CREAT | LFS3_O_EXCL | LFS3_O_APPEND) => 0;
    lfs3_file_seek(&lfs3, &file, LIMIT, LFS3_SEEK_SET) => LIMIT;
    lfs3_file_write(&lfs3, &file, sim, SIZE) => SIZE;
    lfs3_file_sync(&lfs3, &file) => 0;

    // seeking to the start shouldn't let appends exceed the file limit
    lfs3_file_rewind(&lfs3, &file) => 0;
    lfs3_file_write(&lfs3, &file, &sim[SIZE], LIMIT-SIZE+1)
            => LFS3_ERR_FBIG;
    lfs3_file_close(&lfs3, &file) => 0;

    // but we should be able to append up to the file limit
    lfs3_file_open(&lfs3, &file, "hello", MODE | LFS3_O_APPEND) => 0;
    lfs3_file_write(&lfs3, &file, &sim[SIZE], LIMIT-SIZE) => LIMIT-SIZE;
    lfs3_file_sync(&lfs3, &file) => 0;
    lfs3_file_rewind(&lfs3, &file) => 0;
    lfs3_file_write(&lfs3, &file, &sim[SIZE], 1) => LFS3_ERR_FBIG;
    lfs3_file_close(&lfs3, &file) => 0;

    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;
        }

        // check our file with stat
        struct lfs3_info info;
        lfs3_stat(&lfs3, "hello", &info) => 0;
        assert(strcmp(info.name, "hello") == 0);
        assert(info.type == LFS3_TYPE_REG);
        assert(info.size == LIMIT);

        // try reading our file
        lfs3_file_open(&lfs3, &file, "hello", LFS3_O_RDONLY) => 0;
        // is size correct?
        lfs3_file_size(&lfs3, &file) => LIMIT;
        // try reading
        uint8_t rbuf[2*LIMIT];
        memset(rbuf, 0xaa, 2*LIMIT);
        lfs3_file_read(&lfs3, &file, rbuf, 2*LIMIT) => LIMIT;
        // does our file match our simulation?
        assert(memcmp(rbuf, sim, LIMIT) == 0);
        lfs3_file_close(&lfs3, &file) => 0;
    }

    lfs3_unmount(&lfs3) => 0;
'''

# test a sparse file that ends at the largest possible file size
[cases.test_fwrite_filemax]
defines.SIZE = 16
# INIT=0 => only the data at the end
# INIT=1 => data at the start and the end
defines.INIT = [0, 1]
defines.MODE = ['LFS3_O_WRONLY', 'LFS3_O_RDWR']
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR, CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    uint8_t head[SIZE];
    uint8_t tail[SIZE];
    uint32_t prng = 42;
    for (lfs3_size_t i = 0; i < SIZE; i++) {
        head[i] = 'a' + (TEST_PRNG(&prng) % 26);
        tail[i] = 'a' + (TEST_PRNG(&prng) % 26);
    }

    // write SIZE bytes ending at byte LFS3_FILE_MAX-1
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "hello",
            MODE | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
    if (INIT == 1) {
        lfs3_file_write(&lfs3, &file, head, SIZE) => SIZE;
    }
    lfs3_file_seek(&lfs3, &file, LFS3_FILE_MAX-SIZE, LFS3_SEEK_SET)
            => LFS3_FILE_MAX-SIZE;
    lfs3_file_write(&lfs3, &file, tail, SIZE) => SIZE;
    lfs3_file_size(&lfs3, &file) => LFS3_FILE_MAX;
    lfs3_file_tell(&lfs3, &file) => LFS3_FILE_MAX;
    lfs3_file_close(&lfs3, &file) => 0;

    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
        }

        struct lfs3_info info;
        lfs3_stat(&lfs3, "hello", &info) => 0;
        assert(info.type == LFS3_TYPE_REG);
        assert(info.size == LFS3_FILE_MAX);

        lfs3_file_open(&lfs3, &file, "hello", LFS3_O_RDONLY) => 0;
        lfs3_file_size(&lfs3, &file) => LFS3_FILE_MAX;
        uint8_t rbuf[2*SIZE];
        uint8_t zeros[SIZE];
        memset(zeros, 0, SIZE);
        // the start
        memset(rbuf, 0xaa, 2*SIZE);
        lfs3_file_read(&lfs3, &file, rbuf, SIZE) => SIZE;
        assert(memcmp(rbuf, (INIT == 1) ? head : zeros, SIZE) == 0);
        // the middle of the hole
        lfs3_file_seek(&lfs3, &file, LFS3_FILE_MAX/2, LFS3_SEEK_SET)
                => LFS3_FILE_MAX/2;
        memset(rbuf, 0xaa, 2*SIZE);
        lfs3_file_read(&lfs3, &file, rbuf, SIZE) => SIZE;
        assert(memcmp(rbuf, zeros, SIZE) == 0);
        // the end of the hole and the last bytes
        lfs3_file_seek(&lfs3, &file, LFS3_FILE_MAX-2*SIZE, LFS3_SEEK_SET)
                => LFS3_FILE_MAX-2*SIZE;
        memset(rbuf, 0xaa, 2*SIZE);
        lfs3_file_read(&lfs3, &file, rbuf, 2*SIZE+1) => 2*SIZE;
        assert(memcmp(rbuf, zeros, SIZE) == 0);
        assert(memcmp(&rbuf[SIZE], tail, SIZE) == 0);
        lfs3_file_read(&lfs3, &file, rbuf, 1) => 0;
        lfs3_file_close(&lfs3, &file) => 0;

        lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
    }

    // nothing fits past the end
    lfs3_file_open(&lfs3, &file, "hello", MODE) => 0;
    lfs3_file_seek(&lfs3, &file, 0, LFS3_SEEK_END) => LFS3_FILE_MAX;
    lfs3_file_write(&lfs3, &file, tail, 1) => LFS3_ERR_FBIG;
    lfs3_file_close(&lfs3, &file) => 0;

    // fruncate to the last SIZE bytes
    lfs3_file_open(&lfs3, &file, "hello", MODE) => 0;
    lfs3_file_fruncate(&lfs3, &file, SIZE) => 0;
    lfs3_file_size(&lfs3, &file) => SIZE;
    lfs3_file_close(&lfs3, &file) => 0;

    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
        }

        struct lfs3_info info;
        lfs3_stat(&lfs3, "hello", &info) => 0;
        assert(info.type == LFS3_TYPE_REG);
        assert(info.size == SIZE);

        lfs3_file_open(&lfs3, &file, "hello", LFS3_O_RDONLY) => 0;
        uint8_t rbuf[2*SIZE];
        memset(rbuf, 0xaa, 2*SIZE);
        lfs3_file_read(&lfs3, &file, rbuf, 2*SIZE) => SIZE;
        assert(memcmp(rbuf, tail, SIZE) == 0);
        lfs3_file_close(&lfs3, &file) => 0;

        lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
    }

    lfs3_unmount(&lfs3) => 0;
'''

# fuzz reads, writes, truncates and fruncates in the last bytes of a file
# that ends at or near the largest possible file size, so the bids, rids
# and weights in its tree stay near 2^31
[cases.test_fwrite_filemax_fuzz]
defines.N = 40
defines.SIZE = [
    '2*FCACHE_SIZE',
    'BLOCK_SIZE/2',
    '2*BLOCK_SIZE',
]
# chunk is more an upper limit here
defines.CHUNK = [64, 16]
# INIT=0 => a hole up to the last SIZE bytes
# INIT=1 => a hole, then the last SIZE bytes filled with data
defines.INIT = [0, 1]
defines.SYNC = [false, true]
defines.REMOUNT = [false, true]
defines.SEED = 'range(10)'
fuzz = 'SEED'
if = 'CHUNK <= SIZE'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR, CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    // simulate the last 2*SIZE bytes of our file in ram, we only write
    // the last SIZE bytes, and never fruncate data out of the simulation,
    // so everything before it stays zero
    const lfs3_off_t lo = LFS3_FILE_MAX - 2*SIZE;
    const lfs3_off_t base = LFS3_FILE_MAX - SIZE;
    uint8_t sim[2*SIZE];
    memset(sim, 0, 2*SIZE);
    lfs3_off_t size;
    uint32_t prng = SEED;

    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "hello",
            LFS3_O_RDWR | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
    if (INIT == 0) {
        lfs3_file_truncate(&lfs3, &file, base) => 0;
        size = base;
    } else {
        for (lfs3_size_t i = 0; i < SIZE; i++) {
            sim[SIZE+i] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_seek(&lfs3, &file, base, LFS3_SEEK_SET) => base;
        lfs3_file_write(&lfs3, &file, &sim[SIZE], SIZE) => SIZE;
        size = LFS3_FILE_MAX;
    }

    for (lfs3_size_t i = 0; i < N; i++) {
        // are we reading, writing, truncating, or fruncating
        uint8_t op = TEST_PRNG(&prng) % 4;

        // writing?
        if (op == 0) {
            // choose a random location in the last SIZE bytes
            lfs3_off_t off = base + (TEST_PRNG(&prng) % SIZE);
            // and a random size, up to the chunk size
            lfs3_size_t chunk = lfs3_min(
                    (TEST_PRNG(&prng) % CHUNK) + 1,
                    LFS3_FILE_MAX - off);

            // update the sim
            for (lfs3_size_t j = 0; j < chunk; j++) {
                sim[off-lo+j] = 'a' + (TEST_PRNG(&prng) % 26);
            }
            size = lfs3_max(size, off+chunk);

            // update the file
            lfs3_file_seek(&lfs3, &file, off, LFS3_SEEK_SET) => off;
            lfs3_file_write(&lfs3, &file, &sim[off-lo], chunk) => chunk;

        // reading?
        } else if (op == 1) {
            // choose a random location in the last 2*SIZE bytes
            lfs3_off_t off = lo + (TEST_PRNG(&prng) % (2*SIZE));
            // and a random size, up to the chunk size
            lfs3_size_t chunk = lfs3_min(
                    (TEST_PRNG(&prng) % CHUNK) + 1,
                    LFS3_FILE_MAX - off);

            // we may read less than chunk if we're past eof
            lfs3_off_t expected = lfs3_min(
                    chunk,
                    size - lfs3_min(off, size));

            // read the file and assert we got the correct data
            lfs3_file_seek(&lfs3, &file, off, LFS3_SEEK_SET) => off;
            uint8_t rbuf[CHUNK];
            memset(rbuf, 0xaa, CHUNK);
            lfs3_file_read(&lfs3, &file, rbuf, chunk) => expected;
            assert(memcmp(rbuf, &sim[off-lo], expected) == 0);

        // truncating?
        } else if (op == 2) {
            // choose a random new file size in the last SIZE bytes
            lfs3_off_t size_ = base + (TEST_PRNG(&prng) % (SIZE+1));

            // update the sim
            if (size_ < size) {
                memset(&sim[size_-lo], 0, size-size_);
            }
            size = size_;

            // truncate the file
            lfs3_file_truncate(&lfs3, &file, size_) => 0;

        // fruncating?
        } else if (op == 3) {
            // choose a random new file size in the last SIZE bytes that
            // doesn't shift data out of the sim
            lfs3_off_t lead = 0;
            while (lead < 2*SIZE && !sim[lead]) {
                lead += 1;
            }
            lfs3_off_t min = lfs3_max(base, size - lead);
            lfs3_off_t size_ = min
                    + (TEST_PRNG(&prng) % (LFS3_FILE_MAX - min + 1));

            // update the sim
            if (size_ > size) {
                memmove(&sim[size_-size], sim, 2*SIZE-(size_-size));
                memset(sim, 0, size_-size);
            } else if (size_ < size) {
                memmove(sim, &sim[size-size_], 2*SIZE-(size-size_));
                memset(&sim[2*SIZE-(size-size_)], 0, size-size_);
            }
            size = size_;

            // fruncate the file
            lfs3_file_fruncate(&lfs3, &file, size_) => 0;
        }

        // sync?
        if (SYNC) {
            lfs3_file_sync(&lfs3, &file) => 0;
        }

        // remount?
        if (REMOUNT) {
            lfs3_file_close(&lfs3, &file) => 0;
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
            lfs3_file_open(&lfs3, &file, "hello", LFS3_O_RDWR) => 0;
        }
    }
    lfs3_file_close(&lfs3, &file) => 0;

    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
        }

        // check our file with stat
        struct lfs3_info info;
        lfs3_stat(&lfs3, "hello", &info) => 0;
        assert(info.type == LFS3_TYPE_REG);
        assert(info.size == size);

        lfs3_file_open(&lfs3, &file, "hello", LFS3_O_RDONLY) => 0;
        lfs3_file_size(&lfs3, &file) => size;
        uint8_t rbuf[2*SIZE];
        uint8_t zeros[SIZE];
        memset(zeros, 0, SIZE);
        // the start of the hole
        memset(rbuf, 0xaa, 2*SIZE);
        lfs3_file_read(&lfs3, &file, rbuf, SIZE) => SIZE;
        assert(memcmp(rbuf, zeros, SIZE) == 0);
        // does the rest of our file match our simulation?
        lfs3_file_seek(&lfs3, &file, lo, LFS3_SEEK_SET) => lo;
        memset(rbuf, 0xaa, 2*SIZE);
        lfs3_file_read(&lfs3, &file, rbuf, 2*SIZE) => size - lo;
        assert(memcmp(rbuf, sim, size - lo) == 0);
        lfs3_file_close(&lfs3, &file) => 0;

        lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
    }

    lfs3_unmount(&lfs3) => 0;
'''

# test a file_limit below LFS3_FILE_MAX, writes, seeks, truncates, and
# fruncates can reach the limit but not pass it
[cases.test_fwrite_file_limit]
defines.LIMIT = [1, 1000, 65536]
defines.SIZE = [
    '1',
    'FCACHE_SIZE/2',
    '2*FCACHE_SIZE',
    'BLOCK_SIZE/2',
    '2*BLOCK_SIZE',
]
# OP=0 => write
# OP=1 => truncate
# OP=2 => fruncate
defines.OP = [0, 1, 2]
defines.MODE = ['LFS3_O_WRONLY', 'LFS3_O_RDWR']
if = 'SIZE <= LIMIT'
code = '''
    struct lfs3_cfg cfg = *CFG;
    cfg.file_limit = LIMIT;
    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR, &cfg) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;

    struct lfs3_fsinfo fsinfo;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.file_limit == LIMIT);

    // simulate our file in ram
    uint8_t *sim = malloc(LIMIT);
    assert(sim);
    memset(sim, 0, LIMIT);
    uint32_t prng = 42;
    for (lfs3_size_t i = 0; i < SIZE; i++) {
        sim[i] = 'a' + (TEST_PRNG(&prng) % 26);
    }
    lfs3_off_t size = SIZE;
    uint8_t wbuf[SIZE];
    for (lfs3_size_t i = 0; i < SIZE; i++) {
        wbuf[i] = 'a' + (TEST_PRNG(&prng) % 26);
    }

    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "hello",
            LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
    lfs3_file_write(&lfs3, &file, sim, SIZE) => SIZE;
    lfs3_file_close(&lfs3, &file) => 0;

    for (int step = 0; step < 2; step++) {
        lfs3_file_open(&lfs3, &file, "hello", MODE) => 0;
        // seeks can reach the limit, but not pass it
        lfs3_file_seek(&lfs3, &file, LIMIT, LFS3_SEEK_SET) => LIMIT;
        lfs3_file_seek(&lfs3, &file, LIMIT+1, LFS3_SEEK_SET)
                => LFS3_ERR_INVAL;
        lfs3_file_tell(&lfs3, &file) => LIMIT;

        if (step == 0) {
            // try to pass the limit, this should fail and change nothing
            if (OP == 0) {
                lfs3_file_seek(&lfs3, &file, LIMIT-(SIZE/2), LFS3_SEEK_SET)
                        => LIMIT-(SIZE/2);
                lfs3_file_write(&lfs3, &file, wbuf, SIZE) => LFS3_ERR_FBIG;
            } else if (OP == 1) {
                lfs3_file_truncate(&lfs3, &file, LIMIT+1) => LFS3_ERR_FBIG;
                lfs3_file_truncate(&lfs3, &file, LIMIT+SIZE)
                        => LFS3_ERR_FBIG;
            } else {
                lfs3_file_fruncate(&lfs3, &file, LIMIT+1) => LFS3_ERR_FBIG;
                lfs3_file_fruncate(&lfs3, &file, LIMIT+SIZE)
                        => LFS3_ERR_FBIG;
            }

        } else {
            // reach the limit exactly, this should succeed
            if (OP == 0) {
                lfs3_file_seek(&lfs3, &file, LIMIT-SIZE, LFS3_SEEK_SET)
                        => LIMIT-SIZE;
                lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
                memcpy(&sim[LIMIT-SIZE], wbuf, SIZE);
            } else if (OP == 1) {
                lfs3_file_truncate(&lfs3, &file, LIMIT) => 0;
            } else {
                lfs3_file_fruncate(&lfs3, &file, LIMIT) => 0;
                memmove(&sim[LIMIT-size], sim, size);
                memset(sim, 0, LIMIT-size);
            }
            size = LIMIT;
            lfs3_file_size(&lfs3, &file) => LIMIT;
            lfs3_file_sync(&lfs3, &file) => 0;

            // but one more byte fails
            lfs3_file_seek(&lfs3, &file, 0, LFS3_SEEK_END) => LIMIT;
            lfs3_file_write(&lfs3, &file, wbuf, 1) => LFS3_ERR_FBIG;
        }
        lfs3_file_close(&lfs3, &file) => 0;

        for (int remount = 0; remount < 2; remount++) {
            // remount?
            if (remount) {
                lfs3_unmount(&lfs3) => 0;
                lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;
            }

            // check our file with stat
            struct lfs3_info info;
            lfs3_stat(&lfs3, "hello", &info) => 0;
            assert(info.type == LFS3_TYPE_REG);
            assert(info.size == size);

            // try reading our file
            lfs3_file_open(&lfs3, &file, "hello", LFS3_O_RDONLY) => 0;
            lfs3_file_size(&lfs3, &file) => size;
            uint8_t *rbuf = malloc(LIMIT+1);
            assert(rbuf);
            memset(rbuf, 0xaa, LIMIT+1);
            lfs3_file_read(&lfs3, &file, rbuf, LIMIT+1) => size;
            assert(memcmp(rbuf, sim, size) == 0);
            free(rbuf);
            lfs3_file_close(&lfs3, &file) => 0;

            lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
        }
    }

    free(sim);
    lfs3_unmount(&lfs3) => 0;
'''


# heavy fuzz test with rw seeks, truncate, and fruncate
[cases.test_fwrite_rwtf_fuzz]
defines.N = 20
defines.SIZE = [
    'FCACHE_SIZE/2',
    '2*FCACHE_SIZE',
    'BLOCK_SIZE/2',
    'BLOCK_SIZE',
    '2*BLOCK_SIZE',
    '4*BLOCK_SIZE',
]
# chunk is more an upper limit here
defines.CHUNK = [64, 16]
# INIT=0 => no init
# INIT=1 => fill with data
# INIT=2 => truncate to size
defines.INIT = [0, 1, 2]
defines.SYNC = [false, true]
defines.REMOUNT = [false, true]
defines.SEED = 'range(10)'
fuzz = 'SEED'
if = [
    'CHUNK <= SIZE',
    # this just saves testing time
    'SIZE <= 4*1024*FRAGMENT_SIZE',
]
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR, CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    // create a file
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "hello",
            LFS3_O_RDWR | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
    // simulate our file in ram
    uint8_t sim[SIZE];
    lfs3_off_t size;
    uint32_t prng = SEED;
    if (INIT == 0) {
        memset(sim, 0, SIZE);
        size = 0;
    } else if (INIT == 1) {
        for (lfs3_size_t i = 0; i < SIZE; i++) {
            sim[i] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file, sim, SIZE) => SIZE;
        size = SIZE;
    } else {
        memset(sim, 0, SIZE);
        lfs3_file_truncate(&lfs3, &file, SIZE) => 0;
        size = SIZE;
    }

    // sync?
    if (SYNC) {
        lfs3_file_sync(&lfs3, &file) => 0;
    }

    // remount?
    if (REMOUNT) {
        lfs3_file_close(&lfs3, &file) => 0;
        lfs3_unmount(&lfs3) => 0;
        lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
        lfs3_file_open(&lfs3, &file, "hello", LFS3_O_RDWR) => 0;
    }

    for (lfs3_size_t i = 0; i < N; i++) {
        // and if we are reading, writing, truncating, or fruncating
        uint8_t op = TEST_PRNG(&prng) % 4;

        // writing?
        if (op == 0) {
            // choose a random location
            lfs3_off_t off = TEST_PRNG(&prng) % SIZE;
            // and a random size, up to the chunk size
            lfs3_size_t chunk = lfs3_min(
                    (TEST_PRNG(&prng) % (CHUNK+1-1)) + 1,
                    SIZE - off);

            // seek
            lfs3_file_seek(&lfs3, &file, off, LFS3_SEEK_SET) => off;

            // update the sim
            for (lfs3_size_t j = 0; j < chunk; j++) {
                sim[off+j] = 'a' + (TEST_PRNG(&prng) % 26);
            }
            size = lfs3_max(size, off+chunk);

            // update the file
            lfs3_file_write(&lfs3, &file, &sim[off], chunk) => chunk;

            // sync?
            if (SYNC) {
                lfs3_file_sync(&lfs3, &file) => 0;
            }

            // remount?
            if (REMOUNT) {
                lfs3_file_close(&lfs3, &file) => 0;
                lfs3_unmount(&lfs3) => 0;
                lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
                lfs3_file_open(&lfs3, &file, "hello", LFS3_O_RDWR) => 0;
            }

        // reading?
        } else if (op == 1) {
            // choose a random location
            lfs3_off_t off = TEST_PRNG(&prng) % SIZE;
            // and a random size, up to the chunk size
            lfs3_size_t chunk = lfs3_min(
                    (TEST_PRNG(&prng) % (CHUNK+1-1)) + 1,
                    SIZE - off);

            // seek
            lfs3_file_seek(&lfs3, &file, off, LFS3_SEEK_SET) => off;

            // we may read less than chunk if we're past eof
            lfs3_off_t expected = lfs3_min(
                    chunk,
                    size - lfs3_min(off, size));

            // read the file and assert we got the correct data
            uint8_t rbuf[2*SIZE];
            memset(rbuf, 0xaa, 2*SIZE);
            lfs3_file_read(&lfs3, &file, rbuf, chunk) => expected;
            assert(memcmp(rbuf, &sim[off], expected) == 0);

        // truncating?
        } else if (op == 2) {
            // choose a random new file size
            lfs3_off_t size_ = TEST_PRNG(&prng) % SIZE;

            // update the sim
            if (size_ < size) {
                memset(sim+size_, 0, size-size_);
            }
            size = size_;

            // truncate the file
            lfs3_file_truncate(&lfs3, &file, size_) => 0;

        // fruncating?
        } else if (op == 3) {
            // choose a random new file size
            lfs3_off_t size_ = TEST_PRNG(&prng) % SIZE;

            // update the sim
            if (size_ > size) {
                memmove(sim+size_-size, sim, size);
                memset(sim, 0, size_-size);
            } else if (size_ < size) {
                memmove(sim, sim+size-size_, size_);
                memset(sim+size_, 0, size-size_);
            }
            size = size_;

            // truncate the file
            lfs3_file_fruncate(&lfs3, &file, size_) => 0;
        }
    }
    lfs3_file_close(&lfs3, &file) => 0;

    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
        }

        // check our file with stat
        struct lfs3_info info;
        lfs3_stat(&lfs3, "hello", &info) => 0;
        assert(strcmp(info.name, "hello") == 0);
        assert(info.type == LFS3_TYPE_REG);
        assert(info.size == size);

        // and with dir read
        lfs3_dir_t dir;
        lfs3_dir_open(&lfs3, &dir, "/") => 0;
        lfs3_dir_read(&lfs3, &dir, &info) => 0;
        assert(strcmp(info.name, ".") == 0);
        assert(info.type == LFS3_TYPE_DIR);
        assert(info.size == 0);
        lfs3_dir_read(&lfs3, &dir, &info) => 0;
        assert(strcmp(info.name, "..") == 0);
        assert(info.type == LFS3_TYPE_DIR);
        assert(info.size == 0);
        lfs3_dir_read(&lfs3, &dir, &info) => 0;
        assert(strcmp(info.name, "hello") == 0);
        assert(info.type == LFS3_TYPE_REG);
        assert(info.size == size);
        lfs3_dir_read(&lfs3, &dir, &info) => LFS3_ERR_NOENT;
        lfs3_dir_close(&lfs3, &dir) => 0;

        // try reading our file
        lfs3_file_open(&lfs3, &file, "hello", LFS3_O_RDONLY) => 0;
        // is size correct?
        lfs3_file_size(&lfs3, &file) => size;
        // try reading
        uint8_t rbuf[2*SIZE];
        memset(rbuf, 0xaa, 2*SIZE);
        lfs3_file_read(&lfs3, &file, rbuf, 2*SIZE) => size;
        // does our file match our simulation?
        assert(memcmp(rbuf, sim, size) == 0);
        lfs3_file_close(&lfs3, &file) => 0;
    }

    lfs3_unmount(&lfs3) => 0;
'''

