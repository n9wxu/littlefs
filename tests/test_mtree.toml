[cases.test_mtree_drop_fuzz]
defines.N = [5, 10, 20, 40, 80, 160]
defines.FORCE_COMPACTION = [false, true]
defines.SEED = 'range(100)'
fuzz = 'SEED'
in = 'lfs3.c'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR | F_FLAGS, CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR | M_FLAGS, CFG) => 0;
    lfs3_alloc_ckpoint(&lfs3);

    bool sim[N];
    for (lfs3_size_t i = 0; i < N; i++) {
        sim[i] = false;
    }

    uint32_t prng = SEED;
    for (lfs3_size_t i = 0; i < N; i++) {
        // choose a pseudo-random name
        lfs3_size_t x = TEST_PRNG(&prng) % N;
        char name[256];
        name[0] = '\0';
        sprintf(name+1, "%03x", x);
        // choose to create or delete
        uint8_t op = TEST_PRNG(&prng) % 2;

        // create
        if (op == 0) {
            // update sim
            sim[x] = true;

            // update mtree
            lfs3_mdir_t mdir;
            lfs3_stag_t tag = lfs3_mtree_namelookup(&lfs3, 0, name+1, 3,
                    &mdir, NULL);
            assert(tag >= 0 || tag == LFS3_ERR_NOENT);
            if (tag != LFS3_ERR_NOENT) {
                continue;
            }
            // force a compaction?
            if (FORCE_COMPACTION) {
                lfs3.mroot.r.eoff = -1;
                mdir.r.eoff = -1;
            }
            lfs3_mdir_commit(&lfs3, &mdir, LFS3_RATTRS(
                    LFS3_RATTR(4, LFS3_TAG_REG, +1, LFS3_FROM_NAME),
                    LFS3_RATTR_ARG(0),
                    LFS3_RATTR_ARG(name+1),
                    LFS3_RATTR_ARG(3),
                    LFS3_RATTR_NULL)) => 0;
            lfs3_data_t data;

            // double check
            uint8_t buffer[256];
            lfs3_mdir_lookup(&lfs3, &mdir, LFS3_TAG_REG,
                    &data) => LFS3_TAG_REG;
            lfs3_data_read(&lfs3, &data, buffer, sizeof(buffer)) => 4;
            assert(memcmp(buffer, name, 4) == 0);

        // delete
        } else {
            // update sim
            sim[x] = false;

            // update mtree
            lfs3_mdir_t mdir;
            lfs3_stag_t tag = lfs3_mtree_namelookup(&lfs3, 0, name+1, 3,
                    &mdir, NULL);
            assert(tag >= 0 || tag == LFS3_ERR_NOENT);
            if (tag == LFS3_ERR_NOENT) {
                continue;
            }
            // force a compaction?
            if (FORCE_COMPACTION) {
                lfs3.mroot.r.eoff = -1;
                mdir.r.eoff = -1;
            }
            lfs3_mdir_commit(&lfs3, &mdir, LFS3_RATTRS(
                    LFS3_RATTR(1, LFS3_tag_RM, -1),
                    LFS3_RATTR_NULL)) => 0;
        }
    }

    // try looking up each entry
    lfs3_mdir_t mdir;
    lfs3_mtree_lookup(&lfs3, 0, &mdir) => 0;
    lfs3_data_t data;
    uint8_t buffer[256];
    lfs3_mdir_lookup(&lfs3, &mdir, LFS3_TAG_BOOKMARK,
            &data) => LFS3_TAG_BOOKMARK;
    lfs3_data_read(&lfs3, &data, buffer, sizeof(buffer)) => 1;
    for (lfs3_size_t i = 0; i < N; i++) {
        char name[256];
        name[0] = '\0';
        sprintf(name+1, "%03x", i);
        if (sim[i]) {
            lfs3_mtree_namelookup(&lfs3, 0, name+1, 3,
                    &mdir, NULL) => LFS3_TAG_REG;
            lfs3_mdir_lookup(&lfs3, &mdir, LFS3_TAG_REG,
                    &data) => LFS3_TAG_REG;
            lfs3_data_read(&lfs3, &data, buffer, sizeof(buffer)) => 4;
            assert(memcmp(buffer, name, 4) == 0);
        } else {
            lfs3_mtree_namelookup(&lfs3, 0, name+1, 3,
                    &mdir, NULL) => LFS3_ERR_NOENT;
        }
    }

    // check things stay sane after remount
    lfs3_unmount(&lfs3) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR | M_FLAGS, CFG) => 0;

    // try looking up each entry
    lfs3_mtree_lookup(&lfs3, 0, &mdir) => 0;
    lfs3_mdir_lookup(&lfs3, &mdir, LFS3_TAG_BOOKMARK,
            &data) => LFS3_TAG_BOOKMARK;
    lfs3_data_read(&lfs3, &data, buffer, sizeof(buffer)) => 1;
    for (lfs3_size_t i = 0; i < N; i++) {
        char name[256];
        name[0] = '\0';
        sprintf(name+1, "%03x", i);
        if (sim[i]) {
            lfs3_mtree_namelookup(&lfs3, 0, name+1, 3,
                    &mdir, NULL) => LFS3_TAG_REG;
            lfs3_mdir_lookup(&lfs3, &mdir, LFS3_TAG_REG,
                    &data) => LFS3_TAG_REG;
            lfs3_data_read(&lfs3, &data, buffer, sizeof(buffer)) => 4;
            assert(memcmp(buffer, name, 4) == 0);
        } else {
            lfs3_mtree_namelookup(&lfs3, 0, name+1, 3,
                    &mdir, NULL) => LFS3_ERR_NOENT;
        }
    }

    lfs3_unmount(&lfs3) => 0;
'''


# drop under powerloss
#
# Our progress is kept in a reserved attribute on the mroot, committed
# after each step. Every step is idempotent, so the step in progress is
# either complete or absent, and can always be redone
#
[cases.test_mtree_drop_pl]
defines.POWERLOSS_BEHAVIOR = [
    'LFS3_EMUBD_POWERLOSS_ATOMIC',
    'LFS3_EMUBD_POWERLOSS_SOMEBITS',
    'LFS3_EMUBD_POWERLOSS_MOSTBITS',
    'LFS3_EMUBD_POWERLOSS_OOO',
]
defines.N = [5, 10, 20, 40, 80, 160]
defines.FORCE_COMPACTION = [false, true]
defines.H = 2
defines.SEED = 'range(10)'
fuzz = 'SEED'
reentrant = true
in = 'lfs3.c'
code = '''
    // format once per test
    lfs3_t lfs3;
    int err = lfs3_mount(&lfs3, LFS3_M_RDWR | M_FLAGS, CFG);
    if (err) {
        lfs3_format(&lfs3, LFS3_F_RDWR | F_FLAGS, CFG) => 0;
        lfs3_mount(&lfs3, LFS3_M_RDWR | M_FLAGS, CFG) => 0;
    }
    lfs3_alloc_ckpoint(&lfs3);

    // how far did we get?
    uint32_t step = 0;
    lfs3_data_t data;
    lfs3_stag_t tag = lfs3_mdir_lookup(&lfs3, &lfs3.mroot, LFS3_TAG_ATTR(0),
            &data);
    assert(tag == LFS3_TAG_ATTR(0) || tag == LFS3_ERR_NOENT);
    if (tag != LFS3_ERR_NOENT) {
        lfs3_data_read(&lfs3, &data, &step, sizeof(uint32_t))
                => sizeof(uint32_t);
    }
    assert(step <= N);

    // replay our sim up to our step
    bool sim[N];
    for (lfs3_size_t i = 0; i < N; i++) {
        sim[i] = false;
    }
    uint32_t prng = SEED;
    for (lfs3_size_t i = 0; i < step; i++) {
        lfs3_size_t x = TEST_PRNG(&prng) % N;
        uint8_t op = TEST_PRNG(&prng) % 2;
        sim[x] = (op == 0);
    }
    // the step in progress may or may not have made it to disk
    uint32_t prng_ = prng;
    lfs3_size_t x_ = (step < N) ? TEST_PRNG(&prng_) % N : N;

    // check each entry, and open handles on a couple of them, these
    // should keep tracking their entries as the mtree changes
    lfs3_handle_t hs[H];
    lfs3_size_t h_xs[H];
    bool h_open[H];
    for (lfs3_size_t h = 0; h < H; h++) {
        h_open[h] = false;
    }
    for (lfs3_size_t i = 0; i < N; i++) {
        char name[256];
        name[0] = '\0';
        sprintf(name+1, "%03x", i);
        lfs3_mdir_t mdir;
        lfs3_stag_t tag = lfs3_mtree_namelookup(&lfs3, 0, name+1, 3,
                &mdir, NULL);
        assert(tag == LFS3_TAG_REG || tag == LFS3_ERR_NOENT);
        if (i != x_) {
            assert((tag == LFS3_TAG_REG) == sim[i]);
        }
        if (tag == LFS3_TAG_REG) {
            uint8_t buffer[256];
            lfs3_mdir_lookup(&lfs3, &mdir, LFS3_TAG_REG,
                    &data) => LFS3_TAG_REG;
            lfs3_data_read(&lfs3, &data, buffer, sizeof(buffer)) => 4;
            assert(memcmp(buffer, name, 4) == 0);

            for (lfs3_size_t h = 0; h < H && i != x_; h++) {
                if (!h_open[h]) {
                    hs[h] = (lfs3_handle_t){.flags=0};
                    hs[h].mdir = mdir;
                    lfs3_handle_open(&lfs3, &hs[h]);
                    h_xs[h] = i;
                    h_open[h] = true;
                    break;
                }
            }
        }
    }

    for (lfs3_size_t i = step; i < N; i++) {
        // choose a pseudo-random name
        lfs3_size_t x = TEST_PRNG(&prng) % N;
        char name[256];
        name[0] = '\0';
        sprintf(name+1, "%03x", x);
        // choose an op
        uint8_t op = TEST_PRNG(&prng) % 2;

        if (op == 0) {
            // update sim
            sim[x] = true;

            // update mtree
            lfs3_mdir_t mdir;
            lfs3_stag_t tag = lfs3_mtree_namelookup(&lfs3, 0, name+1, 3,
                    &mdir, NULL);
            assert(tag >= 0 || tag == LFS3_ERR_NOENT);
            if (tag == LFS3_ERR_NOENT) {
                // force a compaction?
                if (FORCE_COMPACTION) {
                    lfs3.mroot.r.eoff = -1;
                    mdir.r.eoff = -1;
                }
                lfs3_alloc_ckpoint(&lfs3);
                lfs3_mdir_commit(&lfs3, &mdir, LFS3_RATTRS(
                        LFS3_RATTR(4, LFS3_TAG_REG, +1, LFS3_FROM_NAME),
                        LFS3_RATTR_ARG(0),
                        LFS3_RATTR_ARG(name+1),
                        LFS3_RATTR_ARG(3),
                        LFS3_RATTR_NULL)) => 0;

                // double check
                uint8_t buffer[256];
                lfs3_mdir_lookup(&lfs3, &mdir, LFS3_TAG_REG,
                        &data) => LFS3_TAG_REG;
                lfs3_data_read(&lfs3, &data, buffer, sizeof(buffer)) => 4;
                assert(memcmp(buffer, name, 4) == 0);
            }

            // track new entries with any free handles
            bool tracked = false;
            for (lfs3_size_t h = 0; h < H; h++) {
                tracked = tracked || (h_open[h] && h_xs[h] == x);
            }
            for (lfs3_size_t h = 0; h < H && !tracked; h++) {
                if (!h_open[h]) {
                    lfs3_mtree_namelookup(&lfs3, 0, name+1, 3,
                            &mdir, NULL) => LFS3_TAG_REG;
                    hs[h] = (lfs3_handle_t){.flags=0};
                    hs[h].mdir = mdir;
                    lfs3_handle_open(&lfs3, &hs[h]);
                    h_xs[h] = x;
                    h_open[h] = true;
                    break;
                }
            }

        } else {
            // update sim
            sim[x] = false;

            // stop tracking this entry
            for (lfs3_size_t h = 0; h < H; h++) {
                if (h_open[h] && h_xs[h] == x) {
                    lfs3_handle_close(&lfs3, &hs[h]);
                    h_open[h] = false;
                }
            }

            // update mtree
            lfs3_mdir_t mdir;
            lfs3_stag_t tag = lfs3_mtree_namelookup(&lfs3, 0, name+1, 3,
                    &mdir, NULL);
            assert(tag >= 0 || tag == LFS3_ERR_NOENT);
            if (tag != LFS3_ERR_NOENT) {
                // force a compaction?
                if (FORCE_COMPACTION) {
                    lfs3.mroot.r.eoff = -1;
                    mdir.r.eoff = -1;
                }
                lfs3_alloc_ckpoint(&lfs3);
                lfs3_mdir_commit(&lfs3, &mdir, LFS3_RATTRS(
                        LFS3_RATTR(1, LFS3_tag_RM, -1),
                        LFS3_RATTR_NULL)) => 0;
            }
        }

        // record our progress
        uint32_t step_ = i+1;
        lfs3_alloc_ckpoint(&lfs3);
        lfs3_mdir_commit(&lfs3, &lfs3.mroot, LFS3_RATTRS(
                LFS3_RATTR(2, LFS3_TAG_ATTR(0), 0,
                    LFS3_FROM_BUF, sizeof(uint32_t)),
                LFS3_RATTR_ARG(&step_),
                LFS3_RATTR_NULL)) => 0;

        // our handles should still track their entries
        for (lfs3_size_t h = 0; h < H; h++) {
            if (!h_open[h]) {
                continue;
            }
            char name[256];
            name[0] = '\0';
            sprintf(name+1, "%03x", h_xs[h]);
            lfs3_mdir_t mdir;
            lfs3_mtree_namelookup(&lfs3, 0, name+1, 3,
                    &mdir, NULL) => LFS3_TAG_REG;
            assert(hs[h].mdir.mid == mdir.mid);
            assert(lfs3_mdir_cmp(&hs[h].mdir, &mdir) == 0);
        }
    }

    for (lfs3_size_t h = 0; h < H; h++) {
        if (h_open[h]) {
            lfs3_handle_close(&lfs3, &hs[h]);
        }
    }

    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR | M_FLAGS, CFG) => 0;
        }

        // try looking up each entry
        lfs3_mdir_t mdir;
        lfs3_mtree_lookup(&lfs3, 0, &mdir) => 0;
        uint8_t buffer[256];
        lfs3_mdir_lookup(&lfs3, &mdir, LFS3_TAG_BOOKMARK,
                &data) => LFS3_TAG_BOOKMARK;
        lfs3_data_read(&lfs3, &data, buffer, sizeof(buffer)) => 1;
        for (lfs3_size_t i = 0; i < N; i++) {
            char name[256];
            name[0] = '\0';
            sprintf(name+1, "%03x", i);
            if (sim[i]) {
                lfs3_mtree_namelookup(&lfs3, 0, name+1, 3,
                        &mdir, NULL) => LFS3_TAG_REG;
                lfs3_mdir_lookup(&lfs3, &mdir, LFS3_TAG_REG,
                        &data) => LFS3_TAG_REG;
                lfs3_data_read(&lfs3, &data, buffer, sizeof(buffer)) => 4;
                assert(memcmp(buffer, name, 4) == 0);
            } else {
                lfs3_mtree_namelookup(&lfs3, 0, name+1, 3,
                        &mdir, NULL) => LFS3_ERR_NOENT;
            }
        }

        lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
    }

    lfs3_unmount(&lfs3) => 0;
'''


## Relocation operations ##

# specific relocation corner cases
[cases.test_mtree_relocate]
# this should be set so only one entry can fit in a metadata block
defines.SIZE = 'BLOCK_SIZE / 4'
# make it so blocks relocate every two compacts
defines.BLOCK_RECYCLES = 0
in = 'lfs3.c'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR | F_FLAGS, CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR | M_FLAGS, CFG) => 0;
    lfs3_alloc_ckpoint(&lfs3);
    lfs3_data_t data;

    // create a 2 large rattrs that needs to be uninlined
    uint8_t buffer[SIZE];
    memset(buffer, 'a', SIZE);
    lfs3_mdir_commit(&lfs3, &lfs3.mroot, LFS3_RATTRS(
            LFS3_RATTR(3, LFS3_TAG_ATTR(1), 0, LFS3_FROM_DATA),
            LFS3_RATTR_ARG(SIZE),
            LFS3_RATTR_ARG(buffer),
            LFS3_RATTR_NULL)) => 0;

    memset(buffer, 'b', SIZE);
    lfs3_mdir_t mdir;
    lfs3_mtree_lookup(&lfs3, 0, &mdir) => 0;
    lfs3_mdir_commit(&lfs3, &mdir, LFS3_RATTRS(
            LFS3_RATTR(3, LFS3_TAG_ATTR(2), 0, LFS3_FROM_DATA),
            LFS3_RATTR_ARG(SIZE),
            LFS3_RATTR_ARG(buffer),
            LFS3_RATTR_NULL)) => 0;

    // force mroot to compact
    lfs3.mroot.r.eoff = -1;
    lfs3_mdir_commit(&lfs3, &lfs3.mroot, LFS3_RATTRS(
            LFS3_RATTR(2, LFS3_TAG_ATTR(3), 0, LFS3_FROM_BUF, 1),
            LFS3_RATTR_ARG("c"),
            LFS3_RATTR_NULL)) => 0;

    // assert mdirs were unininlined
    assert(lfs3.mtree.r.weight == (1 << lfs3.mbits));
    // assert mroot now has no entries
    assert(lfs3.mroot.r.weight == 0);

    // force mdir to compact twice, this should relocate
    lfs3_mtree_lookup(&lfs3, 0, &mdir) => 0;
    lfs3_mdir_t old_mdir = mdir;
    mdir.r.eoff = -1;
    lfs3_mdir_commit(&lfs3, &mdir, LFS3_RATTRS(
            LFS3_RATTR(2, LFS3_TAG_ATTR(4), 0, LFS3_FROM_BUF, 1),
            LFS3_RATTR_ARG("d"),
            LFS3_RATTR_NULL)) => 0;
    mdir.r.eoff = -1;
    lfs3_mdir_commit(&lfs3, &mdir, LFS3_RATTRS(
            LFS3_RATTR(2, LFS3_TAG_ATTR(5), 0, LFS3_FROM_BUF, 1),
            LFS3_RATTR_ARG("e"),
            LFS3_RATTR_NULL)) => 0;
    // assert we relocated
    assert(lfs3_mdir_cmp(&old_mdir, &mdir) != 0);

    // assert mdirs were unininlined
    assert(lfs3.mtree.r.weight == (1 << lfs3.mbits));
    // assert mroot now has no entries
    assert(lfs3.mroot.r.weight == 0);

    // assert that our rattrs are still in the mroot/mtree
    lfs3_mdir_lookup(&lfs3, &lfs3.mroot, LFS3_TAG_ATTR(1),
            &data) => LFS3_TAG_ATTR(1);
    lfs3_data_read(&lfs3, &data, buffer, SIZE) => SIZE;
    assert(buffer[0] == 'a');

    lfs3_mtree_lookup(&lfs3, 0, &mdir) => 0;
    assert(mdir.r.weight == 1);
    lfs3_mdir_lookup(&lfs3, &mdir, LFS3_TAG_ATTR(2),
            &data) => LFS3_TAG_ATTR(2);
    lfs3_data_read(&lfs3, &data, buffer, SIZE) => SIZE;
    assert(buffer[0] == 'b');

    lfs3_mdir_lookup(&lfs3, &lfs3.mroot, LFS3_TAG_ATTR(3),
            &data) => LFS3_TAG_ATTR(3);
    lfs3_data_read(&lfs3, &data, buffer, 1) => 1;
    assert(buffer[0] == 'c');

    lfs3_mtree_lookup(&lfs3, 0, &mdir) => 0;
    assert(mdir.r.weight == 1);
    lfs3_mdir_lookup(&lfs3, &mdir, LFS3_TAG_ATTR(4),
            &data) => LFS3_TAG_ATTR(4);
    lfs3_data_read(&lfs3, &data, buffer, 1) => 1;
    assert(buffer[0] == 'd');

    lfs3_mdir_lookup(&lfs3, &mdir, LFS3_TAG_ATTR(5),
            &data) => LFS3_TAG_ATTR(5);
    lfs3_data_read(&lfs3, &data, buffer, 1) => 1;
    assert(buffer[0] == 'e');

    // check things stay sane after remount
    lfs3_unmount(&lfs3) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR | M_FLAGS, CFG) => 0;

    // assert mdirs were unininlined
    assert(lfs3.mtree.r.weight == (1 << lfs3.mbits));
    // assert mroot now has no entries
    assert(lfs3.mroot.r.weight == 0);

    // assert that our rattrs are still in the mroot/mtree
    lfs3_mdir_lookup(&lfs3, &lfs3.mroot, LFS3_TAG_ATTR(1),
            &data) => LFS3_TAG_ATTR(1);
    lfs3_data_read(&lfs3, &data, buffer, SIZE) => SIZE;
    assert(buffer[0] == 'a');

    lfs3_mtree_lookup(&lfs3, 0, &mdir) => 0;
    assert(mdir.r.weight == 1);
    lfs3_mdir_lookup(&lfs3, &mdir, LFS3_TAG_ATTR(2),
            &data) => LFS3_TAG_ATTR(2);
    lfs3_data_read(&lfs3, &data, buffer, SIZE) => SIZE;
    assert(buffer[0] == 'b');

    lfs3_mdir_lookup(&lfs3, &lfs3.mroot, LFS3_TAG_ATTR(3),
            &data) => LFS3_TAG_ATTR(3);
    lfs3_data_read(&lfs3, &data, buffer, 1) => 1;
    assert(buffer[0] == 'c');

    lfs3_mtree_lookup(&lfs3, 0, &mdir) => 0;
    assert(mdir.r.weight == 1);
    lfs3_mdir_lookup(&lfs3, &mdir, LFS3_TAG_ATTR(4),
            &data) => LFS3_TAG_ATTR(4);
    lfs3_data_read(&lfs3, &data, buffer, 1) => 1;
    assert(buffer[0] == 'd');

    lfs3_mdir_lookup(&lfs3, &mdir, LFS3_TAG_ATTR(5),
            &data) => LFS3_TAG_ATTR(5);
    lfs3_data_read(&lfs3, &data, buffer, 1) => 1;
    assert(buffer[0] == 'e');

    lfs3_unmount(&lfs3) => 0;
'''

[cases.test_mtree_relocate_l]
# this should be set so only one entry can fit in a metadata block
defines.SIZE = 'BLOCK_SIZE / 4'
# make it so blocks relocate every two compacts
defines.BLOCK_RECYCLES = 0
in = 'lfs3.c'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR | F_FLAGS, CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR | M_FLAGS, CFG) => 0;
    lfs3_alloc_ckpoint(&lfs3);
    lfs3_data_t data;

    // create 2 large entries that needs to be uninlined and split
    uint8_t buffer[SIZE];
    buffer[0] = '\0';
    memset(buffer+1, 'a', SIZE-1);
    lfs3_mdir_t mdir;
    lfs3_mtree_namelookup(&lfs3, 0, (const char*)buffer+1, SIZE-1,
            &mdir, NULL) => LFS3_ERR_NOENT;
    lfs3_mdir_commit(&lfs3, &mdir, LFS3_RATTRS(
            LFS3_RATTR(3, LFS3_TAG_REG, +1, LFS3_FROM_DATA),
            LFS3_RATTR_ARG(SIZE),
            LFS3_RATTR_ARG(buffer),
            LFS3_RATTR_NULL)) => 0;
    assert(mdir.r.weight == 2);

    memset(buffer+1, 'b', SIZE-1);
    lfs3_mtree_namelookup(&lfs3, 0, (const char*)buffer+1, SIZE-1,
            &mdir, NULL) => LFS3_ERR_NOENT;
    lfs3_mdir_commit(&lfs3, &mdir, LFS3_RATTRS(
            LFS3_RATTR(3, LFS3_TAG_REG, +1, LFS3_FROM_DATA),
            LFS3_RATTR_ARG(SIZE),
            LFS3_RATTR_ARG(buffer),
            LFS3_RATTR_NULL)) => 0;
    assert(mdir.r.weight == 3);

    // force mroot to compact
    lfs3.mroot.r.eoff = -1;
    lfs3_mdir_commit(&lfs3, &lfs3.mroot, LFS3_RATTRS(
            LFS3_RATTR(2, LFS3_TAG_ATTR(1), 0, LFS3_FROM_BUF, 1),
            LFS3_RATTR_ARG("c"),
            LFS3_RATTR_NULL)) => 0;

    // assert mdirs were unininlined and split
    assert(lfs3.mtree.r.weight == (2 << lfs3.mbits));
    // assert mroot now has no entries
    assert(lfs3.mroot.r.weight == 0);

    // force mdir to compact twice, this should relocate
    memset(buffer+1, 'a', SIZE-1);
    lfs3_mtree_namelookup(&lfs3, 0, (const char*)buffer+1, SIZE-1,
            &mdir, NULL) => LFS3_TAG_REG;
    lfs3_mdir_t old_mdir = mdir;
    mdir.r.eoff = -1;
    lfs3_mdir_commit(&lfs3, &mdir, LFS3_RATTRS(
            LFS3_RATTR(2, LFS3_TAG_ATTR(2), 0, LFS3_FROM_BUF, 1),
            LFS3_RATTR_ARG("d"),
            LFS3_RATTR_NULL)) => 0;
    mdir.r.eoff = -1;
    lfs3_mdir_commit(&lfs3, &mdir, LFS3_RATTRS(
            LFS3_RATTR(2, LFS3_TAG_ATTR(3), 0, LFS3_FROM_BUF, 1),
            LFS3_RATTR_ARG("e"),
            LFS3_RATTR_NULL)) => 0;
    // assert we relocated
    assert(lfs3_mdir_cmp(&old_mdir, &mdir) != 0);

    // assert mdirs were unininlined and split
    assert(lfs3.mtree.r.weight == (2 << lfs3.mbits));
    // assert mroot now has no entries
    assert(lfs3.mroot.r.weight == 0);

    // assert that our entries are still in the mtree
    lfs3_mtree_lookup(&lfs3, (0 << lfs3.mbits)+1, &mdir) => 0;
    assert(mdir.r.weight == 2);
    lfs3_mdir_lookup(&lfs3, &mdir, LFS3_TAG_REG,
            &data) => LFS3_TAG_REG;
    lfs3_data_read(&lfs3, &data, buffer, SIZE) => SIZE;
    assert(buffer[1] == 'a');

    lfs3_mtree_lookup(&lfs3, (1 << lfs3.mbits)+0, &mdir) => 0;
    assert(mdir.r.weight == 1);
    lfs3_mdir_lookup(&lfs3, &mdir, LFS3_TAG_REG,
            &data) => LFS3_TAG_REG;
    lfs3_data_read(&lfs3, &data, buffer, SIZE) => SIZE;
    assert(buffer[1] == 'b');

    lfs3_mdir_lookup(&lfs3, &lfs3.mroot, LFS3_TAG_ATTR(1),
            &data) => LFS3_TAG_ATTR(1);
    lfs3_data_read(&lfs3, &data, buffer, 1) => 1;
    assert(buffer[0] == 'c');

    lfs3_mtree_lookup(&lfs3, (0 << lfs3.mbits)+1, &mdir) => 0;
    assert(mdir.r.weight == 2);
    lfs3_mdir_lookup(&lfs3, &mdir, LFS3_TAG_ATTR(2),
            &data) => LFS3_TAG_ATTR(2);
    lfs3_data_read(&lfs3, &data, buffer, 1) => 1;
    assert(buffer[0] == 'd');

    lfs3_mdir_lookup(&lfs3, &mdir, LFS3_TAG_ATTR(3),
            &data) => LFS3_TAG_ATTR(3);
    lfs3_data_read(&lfs3, &data, buffer, 1) => 1;
    assert(buffer[0] == 'e');

    // check things stay sane after remount
    lfs3_unmount(&lfs3) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR | M_FLAGS, CFG) => 0;

    // assert mdirs were unininlined and split
