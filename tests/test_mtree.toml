    uint8_t magic[LFS3_MAX(16, READ_SIZE)];
    CFG->read(CFG, 0, 0, magic, LFS3_MAX(16, READ_SIZE)) => 0;
    assert(memcmp(&magic[8], "littlefs", 8) == 0);
