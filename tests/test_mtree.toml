    lfs3_mdir_commit(&lfs3, &lfs3.mroot, LFS3_RATTRS(
            LFS3_RATTR(2, LFS3_TAG_ATTR(2), 0, LFS3_FROM_BUF, 1),
            LFS3_RATTR_ARG("c"),
            LFS3_RATTR_NULL)) => 0;
    // assert we relocated
    assert(lfs3_mdir_cmp(&old_mroot, &lfs3.mroot) != 0);

