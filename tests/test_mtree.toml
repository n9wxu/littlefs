'''

# mroot extension under powerloss
#
# Every step forces the mroot to compact, and with block_recycles 0 or 1
# the mroot relocates, which extends the mroot chain when the mroot is
# the anchor. Our progress is committed in a reserved attribute in the
# same commit as each step
#
[cases.test_mtree_extend_pl]
defines.POWERLOSS_BEHAVIOR = [
    'LFS3_EMUBD_POWERLOSS_ATOMIC',
    'LFS3_EMUBD_POWERLOSS_SOMEBITS',
    'LFS3_EMUBD_POWERLOSS_MOSTBITS',
    'LFS3_EMUBD_POWERLOSS_OOO',
]
# this should be set so only one entry can fit in a metadata block
defines.SIZE = 'BLOCK_SIZE / 4'
defines.BLOCK_RECYCLES = [1, 0]
defines.N = 32
defines.M = 4
defines.SEED = 'range(10)'
fuzz = 'SEED'
reentrant = true
in = 'lfs3.c'
code = '''
    // format once per test
    lfs3_t lfs3;
    int err = lfs3_mount(&lfs3, LFS3_M_RDWR | M_FLAGS, CFG);
    if (err) {
        lfs3_format(&lfs3, LFS3_F_RDWR | F_FLAGS, CFG) => 0;
        lfs3_mount(&lfs3, LFS3_M_RDWR | M_FLAGS, CFG) => 0;
    }
    lfs3_alloc_ckpoint(&lfs3);
    lfs3_data_t data;

    // prepare mroot with an entry
    uint8_t buffer[SIZE];
    buffer[0] = '\0';
    memset(buffer+1, 'a', SIZE-1);
    lfs3_mdir_t mdir;
    lfs3_stag_t tag = lfs3_mtree_namelookup(&lfs3,
            0, (const char*)buffer+1, SIZE-1,
            &mdir, NULL);
    assert(tag == LFS3_TAG_REG || tag == LFS3_ERR_NOENT);
    if (tag == LFS3_ERR_NOENT) {
        lfs3_mdir_commit(&lfs3, &mdir, LFS3_RATTRS(
                LFS3_RATTR(3, LFS3_TAG_REG, +1, LFS3_FROM_DATA),
                LFS3_RATTR_ARG(SIZE),
                LFS3_RATTR_ARG(buffer),
                LFS3_RATTR_NULL)) => 0;
        lfs3_mtree_namelookup(&lfs3,
                0, (const char*)buffer+1, SIZE-1,
                &mdir, NULL) => LFS3_TAG_REG;
    }

    // this handle should keep tracking our entry
    lfs3_handle_t h = {.flags=0};
    h.mdir = mdir;
    lfs3_handle_open(&lfs3, &h);

    // how far did we get?
    uint32_t step = 0;
    tag = lfs3_mdir_lookup(&lfs3, &lfs3.mroot, LFS3_TAG_ATTR(0),
            &data);
    assert(tag == LFS3_TAG_ATTR(0) || tag == LFS3_ERR_NOENT);
    if (tag != LFS3_ERR_NOENT) {
        lfs3_data_read(&lfs3, &data, &step, sizeof(uint32_t))
                => sizeof(uint32_t);
    }
    assert(step <= N);

    // replay our sim up to our step, 0 => no attr
    uint32_t sim[M+1];
    for (lfs3_size_t a = 0; a <= M; a++) {
        sim[a] = 0;
    }
    uint32_t prng = SEED;
    for (lfs3_size_t i = 0;; i++) {
        // caught up with disk? check our attrs
        if (i == step) {
            for (lfs3_size_t a = 1; a <= M; a++) {
                if (sim[a]) {
                    uint32_t v;
                    lfs3_mdir_lookup(&lfs3, &lfs3.mroot, LFS3_TAG_ATTR(a),
                            &data) => LFS3_TAG_ATTR(a);
                    lfs3_data_read(&lfs3, &data, &v, sizeof(uint32_t))
                            => sizeof(uint32_t);
                    assert(v == sim[a]);
                } else {
                    lfs3_mdir_lookup(&lfs3, &lfs3.mroot, LFS3_TAG_ATTR(a),
                            &data) => LFS3_ERR_NOENT;
                }
            }
        }

        if (i == N) {
            break;
        }

        // choose an attr and a value
        lfs3_size_t a = 1 + (TEST_PRNG(&prng) % M);
        uint32_t v = TEST_PRNG(&prng) | 1;
        sim[a] = v;

        // force the mroot to compact, committing our progress with
        // our attr
        if (i >= step) {
            uint32_t step_ = i+1;
            lfs3.mroot.r.eoff = -1;
            lfs3_alloc_ckpoint(&lfs3);
            lfs3_mdir_commit(&lfs3, &lfs3.mroot, LFS3_RATTRS(
                    LFS3_RATTR(2, LFS3_TAG_ATTR(0), 0,
                        LFS3_FROM_BUF, sizeof(uint32_t)),
                    LFS3_RATTR_ARG(&step_),
                    LFS3_RATTR(2, LFS3_TAG_ATTR(a), 0,
                        LFS3_FROM_BUF, sizeof(uint32_t)),
                    LFS3_RATTR_ARG(&v),
                    LFS3_RATTR_NULL)) => 0;

            // our handle should still track our entry
            lfs3_mtree_namelookup(&lfs3,
                    0, (const char*)buffer+1, SIZE-1,
                    &mdir, NULL) => LFS3_TAG_REG;
            assert(h.mdir.mid == mdir.mid);
            assert(lfs3_mdir_cmp(&h.mdir, &mdir) == 0);
        }
    }

    lfs3_handle_close(&lfs3, &h);

    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR | M_FLAGS, CFG) => 0;
        }

        // assert that our entry is still there
        lfs3_mtree_namelookup(&lfs3,
                0, (const char*)buffer+1, SIZE-1,
                &mdir, NULL) => LFS3_TAG_REG;
        uint8_t rbuf[SIZE];
        lfs3_mdir_lookup(&lfs3, &mdir, LFS3_TAG_REG,
                &data) => LFS3_TAG_REG;
        lfs3_data_read(&lfs3, &data, rbuf, SIZE) => SIZE;
        assert(memcmp(rbuf, buffer, SIZE) == 0);

        // and our attrs
        for (lfs3_size_t a = 0; a <= M; a++) {
            uint32_t v;
            if (a == 0 || sim[a]) {
                lfs3_mdir_lookup(&lfs3, &lfs3.mroot, LFS3_TAG_ATTR(a),
                        &data) => LFS3_TAG_ATTR(a);
                lfs3_data_read(&lfs3, &data, &v, sizeof(uint32_t))
                        => sizeof(uint32_t);
                assert(v == ((a == 0) ? (uint32_t)N : sim[a]));
            } else {
                lfs3_mdir_lookup(&lfs3, &lfs3.mroot, LFS3_TAG_ATTR(a),
                        &data) => LFS3_ERR_NOENT;
            }
        }

        lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
    }

    lfs3_unmount(&lfs3) => 0;
'''


[cases.test_mtree_relocate_mroot]
# this should be set so only one entry can fit in a metadata block
defines.SIZE = 'BLOCK_SIZE / 4'
# make it so blocks relocate every two compacts
defines.BLOCK_RECYCLES = 0
in = 'lfs3.c'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR | F_FLAGS, CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR | M_FLAGS, CFG) => 0;
    lfs3_alloc_ckpoint(&lfs3);
    lfs3_data_t data;

    // prepare mroot with an entry
    uint8_t buffer[SIZE];
    buffer[0] = '\0';
    memset(buffer+1, 'a', SIZE-1);
