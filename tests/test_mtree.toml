    assert(right.mdir.mid == mdir.mid);
    assert(lfs3_mdir_cmp(&right.mdir, &mdir) == 0);
    assert(right.mdir.r.trunk == mdir.r.trunk);
    assert(right.mdir.r.cksum == mdir.r.cksum);

