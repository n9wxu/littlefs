# Test the high-level metadata tree in the core of littlefs
after = ['test_rbyd', 'test_btree']

# maximize lookahead buffer, we don't actually gc so we only get one pass
# of the disk for these tests
defines.LOOKAHEAD_SIZE = '(BLOCK_COUNT+8-1) / 8'

# test with normal revision counts, debug revision counts, and noisy
# revision counts
defines.REVPERTURB = [false, true]
defines.REVNOISE = [false, true]
defines.F_FLAGS = '''
    ((REVPERTURB) ? LFS3_IFDEF_REVPERTURB(LFS3_F_REVPERTURB, -1) : 0)
        | ((REVNOISE) ? LFS3_IFDEF_REVNOISE(LFS3_F_REVNOISE, -1) : 0)
'''
defines.M_FLAGS = '''
    ((REVPERTURB) ? LFS3_IFDEF_REVPERTURB(LFS3_M_REVPERTURB, -1) : 0)
        | ((REVNOISE) ? LFS3_IFDEF_REVNOISE(LFS3_M_REVNOISE, -1) : 0)
'''
if = [
    'LFS3_IFDEF_REVPERTURB(true, !REVPERTURB)',
    'LFS3_IFDEF_REVNOISE(true, !REVNOISE)',
    '!REVPERTURB || !REVNOISE',
]



# test a single mroot
[cases.test_mtree_mroot]
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR | F_FLAGS, CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR | M_FLAGS, CFG) => 0;
    lfs3_unmount(&lfs3) => 0;
'''

# test a single mroot with attributes
[cases.test_mtree_mroot_rattrs]
defines.N = [1, 3]
in = 'lfs3.c'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR | F_FLAGS, CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR | M_FLAGS, CFG) => 0;
    lfs3_alloc_ckpoint(&lfs3);

    for (lfs3_size_t i = 0; i < N; i++) {
        lfs3_mdir_commit(&lfs3, &lfs3.mroot, LFS3_RATTRS(
                LFS3_RATTR(2, LFS3_TAG_ATTR(i), 0, LFS3_FROM_BUF, 1),
                LFS3_RATTR_ARG(&(uint8_t){'a'+(i % 26)}),
                LFS3_RATTR_NULL)) => 0;
    }

    for (lfs3_size_t i = 0; i < N; i++) {
        lfs3_data_t data;
        uint8_t buffer[1];
        lfs3_mdir_lookup(&lfs3, &lfs3.mroot, LFS3_TAG_ATTR(i),
                &data) => LFS3_TAG_ATTR(i);
        lfs3_data_read(&lfs3, &data, buffer, 1) => 1;
        assert(memcmp(buffer, &(uint8_t){'a'+(i % 26)}, 1) == 0);
    }

    lfs3_unmount(&lfs3) => 0;


    // check things stay sane after remount
    lfs3_mount(&lfs3, LFS3_M_RDWR | M_FLAGS, CFG) => 0;

    for (lfs3_size_t i = 0; i < N; i++) {
        lfs3_data_t data;
        uint8_t buffer[1];
        lfs3_mdir_lookup(&lfs3, &lfs3.mroot, LFS3_TAG_ATTR(i),
                &data) => LFS3_TAG_ATTR(i);
        lfs3_data_read(&lfs3, &data, buffer, 1) => 1;
        assert(memcmp(buffer, &(uint8_t){'a'+(i % 26)}, 1) == 0);
    }

    lfs3_unmount(&lfs3) => 0;
'''

# test a single mroot with forced compaction
[cases.test_mtree_mroot_compact]
defines.N = [1, 3]
in = 'lfs3.c'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR | F_FLAGS, CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR | M_FLAGS, CFG) => 0;
    lfs3_alloc_ckpoint(&lfs3);

    for (lfs3_size_t i = 0; i < N; i++) {
        // force mroot to compact
        lfs3.mroot.r.eoff = -1;

        lfs3_mdir_commit(&lfs3, &lfs3.mroot, LFS3_RATTRS(
                LFS3_RATTR(2, LFS3_TAG_ATTR(i), 0, LFS3_FROM_BUF, 1),
                LFS3_RATTR_ARG(&(uint8_t){'a'+(i % 26)}),
                LFS3_RATTR_NULL)) => 0;
    }

    for (lfs3_size_t i = 0; i < N; i++) {
        lfs3_data_t data;
        uint8_t buffer[1];
        lfs3_mdir_lookup(&lfs3, &lfs3.mroot, LFS3_TAG_ATTR(i),
                &data) => LFS3_TAG_ATTR(i);
        lfs3_data_read(&lfs3, &data, buffer, 1) => 1;
        assert(memcmp(buffer, &(uint8_t){'a'+(i % 26)}, 1) == 0);
    }

    lfs3_unmount(&lfs3) => 0;


    // check things stay sane after remount
    lfs3_mount(&lfs3, LFS3_M_RDWR | M_FLAGS, CFG) => 0;

    for (lfs3_size_t i = 0; i < N; i++) {
        lfs3_data_t data;
        uint8_t buffer[1];
        lfs3_mdir_lookup(&lfs3, &lfs3.mroot, LFS3_TAG_ATTR(i),
                &data) => LFS3_TAG_ATTR(i);
        lfs3_data_read(&lfs3, &data, buffer, 1) => 1;
        assert(memcmp(buffer, &(uint8_t){'a'+(i % 26)}, 1) == 0);
    }

    lfs3_unmount(&lfs3) => 0;
'''

# test a single mroot with many commits
[cases.test_mtree_mroot_many_commits]
defines.N = [5, 5000]
in = 'lfs3.c'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR | F_FLAGS, CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR | M_FLAGS, CFG) => 0;
    lfs3_alloc_ckpoint(&lfs3);

    for (lfs3_size_t i = 0; i < N; i++) {
        lfs3_mdir_commit(&lfs3, &lfs3.mroot, LFS3_RATTRS(
                LFS3_RATTR(2, LFS3_TAG_ATTR(1), 0, LFS3_FROM_BUF, 1),
                LFS3_RATTR_ARG(&(uint8_t){'a'+(i % 26)}),
                LFS3_RATTR_NULL)) => 0;
        lfs3_data_t data;

        uint8_t buffer[4];
        lfs3_mdir_lookup(&lfs3, &lfs3.mroot, LFS3_TAG_ATTR(1),
                &data) => LFS3_TAG_ATTR(1);
        lfs3_data_read(&lfs3, &data, buffer, 4) => 1;
        assert(memcmp(buffer, &(uint8_t){'a'+(i % 26)}, 1) == 0);
    }
    lfs3_data_t data;

    uint8_t buffer[4];
    lfs3_mdir_lookup(&lfs3, &lfs3.mroot, LFS3_TAG_ATTR(1),
            &data) => LFS3_TAG_ATTR(1);
    lfs3_data_read(&lfs3, &data, buffer, 4) => 1;
    assert(memcmp(buffer, &(uint8_t){'a'+((N-1) % 26)}, 1) == 0);

    lfs3_unmount(&lfs3) => 0;


    // check things stay sane after remount
    lfs3_mount(&lfs3, LFS3_M_RDWR | M_FLAGS, CFG) => 0;

    lfs3_mdir_lookup(&lfs3, &lfs3.mroot, LFS3_TAG_ATTR(1),
            &data) => LFS3_TAG_ATTR(1);
    lfs3_data_read(&lfs3, &data, buffer, 4) => 1;
    assert(memcmp(buffer, &(uint8_t){'a'+((N-1) % 26)}, 1) == 0);

    lfs3_unmount(&lfs3) => 0;
'''


## Splitting operations ##

# specific split corner cases
[cases.test_mtree_uninline]
# this should be set so only one entry can fit in a metadata block
defines.SIZE = 'BLOCK_SIZE / 4'
in = 'lfs3.c'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR | F_FLAGS, CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR | M_FLAGS, CFG) => 0;
    lfs3_alloc_ckpoint(&lfs3);
    lfs3_data_t data;

    // create a 2 large rattrs that needs to be uninlined
    uint8_t buffer[SIZE];
    memset(buffer, 'a', SIZE);
    lfs3_mdir_commit(&lfs3, &lfs3.mroot, LFS3_RATTRS(
            LFS3_RATTR(3, LFS3_TAG_ATTR(1), 0, LFS3_FROM_DATA),
            LFS3_RATTR_ARG(SIZE),
            LFS3_RATTR_ARG(buffer),
            LFS3_RATTR_NULL)) => 0;

    memset(buffer, 'b', SIZE);
    lfs3_mdir_t mdir;
    lfs3_mtree_lookup(&lfs3, 0, &mdir) => 0;
    lfs3_mdir_commit(&lfs3, &mdir, LFS3_RATTRS(
            LFS3_RATTR(3, LFS3_TAG_ATTR(2), 0, LFS3_FROM_DATA),
            LFS3_RATTR_ARG(SIZE),
            LFS3_RATTR_ARG(buffer),
            LFS3_RATTR_NULL)) => 0;

    // force mroot to compact
    lfs3.mroot.r.eoff = -1;
    lfs3_mdir_commit(&lfs3, &lfs3.mroot, LFS3_RATTRS(
            LFS3_RATTR(2, LFS3_TAG_ATTR(3), 0, LFS3_FROM_BUF, 1),
            LFS3_RATTR_ARG("c"),
            LFS3_RATTR_NULL)) => 0;

    // assert mdirs were unininlined
    assert(lfs3.mtree.r.weight == (1 << lfs3.mbits));
    // assert mroot now has no entries
    assert(lfs3.mroot.r.weight == 0);

    // assert that our rattrs are still in the mroot/mtree
    lfs3_mdir_lookup(&lfs3, &lfs3.mroot, LFS3_TAG_ATTR(1),
            &data) => LFS3_TAG_ATTR(1);
    lfs3_data_read(&lfs3, &data, buffer, SIZE) => SIZE;
    assert(buffer[0] == 'a');

    lfs3_mtree_lookup(&lfs3, 0, &mdir) => 0;
    assert(mdir.r.weight == 1);
    lfs3_mdir_lookup(&lfs3, &mdir, LFS3_TAG_ATTR(2),
            &data) => LFS3_TAG_ATTR(2);
    lfs3_data_read(&lfs3, &data, buffer, SIZE) => SIZE;
    assert(buffer[0] == 'b');

    lfs3_mdir_lookup(&lfs3, &lfs3.mroot, LFS3_TAG_ATTR(3),
            &data) => LFS3_TAG_ATTR(3);
    lfs3_data_read(&lfs3, &data, buffer, 1) => 1;
    assert(buffer[0] == 'c');

    // check things stay sane after remount
    lfs3_unmount(&lfs3) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR | M_FLAGS, CFG) => 0;

    // assert mdirs were unininlined
    assert(lfs3.mtree.r.weight == (1 << lfs3.mbits));
    // assert mroot now has no entries
    assert(lfs3.mroot.r.weight == 0);

    // assert that our rattrs are still in the mroot/mtree
    lfs3_mdir_lookup(&lfs3, &lfs3.mroot, LFS3_TAG_ATTR(1),
            &data) => LFS3_TAG_ATTR(1);
    lfs3_data_read(&lfs3, &data, buffer, SIZE) => SIZE;
    assert(buffer[0] == 'a');

    lfs3_mtree_lookup(&lfs3, 0, &mdir) => 0;
    assert(mdir.r.weight == 1);
    lfs3_mdir_lookup(&lfs3, &mdir, LFS3_TAG_ATTR(2),
            &data) => LFS3_TAG_ATTR(2);
    lfs3_data_read(&lfs3, &data, buffer, SIZE) => SIZE;
    assert(buffer[0] == 'b');

    lfs3_mdir_lookup(&lfs3, &lfs3.mroot, LFS3_TAG_ATTR(3),
            &data) => LFS3_TAG_ATTR(3);
    lfs3_data_read(&lfs3, &data, buffer, 1) => 1;
    assert(buffer[0] == 'c');

    lfs3_unmount(&lfs3) => 0;
'''

[cases.test_mtree_uninline_split]
# this should be set so only one entry can fit in a metadata block
defines.SIZE = 'BLOCK_SIZE / 4'
in = 'lfs3.c'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR | F_FLAGS, CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR | M_FLAGS, CFG) => 0;
    lfs3_alloc_ckpoint(&lfs3);
    lfs3_data_t data;

    // create 2 large entries that needs to be uninlined and split
    uint8_t buffer[SIZE];
    buffer[0] = '\0';
    memset(buffer+1, 'a', SIZE-1);
    lfs3_mdir_t mdir;
    lfs3_mtree_namelookup(&lfs3, 0, (const char*)buffer+1, SIZE-1,
            &mdir, NULL) => LFS3_ERR_NOENT;
    lfs3_mdir_commit(&lfs3, &mdir, LFS3_RATTRS(
            LFS3_RATTR(3, LFS3_TAG_REG, +1, LFS3_FROM_DATA),
            LFS3_RATTR_ARG(SIZE),
            LFS3_RATTR_ARG(buffer),
            LFS3_RATTR_NULL)) => 0;
    assert(mdir.r.weight == 2);

    memset(buffer+1, 'b', SIZE-1);
    lfs3_mtree_namelookup(&lfs3, 0, (const char*)buffer+1, SIZE-1,
            &mdir, NULL) => LFS3_ERR_NOENT;
    lfs3_mdir_commit(&lfs3, &mdir, LFS3_RATTRS(
            LFS3_RATTR(3, LFS3_TAG_REG, +1, LFS3_FROM_DATA),
            LFS3_RATTR_ARG(SIZE),
            LFS3_RATTR_ARG(buffer),
            LFS3_RATTR_NULL)) => 0;
    assert(mdir.r.weight == 3);

    // force mroot to compact
    lfs3.mroot.r.eoff = -1;
    lfs3_mdir_commit(&lfs3, &lfs3.mroot, LFS3_RATTRS(
            LFS3_RATTR(2, LFS3_TAG_ATTR(1), 0, LFS3_FROM_BUF, 1),
            LFS3_RATTR_ARG("c"),
            LFS3_RATTR_NULL)) => 0;

    // assert mdirs were unininlined and split
    assert(lfs3.mtree.r.weight == (2 << lfs3.mbits));
    // assert mroot now has no entries
    assert(lfs3.mroot.r.weight == 0);

    // assert that our entries are still in the mtree
    lfs3_mtree_lookup(&lfs3, (0 << lfs3.mbits)+1, &mdir) => 0;
    assert(mdir.r.weight == 2);
    lfs3_mdir_lookup(&lfs3, &mdir, LFS3_TAG_REG,
            &data) => LFS3_TAG_REG;
    lfs3_data_read(&lfs3, &data, buffer, SIZE) => SIZE;
    assert(buffer[1] == 'a');

    lfs3_mtree_lookup(&lfs3, (1 << lfs3.mbits)+0, &mdir) => 0;
    assert(mdir.r.weight == 1);
    lfs3_mdir_lookup(&lfs3, &mdir, LFS3_TAG_REG,
            &data) => LFS3_TAG_REG;
    lfs3_data_read(&lfs3, &data, buffer, SIZE) => SIZE;
    assert(buffer[1] == 'b');

    lfs3_mdir_lookup(&lfs3, &lfs3.mroot, LFS3_TAG_ATTR(1),
            &data) => LFS3_TAG_ATTR(1);
    lfs3_data_read(&lfs3, &data, buffer, 1) => 1;
    assert(buffer[0] == 'c');

    // check things stay sane after remount
    lfs3_unmount(&lfs3) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR | M_FLAGS, CFG) => 0;

    // assert mdirs were unininlined and split
    assert(lfs3.mtree.r.weight == (2 << lfs3.mbits));
    // assert mroot now has no entries
    assert(lfs3.mroot.r.weight == 0);

    // assert that our entries are still in the mtree
    lfs3_mtree_lookup(&lfs3, (0 << lfs3.mbits)+1, &mdir) => 0;
    assert(mdir.r.weight == 2);
    lfs3_mdir_lookup(&lfs3, &mdir, LFS3_TAG_REG,
            &data) => LFS3_TAG_REG;
    lfs3_data_read(&lfs3, &data, buffer, SIZE) => SIZE;
    assert(buffer[1] == 'a');

    lfs3_mtree_lookup(&lfs3, (1 << lfs3.mbits)+0, &mdir) => 0;
    assert(mdir.r.weight == 1);
    lfs3_mdir_lookup(&lfs3, &mdir, LFS3_TAG_REG,
            &data) => LFS3_TAG_REG;
    lfs3_data_read(&lfs3, &data, buffer, SIZE) => SIZE;
    assert(buffer[1] == 'b');

    lfs3_mdir_lookup(&lfs3, &lfs3.mroot, LFS3_TAG_ATTR(1),
            &data) => LFS3_TAG_ATTR(1);
    lfs3_data_read(&lfs3, &data, buffer, 1) => 1;
    assert(buffer[0] == 'c');

    lfs3_unmount(&lfs3) => 0;
'''

[cases.test_mtree_split]
# this should be set so only one entry can fit in a metadata block
defines.SIZE = 'BLOCK_SIZE / 4'
in = 'lfs3.c'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR | F_FLAGS, CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR | M_FLAGS, CFG) => 0;
    lfs3_alloc_ckpoint(&lfs3);
    lfs3_data_t data;

    // create 2 large entries that needs to be uninlined and split
    uint8_t buffer[SIZE];
    buffer[0] = '\0';
    memset(buffer+1, 'a', SIZE-1);
    lfs3_mdir_t mdir;
    lfs3_mtree_namelookup(&lfs3, 0, (const char*)buffer+1, SIZE-1,
            &mdir, NULL) => LFS3_ERR_NOENT;
    lfs3_mdir_commit(&lfs3, &mdir, LFS3_RATTRS(
            LFS3_RATTR(3, LFS3_TAG_REG, +1, LFS3_FROM_DATA),
            LFS3_RATTR_ARG(SIZE),
            LFS3_RATTR_ARG(buffer),
            LFS3_RATTR_NULL)) => 0;
    assert(mdir.r.weight == 2);

    memset(buffer+1, 'b', SIZE-1);
    lfs3_mtree_namelookup(&lfs3, 0, (const char*)buffer+1, SIZE-1,
            &mdir, NULL) => LFS3_ERR_NOENT;
    lfs3_mdir_commit(&lfs3, &mdir, LFS3_RATTRS(
            LFS3_RATTR(3, LFS3_TAG_REG, +1, LFS3_FROM_DATA),
            LFS3_RATTR_ARG(SIZE),
            LFS3_RATTR_ARG(buffer),
            LFS3_RATTR_NULL)) => 0;
    assert(mdir.r.weight == 3);

    // force mroot to compact
    lfs3.mroot.r.eoff = -1;
    lfs3_mdir_commit(&lfs3, &lfs3.mroot, LFS3_RATTRS(
            LFS3_RATTR(2, LFS3_TAG_ATTR(1), 0, LFS3_FROM_BUF, 1),
            LFS3_RATTR_ARG("c"),
            LFS3_RATTR_NULL)) => 0;

    // assert mdirs were unininlined and split
    assert(lfs3.mtree.r.weight == (2 << lfs3.mbits));
    // assert mroot now has no entries
    assert(lfs3.mroot.r.weight == 0);

    // now add another large entry to an mdir, forcing a split
    memset(buffer+1, 'd', SIZE-1);
    lfs3_mtree_namelookup(&lfs3, 0, (const char*)buffer+1, SIZE-1,
            &mdir, NULL) => LFS3_ERR_NOENT;
    lfs3_mdir_commit(&lfs3, &mdir, LFS3_RATTRS(
            LFS3_RATTR(3, LFS3_TAG_REG, +1, LFS3_FROM_DATA),
            LFS3_RATTR_ARG(SIZE),
            LFS3_RATTR_ARG(buffer),
            LFS3_RATTR_NULL)) => 0;
    assert(mdir.r.weight == 2);

    // force mdir to compact
    mdir.r.eoff = -1;
    lfs3_mdir_commit(&lfs3, &mdir, LFS3_RATTRS(
            LFS3_RATTR(2, LFS3_TAG_ATTR(2), 0, LFS3_FROM_BUF, 1),
            LFS3_RATTR_ARG("e"),
            LFS3_RATTR_NULL)) => 0;

    // assert mdir was split correctly
    assert(lfs3.mtree.r.weight == (3 << lfs3.mbits));
    // assert mroot still has no entries
    assert(lfs3.mroot.r.weight == 0);

    // assert that our entries are still in the mtree
    lfs3_mtree_lookup(&lfs3, (0 << lfs3.mbits)+1, &mdir) => 0;
    assert(mdir.r.weight == 2);
    lfs3_mdir_lookup(&lfs3, &mdir, LFS3_TAG_REG,
            &data) => LFS3_TAG_REG;
    lfs3_data_read(&lfs3, &data, buffer, SIZE) => SIZE;
    assert(buffer[1] == 'a');

    lfs3_mtree_lookup(&lfs3, (1 << lfs3.mbits)+0, &mdir) => 0;
    assert(mdir.r.weight == 1);
    lfs3_mdir_lookup(&lfs3, &mdir, LFS3_TAG_REG,
            &data) => LFS3_TAG_REG;
    lfs3_data_read(&lfs3, &data, buffer, SIZE) => SIZE;
    assert(buffer[1] == 'b');

    lfs3_mdir_lookup(&lfs3, &lfs3.mroot, LFS3_TAG_ATTR(1),
            &data) => LFS3_TAG_ATTR(1);
    lfs3_data_read(&lfs3, &data, buffer, 1) => 1;
    assert(buffer[0] == 'c');

    lfs3_mtree_lookup(&lfs3, (2 << lfs3.mbits)+0, &mdir) => 0;
    assert(mdir.r.weight == 1);
    lfs3_mdir_lookup(&lfs3, &mdir, LFS3_TAG_REG,
            &data) => LFS3_TAG_REG;
    lfs3_data_read(&lfs3, &data, buffer, SIZE) => SIZE;
    assert(buffer[1] == 'd');

    lfs3_mdir_lookup(&lfs3, &mdir, LFS3_TAG_ATTR(2),
            &data) => LFS3_TAG_ATTR(2);
    lfs3_data_read(&lfs3, &data, buffer, 1) => 1;
    assert(buffer[0] == 'e');

    // check things stay sane after remount
    lfs3_unmount(&lfs3) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR | M_FLAGS, CFG) => 0;

    // assert mdir was split correctly
    assert(lfs3.mtree.r.weight == (3 << lfs3.mbits));
    // assert mroot still has no entries
    assert(lfs3.mroot.r.weight == 0);

    // assert that our entries are still in the mtree
    lfs3_mtree_lookup(&lfs3, (0 << lfs3.mbits)+1, &mdir) => 0;
    assert(mdir.r.weight == 2);
    lfs3_mdir_lookup(&lfs3, &mdir, LFS3_TAG_REG,
            &data) => LFS3_TAG_REG;
    lfs3_data_read(&lfs3, &data, buffer, SIZE) => SIZE;
    assert(buffer[1] == 'a');

    lfs3_mtree_lookup(&lfs3, (1 << lfs3.mbits)+0, &mdir) => 0;
    assert(mdir.r.weight == 1);
    lfs3_mdir_lookup(&lfs3, &mdir, LFS3_TAG_REG,
            &data) => LFS3_TAG_REG;
    lfs3_data_read(&lfs3, &data, buffer, SIZE) => SIZE;
    assert(buffer[1] == 'b');

    lfs3_mdir_lookup(&lfs3, &lfs3.mroot, LFS3_TAG_ATTR(1),
            &data) => LFS3_TAG_ATTR(1);
    lfs3_data_read(&lfs3, &data, buffer, 1) => 1;
    assert(buffer[0] == 'c');

    lfs3_mtree_lookup(&lfs3, (2 << lfs3.mbits)+0, &mdir) => 0;
    assert(mdir.r.weight == 1);
    lfs3_mdir_lookup(&lfs3, &mdir, LFS3_TAG_REG,
            &data) => LFS3_TAG_REG;
    lfs3_data_read(&lfs3, &data, buffer, SIZE) => SIZE;
    assert(buffer[1] == 'd');

    lfs3_mdir_lookup(&lfs3, &mdir, LFS3_TAG_ATTR(2),
            &data) => LFS3_TAG_ATTR(2);
    lfs3_data_read(&lfs3, &data, buffer, 1) => 1;
    assert(buffer[0] == 'e');

