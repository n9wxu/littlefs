    lfs3.mroot.r.eoff = -1;
    lfs3_mdir_commit(&lfs3, &lfs3.mroot, LFS3_RATTRS(
            LFS3_RATTR(2, LFS3_TAG_ATTR(3), 0, LFS3_FROM_BUF, 1),
            LFS3_RATTR_ARG("d"),
