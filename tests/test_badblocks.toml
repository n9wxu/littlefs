# Bad-block related tests
after = [
    'test_dirs',
    'test_files',
    'test_fwrite',
    'test_stickynotes',
    'test_trvs',
    'test_gc',
    'test_mount',
    'test_ck',
    'test_compat',
]

defines.FORMAT_BLOCK_COUNT = 'LFS3_IFYES_GBMAP(3, 2, 2)'

code = '''
#include <setjmp.h>

// lose power by jumping back into our test
static void test_badblocks_powerloss_longjmp(void *data) {
    longjmp(*(jmp_buf*)data, 1);
}

// count successful syncs, so we know when a commit made it to disk
static int (*test_badblocks_sync_)(const struct lfs3_cfg *cfg);
static lfs3_size_t test_badblocks_syncs;

static int test_badblocks_sync(const struct lfs3_cfg *cfg) {
    int err = test_badblocks_sync_(cfg);
    if (err) {
        return err;
    }

    test_badblocks_syncs += 1;
    return 0;
}

// a model for the reentrant workloads, files map to the step that wrote
// their contents, and the contents are a pure function of that step
#define TEST_BADBLOCKS_PL_MAX 64

typedef struct test_badblocks_plsim {
    int32_t files[TEST_BADBLOCKS_PL_MAX];
    bool dirs[TEST_BADBLOCKS_PL_MAX];
} test_badblocks_plsim_t;

enum test_badblocks_plop_kind {
    TEST_BADBLOCKS_PL_WRITE,
    TEST_BADBLOCKS_PL_REMOVE,
    TEST_BADBLOCKS_PL_RENAME,
    TEST_BADBLOCKS_PL_MKDIR,
    TEST_BADBLOCKS_PL_RMDIR,
    TEST_BADBLOCKS_PL_MVDIR,
    TEST_BADBLOCKS_PL_NOOP,
};

typedef struct test_badblocks_plop {
    int kind;
    lfs3_size_t x;
    lfs3_size_t y;
} test_badblocks_plop_t;

static lfs3_size_t test_badblocks_plsize(lfs3_size_t step,
        lfs3_size_t block_size) {
    return (step % 3 == 0) ? 2*block_size
            : (step % 3 == 1) ? block_size/2
            : 16;
}

static void test_badblocks_plgen(uint32_t seed, lfs3_size_t step,
        uint8_t *buffer, lfs3_size_t size) {
    uint32_t prng = seed ^ (0x9e3779b9 * (step+1));
    for (lfs3_size_t i = 0; i < size; i++) {
        buffer[i] = 'a' + (TEST_PRNG(&prng) % 26);
    }
}

// pick a random existing entry, or -1 if there are none
static lfs3_size_t test_badblocks_plpick(uint32_t *prng,
        const test_badblocks_plsim_t *sim, bool dirs, lfs3_size_t n) {
    lfs3_size_t count = 0;
    for (lfs3_size_t i = 0; i < n; i++) {
        count += (dirs) ? sim->dirs[i] : (sim->files[i] >= 0);
    }
    if (count == 0) {
        return -1;
    }

    lfs3_size_t j = TEST_PRNG(prng) % count;
    for (lfs3_size_t i = 0; i < n; i++) {
        if ((dirs) ? sim->dirs[i] : (sim->files[i] >= 0)) {
            if (j == 0) {
                return i;
            }
            j -= 1;
        }
    }
    LFS3_UNREACHABLE();
}

// choose the next operation and play it out in our model
static test_badblocks_plop_t test_badblocks_plstep(uint32_t *prng,
        test_badblocks_plsim_t *sim, lfs3_size_t step, lfs3_size_t n) {
    test_badblocks_plop_t op;
    op.kind = TEST_PRNG(prng) % 6;
    op.x = TEST_PRNG(prng) % n;
    op.y = TEST_PRNG(prng) % n;

    // removing or renaming needs something to remove or rename
    if (op.kind == TEST_BADBLOCKS_PL_REMOVE
            || op.kind == TEST_BADBLOCKS_PL_RENAME
            || op.kind == TEST_BADBLOCKS_PL_RMDIR
            || op.kind == TEST_BADBLOCKS_PL_MVDIR) {
        bool dirs = (op.kind >= TEST_BADBLOCKS_PL_MKDIR);
        op.x = test_badblocks_plpick(prng, sim, dirs, n);
        if (op.x == (lfs3_size_t)-1) {
            op.kind = (dirs) ? TEST_BADBLOCKS_PL_MKDIR : TEST_BADBLOCKS_PL_WRITE;
            op.x = op.y;
        }
    }

    switch (op.kind) {
    case TEST_BADBLOCKS_PL_WRITE:;
        sim->files[op.x] = step;
        break;
    case TEST_BADBLOCKS_PL_REMOVE:;
        sim->files[op.x] = -1;
        break;
    case TEST_BADBLOCKS_PL_RENAME:;
        if (op.x == op.y) {
            op.kind = TEST_BADBLOCKS_PL_NOOP;
            break;
        }
        sim->files[op.y] = sim->files[op.x];
        sim->files[op.x] = -1;
        break;
    case TEST_BADBLOCKS_PL_MKDIR:;
        if (sim->dirs[op.x]) {
            op.kind = TEST_BADBLOCKS_PL_NOOP;
            break;
        }
        sim->dirs[op.x] = true;
        break;
    case TEST_BADBLOCKS_PL_RMDIR:;
        sim->dirs[op.x] = false;
        break;
    case TEST_BADBLOCKS_PL_MVDIR:;
        // don't rename over dirs
        if (sim->dirs[op.y]) {
            op.kind = TEST_BADBLOCKS_PL_NOOP;
            break;
        }
        sim->dirs[op.y] = true;
        sim->dirs[op.x] = false;
        break;
    default:;
        LFS3_UNREACHABLE();
    }

    return op;
}

// does the disk match our model? asserts on anything that isn't a
// mismatch
static bool test_badblocks_plck(lfs3_t *lfs3,
        const test_badblocks_plsim_t *sim, lfs3_size_t n, uint32_t seed,
        lfs3_size_t block_size) {
    // check what's in the root dir
    bool seen_files[TEST_BADBLOCKS_PL_MAX] = {false};
    bool seen_dirs[TEST_BADBLOCKS_PL_MAX] = {false};
    lfs3_dir_t dir;
    int err = lfs3_dir_open(lfs3, &dir, "/");
    assert(!err);
    while (true) {
        struct lfs3_info info;
        err = lfs3_dir_read(lfs3, &dir, &info);
        assert(!err || err == LFS3_ERR_NOENT);
        if (err == LFS3_ERR_NOENT) {
            break;
        }
        if (strcmp(info.name, ".") == 0
                || strcmp(info.name, "..") == 0
                || strcmp(info.name, "state") == 0) {
            continue;
        }

        unsigned x;
        char c;
        int d = sscanf(info.name, "%c%03x", &c, &x);
        assert(d == 2 && (c == 'f' || c == 'd') && x < n);
        if (c == 'f') {
            assert(info.type == LFS3_TYPE_REG);
            seen_files[x] = true;
        } else {
            assert(info.type == LFS3_TYPE_DIR);
            seen_dirs[x] = true;
        }
    }
    err = lfs3_dir_close(lfs3, &dir);
    assert(!err);

    for (lfs3_size_t x = 0; x < n; x++) {
        if (seen_dirs[x] != sim->dirs[x]
                || seen_files[x] != (sim->files[x] >= 0)) {
            return false;
        }
    }

    // check each file's step attribute and contents
    for (lfs3_size_t x = 0; x < n; x++) {
        if (sim->files[x] < 0) {
            continue;
        }

        char name[256];
        sprintf(name, "f%03x", (unsigned)x);
        int32_t step = -1;
        struct lfs3_attr attrs[] = {{
            .type = 's',
            .flags = LFS3_A_RDONLY,
            .buffer = &step,
            .buffer_size = sizeof(step),
        }};
        struct lfs3_file_cfg filecfg = {
            .attrs = attrs,
            .attr_count = 1,
        };
        lfs3_file_t file;
        err = lfs3_file_opencfg(lfs3, &file, name, LFS3_O_RDONLY, &filecfg);
        assert(!err);
        // the step attribute should always match the data
        lfs3_size_t size = test_badblocks_plsize(step, block_size);
        uint8_t *wbuf = malloc(size);
        uint8_t *rbuf = malloc(size+1);
        test_badblocks_plgen(seed, step, wbuf, size);
        lfs3_ssize_t d = lfs3_file_read(lfs3, &file, rbuf, size+1);
        assert(d == (lfs3_ssize_t)size);
        assert(memcmp(rbuf, wbuf, size) == 0);
        free(wbuf);
        free(rbuf);
        err = lfs3_file_close(lfs3, &file);
        assert(!err);

        if (step != sim->files[x]) {
            return false;
        }
    }

    return true;
}
'''


## Single-block badblock tests
#
# first test with every possible single badblock

# B-tree's ridiculous branching factor is great for performance, but it makes
# them a bit of a pain to test, here we test them explicitly
[cases.test_badblocks_every_btree_many]
defines.BADBLOCK = -1
defines.BADBLOCK_BEHAVIOR = [
    'LFS3_EMUBD_BADBLOCK_PROGERROR',
    'LFS3_EMUBD_BADBLOCK_ERASEERROR',
    'LFS3_EMUBD_BADBLOCK_READERROR',
    'LFS3_EMUBD_BADBLOCK_PROGNOOP',
    'LFS3_EMUBD_BADBLOCK_ERASENOOP',
]
# we need prog checking to detect read errors
defines.CKPROGS = 'BADBLOCK_BEHAVIOR >= LFS3_EMUBD_BADBLOCK_READERROR'
defines.N = [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]
# maximize lookahead buffer to avoid alloc scans
defines.LOOKAHEAD_SIZE = '(BLOCK_COUNT+8-1) / 8'
defines.SEED = 42
fuzz = 'SEED'
if = 'LFS3_IFDEF_CKPROGS(true, !CKPROGS)'
# don't bother testing with more complicated block allocators
ifndef = 'LFS3_YES_GBMAP'
in = 'lfs3.c'
code = '''
    // test all possible bad blocks
    for (lfs3_size_t i = 0;
            i < ((BADBLOCK == -1) ? BLOCK_COUNT : 1);
            i++) {
        lfs3_size_t badblock = (BADBLOCK == -1) ? i : BADBLOCK;
        printf("--- badblock: 0x%x ---\n", badblock);
        // mark our badblock as bad
        lfs3_emubd_mkbad(CFG, badblock) => 0;

        // test creating a btree
        lfs3_t lfs3;
        lfs3_init(&lfs3,
                LFS3_M_RDWR
                    | ((CKPROGS) ? LFS3_IFDEF_CKPROGS(LFS3_M_CKPROGS, -1) : 0),
                CFG) => 0;
        // create free lookahead
        memset(lfs3.lookahead.buffer, 0, CFG->lookahead_size);
        lfs3.lookahead.window = 2;
        lfs3.lookahead.off = 0;
        lfs3.lookahead.known = lfs3_min(8*CFG->lookahead_size,
                CFG->block_count-2);
        lfs3_alloc_ckpoint(&lfs3);

        // create a btree
        lfs3_btree_t btree;
        lfs3_btree_init(&btree);

        // set up a simulation to compare against
        char *sim = malloc(N);
        lfs3_size_t sim_size = 0;
        memset(sim, 0, N);

        uint32_t prng = SEED;
        for (lfs3_size_t i = 0; i < N; i++) {
            // choose a pseudo-random bid
            lfs3_size_t bid = TEST_PRNG(&prng) % (sim_size+1);

            // add to btree
            lfs3_btree_commit(&lfs3, &btree, bid, LFS3_RATTRS(
                    LFS3_RATTR(2, LFS3_TAG_DATA, +1, LFS3_FROM_BUF, 1),
                    LFS3_RATTR_ARG(&(uint8_t){'a'+(i % 26)}),
                    LFS3_RATTR_NULL)) => 0;

            // add to sim
            memmove(&sim[bid+1], &sim[bid], sim_size-bid);
            sim[bid] = 'a'+(i % 26);
            sim_size += 1;
        }

        // check that btree matches sim
        printf("expd: [");
        bool first = true;
        for (lfs3_size_t i = 0; i < sim_size; i++) {
            if (!first) {
                printf(", ");
            }
            first = false;
            printf("%c", sim[i]);
        }
        printf("]\n");
        printf("btree: w%d 0x%x.%x\n",
                btree.r.weight,
                btree.r.blocks[0],
                btree.r.trunk);
        assert(btree.r.weight == sim_size);

        uint8_t buffer[4];
        lfs3_bid_t bid_;
        lfs3_stag_t tag_;
        lfs3_size_t weight_;
        lfs3_data_t data_;
        for (lfs3_size_t i = 0; i < sim_size; i++) {
            tag_ = lfs3_btree_lookupnext(&lfs3, &btree, i,
                    &bid_, &weight_, &data_);
            lfs3_data_read(&lfs3, &data_, buffer, 4) => 1;
            assert(bid_ == i);
            assert(tag_ == LFS3_TAG_DATA);
            assert(weight_ == 1);
            assert(memcmp(buffer, &sim[i], 1) == 0);
        }

        // and no extra elements
        lfs3_btree_lookupnext(&lfs3, &btree, sim_size,
                &bid_, &weight_, &data_) => LFS3_ERR_NOENT;

        // clean up sim
        free(sim);
        lfs3_deinit(&lfs3) => 0;

        // reset badblock
        lfs3_emubd_mkgood(CFG, badblock) => 0;
    }
'''

# badblocks with dirs
[cases.test_badblocks_every_spam_dir_many]
defines.BADBLOCK = -1
defines.BADBLOCK_BEHAVIOR = [
    'LFS3_EMUBD_BADBLOCK_PROGERROR',
    'LFS3_EMUBD_BADBLOCK_ERASEERROR',
    'LFS3_EMUBD_BADBLOCK_READERROR',
    'LFS3_EMUBD_BADBLOCK_PROGNOOP',
    'LFS3_EMUBD_BADBLOCK_ERASENOOP',
]
# we need prog checking to detect read errors
defines.CKPROGS = 'BADBLOCK_BEHAVIOR >= LFS3_EMUBD_BADBLOCK_READERROR'
defines.N = [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]
if = 'LFS3_IFDEF_CKPROGS(true, !CKPROGS)'
code = '''
    // test all possible bad blocks
    for (lfs3_size_t i = FORMAT_BLOCK_COUNT;
            i < ((BADBLOCK == -1) ? BLOCK_COUNT : 1);
            i++) {
        lfs3_size_t badblock = (BADBLOCK == -1) ? i : BADBLOCK;
        printf("--- badblock: 0x%x ---\n", badblock);
        // mark our badblock as bad
        lfs3_emubd_mkbad(CFG, badblock) => 0;

        // test creating directories
        lfs3_t lfs3;
        lfs3_format(&lfs3,
                LFS3_F_RDWR
                    | ((CKPROGS) ? LFS3_IFDEF_CKPROGS(LFS3_F_CKPROGS, -1) : 0),
                CFG) => 0;
        lfs3_mount(&lfs3,
                LFS3_M_RDWR
                    | ((CKPROGS) ? LFS3_IFDEF_CKPROGS(LFS3_M_CKPROGS, -1) : 0),
                CFG) => 0;

        // make this many directories
        for (lfs3_size_t i = 0; i < N; i++) {
            char name[256];
            sprintf(name, "dir%03x", i);
            int err = lfs3_mkdir(&lfs3, name);
            assert(!err || (TEST_PLS && err == LFS3_ERR_EXIST));
        }

        for (int remount = 0; remount < 2; remount++) {
            // remount?
            if (remount) {
                lfs3_unmount(&lfs3) => 0;
                lfs3_mount(&lfs3,
                        LFS3_M_RDWR
                            | ((CKPROGS)
                                ? LFS3_IFDEF_CKPROGS(LFS3_M_CKPROGS, -1)
                                : 0),
                        CFG) => 0;
            }

            // grm should be zero here
            assert(lfs3.grm_p[0] == 0);

            // check that our mkdir worked
            for (lfs3_size_t i = 0; i < N; i++) {
                char name[256];
                sprintf(name, "dir%03x", i);
                struct lfs3_info info;
                lfs3_stat(&lfs3, name, &info) => 0;
                assert(strcmp(info.name, name) == 0);
                assert(info.type == LFS3_TYPE_DIR);
                assert(info.size == 0);
            }

            lfs3_dir_t dir;
            lfs3_dir_open(&lfs3, &dir, "/") => 0;
            struct lfs3_info info;
            lfs3_dir_read(&lfs3, &dir, &info) => 0;
            assert(strcmp(info.name, ".") == 0);
            assert(info.type == LFS3_TYPE_DIR);
            assert(info.size == 0);
            lfs3_dir_read(&lfs3, &dir, &info) => 0;
            assert(strcmp(info.name, "..") == 0);
            assert(info.type == LFS3_TYPE_DIR);
            assert(info.size == 0);
            for (lfs3_size_t i = 0; i < N; i++) {
                char name[256];
                sprintf(name, "dir%03x", i);
                lfs3_dir_read(&lfs3, &dir, &info) => 0;
                assert(strcmp(info.name, name) == 0);
                assert(info.type == LFS3_TYPE_DIR);
                assert(info.size == 0);
            }
            lfs3_dir_read(&lfs3, &dir, &info) => LFS3_ERR_NOENT;
            lfs3_dir_close(&lfs3, &dir) => 0;

            for (lfs3_size_t i = 0; i < N; i++) {
                char name[256];
                sprintf(name, "dir%03x", i);
                lfs3_dir_open(&lfs3, &dir, name) => 0;
                lfs3_dir_read(&lfs3, &dir, &info) => 0;
                assert(strcmp(info.name, ".") == 0);
                assert(info.type == LFS3_TYPE_DIR);
                assert(info.size == 0);
                lfs3_dir_read(&lfs3, &dir, &info) => 0;
                assert(strcmp(info.name, "..") == 0);
                assert(info.type == LFS3_TYPE_DIR);
                assert(info.size == 0);
                lfs3_dir_read(&lfs3, &dir, &info) => LFS3_ERR_NOENT;
                lfs3_dir_close(&lfs3, &dir) => 0;
            }
        }

        lfs3_unmount(&lfs3) => 0;

        // reset badblock
        lfs3_emubd_mkgood(CFG, badblock) => 0;
    }
'''

# badblocks with fuzz dirs
[cases.test_badblocks_every_spam_dir_fuzz]
defines.BADBLOCK = -1
defines.BADBLOCK_BEHAVIOR = [
    'LFS3_EMUBD_BADBLOCK_PROGERROR',
    'LFS3_EMUBD_BADBLOCK_ERASEERROR',
    'LFS3_EMUBD_BADBLOCK_READERROR',
    'LFS3_EMUBD_BADBLOCK_PROGNOOP',
    'LFS3_EMUBD_BADBLOCK_ERASENOOP',
]
# we need prog checking to detect read errors
defines.CKPROGS = 'BADBLOCK_BEHAVIOR >= LFS3_EMUBD_BADBLOCK_READERROR'
defines.N = [1, 2, 4, 8, 16, 32, 64, 128, 256]
defines.OPS = '2*N'
defines.SEED = 42
fuzz = 'SEED'
if = 'LFS3_IFDEF_CKPROGS(true, !CKPROGS)'
code = '''
    // test all possible bad blocks
    for (lfs3_size_t i = FORMAT_BLOCK_COUNT;
            i < ((BADBLOCK == -1) ? BLOCK_COUNT : 1);
            i++) {
        lfs3_size_t badblock = (BADBLOCK == -1) ? i : BADBLOCK;
        printf("--- badblock: 0x%x ---\n", badblock);
        // mark our badblock as bad
        lfs3_emubd_mkbad(CFG, badblock) => 0;

        // test fuzz with dirs
        lfs3_t lfs3;
        lfs3_format(&lfs3,
                LFS3_F_RDWR
                    | ((CKPROGS) ? LFS3_IFDEF_CKPROGS(LFS3_F_CKPROGS, -1) : 0),
                CFG) => 0;
        lfs3_mount(&lfs3,
                LFS3_M_RDWR
                    | ((CKPROGS) ? LFS3_IFDEF_CKPROGS(LFS3_M_CKPROGS, -1) : 0),
                CFG) => 0;

        // set up a simulation to compare against
        lfs3_size_t *sim = malloc(N*sizeof(lfs3_size_t));
        lfs3_size_t sim_size = 0;

        uint32_t prng = SEED;
        for (lfs3_size_t i = 0; i < OPS; i++) {
            // choose a pseudo-random op, either mkdir, remove, or rename
            uint8_t op = TEST_PRNG(&prng) % 3;

            if (op == 0 || sim_size == 0) {
                // choose a pseudo-random number, truncate to 3 hexadecimals
                lfs3_size_t x = TEST_PRNG(&prng) % N;
                // insert into our sim
                for (lfs3_size_t j = 0;; j++) {
                    if (j >= sim_size || sim[j] >= x) {
                        // already seen?
                        if (j < sim_size && sim[j] == x) {
                            // do nothing
                        } else {
                            // insert
                            memmove(&sim[j+1], &sim[j],
                                    (sim_size-j)*sizeof(lfs3_size_t));
                            sim_size += 1;
                            sim[j] = x;
                        }
                        break;
                    }
                }

                // create a directory here
                char name[256];
                sprintf(name, "dir%03x", x);
                int err = lfs3_mkdir(&lfs3, name);
                assert(!err || err == LFS3_ERR_EXIST);

            } else if (op == 1) {
                // choose a pseudo-random entry to delete
                lfs3_size_t j = TEST_PRNG(&prng) % sim_size;
                lfs3_size_t x = sim[j];
                // delete from our sim
                memmove(&sim[j], &sim[j+1],
                        (sim_size-(j+1))*sizeof(lfs3_size_t));
                sim_size -= 1;

                // remove this directory
                char name[256];
                sprintf(name, "dir%03x", x);
                lfs3_remove(&lfs3, name) => 0;

            } else {
                // choose a pseudo-random entry to rename, and a pseudo-random
                // number to rename to
                lfs3_size_t j = TEST_PRNG(&prng) % sim_size;
                lfs3_size_t x = sim[j];
                lfs3_size_t y = TEST_PRNG(&prng) % N;
                for (lfs3_size_t k = 0;; k++) {
                    if (k >= sim_size || sim[k] >= y) {
                        // already seen and not a noop?
                        if (k < sim_size && sim[k] == y && x != y) {
                            // just delete the original entry
                            memmove(&sim[j], &sim[j+1],
                                    (sim_size-(j+1))*sizeof(lfs3_size_t));
                            sim_size -= 1;
                        } else {
                            // first delete
                            memmove(&sim[j], &sim[j+1],
                                    (sim_size-(j+1))*sizeof(lfs3_size_t));
                            if (k > j) {
                                k -= 1;
                            }
                            // then insert
                            memmove(&sim[k+1], &sim[k],
                                    (sim_size-1-k)*sizeof(lfs3_size_t));
                            sim[k] = y;
                        }
                        break;
                    }
                }

                // rename this directory
                char old_name[256];
                sprintf(old_name, "dir%03x", x);
                char new_name[256];
                sprintf(new_name, "dir%03x", y);
                lfs3_rename(&lfs3, old_name, new_name) => 0;
            }
        }

        for (int remount = 0; remount < 2; remount++) {
            // remount?
            if (remount) {
                lfs3_unmount(&lfs3) => 0;
                lfs3_mount(&lfs3,
                        LFS3_M_RDWR
                            | ((CKPROGS)
                                ? LFS3_IFDEF_CKPROGS(LFS3_M_CKPROGS, -1)
                                : 0),
                        CFG) => 0;
            }

            // grm should be zero here
            assert(lfs3.grm_p[0] == 0);

            // test that our directories match our simulation
            for (lfs3_size_t j = 0; j < sim_size; j++) {
                char name[256];
                sprintf(name, "dir%03x", sim[j]);
                struct lfs3_info info;
                lfs3_stat(&lfs3, name, &info) => 0;
                char name2[256];
                sprintf(name2, "dir%03x", sim[j]);
                assert(strcmp(info.name, name2) == 0);
                assert(info.type == LFS3_TYPE_DIR);
                assert(info.size == 0);
            }

            lfs3_dir_t dir;
            lfs3_dir_open(&lfs3, &dir, "/") => 0;
            struct lfs3_info info;
            lfs3_dir_read(&lfs3, &dir, &info) => 0;
            assert(strcmp(info.name, ".") == 0);
            assert(info.type == LFS3_TYPE_DIR);
            assert(info.size == 0);
            lfs3_dir_read(&lfs3, &dir, &info) => 0;
            assert(strcmp(info.name, "..") == 0);
            assert(info.type == LFS3_TYPE_DIR);
            assert(info.size == 0);
            for (lfs3_size_t j = 0; j < sim_size; j++) {
                char name[256];
                sprintf(name, "dir%03x", sim[j]);
                lfs3_dir_read(&lfs3, &dir, &info) => 0;
                assert(strcmp(info.name, name) == 0);
                assert(info.type == LFS3_TYPE_DIR);
                assert(info.size == 0);
            }
            lfs3_dir_read(&lfs3, &dir, &info) => LFS3_ERR_NOENT;
            lfs3_dir_close(&lfs3, &dir) => 0;
        }

        // clean up sim/lfs3
        free(sim);
        lfs3_unmount(&lfs3) => 0;

        // reset badblock
        lfs3_emubd_mkgood(CFG, badblock) => 0;
    }
'''

# badblocks with files
[cases.test_badblocks_every_spam_file_many]
defines.BADBLOCK = -1
defines.BADBLOCK_BEHAVIOR = [
    'LFS3_EMUBD_BADBLOCK_PROGERROR',
