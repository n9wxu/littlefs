                assert(memcmp(rbuf, wbuf, SIZE) == 0);
                lfs3_file_close(&lfs3, &file) => 0;
            }
        }

        lfs3_unmount(&lfs3) => 0;

        // reset badblock
        lfs3_emubd_mkgood(CFG, badblock) => 0;
