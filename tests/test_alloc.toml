                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            &cfg) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;

    // create n files repeatedly until we're sure we've wrapped around
    // a few times
    uint32_t prng = 42;
    uint32_t prng_ = prng;
    for (lfs3_size_t i = 0;
            i < (WRAPAROUND*COUNT)
                / (N*(SIZE/BLOCK_SIZE));
