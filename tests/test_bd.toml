    // read block 1
    block = 1;
    for (lfs3_off_t i = 0; i < CFG->block_size; i += READ) {
        CFG->read(CFG, block, i, buffer, READ) => 0;

        for (lfs3_off_t j = 0; j < READ; j++) {
            LFS3_ASSERT(buffer[j] == (block+i+j) % 251);
        }
    }

    // read block 0 again
    block = 0;
    for (lfs3_off_t i = 0; i < CFG->block_size; i += READ) {
        CFG->read(CFG, block, i, buffer, READ) => 0;

        for (lfs3_off_t j = 0; j < READ; j++) {
            LFS3_ASSERT(buffer[j] == (block+i+j) % 251);
        }
