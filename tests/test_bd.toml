# Block device tests
#
# These tests don't really test littlefs at all, they are here only to make
# sure the underlying block device is working.
#
# Note we use 251, a prime, in places to avoid aliasing powers of 2.
#

code = '''
// a powerloss callback that returns, so the interrupted operation
// continues, the way the exhaustive runner branches
__attribute__((unused))
static void test_bd_powerloss_continue(void *data) {
    (void)data;
}
'''

[cases.test_bd_one_block]
defines.READ = ['READ_SIZE', 'BLOCK_SIZE']
defines.PROG = ['PROG_SIZE', 'BLOCK_SIZE']
code = '''
    uint8_t buffer[LFS3_MAX(READ, PROG)];

    // write data
    CFG->erase(CFG, 0) => 0;
    for (lfs3_off_t i = 0; i < CFG->block_size; i += PROG) {
        for (lfs3_off_t j = 0; j < PROG; j++) {
            buffer[j] = (i+j) % 251;
        }
        CFG->prog(CFG, 0, i, buffer, PROG) => 0;
    }

    // read data
    for (lfs3_off_t i = 0; i < CFG->block_size; i += READ) {
        CFG->read(CFG, 0, i, buffer, READ) => 0;

        for (lfs3_off_t j = 0; j < READ; j++) {
            LFS3_ASSERT(buffer[j] == (i+j) % 251);
        }
    }
'''

[cases.test_bd_two_block]
defines.READ = ['READ_SIZE', 'BLOCK_SIZE']
defines.PROG = ['PROG_SIZE', 'BLOCK_SIZE']
code = '''
    uint8_t buffer[LFS3_MAX(READ, PROG)];
    lfs3_block_t block;

    // write block 0
    block = 0;
    CFG->erase(CFG, block) => 0;
    for (lfs3_off_t i = 0; i < CFG->block_size; i += PROG) {
        for (lfs3_off_t j = 0; j < PROG; j++) {
            buffer[j] = (block+i+j) % 251;
        }
        CFG->prog(CFG, block, i, buffer, PROG) => 0;
    }

    // read block 0
    block = 0;
    for (lfs3_off_t i = 0; i < CFG->block_size; i += READ) {
        CFG->read(CFG, block, i, buffer, READ) => 0;

        for (lfs3_off_t j = 0; j < READ; j++) {
            LFS3_ASSERT(buffer[j] == (block+i+j) % 251);
        }
    }

    // write block 1
    block = 1;
    CFG->erase(CFG, block) => 0;
    for (lfs3_off_t i = 0; i < CFG->block_size; i += PROG) {
        for (lfs3_off_t j = 0; j < PROG; j++) {
            buffer[j] = (block+i+j) % 251;
        }
        CFG->prog(CFG, block, i, buffer, PROG) => 0;
    }

    // read block 1
    block = 1;
    for (lfs3_off_t i = 0; i < CFG->block_size; i += READ) {
        CFG->read(CFG, block, i, buffer, READ) => 0;

        for (lfs3_off_t j = 0; j < READ; j++) {
            LFS3_ASSERT(buffer[j] == (block+i+j) % 251);
        }
    }

    // read block 0 again
    block = 0;
    for (lfs3_off_t i = 0; i < CFG->block_size; i += READ) {
        CFG->read(CFG, block, i, buffer, READ) => 0;

        for (lfs3_off_t j = 0; j < READ; j++) {
            LFS3_ASSERT(buffer[j] == (block+i+j) % 251);
        }
    }
'''

