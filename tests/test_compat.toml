    assert(sizeof(struct lfsp_cfg) == sizeof(struct lfs3_cfg));
    memcpy(&cfgp, CFG, sizeof(cfgp));
    lfsp_t lfsp;
    lfsp_mount(&lfsp, LFSP_M_RDWR, &cfgp) => 0;

    // write half COUNT files
    prng = 42;
    for (lfs3_size_t i = 0; i < COUNT; i++) {
        // skip half but keep our prng reproducible
        for (lfs3_size_t j = 0; j < SIZE/2; j++) {
            TEST_PRNG(&prng);
        }

        // write the other half
        lfsp_file_t file;
        char name[16];
        sprintf(name, "dir%03d/file%03d", i, i);
        lfsp_file_open(&lfsp, &file, name, LFSP_O_WRONLY) => 0;
        lfsp_file_seek(&lfsp, &file, SIZE/2, LFSP_SEEK_SET) => SIZE/2;

        for (lfs3_size_t j = SIZE/2; j < SIZE; j += CHUNK) {
            uint8_t chunk[CHUNK];
            for (lfs3_size_t k = 0; k < CHUNK; k++) {
                chunk[k] = TEST_PRNG(&prng) & 0xff;
            }

            lfsp_file_write(&lfsp, &file, chunk, CHUNK) => CHUNK;
        }
        lfsp_file_close(&lfsp, &file) => 0;
    }

    // can we list the directories?
    lfsp_dir_t dir;
    lfsp_dir_open(&lfsp, &dir, "/") => 0;
    struct lfsp_info info;
    lfsp_dir_read(&lfsp, &dir, &info) => 0;
    assert(strcmp(info.name, ".") == 0);
    assert(info.type == LFSP_TYPE_DIR);
    assert(info.size == 0);
    lfsp_dir_read(&lfsp, &dir, &info) => 0;
    assert(strcmp(info.name, "..") == 0);
    assert(info.type == LFSP_TYPE_DIR);
    assert(info.size == 0);

    for (lfs3_size_t i = 0; i < COUNT; i++) {
        lfsp_dir_read(&lfsp, &dir, &info) => 0;
        char name[8];
        sprintf(name, "dir%03d", i);
        assert(strcmp(info.name, name) == 0);
        assert(info.type == LFSP_TYPE_DIR);
        assert(info.size == 0);
    }

    lfsp_dir_read(&lfsp, &dir, &info) => LFSP_ERR_NOENT;
    lfsp_dir_close(&lfsp, &dir) => 0;

    // can we list the files?
    for (lfs3_size_t i = 0; i < COUNT; i++) {
        char name[8];
        sprintf(name, "dir%03d", i);
        lfsp_dir_t dir;
        lfsp_dir_open(&lfsp, &dir, name) => 0;
        struct lfsp_info info;
        lfsp_dir_read(&lfsp, &dir, &info) => 0;
        assert(strcmp(info.name, ".") == 0);
        assert(info.type == LFSP_TYPE_DIR);
        assert(info.size == 0);
        lfsp_dir_read(&lfsp, &dir, &info) => 0;
        assert(strcmp(info.name, "..") == 0);
        assert(info.type == LFSP_TYPE_DIR);
        assert(info.size == 0);

        lfsp_dir_read(&lfsp, &dir, &info) => 0;
        sprintf(name, "file%03d", i);
        assert(strcmp(info.name, name) == 0);
        assert(info.type == LFSP_TYPE_REG);
        assert(info.size == SIZE);

        lfsp_dir_read(&lfsp, &dir, &info) => LFSP_ERR_NOENT;
        lfsp_dir_close(&lfsp, &dir) => 0;
    }

    // now can we read the files?
    prng = 42;
    for (lfs3_size_t i = 0; i < COUNT; i++) {
        lfsp_file_t file;
        char name[16];
        sprintf(name, "dir%03d/file%03d", i, i);
        lfsp_file_open(&lfsp, &file, name, LFSP_O_RDONLY) => 0;
        for (lfs3_size_t j = 0; j < SIZE; j += CHUNK) {
            uint8_t chunk[CHUNK];
            lfsp_file_read(&lfsp, &file, chunk, CHUNK) => CHUNK;

            for (lfs3_size_t k = 0; k < CHUNK; k++) {
                assert(chunk[k] == (TEST_PRNG(&prng) & 0xff));
            }
        }
        lfsp_file_close(&lfsp, &file) => 0;
    }

    lfsp_unmount(&lfsp) => 0;
'''



## gbmap compatibility tests ##

# test that images with and without a gbmap mount as expected in builds
# with and without LFS3_GBMAP, and that a driver that doesn't track bad
# blocks never writes blocks a newer driver marked bad in the gbmap
#
# ROLE=0 => make the image and check it, the same build on both sides
# ROLE=1 => only make the image, with -d this writes it to a file
# ROLE=2 => check the image in the file TEST_COMPAT_GBMAP_IMAGE
#
# make test-compat-gbmap exchanges images between the default,
# LFS3_GBMAP, and LFS3_YES_GBMAP builds with ROLE=1 and ROLE=2, GBMAP and
# BMBAD must then describe the image
[cases.test_compat_gbmap_exchange]
defines.ROLE = 0
defines.GBMAP = [false, true]
defines.BMBAD = [false, true]
# count erases
defines.ERASE_CYCLES = 0xffffffff
if = [
    'ROLE == 2 || LFS3_IFYES_GBMAP(GBMAP, true, !GBMAP)',
    '!BMBAD || GBMAP',
]
in = 'lfs3.c'
code = '''
    #define TEST_COMPAT_GBMAP_N 12
    #define TEST_COMPAT_GBMAP_BAD 8
    #define TEST_COMPAT_GBMAP_SIZE(i) \
        ((const lfs3_size_t[]){0, 7, 100, 1000, 5000, 20000}[(i) % 6])
    #define TEST_COMPAT_GBMAP_DATA(i, buffer) do { \
        uint32_t prng_ = 42 + (i); \
        for (lfs3_size_t j_ = 0; j_ < TEST_COMPAT_GBMAP_SIZE(i); j_++) { \
            (buffer)[j_] = 'a' + (TEST_PRNG(&prng_) % 26); \
        } \
    } while (0)
    uint8_t *wbuf = malloc(20000);
    uint8_t *rbuf = malloc(20000+1);
    assert(wbuf && rbuf);
    lfs3_t lfs3;

    if (ROLE == 0 || ROLE == 1) {
        // make the image
        lfs3_format(&lfs3,
                LFS3_F_RDWR
                    | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
                CFG) => 0;
        lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
        lfs3_mkdir(&lfs3, "dir") => 0;
        for (lfs3_size_t i = 0; i < TEST_COMPAT_GBMAP_N; i++) {
            char name[256];
            sprintf(name, "dir/file%03x", i);
            TEST_COMPAT_GBMAP_DATA(i, wbuf);
            lfs3_file_t file;
            lfs3_file_open(&lfs3, &file, name,
                    LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
            lfs3_file_write(&lfs3, &file, wbuf, TEST_COMPAT_GBMAP_SIZE(i))
                    => TEST_COMPAT_GBMAP_SIZE(i);
            lfs3_file_close(&lfs3, &file) => 0;
        }
        lfs3_setattr(&lfs3, "dir", 'a', "gbmap?", 6) => 0;

        // mark some free blocks bad in the gbmap, as a driver that tracks
        // bad blocks would
        #ifdef LFS3_GBMAP
        if (BMBAD) {
            lfs3_size_t marked = 0;
            for (lfs3_block_t b = BLOCK_COUNT-1;
                    b > 0 && marked < TEST_COMPAT_GBMAP_BAD;
                    b--) {
                lfs3_bid_t bid;
                lfs3_bid_t weight;
                lfs3_stag_t tag = lfs3_gbmap_lookupnext(&lfs3,
                        &lfs3.gbmap.b, b, &bid, &weight, NULL);
                assert(tag >= 0);
                if (tag == LFS3_TAG_BMFREE || tag == LFS3_TAG_BMERASED) {
                    lfs3_gbmap_set(&lfs3, &lfs3.gbmap.b, b,
                            LFS3_TAG_BMBAD, NULL) => 0;
                    marked += 1;
                }
            }
            assert(marked == TEST_COMPAT_GBMAP_BAD);
            lfs3_alloc_syncgbmap(&lfs3) => 0;
        }
        #endif
        lfs3_unmount(&lfs3) => 0;
    }

    if (ROLE == 2) {
        // load the image
        const char *path = getenv("TEST_COMPAT_GBMAP_IMAGE");
        assert(path);
        FILE *f = fopen(path, "rb");
        assert(f);
        uint8_t *block = malloc(BLOCK_SIZE);
        assert(block);
        for (lfs3_block_t b = 0; b < BLOCK_COUNT; b++) {
            size_t d = fread(block, 1, BLOCK_SIZE, f);
            assert(d == BLOCK_SIZE);
            CFG->erase(CFG, b) => 0;
            CFG->prog(CFG, b, 0, block, BLOCK_SIZE) => 0;
        }
        assert(fgetc(f) == EOF);
        fclose(f);
        free(block);
    }

    if (ROLE == 0 || ROLE == 2) {
        // check the image
        #define TEST_COMPAT_GBMAP_CK() do { \
            struct lfs3_info info; \
            int err_ = lfs3_stat(&lfs3, "dir", &info); \
            assert(!err_); \
            assert(info.type == LFS3_TYPE_DIR); \
            uint8_t abuf[6]; \
            lfs3_ssize_t d_ = lfs3_getattr(&lfs3, "dir", 'a', abuf, 6); \
            assert(d_ == 6); \
            assert(memcmp(abuf, "gbmap?", 6) == 0); \
            for (lfs3_size_t i = 0; i < TEST_COMPAT_GBMAP_N; i++) { \
                char name[256]; \
                sprintf(name, "dir/file%03x", i); \
                TEST_COMPAT_GBMAP_DATA(i, wbuf); \
                lfs3_file_t file; \
                err_ = lfs3_file_open(&lfs3, &file, name, LFS3_O_RDONLY); \
                assert(!err_); \
                d_ = lfs3_file_read(&lfs3, &file, rbuf, 20000+1); \
                assert(d_ == (lfs3_ssize_t)TEST_COMPAT_GBMAP_SIZE(i)); \
                assert(memcmp(rbuf, wbuf, TEST_COMPAT_GBMAP_SIZE(i)) == 0); \
                err_ = lfs3_file_close(&lfs3, &file); \
                assert(!err_); \
            } \
            err_ = lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA); \
            assert(!err_); \
        } while (0)

        // any build can read any image, without writing
        lfs3_emubd_sio_t progs = lfs3_emubd_progs(CFG);
        lfs3_emubd_sio_t erases = lfs3_emubd_erases(CFG);
        lfs3_mount(&lfs3, LFS3_M_RDONLY, CFG) => 0;
        TEST_COMPAT_GBMAP_CK();
        lfs3_unmount(&lfs3) => 0;
        lfs3_emubd_progs(CFG) => progs;
        lfs3_emubd_erases(CFG) => erases;

        // only builds with LFS3_GBMAP can write images with a gbmap, and
        // LFS3_YES_GBMAP builds can only write images with a gbmap
        int expected = 0;
        #ifndef LFS3_GBMAP
        if (GBMAP) {
            expected = LFS3_ERR_NOTSUP;
        }
        #endif
        #ifdef LFS3_YES_GBMAP
        if (!GBMAP) {
            expected = LFS3_ERR_NOTSUP;
        }
        #endif
        lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => expected;
        lfs3_emubd_progs(CFG) => progs;
        lfs3_emubd_erases(CFG) => erases;

        if (!expected) {
            // find any blocks marked bad
            lfs3_block_t bad[TEST_COMPAT_GBMAP_BAD];
            lfs3_emubd_swear_t bad_wear[TEST_COMPAT_GBMAP_BAD];
            lfs3_emubd_sio_t bad_progs[TEST_COMPAT_GBMAP_BAD];
            lfs3_size_t bad_count = 0;
            #ifdef LFS3_GBMAP
            #define TEST_COMPAT_GBMAP_FINDBAD(count) do { \
                count = 0; \
                for (lfs3_block_t b = 0; b < BLOCK_COUNT;) { \
                    lfs3_bid_t bid_; \
                    lfs3_bid_t weight_; \
                    lfs3_stag_t tag_ = lfs3_gbmap_lookupnext(&lfs3, \
                            &lfs3.gbmap.b, b, &bid_, &weight_, NULL); \
                    assert(tag_ >= 0); \
                    for (; b <= bid_; b++) { \
                        if (tag_ == LFS3_TAG_BMBAD) { \
                            assert(count < TEST_COMPAT_GBMAP_BAD); \
                            bad[count] = b; \
                            count += 1; \
                        } \
                    } \
                } \
            } while (0)
            if (lfs3_f_isgbmap(lfs3.flags)) {
                TEST_COMPAT_GBMAP_FINDBAD(bad_count);
            }
            #endif
            assert(bad_count == ((BMBAD) ? TEST_COMPAT_GBMAP_BAD : 0));
            for (lfs3_size_t j = 0; j < bad_count; j++) {
                bad_wear[j] = lfs3_emubd_wear(CFG, bad[j]);
                bad_progs[j] = lfs3_emubd_blockprogs(CFG, bad[j]);
            }

            // fill the disk, free some space, and fill it again, a few
            // times, so the gbmap is repopulated
            lfs3_size_t created = 0;
            for (int pass = 0; pass < 4; pass++) {
                while (true) {
                    char name[256];
                    sprintf(name, "fill%04x", created);
                    memset(wbuf, 'f', 2*BLOCK_SIZE);
                    lfs3_file_t file;
                    int err = lfs3_file_open(&lfs3, &file, name,
                            LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL);
                    assert(!err || err == LFS3_ERR_NOSPC);
                    if (err) {
                        break;
                    }
                    created += 1;
                    lfs3_ssize_t d = lfs3_file_write(&lfs3, &file,
                            wbuf, 2*BLOCK_SIZE);
                    assert(d == 2*BLOCK_SIZE || d == LFS3_ERR_NOSPC);
                    err = lfs3_file_close(&lfs3, &file);
                    assert(!err || err == LFS3_ERR_NOSPC);
                    if (d < 0 || err) {
                        break;
                    }
                }

                // remove every other fill file
                for (lfs3_size_t i = pass % 2; i < created; i += 2) {
                    char name[256];
                    sprintf(name, "fill%04x", i);
                    int err = lfs3_remove(&lfs3, name);
                    assert(!err || err == LFS3_ERR_NOENT);
                }
            }

            // bad blocks were never erased or progged, and are still
            // marked bad
            for (lfs3_size_t j = 0; j < bad_count; j++) {
                assert(lfs3_emubd_wear(CFG, bad[j]) == bad_wear[j]);
                assert(lfs3_emubd_blockprogs(CFG, bad[j]) == bad_progs[j]);
            }
            #ifdef LFS3_GBMAP
            if (lfs3_f_isgbmap(lfs3.flags)) {
                lfs3_size_t bad_count_;
                TEST_COMPAT_GBMAP_FINDBAD(bad_count_);
                assert(bad_count_ == bad_count);
            }
            #undef TEST_COMPAT_GBMAP_FINDBAD
            #endif

            // and our image is still there
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
            TEST_COMPAT_GBMAP_CK();
            lfs3_unmount(&lfs3) => 0;
        }
        #undef TEST_COMPAT_GBMAP_CK
    }

    free(wbuf);
    free(rbuf);
    #undef TEST_COMPAT_GBMAP_N
    #undef TEST_COMPAT_GBMAP_BAD
    #undef TEST_COMPAT_GBMAP_SIZE
    #undef TEST_COMPAT_GBMAP_DATA
'''



## byte-order tests ##

# test that images move between hosts of either byte order
#
# A fixed workload of dirs, files of every layout, attrs and kv entries,
# then a check that every lfs3_stat, lfs3_dir_read, lfs3_get and
# lfs3_getattr gives what the workload wrote
#
# ROLE=0 => make the image and check it, the same build on both sides
# ROLE=1 => only make the image, with -d this writes it to a file
# ROLE=2 => check the image in the file TEST_COMPAT_ENDIAN_IMAGE
#
# ROLE=1 and ROLE=2 append the lfs3_fs_cksum they find to the file
# TEST_COMPAT_ENDIAN_CKSUM, if set
#
# make test-compat-endian exchanges images between a native build and a
# build for a host of the other byte order run under qemu
[cases.test_compat_endian_exchange]
defines.ROLE = 0
code = '''
    #define TEST_COMPAT_ENDIAN_N 8
    #define TEST_COMPAT_ENDIAN_SIZE(i) \
        ((const lfs3_size_t[]){ \
            0, 7, 200, 1000, 5000, 70000, 3*4096+17, 300}[(i)])
    #define TEST_COMPAT_ENDIAN_DATA(i, buffer, size) do { \
        uint32_t prng_ = 0x6c667333 + (i); \
        for (lfs3_size_t j_ = 0; j_ < (size); j_++) { \
            (buffer)[j_] = TEST_PRNG(&prng_) & 0xff; \
        } \
    } while (0)
    const char *paths[TEST_COMPAT_ENDIAN_N] = {
        "empty",
        "a/inline",
        "a/fragment",
        "a/b/fragments",
        "a/b/block",
        "c/btree",
        "c/appended",
        "renamed",
    };
    const char *dirs[4] = {"/", "a", "a/b", "c"};
    uint8_t *wbuf = malloc(70000);
    uint8_t *rbuf = malloc(70000+1);
    assert(wbuf && rbuf);
    lfs3_t lfs3;

    if (ROLE == 0 || ROLE == 1) {
        // make the image
        lfs3_format(&lfs3, LFS3_F_RDWR, CFG) => 0;
        lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
        lfs3_mkdir(&lfs3, "a") => 0;
        lfs3_mkdir(&lfs3, "a/b") => 0;
        lfs3_mkdir(&lfs3, "c") => 0;
        lfs3_mkdir(&lfs3, "c/gone") => 0;
        for (lfs3_size_t i = 0; i < TEST_COMPAT_ENDIAN_N; i++) {
            lfs3_size_t size = TEST_COMPAT_ENDIAN_SIZE(i);
            TEST_COMPAT_ENDIAN_DATA(i, wbuf, size);
            // written in one go, in small appends, through lfs3_set, or
            // under another name
            const char *path = (i == 7) ? "c/gone/torename" : paths[i];
            if (i == 2) {
                lfs3_set(&lfs3, path, wbuf, size) => 0;
                continue;
            }
            lfs3_file_t file;
            lfs3_file_open(&lfs3, &file, path,
                    LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
            lfs3_size_t chunk = (i == 3 || i == 6) ? 61 : lfs3_max(size, 1);
            for (lfs3_size_t j = 0; j < size; j += chunk) {
                lfs3_size_t d = lfs3_min(chunk, size-j);
                lfs3_file_write(&lfs3, &file, &wbuf[j], d) => d;
                if (i == 3 || i == 6) {
                    lfs3_file_sync(&lfs3, &file) => 0;
                }
            }
            lfs3_file_close(&lfs3, &file) => 0;
        }
        lfs3_rename(&lfs3, "c/gone/torename", paths[7]) => 0;
        lfs3_remove(&lfs3, "c/gone") => 0;

        // attrs of a few sizes on dirs, files and "/"
        for (lfs3_size_t i = 0; i < 4; i++) {
            uint8_t abuf[255];
            for (lfs3_size_t t = 0; t < 3; t++) {
                lfs3_size_t size = (const lfs3_size_t[]){1, 16, 255}[t];
                memset(abuf, 'A' + i*3 + t, size);
                lfs3_setattr(&lfs3, dirs[i], 'a'+t, abuf, size) => 0;
                lfs3_setattr(&lfs3, paths[i+1], 'a'+t, abuf, size) => 0;
            }
        }

        // a file-attached attr
        uint8_t fattr[4] = {0x01, 0x02, 0x03, 0x04};
        struct lfs3_attr attr = {
            .type = 'f',
            .flags = LFS3_A_WRONLY,
            .buffer = fattr,
            .buffer_size = 4,
        };
        struct lfs3_file_cfg filecfg = {.attrs = &attr, .attr_count = 1};
        lfs3_file_t file;
        lfs3_file_opencfg(&lfs3, &file, paths[5], LFS3_O_WRONLY,
                &filecfg) => 0;
        lfs3_file_close(&lfs3, &file) => 0;

        if (ROLE == 1) {
            uint32_t cksum;
            lfs3_fs_cksum(&lfs3, &cksum) => 0;
            const char *cksum_path = getenv("TEST_COMPAT_ENDIAN_CKSUM");
            if (cksum_path) {
                FILE *f = fopen(cksum_path, "a");
                assert(f);
                fprintf(f, "%08"PRIx32"\n", cksum);
                fclose(f);
            }
        }
        lfs3_unmount(&lfs3) => 0;
    }

    if (ROLE == 2) {
        // load the image
        const char *path = getenv("TEST_COMPAT_ENDIAN_IMAGE");
        assert(path);
        FILE *f = fopen(path, "rb");
        assert(f);
        uint8_t *block = malloc(BLOCK_SIZE);
        assert(block);
        for (lfs3_block_t b = 0; b < BLOCK_COUNT; b++) {
            size_t d = fread(block, 1, BLOCK_SIZE, f);
            assert(d == BLOCK_SIZE);
            CFG->erase(CFG, b) => 0;
            CFG->prog(CFG, b, 0, block, BLOCK_SIZE) => 0;
        }
        assert(fgetc(f) == EOF);
        fclose(f);
        free(block);
    }

    if (ROLE == 0 || ROLE == 2) {
        // check the image, read-only first, so we know reading writes
        // nothing
        for (int rdonly = 1; rdonly >= 0; rdonly--) {
            lfs3_mount(&lfs3, (rdonly) ? LFS3_M_RDONLY : LFS3_M_RDWR, CFG)
                    => 0;

            // every file
            for (lfs3_size_t i = 0; i < TEST_COMPAT_ENDIAN_N; i++) {
                lfs3_size_t size = TEST_COMPAT_ENDIAN_SIZE(i);
                TEST_COMPAT_ENDIAN_DATA(i, wbuf, size);
                struct lfs3_info info;
                lfs3_stat(&lfs3, paths[i], &info) => 0;
                assert(info.type == LFS3_TYPE_REG);
                assert(info.size == size);
                assert(strcmp(info.name, strrchr(paths[i], '/')
                        ? strrchr(paths[i], '/')+1
                        : paths[i]) == 0);
                lfs3_size(&lfs3, paths[i]) => size;
                lfs3_get(&lfs3, paths[i], rbuf, 70000+1) => size;
                assert(memcmp(rbuf, wbuf, size) == 0);
            }
            struct lfs3_info info;
            lfs3_stat(&lfs3, "c/gone", &info) => LFS3_ERR_NOENT;

            // every dir, in order
            const char *listings[4][5] = {
                {"a", "c", "empty", "renamed", NULL},
                {"b", "fragment", "inline", NULL},
                {"block", "fragments", NULL},
                {"appended", "btree", NULL},
            };
            for (lfs3_size_t i = 0; i < 4; i++) {
                lfs3_dir_t dir;
                lfs3_dir_open(&lfs3, &dir, dirs[i]) => 0;
                lfs3_dir_read(&lfs3, &dir, &info) => 0;
                assert(strcmp(info.name, ".") == 0);
                lfs3_dir_read(&lfs3, &dir, &info) => 0;
                assert(strcmp(info.name, "..") == 0);
                for (lfs3_size_t j = 0; listings[i][j]; j++) {
                    lfs3_dir_read(&lfs3, &dir, &info) => 0;
                    assert(strcmp(info.name, listings[i][j]) == 0);
                    char path[256];
                    sprintf(path, "%s/%s",
                            (i == 0) ? "" : dirs[i], listings[i][j]);
                    struct lfs3_info info_;
                    lfs3_stat(&lfs3, path + (i == 0), &info_) => 0;
                    assert(info.type == info_.type);
                    assert(info.size == info_.size);
                }
                lfs3_dir_read(&lfs3, &dir, &info) => LFS3_ERR_NOENT;
                lfs3_dir_close(&lfs3, &dir) => 0;
            }

            // every attr
            for (lfs3_size_t i = 0; i < 4; i++) {
                uint8_t abuf[255];
                for (lfs3_size_t t = 0; t < 3; t++) {
                    lfs3_size_t size = (const lfs3_size_t[]){1, 16, 255}[t];
                    memset(abuf, 'A' + i*3 + t, size);
                    lfs3_getattr(&lfs3, dirs[i], 'a'+t, rbuf, 256) => size;
                    assert(memcmp(rbuf, abuf, size) == 0);
                    lfs3_getattr(&lfs3, paths[i+1], 'a'+t, rbuf, 256)
                            => size;
                    assert(memcmp(rbuf, abuf, size) == 0);
                }
            }
            uint8_t fattr[4];
            lfs3_getattr(&lfs3, paths[5], 'f', fattr, 4) => 4;
            assert(memcmp(fattr, "\x01\x02\x03\x04", 4) == 0);

            lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;

            uint32_t cksum;
            lfs3_fs_cksum(&lfs3, &cksum) => 0;
            const char *cksum_path = getenv("TEST_COMPAT_ENDIAN_CKSUM");
            if (rdonly && ROLE == 2 && cksum_path) {
                FILE *f = fopen(cksum_path, "a");
                assert(f);
                fprintf(f, "%08"PRIx32"\n", cksum);
                fclose(f);
            }
            lfs3_unmount(&lfs3) => 0;
        }
    }

    free(wbuf);
    free(rbuf);
    #undef TEST_COMPAT_ENDIAN_N
    #undef TEST_COMPAT_ENDIAN_SIZE
    #undef TEST_COMPAT_ENDIAN_DATA
'''
