    test_crafted_commit(&lfs3, NULL, LFS3_TAG_GEOMETRY, 0,
            geometry, geometry_size);
    lfs3_unmount(&lfs3) => 0;

    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => LFS3_ERR_CORRUPT;
    lfs3_mount(&lfs3, LFS3_M_RDONLY, CFG) => LFS3_ERR_CORRUPT;
'''

# a file larger than the file limit
