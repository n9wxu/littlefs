# a name longer than any littlefs creates
[cases.test_crafted_name]
code = '''
    lfs3_t lfs3;
    test_crafted_mkfile(&lfs3, CFG,
            (GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0);

    char name[LFS3_NAME_MAX+2];
    memset(name, 'g', LFS3_NAME_MAX+1);
    name[LFS3_NAME_MAX+1] = '\0';
    lfs3_mdir_t mdir;
    const char *path = name;
    lfs3_mtree_pathlookup(&lfs3, &path, &mdir, NULL) => LFS3_ERR_NOENT;
    lfs3_mdir_commit(&lfs3, &mdir, LFS3_RATTRS(
            LFS3_RATTR(3, LFS3_TAG_REG, +1, LFS3_FROM_NAME),
            LFS3_RATTR_ARG(0),
            LFS3_RATTR_ARG(name),
            LFS3_RATTR_NULL)) => 0;
    lfs3_unmount(&lfs3) => 0;

    for (int rdonly = 0; rdonly < 2; rdonly++) {
        lfs3_mount(&lfs3, (rdonly) ? LFS3_M_RDONLY : LFS3_M_RDWR, CFG) => 0;
        lfs3_dir_t dir;
        lfs3_dir_open(&lfs3, &dir, "/") => 0;
        struct lfs3_info info;
        lfs3_dir_read(&lfs3, &dir, &info) => 0;
        lfs3_dir_read(&lfs3, &dir, &info) => 0;
        lfs3_dir_read(&lfs3, &dir, &info) => 0;
        assert(strcmp(info.name, "f") == 0);
        lfs3_dir_read(&lfs3, &dir, &info) => LFS3_ERR_CORRUPT;
        lfs3_dir_close(&lfs3, &dir) => 0;
        lfs3_stat(&lfs3, name, &info) => LFS3_ERR_CORRUPT;
        lfs3_unmount(&lfs3) => 0;
    }
'''

# grms naming mids that don't exist
#
# BAD=0 => a mid past the end of the mtree
# BAD=1 => a mid past the end of its mdir
[cases.test_crafted_grm]
defines.BAD = [0, 1]
code = '''
    lfs3_t lfs3;
    test_crafted_mkfile(&lfs3, CFG,
            (GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0);

    // everything is in the mroot, so its grmdelta is the grm
    assert(lfs3.mtree.r.weight == 0);
    uint8_t grm[LFS3_GRM_DSIZE];
    lfs3_size_t grm_size = test_crafted_enc(grm, "l",
            (BAD == 0) ? (1 << lfs3.mbits) : (1 << lfs3.mbits) - 1);
    test_crafted_commit(&lfs3, NULL, LFS3_TAG_GRMDELTA, 0,
            grm, grm_size);
    lfs3_unmount(&lfs3) => 0;

    // a grm we can't decode is only a problem for writes
    if (BAD == 0) {
        lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => LFS3_ERR_CORRUPT;
        lfs3_mount(&lfs3, LFS3_M_RDONLY, CFG) => 0;
        struct lfs3_fsinfo fsinfo;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert(fsinfo.flags & LFS3_I_DEGRADED);
        test_crafted_read(&lfs3, "f") => 0;
        lfs3_unmount(&lfs3) => 0;

    // a grm we can't carry out fails the writes that try
    } else {
        lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
        test_crafted_read(&lfs3, "f") => 0;
        lfs3_fs_mkconsistent(&lfs3) => LFS3_ERR_CORRUPT;
        lfs3_mkdir(&lfs3, "d") => LFS3_ERR_CORRUPT;
        lfs3_unmount(&lfs3) => 0;
    }
'''

# a gbmap out of range
#
# BAD=0 => window past the end of the filesystem
# BAD=1 => more known blocks than the filesystem has
# BAD=2 => a gbmap that says the mroot anchor is free
# BAD=3 => an erased range whose ecksum is larger than a block
[cases.test_crafted_gbmap]
defines.GBMAP = true
defines.BAD = [0, 1, 2, 3]
ifdef = 'LFS3_GBMAP'
if = 'BAD != 3 || LFS3_IFDEF_PREERASE(true, false)'
code = '''
    lfs3_t lfs3;
    test_crafted_mkfile(&lfs3, CFG, LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1));

    // everything is in the mroot, so its gbmapdelta is the gbmap
    assert(lfs3.mtree.r.weight == 0);
    lfs3_block_t node = lfs3.gbmap.b.r.blocks[0];
    lfs3_size_t trunk = lfs3_rbyd_trunk(&lfs3.gbmap.b.r);
    uint32_t cksum = lfs3.gbmap.b.r.cksum;
    // a gbmap of one range
    if (BAD >= 2) {
        uint8_t ecksum[LFS3_ECKSUM_DSIZE];
        lfs3_size_t ecksum_size = test_crafted_enc(ecksum, "lw",
                BLOCK_SIZE+1, 0);
        cksum = test_crafted_mkrbyd(CFG, node,
                (const test_crafted_tag_t[]){
                    (BAD == 2)
                        ? (test_crafted_tag_t){
                            LFS3_TAG_BMFREE, BLOCK_COUNT, 0, NULL}
                        : (test_crafted_tag_t){
                            LFS3_TAG_BMERASED, BLOCK_COUNT,
                            ecksum_size, ecksum}},
                1);
        trunk = 4;
    }
    uint8_t gbmap[LFS3_GBMAP_DSIZE];
    lfs3_size_t gbmap_size = test_crafted_enc(gbmap, "llllw",
            (BAD == 0) ? BLOCK_COUNT : (BAD == 2) ? 0 : 2,
            (BAD == 1) ? BLOCK_COUNT+1 : BLOCK_COUNT,
            node, trunk, cksum);
    test_crafted_commit(&lfs3, NULL, LFS3_TAG_GBMAPDELTA, 0,
            gbmap, gbmap_size);
    lfs3_unmount(&lfs3) => 0;

    // a gbmap we can't decode is only a problem for writes
    if (BAD <= 1) {
        lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => LFS3_ERR_CORRUPT;
        lfs3_mount(&lfs3, LFS3_M_RDONLY, CFG) => 0;
        struct lfs3_fsinfo fsinfo;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert(fsinfo.flags & LFS3_I_DEGRADED);
        test_crafted_read(&lfs3, "f") => 0;
        lfs3_unmount(&lfs3) => 0;

    // a gbmap that can't be right is dropped and rebuilt at the first
    // allocation that reads it
    } else {
        lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
        uint8_t wbuf[2*BLOCK_SIZE];
        memset(wbuf, 'g', sizeof(wbuf));
        lfs3_set(&lfs3, "g", wbuf, sizeof(wbuf)) => 0;
        lfs3_unmount(&lfs3) => 0;

        lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
        test_crafted_read(&lfs3, "f") => 0;
        test_crafted_read(&lfs3, "g") => 0;
        lfs3_fs_ck(&lfs3, LFS3_CK_CK) => 0;
        lfs3_unmount(&lfs3) => 0;
    }
'''


## Alts ##

# alts that would send a lookup around in circles, or out of the block
#
# BAD=0 => a followed alt leads back to itself
# BAD=1 => an unreachable alt, jump=0, is followed
# BAD=2 => an alt jumps before the start of the block
[cases.test_crafted_alt]
defines.BAD = [0, 1, 2]
code = '''
    lfs3_t lfs3;
    lfs3_block_t node = test_crafted_mkfile(&lfs3, CFG,
            (GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0);

    // a trunk of an alt never followed, at 4, an alt followed for the
    // upper half of the rids, at 4+4, and data for the lower half
    uint8_t data[500];
    memset(data, 'x', sizeof(data));
    lfs3_size_t jump = (BAD == 0) ? 4 : (BAD == 1) ? 0 : 9;
    uint32_t cksum = test_crafted_mkrbyd(CFG, node,
            (const test_crafted_tag_t[]){
                {LFS3_TAG_ALT | LFS3_TAG_B | LFS3_TAG_LE | 0x404,
                    0, 4, NULL},
                {LFS3_TAG_ALT | LFS3_TAG_B | LFS3_TAG_GT | 0x404,
                    500, jump, NULL},
                {LFS3_TAG_DATA, 500, 500, data}},
            3);

    uint8_t btree[LFS3_BTREE_DSIZE];
    lfs3_size_t btree_size = test_crafted_enc(btree, "lllw",
            1000, node, 4, cksum);
    test_crafted_commit(&lfs3, "f", LFS3_tag_MASK8 | LFS3_TAG_BTREE, 0,
            btree, btree_size);
    lfs3_unmount(&lfs3) => 0;

    // lookups find the damage instead of looping
    for (int rdonly = 0; rdonly < 2; rdonly++) {
        lfs3_mount(&lfs3, (rdonly) ? LFS3_M_RDONLY : LFS3_M_RDWR, CFG) => 0;
        test_crafted_read(&lfs3, "f") => LFS3_ERR_CORRUPT;
        test_crafted_trv(&lfs3, 0) => LFS3_ERR_CORRUPT;
        lfs3_unmount(&lfs3) => 0;
    }

    // and so do writes
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "f", LFS3_O_WRONLY) => 0;
    lfs3_file_write(&lfs3, &file, "x", 1) => 1;
    lfs3_file_sync(&lfs3, &file) => LFS3_ERR_CORRUPT;
    int err = lfs3_file_close(&lfs3, &file);
    assert(!err || err == LFS3_ERR_CORRUPT);
    lfs3_unmount(&lfs3) => 0;
'''

# a btree node holding more than littlefs puts in one, too much to split
#
# SIZE=2100 => more than half a block
# SIZE=3900 => nearly a full block
[cases.test_crafted_btree_full]
defines.SIZE = [2100, 3900]
defines.POS = [0, 1000]
code = '''
    lfs3_t lfs3;
    lfs3_block_t node = test_crafted_mkfile(&lfs3, CFG,
            (GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0);

    // a btree node of one data fragment
    uint8_t data[SIZE];
    memset(data, 'x', sizeof(data));
    uint32_t cksum = test_crafted_mkrbyd(CFG, node,
            (const test_crafted_tag_t[]){
                {LFS3_TAG_DATA, SIZE, SIZE, data}},
            1);
    uint8_t btree[LFS3_BTREE_DSIZE];
    lfs3_size_t btree_size = test_crafted_enc(btree, "lllw",
            SIZE, node, 4, cksum);
    test_crafted_commit(&lfs3, "f", LFS3_tag_MASK8 | LFS3_TAG_BTREE, 0,
            btree, btree_size);
    lfs3_unmount(&lfs3) => 0;

    // reads are fine
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
    test_crafted_read(&lfs3, "f") => 0;

    // writes that split the node find the damage
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "f", LFS3_O_WRONLY) => 0;
    lfs3_file_seek(&lfs3, &file, POS, LFS3_SEEK_SET) => POS;
    lfs3_file_write(&lfs3, &file, "y", 1) => 1;
    lfs3_file_sync(&lfs3, &file) => LFS3_ERR_CORRUPT;
    int err = lfs3_file_close(&lfs3, &file);
    assert(!err || err == LFS3_ERR_CORRUPT);
    lfs3_unmount(&lfs3) => 0;
'''

# btree branches that loop back on themselves
#
# CYCLE=1 => a node whose branch is itself
# CYCLE=2 => two nodes whose branches are each other
[cases.test_crafted_btree_cycle]
defines.CYCLE = [1, 2]
code = '''
    lfs3_t lfs3;
    lfs3_block_t node = test_crafted_mkfile(&lfs3, CFG,
            (GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0);
    // file f has two data blocks, the second is next to the first or
    // we find it by looking up the file's second block pointer
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "f", LFS3_O_RDONLY) => 0;
    lfs3_bptr_t bptr;
    lfs3_file_lookupnext(&lfs3, &file, BLOCK_SIZE,
            NULL, NULL, &bptr) => 0;
    lfs3_block_t nodes[2] = {node, lfs3_bptr_block(&bptr)};
    lfs3_file_close(&lfs3, &file) => 0;
    assert(nodes[0] != nodes[1]);

    // inner nodes of one branch each, to the next node, no checksums
    // check out, only checks look at those
    for (int i = 0; i < CYCLE; i++) {
        uint8_t branch[LFS3_BRANCH_DSIZE];
        lfs3_size_t branch_size = test_crafted_enc(branch, "llw",
                nodes[(i+1) % CYCLE], 4, 0);
        test_crafted_mkrbyd(CFG, nodes[i],
                (const test_crafted_tag_t[]){
                    {LFS3_TAG_BRANCH, 100, branch_size, branch}},
                1);
    }

    uint8_t btree[LFS3_BTREE_DSIZE];
    lfs3_size_t btree_size = test_crafted_enc(btree, "lllw",
            100, nodes[0], 4, 0);
    test_crafted_commit(&lfs3, "f", LFS3_tag_MASK8 | LFS3_TAG_BTREE, 0,
            btree, btree_size);
    lfs3_unmount(&lfs3) => 0;

    // lookups find the damage instead of looping
    for (int rdonly = 0; rdonly < 2; rdonly++) {
        lfs3_mount(&lfs3, (rdonly) ? LFS3_M_RDONLY : LFS3_M_RDWR, CFG) => 0;
        test_crafted_read(&lfs3, "f") => LFS3_ERR_CORRUPT;
        test_crafted_trv(&lfs3, 0) => LFS3_ERR_CORRUPT;
        lfs3_unmount(&lfs3) => 0;
    }
'''


## Salvage ##

# an entry out of order, a lookup by its did doesn't lead to it, and no
# name reaches it, a salvage removes it where it is
[cases.test_crafted_salvage_order]
code = '''
    lfs3_t lfs3;
    test_crafted_mkfile(&lfs3, CFG,
            (GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0);

    // an entry of a did no directory names, between the root's bookmark
    // and the root's other entries, a lookup of its did ends up past
    // them, everything is in the mroot
    lfs3_set(&lfs3, "a", "a", 1) => 0;
    lfs3_set(&lfs3, "b", "b", 1) => 0;
    lfs3_set(&lfs3, "c", "c", 1) => 0;
    assert(lfs3.mtree.r.weight == 0);
    lfs3_mdir_t mdir;
    lfs3_mtree_lookup(&lfs3, 1, &mdir) => 0;
    lfs3_mdir_commit(&lfs3, &mdir, LFS3_RATTRS(
            LFS3_RATTR(3, LFS3_TAG_REG, +1, LFS3_FROM_NAME),
            LFS3_RATTR_ARG(0x10),
            LFS3_RATTR_ARG("x"),
            LFS3_RATTR_NULL)) => 0;

    // and damage that needs a salvage, a grm past the end of the mtree
    uint8_t grm[LFS3_GRM_DSIZE];
    lfs3_size_t grm_size = test_crafted_enc(grm, "l", 1 << lfs3.mbits);
    test_crafted_commit(&lfs3, NULL, LFS3_TAG_GRMDELTA, 0,
            grm, grm_size);
    lfs3_unmount(&lfs3) => 0;

    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => LFS3_ERR_CORRUPT;
    lfs3_mount(&lfs3, LFS3_M_RDWR | LFS3_M_SALVAGE, CFG) => 0;
    lfs3_unmount(&lfs3) => 0;

    // the entry is gone, the root's entries are still here
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
    lfs3_dir_t dir;
    lfs3_dir_open(&lfs3, &dir, "/") => 0;
    struct lfs3_info info;
    lfs3_dir_read(&lfs3, &dir, &info) => 0;
    lfs3_dir_read(&lfs3, &dir, &info) => 0;
    const char *names[] = {"a", "b", "c", "f"};
    for (int i = 0; i < 4; i++) {
        lfs3_dir_read(&lfs3, &dir, &info) => 0;
        assert(strcmp(info.name, names[i]) == 0);
    }
    lfs3_dir_read(&lfs3, &dir, &info) => LFS3_ERR_NOENT;
    lfs3_dir_close(&lfs3, &dir) => 0;
    test_crafted_read(&lfs3, "f") => 0;
    lfs3_fs_ck(&lfs3, LFS3_CK_CK) => 0;
    lfs3_unmount(&lfs3) => 0;
'''

# an mroot with no entries, not even the root's bookmark, a salvage steps
# past it and recreates the bookmark
[cases.test_crafted_salvage_empty]
code = '''
    lfs3_t lfs3;
    test_crafted_mkfile(&lfs3, CFG,
            (GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0);

    // remove f and the root's bookmark, everything is in the mroot
    lfs3_remove(&lfs3, "f") => 0;
    assert(lfs3.mtree.r.weight == 0);
    lfs3_mdir_t mdir;
    lfs3_mtree_lookup(&lfs3, 0, &mdir) => 0;
    lfs3_mdir_commit(&lfs3, &mdir, LFS3_RATTRS(
            LFS3_RATTR(1, LFS3_tag_RM, -1),
            LFS3_RATTR_NULL)) => 0;
    assert(lfs3.mroot.r.weight == 0);

    // and damage that needs a salvage, a grm past the end of the mtree
    uint8_t grm[LFS3_GRM_DSIZE];
    lfs3_size_t grm_size = test_crafted_enc(grm, "l", 1 << lfs3.mbits);
    test_crafted_commit(&lfs3, NULL, LFS3_TAG_GRMDELTA, 0,
            grm, grm_size);
    lfs3_unmount(&lfs3) => 0;

    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => LFS3_ERR_CORRUPT;
    lfs3_mount(&lfs3, LFS3_M_RDWR | LFS3_M_SALVAGE, CFG) => 0;
    lfs3_unmount(&lfs3) => 0;

    // an empty root we can write to
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
    lfs3_dir_t dir;
    lfs3_dir_open(&lfs3, &dir, "/") => 0;
    struct lfs3_info info;
    lfs3_dir_read(&lfs3, &dir, &info) => 0;
    lfs3_dir_read(&lfs3, &dir, &info) => 0;
    lfs3_dir_read(&lfs3, &dir, &info) => LFS3_ERR_NOENT;
    lfs3_dir_close(&lfs3, &dir) => 0;
    lfs3_mkdir(&lfs3, "d") => 0;
    lfs3_set(&lfs3, "d/g", "g", 1) => 0;
    test_crafted_read(&lfs3, "d/g") => 0;
    lfs3_fs_ck(&lfs3, LFS3_CK_CK) => 0;
    lfs3_unmount(&lfs3) => 0;
'''
