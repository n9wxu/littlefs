    lfs3_t lfs3;
    test_crafted_mkfile(&lfs3, CFG,
            (GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0);

    // geometry is stored minus 1
    uint8_t geometry[LFS3_GEOMETRY_DSIZE];
