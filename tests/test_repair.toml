# Test the repairing check
#
# Blocks that fail a read are suspect, ck_retries reads them again, and on
# a writable filesystem checks move data off of suspect blocks, exactly
# the bytes of a read that passed, then reuse or mark bad the old block.
# This lives with bad-block tracking, so these only run with LFS3_GBMAP.
# These are internal tests so they can look at the gbmap and files
# directly.
after = [
    'test_badblocks_gbmap',
]
ifdef = 'LFS3_GBMAP'
in = 'lfs3.c'

defines.FORMAT_BLOCK_COUNT = 3

code = '''
// make reads of a block go wrong, the read that covers its first byte
// gets a flipped bit
//
// - test_repair_skip reads pass first
// - then test_repair_fails reads fail, -1 fails every read
#define TEST_REPAIR_MAX 4096

static lfs3_sblock_t test_repair_block = -1;
static lfs3_size_t test_repair_skip = 0;
static lfs3_size_t test_repair_fails = 0;
static lfs3_size_t test_repair_reads = 0;

// make erases of a block fail
static lfs3_sblock_t test_repair_erasefail = -1;

// count erases and progs per block
static uint32_t test_repair_erases[TEST_REPAIR_MAX];
static uint32_t test_repair_progs[TEST_REPAIR_MAX];

static int test_repair_read(const struct lfs3_cfg *cfg, lfs3_block_t block,
        lfs3_off_t off, void *buffer, lfs3_size_t size) {
    int err = lfs3_emubd_read(cfg, block, off, buffer, size);
    if (err) {
        return err;
    }

    if ((lfs3_sblock_t)block == test_repair_block && off == 0 && size > 0) {
        test_repair_reads += 1;
        if (test_repair_skip > 0) {
            test_repair_skip -= 1;
        } else if (test_repair_fails > 0) {
            if (test_repair_fails != (lfs3_size_t)-1) {
                test_repair_fails -= 1;
            }
            ((uint8_t*)buffer)[0] ^= 0x80;
        }
    }
    return 0;
}

static int test_repair_prog(const struct lfs3_cfg *cfg, lfs3_block_t block,
        lfs3_off_t off, const void *buffer, lfs3_size_t size) {
    test_repair_progs[block] += 1;
    return lfs3_emubd_prog(cfg, block, off, buffer, size);
}

static int test_repair_erase(const struct lfs3_cfg *cfg,
        lfs3_block_t block) {
    test_repair_erases[block] += 1;
    if ((lfs3_sblock_t)block == test_repair_erasefail) {
        return LFS3_ERR_CORRUPT;
    }
    return lfs3_emubd_erase(cfg, block);
}

// copy a config with our hooks
static void test_repair_wrap(struct lfs3_cfg *cfg,
        const struct lfs3_cfg *cfg_) {
    assert(cfg_->block_count <= TEST_REPAIR_MAX);
    *cfg = *cfg_;
    cfg->read = test_repair_read;
    cfg->prog = test_repair_prog;
    cfg->erase = test_repair_erase;
    test_repair_block = -1;
    test_repair_skip = 0;
    test_repair_fails = 0;
    test_repair_reads = 0;
    test_repair_erasefail = -1;
    memset(test_repair_erases, 0, sizeof(test_repair_erases));
    memset(test_repair_progs, 0, sizeof(test_repair_progs));
}

// make the block's reads go wrong
static void test_repair_break(lfs3_block_t block,
        lfs3_size_t skip, lfs3_size_t fails) {
    test_repair_block = block;
    test_repair_skip = skip;
    test_repair_fails = fails;
    test_repair_reads = 0;
}

static void test_repair_heal(void) {
    test_repair_block = -1;
}

// write a file of pseudo-random data
static void test_repair_write(lfs3_t *lfs3, const char *name,
        uint32_t seed, lfs3_size_t size) {
    lfs3_file_t file;
    int err = lfs3_file_open(lfs3, &file, name,
            LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_TRUNC);
    assert(!err);
    uint32_t prng = seed;
    for (lfs3_size_t i = 0; i < size; i += 64) {
        uint8_t buf[64];
        lfs3_size_t d = lfs3_min(64, size - i);
        for (lfs3_size_t j = 0; j < d; j++) {
            buf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_ssize_t d_ = lfs3_file_write(lfs3, &file, buf, d);
        assert(d_ == (lfs3_ssize_t)d);
    }
    err = lfs3_file_close(lfs3, &file);
    assert(!err);
}

// check a file of pseudo-random data
static void test_repair_read_(lfs3_t *lfs3, const char *name,
        uint32_t seed, lfs3_size_t size) {
    lfs3_file_t file;
    int err = lfs3_file_open(lfs3, &file, name, LFS3_O_RDONLY);
    assert(!err);
    assert(lfs3_file_size(lfs3, &file) == (lfs3_soff_t)size);
    uint32_t prng = seed;
    for (lfs3_size_t i = 0; i < size; i += 64) {
        uint8_t buf[64];
        lfs3_size_t d = lfs3_min(64, size - i);
        lfs3_ssize_t d_ = lfs3_file_read(lfs3, &file, buf, d);
        assert(d_ == (lfs3_ssize_t)d);
        for (lfs3_size_t j = 0; j < d; j++) {
            assert(buf[j] == 'a' + (TEST_PRNG(&prng) % 26));
        }
    }
    err = lfs3_file_close(lfs3, &file);
    assert(!err);
}

// find the block holding a file's first byte
static lfs3_block_t test_repair_datablock(lfs3_t *lfs3, const char *name) {
    lfs3_file_t file;
    int err = lfs3_file_open(lfs3, &file, name, LFS3_O_RDONLY);
    assert(!err);
    lfs3_bid_t bid;
    lfs3_bid_t weight;
    lfs3_bptr_t bptr;
    err = lfs3_file_lookupnext(lfs3, &file, 0, &bid, &weight, &bptr);
    assert(!err);
    assert(lfs3_bptr_isbptr(&bptr));
    lfs3_block_t block = lfs3_bptr_block(&bptr);
    err = lfs3_file_close(lfs3, &file);
    assert(!err);
    return block;
}

// find a file's first btree node in its own block, if it has one
static lfs3_sblock_t test_repair_btreeblock(lfs3_t *lfs3, const char *name) {
    lfs3_file_t file;
    int err = lfs3_file_open(lfs3, &file, name, LFS3_O_RDONLY);
    assert(!err);
    lfs3_sblock_t block = -1;
    lfs3_btrv_t btrv;
    btrv.bid = -1;
    while (true) {
        lfs3_data_t data;
        lfs3_stag_t tag = lfs3_btree_traverse(lfs3, &file.b.b, &btrv,
                NULL, NULL, &data);
        assert(tag >= 0 || tag == LFS3_ERR_NOENT);
        if (tag == LFS3_ERR_NOENT) {
            break;
        }
        if (tag == LFS3_TAG_BRANCH) {
            block = ((const lfs3_rbyd_t*)data.u.buffer)->blocks[0];
            break;
        }
    }
    err = lfs3_file_close(lfs3, &file);
    assert(!err);
    return block;
}

// is a block in use?
static bool test_repair_inuse(lfs3_t *lfs3, lfs3_block_t block) {
    bool inuse = false;
    lfs3_trv_t trv;
    int err = lfs3_trv_open(lfs3, &trv, LFS3_T_RDONLY);
    assert(!err);
    while (true) {
        struct lfs3_tinfo tinfo;
        err = lfs3_trv_read(lfs3, &trv, &tinfo);
        assert(!err || err == LFS3_ERR_NOENT);
        if (err == LFS3_ERR_NOENT) {
            break;
        }
        inuse |= (tinfo.block == block);
    }
    err = lfs3_trv_close(lfs3, &trv);
    assert(!err);
    return inuse;
}

// is a block suspect?
static bool test_repair_issuspect(lfs3_t *lfs3, lfs3_block_t block) {
    return lfs3_fs_nextsuspect(lfs3, block) == (lfs3_sblock_t)block;
}

// is a block bad?
static bool test_repair_isbad(lfs3_t *lfs3, lfs3_block_t block) {
    return lfs3_fs_nextbad(lfs3, block) == (lfs3_sblock_t)block;
}

// check the filesystem the way the test asks for
//
// METHOD=0 => lfs3_fs_ck
// METHOD=1 => lfs3_mount with the check flags
// METHOD=2 => lfs3_fs_gc
static int test_repair_ck(lfs3_t *lfs3, const struct lfs3_cfg *cfg,
        int method, uint32_t mflags, uint32_t ckflags) {
    if (method == 0) {
        return lfs3_fs_ck(lfs3, ckflags);
    } else if (method == 1) {
        int err = lfs3_unmount(lfs3);
        assert(!err);
        return lfs3_mount(lfs3, mflags | ckflags, cfg);
    } else {
        #ifdef LFS3_GC
        int err = lfs3_fs_unck(lfs3, ckflags);
        assert(!err);
        while (true) {
            err = lfs3_fs_gc(lfs3);
            if (err) {
                return err;
            }
            struct lfs3_fsinfo fsinfo;
            err = lfs3_fs_stat(lfs3, &fsinfo);
            assert(!err);
            if (!(fsinfo.flags & ckflags)) {
                return 0;
            }
        }
        #else
        assert(false);
        return LFS3_ERR_INVAL;
        #endif
    }
}
'''


# test moving a data block that fails some reads
[cases.test_repair_data]
# METHOD=0 => lfs3_fs_ck
# METHOD=1 => lfs3_mount with LFS3_M_CKDATA
# METHOD=2 => lfs3_fs_gc
defines.METHOD = [0, 1, 2]
defines.RDONLY = [false, true]
# how many reads fail
defines.FAILS = [1, 3]
defines.CK_RETRIES = 3
defines.GC_FLAGS = 'LFS3_GC_CKDATA'
defines.GC_STEPS = 1
defines.N = 4
defines.SIZE = 'BLOCK_SIZE'
if = [
    'METHOD != 2 || LFS3_IFDEF_GC(true, false)',
    'METHOD != 2 || !RDONLY',
]
code = '''
    struct lfs3_cfg cfg;
    test_repair_wrap(&cfg, CFG);

    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR | LFS3_F_GBMAP, &cfg) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;
    for (lfs3_size_t i = 0; i < N; i++) {
        char name[256];
        sprintf(name, "spider%03d", i);
        test_repair_write(&lfs3, name, i, SIZE);
    }
    lfs3_block_t block = test_repair_datablock(&lfs3, "spider001");
    uint32_t mflags = (RDONLY) ? LFS3_M_RDONLY : LFS3_M_RDWR;
    lfs3_unmount(&lfs3) => 0;
    lfs3_mount(&lfs3, mflags, &cfg) => 0;

    // reads fail, but not every read, so a check should pass
    memset(test_repair_erases, 0, sizeof(test_repair_erases));
    memset(test_repair_progs, 0, sizeof(test_repair_progs));
    test_repair_break(block, 0, FAILS);
    test_repair_ck(&lfs3, &cfg, METHOD, mflags, LFS3_CK_CKDATA) => 0;
    test_repair_heal();
    assert(test_repair_issuspect(&lfs3, block));
    assert(!test_repair_isbad(&lfs3, block));

    if (RDONLY) {
        // read-only? nothing moves, nothing is written
        assert(test_repair_inuse(&lfs3, block));
        for (lfs3_block_t b = 0; b < BLOCK_COUNT; b++) {
            assert(test_repair_erases[b] == 0);
            assert(test_repair_progs[b] == 0);
        }
    } else {
        // the data moved, and the old block erased and progged cleanly,
        // so it's free again
        assert(!test_repair_inuse(&lfs3, block));
        assert(test_repair_datablock(&lfs3, "spider001") != block);
        assert(test_repair_erases[block] == 1);
        assert(test_repair_progs[block] > 0);

        // and there's nothing left to move
        memset(test_repair_erases, 0, sizeof(test_repair_erases));
        lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
        for (lfs3_block_t b = 0; b < BLOCK_COUNT; b++) {
            assert(test_repair_erases[b] == 0);
        }
    }

    // our files should be fine
    for (int remount = 0; remount < 2; remount++) {
        if (remount) {
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;
        }

        for (lfs3_size_t i = 0; i < N; i++) {
            char name[256];
            sprintf(name, "spider%03d", i);
            test_repair_read_(&lfs3, name, i, SIZE);
        }
        lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
    }
    lfs3_unmount(&lfs3) => 0;
'''

# test that a check reports a data block it can't read, and that we can
# still remove the file
[cases.test_repair_data_lost]
defines.RDONLY = [false, true]
defines.CK_RETRIES = [0, 3]
# FAILS=1  => one read fails
# FAILS=-1 => every read fails
defines.FAILS = [1, -1]
defines.N = 4
defines.SIZE = 'BLOCK_SIZE'
code = '''
    struct lfs3_cfg cfg;
    test_repair_wrap(&cfg, CFG);

    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR | LFS3_F_GBMAP, &cfg) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;
    for (lfs3_size_t i = 0; i < N; i++) {
        char name[256];
        sprintf(name, "spider%03d", i);
        test_repair_write(&lfs3, name, i, SIZE);
    }
    lfs3_block_t block = test_repair_datablock(&lfs3, "spider001");
    lfs3_unmount(&lfs3) => 0;
    lfs3_mount(&lfs3, (RDONLY) ? LFS3_M_RDONLY : LFS3_M_RDWR, &cfg) => 0;

    // without retries, or failing every read, we can't read it
    test_repair_break(block, 0, (lfs3_size_t)FAILS);
    bool lost = !CK_RETRIES || FAILS == -1;
    lfs3_fs_ck(&lfs3, LFS3_CK_CKDATA) => (lost) ? LFS3_ERR_CORRUPT : 0;
    assert(test_repair_issuspect(&lfs3, block));
    assert(!test_repair_isbad(&lfs3, block));
    assert(test_repair_inuse(&lfs3, block) == (lost || RDONLY));

    // but we can still remove the file
    if (!RDONLY) {
        lfs3_remove(&lfs3, "spider001") => 0;
        assert(!test_repair_inuse(&lfs3, block));
        test_repair_heal();
        lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
        for (lfs3_size_t i = 0; i < N; i++) {
            if (i == 1) {
                continue;
            }
            char name[256];
            sprintf(name, "spider%03d", i);
            test_repair_read_(&lfs3, name, i, SIZE);
        }
    }
    lfs3_unmount(&lfs3) => 0;
'''

# test moving a file's btree node that fails some reads
[cases.test_repair_btree]
# METHOD=0 => lfs3_fs_ck
# METHOD=1 => lfs3_mount with LFS3_M_CKMETA
# METHOD=2 => lfs3_fs_gc
defines.METHOD = [0, 1, 2]
defines.FAILS = [1, 3]
defines.CK_RETRIES = 3
defines.GC_FLAGS = 'LFS3_GC_CKMETA'
defines.GC_STEPS = 1
defines.SIZE = '64*BLOCK_SIZE'
if = 'METHOD != 2 || LFS3_IFDEF_GC(true, false)'
code = '''
    struct lfs3_cfg cfg;
    test_repair_wrap(&cfg, CFG);

    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR | LFS3_F_GBMAP, &cfg) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;
    test_repair_write(&lfs3, "jellyfish", 42, SIZE);
    lfs3_sblock_t block = test_repair_btreeblock(&lfs3, "jellyfish");
    assert(block >= 0);
    lfs3_unmount(&lfs3) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;

    test_repair_break(block, 0, FAILS);
    test_repair_ck(&lfs3, &cfg, METHOD, LFS3_M_RDWR, LFS3_CK_CKMETA) => 0;
    test_repair_heal();

    // the node moved, and the old block is free again
    assert(test_repair_issuspect(&lfs3, block));
    assert(!test_repair_isbad(&lfs3, block));
    assert(!test_repair_inuse(&lfs3, block));
    assert(test_repair_btreeblock(&lfs3, "jellyfish") != block);

    for (int remount = 0; remount < 2; remount++) {
        if (remount) {
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;
        }

        test_repair_read_(&lfs3, "jellyfish", 42, SIZE);
        lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
    }
    lfs3_unmount(&lfs3) => 0;
'''

# test moving a gbmap node that fails some reads
[cases.test_repair_gbmap]
defines.FAILS = [1, 3]
defines.CK_RETRIES = 3
defines.N = 8
defines.SIZE = 'BLOCK_SIZE'
code = '''
    struct lfs3_cfg cfg;
    test_repair_wrap(&cfg, CFG);

    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR | LFS3_F_GBMAP, &cfg) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;
    for (lfs3_size_t i = 0; i < N; i++) {
        char name[256];
        sprintf(name, "spider%03d", i);
        test_repair_write(&lfs3, name, i, SIZE);
    }
    lfs3_alloc_ckpoint(&lfs3) => 0;
    lfs3_alloc_syncgbmap(&lfs3) => 0;
    lfs3_block_t block = lfs3.gbmap.b.r.blocks[0];
    lfs3_unmount(&lfs3) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;

    test_repair_break(block, 0, FAILS);
    lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA) => 0;
    test_repair_heal();

    // the gbmap's root moved, and the old block is free again
    assert(test_repair_issuspect(&lfs3, block));
    assert(!test_repair_isbad(&lfs3, block));
    assert(!test_repair_inuse(&lfs3, block));
    assert(lfs3.gbmap.b.r.blocks[0] != block);

    for (int remount = 0; remount < 2; remount++) {
        if (remount) {
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;
            assert(lfs3.gbmap.b.r.blocks[0] != block);
        }

        for (lfs3_size_t i = 0; i < N; i++) {
            char name[256];
            sprintf(name, "spider%03d", i);
            test_repair_read_(&lfs3, name, i, SIZE);
        }
        lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
    }
    lfs3_unmount(&lfs3) => 0;
'''

# test that a block we moved data off of is reused if it erases and
# progs cleanly, and marked bad if it doesn't
[cases.test_repair_reuse]
# ERASEFAIL=false => the old block works, and is used again
# ERASEFAIL=true  => the old block fails to erase, and is marked bad
defines.ERASEFAIL = [false, true]
defines.CK_RETRIES = 3
defines.N = 4
defines.SIZE = 'BLOCK_SIZE'
code = '''
    struct lfs3_cfg cfg;
    test_repair_wrap(&cfg, CFG);

    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR | LFS3_F_GBMAP, &cfg) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;
    for (lfs3_size_t i = 0; i < N; i++) {
        char name[256];
        sprintf(name, "spider%03d", i);
        test_repair_write(&lfs3, name, i, SIZE);
    }
    lfs3_block_t block = test_repair_datablock(&lfs3, "spider001");
    lfs3_unmount(&lfs3) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;

    test_repair_break(block, 0, 1);
    if (ERASEFAIL) {
        test_repair_erasefail = block;
    }
    lfs3_fs_ck(&lfs3, LFS3_CK_CKDATA) => 0;
    test_repair_heal();
    assert(!test_repair_inuse(&lfs3, block));
    assert(test_repair_isbad(&lfs3, block) == ERASEFAIL);
    // bad is no longer suspect
    assert(test_repair_issuspect(&lfs3, block) == !ERASEFAIL);

    // fill the disk, a good block gets used again, a bad one never does
    memset(test_repair_erases, 0, sizeof(test_repair_erases));
    memset(test_repair_progs, 0, sizeof(test_repair_progs));
    for (lfs3_size_t i = N;; i++) {
        char name[256];
        sprintf(name, "octopus%03d", i);
        lfs3_file_t file;
        lfs3_file_open(&lfs3, &file, name,
                LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
        uint8_t buf[64];
        memset(buf, 'o', 64);
        lfs3_ssize_t d = 0;
        for (lfs3_size_t j = 0; j < SIZE && d >= 0; j += 64) {
            d = lfs3_file_write(&lfs3, &file, buf, 64);
            assert(d == 64 || d == LFS3_ERR_NOSPC);
        }
        int err = lfs3_file_close(&lfs3, &file);
        assert(!err || err == LFS3_ERR_NOSPC);
        if (d < 0 || err) {
            break;
        }
    }
    // a good block taken as the second block of a new mdir pair is used
    // again without an erase, it's erased when the pair first compacts
    // into it
    if (ERASEFAIL) {
        assert(test_repair_erases[block] == 0);
        assert(test_repair_progs[block] == 0);
        assert(!test_repair_inuse(&lfs3, block));
    } else {
        assert(test_repair_erases[block] > 0
                || test_repair_inuse(&lfs3, block));
    }

    lfs3_unmount(&lfs3) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;
    assert(test_repair_isbad(&lfs3, block) == ERASEFAIL);
    for (lfs3_size_t i = 0; i < N; i++) {
        char name[256];
        sprintf(name, "spider%03d", i);
        test_repair_read_(&lfs3, name, i, SIZE);
    }
    lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
    lfs3_unmount(&lfs3) => 0;
'''

# test that a block we need to move data off of twice in one mount is
# marked bad
[cases.test_repair_twice]
defines.CK_RETRIES = 3
defines.N = 4
defines.SIZE = 'BLOCK_SIZE'
code = '''
    struct lfs3_cfg cfg;
    test_repair_wrap(&cfg, CFG);

    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR | LFS3_F_GBMAP, &cfg) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;
    for (lfs3_size_t i = 0; i < N; i++) {
        char name[256];
        sprintf(name, "spider%03d", i);
        test_repair_write(&lfs3, name, i, SIZE);
    }
    lfs3_block_t block = test_repair_datablock(&lfs3, "spider001");
    lfs3_unmount(&lfs3) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;

    // move data off of it once
    test_repair_break(block, 0, 1);
    lfs3_fs_ck(&lfs3, LFS3_CK_CKDATA) => 0;
    test_repair_heal();
    assert(!test_repair_inuse(&lfs3, block));
    assert(!test_repair_isbad(&lfs3, block));

    // rewrite files until one gets its data in our block again
    uint32_t seeds[N];
    for (lfs3_size_t j = 0; j < N; j++) {
        seeds[j] = j;
    }
    lfs3_size_t x = 0;
    char name[256];
    for (lfs3_size_t j = 0;; j++) {
        assert(j < 4*BLOCK_COUNT);
        x = j % N;
        seeds[x] = N + j;
        sprintf(name, "spider%03d", x);
        test_repair_write(&lfs3, name, seeds[x], SIZE);
        if (test_repair_datablock(&lfs3, name) == block) {
            break;
        }
    }

    // and fail it again
    test_repair_break(block, 0, 1);
    lfs3_fs_ck(&lfs3, LFS3_CK_CKDATA) => 0;
    test_repair_heal();
    assert(!test_repair_inuse(&lfs3, block));
    assert(test_repair_isbad(&lfs3, block));
    assert(!test_repair_issuspect(&lfs3, block));

    test_repair_read_(&lfs3, name, seeds[x], SIZE);

    // it should never be written again
    memset(test_repair_erases, 0, sizeof(test_repair_erases));
    memset(test_repair_progs, 0, sizeof(test_repair_progs));
    for (lfs3_size_t j = 0; j < 2*BLOCK_COUNT; j++) {
        x = j % N;
        seeds[x] = 2*BLOCK_COUNT + j;
        sprintf(name, "spider%03d", x);
        test_repair_write(&lfs3, name, seeds[x], SIZE);
    }
    lfs3_unmount(&lfs3) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;
    assert(test_repair_erases[block] == 0);
    assert(test_repair_progs[block] == 0);
    assert(test_repair_isbad(&lfs3, block));
    for (lfs3_size_t j = 0; j < N; j++) {
        sprintf(name, "spider%03d", j);
        test_repair_read_(&lfs3, name, seeds[j], SIZE);
    }
    lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
    lfs3_unmount(&lfs3) => 0;
'''

# test that checks read every block ck_passes times, and that more
# passes find a block that only fails its second read
[cases.test_repair_passes]
# METHOD=0 => lfs3_fs_ck
# METHOD=1 => lfs3_mount with LFS3_M_CKDATA
defines.METHOD = [0, 1]
defines.CK_PASSES = [1, 2, 3]
defines.N = 4
defines.SIZE = 'BLOCK_SIZE'
code = '''
    struct lfs3_cfg cfg;
    test_repair_wrap(&cfg, CFG);

    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR | LFS3_F_GBMAP, &cfg) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;
    for (lfs3_size_t i = 0; i < N; i++) {
        char name[256];
        sprintf(name, "spider%03d", i);
        test_repair_write(&lfs3, name, i, SIZE);
    }
    lfs3_block_t block = test_repair_datablock(&lfs3, "spider001");
    lfs3_unmount(&lfs3) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;

    // count reads
    test_repair_break(block, 0, 0);
    test_repair_ck(&lfs3, &cfg, METHOD, LFS3_M_RDWR, LFS3_CK_CKDATA) => 0;
    assert(test_repair_reads >= CK_PASSES);

    // fail only the second read
    test_repair_break(block, 1, 1);
    test_repair_ck(&lfs3, &cfg, METHOD, LFS3_M_RDWR, LFS3_CK_CKDATA)
            => (CK_PASSES >= 2) ? LFS3_ERR_CORRUPT : 0;
    assert(test_repair_issuspect(&lfs3, block) == (CK_PASSES >= 2));
    test_repair_heal();
    if (METHOD == 1 && CK_PASSES >= 2) {
        lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;
    }
    lfs3_unmount(&lfs3) => 0;
'''

# test that health is reported exactly, bad blocks, suspect blocks, and
# free good blocks
[cases.test_repair_health]
defines.BADS = [0, 3]
defines.SUSPECTS = [0, 2]
defines.N = 8
defines.SIZE = 'BLOCK_SIZE'
code = '''
    struct lfs3_cfg cfg;
    test_repair_wrap(&cfg, CFG);

    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR | LFS3_F_GBMAP, &cfg) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;
    for (lfs3_size_t i = 0; i < N; i++) {
        char name[256];
        sprintf(name, "spider%03d", i);
        test_repair_write(&lfs3, name, i, SIZE);
    }

    // mark some free blocks bad
    bool *bad = calloc(BLOCK_COUNT, 1);
    bool *suspect = calloc(BLOCK_COUNT, 1);
    lfs3_size_t bads = 0;
    for (lfs3_block_t b = BLOCK_COUNT-1; bads < BADS; b--) {
        if (!test_repair_inuse(&lfs3, b)) {
            lfs3_fs_mkbad(&lfs3, b) => 0;
            bad[b] = true;
            bads += 1;
        }
    }

    // and make some blocks fail reads, without retries these stay put
    for (lfs3_size_t i = 0; i < SUSPECTS; i++) {
        char name[256];
        sprintf(name, "spider%03d", i);
        lfs3_block_t block = test_repair_datablock(&lfs3, name);
        test_repair_break(block, 0, -1);
        lfs3_file_t file;
        lfs3_file_open(&lfs3, &file, name, LFS3_O_RDONLY) => 0;
        lfs3_file_ck(&lfs3, &file, LFS3_CK_CKDATA) => LFS3_ERR_CORRUPT;
        lfs3_file_close(&lfs3, &file) => 0;
        suspect[block] = true;
    }
    test_repair_heal();

    // bad blocks
    lfs3_block_t count = 0;
    for (lfs3_block_t b = 0;; b++) {
        lfs3_sblock_t b_ = lfs3_fs_nextbad(&lfs3, b);
        assert(b_ >= 0 || b_ == LFS3_ERR_NOENT);
        if (b_ == LFS3_ERR_NOENT) {
            break;
        }
        assert(bad[b_]);
        count += 1;
        b = b_;
    }
    assert(count == BADS);

    // suspect blocks
    count = 0;
    for (lfs3_block_t b = 0;; b++) {
        lfs3_sblock_t b_ = lfs3_fs_nextsuspect(&lfs3, b);
        assert(b_ >= 0 || b_ == LFS3_ERR_NOENT);
        if (b_ == LFS3_ERR_NOENT) {
            break;
        }
        assert(suspect[b_]);
        count += 1;
        b = b_;
    }
    assert(count == SUSPECTS);

    // free good blocks
    lfs3_block_t nfree = 0;
    for (lfs3_block_t b = 0; b < BLOCK_COUNT; b++) {
        nfree += !test_repair_inuse(&lfs3, b) && !bad[b];
    }
    lfs3_sblock_t usage = lfs3_fs_usage(&lfs3);
    assert(usage >= 0);
    assert((lfs3_block_t)(BLOCK_COUNT - usage) == nfree);

    lfs3_unmount(&lfs3) => 0;
    free(bad);
    free(suspect);
'''
