'''

# test that pre-erasing doesn't allocate without an allocator checkpoint
#
# the pre-erase gbmap commit can allocate, which must never underflow
# the lookahead's checkpoint, otherwise we lose the ability to detect
# NOSPC and the lookahead window can wrap
[cases.test_gc_preerase_ckpoint]
defines.GC_FLAGS = 'LFS3_GC_PREERASE'
defines.GC_STEPS = 1
# test with a number of different erase values
defines.ERASE_VALUE = [0xff, 0x00, -1]
if = 'GBMAP'
ifdef = ['LFS3_GC', 'LFS3_GBMAP', 'LFS3_REVPERTURB', 'LFS3_PREERASE']
in = 'lfs3.c'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                // note preerasing needs revperturb
                | LFS3_F_REVPERTURB
                | LFS3_F_GBMAP,
            CFG) => 0;
    lfs3_mount(&lfs3,
            LFS3_M_RDWR
                // note preerasing needs revperturb
                | LFS3_M_REVPERTURB,
            CFG) => 0;

    // pre-erase one block at a time, enough pre-erases eventually
    // force the gbmap to allocate
    struct lfs3_fsinfo fsinfo;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags & LFS3_I_PREERASE);
    for (lfs3_block_t i = 0;; i++) {
        // a bit hacky, but this catches infinite loops
        assert(i < 2*BLOCK_COUNT);

        lfs3_fs_gc(&lfs3) => 0;
        assert(lfs3.lookahead.ckpoint <= lfs3.block_count);

        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        if (!(fsinfo.flags & LFS3_I_PREERASE)) {
            break;
        }
    }

    // write to a file to try to make sure nothing obvious is broken
    uint32_t prng = 42;
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "spider",
            LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
    uint8_t wbuf[2*BLOCK_SIZE];
    for (lfs3_size_t j = 0; j < 2*BLOCK_SIZE; j++) {
        wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
    }
    lfs3_file_write(&lfs3, &file, wbuf, 2*BLOCK_SIZE) => 2*BLOCK_SIZE;
    lfs3_file_close(&lfs3, &file) => 0;
    lfs3_unmount(&lfs3) => 0;

    lfs3_mount(&lfs3, LFS3_M_RDONLY | LFS3_M_CKDATA, CFG) => 0;
    lfs3_file_open(&lfs3, &file, "spider", LFS3_O_RDONLY) => 0;
    uint8_t rbuf[2*BLOCK_SIZE];
    lfs3_file_read(&lfs3, &file, rbuf, 2*BLOCK_SIZE) => 2*BLOCK_SIZE;
    assert(memcmp(rbuf, wbuf, 2*BLOCK_SIZE) == 0);
    lfs3_file_close(&lfs3, &file) => 0;
    lfs3_unmount(&lfs3) => 0;
'''

# test that pre-erasing at mount on a nearly full disk doesn't
# allocate without an allocator checkpoint, and that we still find the
# disk full afterwards
[cases.test_gc_preerase_ckpoint_full]
# test with a number of different erase values
defines.ERASE_VALUE = [0xff, 0x00, -1]
# how many blocks to free, spread out so pre-erasing fragments the gbmap
defines.FREE = [4, 16, 64]
if = 'GBMAP'
ifdef = ['LFS3_GBMAP', 'LFS3_REVPERTURB', 'LFS3_PREERASE']
in = 'lfs3.c'
code = '''
    // fill the disk, and then free a few blocks
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                // note preerasing needs revperturb
                | LFS3_F_REVPERTURB
                | LFS3_F_GBMAP,
            CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR | LFS3_M_REVPERTURB, CFG) => 0;
    uint8_t wbuf[BLOCK_SIZE];
    lfs3_size_t n = 0;
    while (true) {
        assert(n < BLOCK_COUNT);
        char name[256];
        sprintf(name, "fly%04d", n);
        memset(wbuf, 'a'+(n % 26), BLOCK_SIZE);
        lfs3_file_t file;
        int err = lfs3_file_open(&lfs3, &file, name,
                LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL);
        assert(!err || err == LFS3_ERR_NOSPC);
        if (!err) {
            lfs3_ssize_t d = lfs3_file_write(&lfs3, &file,
                    wbuf, BLOCK_SIZE);
            assert(d == BLOCK_SIZE || d == LFS3_ERR_NOSPC);
            err = lfs3_file_close(&lfs3, &file);
            assert(!err || err == LFS3_ERR_NOSPC);
            if (d < 0) {
                err = d;
            }
        }
        if (err) {
            break;
        }
        n += 1;
    }
    for (lfs3_size_t i = 0; i < FREE; i++) {
        char name[256];
        sprintf(name, "fly%04d", (int)(i*(n/FREE)));
        lfs3_remove(&lfs3, name) => 0;
    }
    lfs3_unmount(&lfs3) => 0;

    // pre-erase at mount, before anything else checkpoints the
    // allocator, and without a lookahead scan
    lfs3_mount(&lfs3,
            LFS3_M_RDWR
                | LFS3_M_REVPERTURB
                | LFS3_M_PREERASE,
            CFG) => 0;
    assert(lfs3.lookahead.ckpoint <= lfs3.block_count);

    // write until we run out of space again, this should not take more
    // than the disk
    lfs3_size_t m = 0;
    while (true) {
        assert(m < 2*BLOCK_COUNT);
        char name[256];
        sprintf(name, "fly%04d", n+m);
        memset(wbuf, 'a'+((n+m) % 26), BLOCK_SIZE);
        lfs3_file_t file;
        int err = lfs3_file_open(&lfs3, &file, name,
                LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL);
        assert(!err || err == LFS3_ERR_NOSPC);
        assert(lfs3.lookahead.ckpoint <= lfs3.block_count);
        if (!err) {
            lfs3_ssize_t d = lfs3_file_write(&lfs3, &file,
                    wbuf, BLOCK_SIZE);
            assert(d == BLOCK_SIZE || d == LFS3_ERR_NOSPC);
            assert(lfs3.lookahead.ckpoint <= lfs3.block_count);
            err = lfs3_file_close(&lfs3, &file);
            assert(!err || err == LFS3_ERR_NOSPC);
            assert(lfs3.lookahead.ckpoint <= lfs3.block_count);
            if (d < 0) {
                err = d;
            }
        }
        if (err) {
            break;
        }
        m += 1;
    }
    // we only freed FREE blocks
    assert(m <= FREE);

    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR | LFS3_M_REVPERTURB, CFG) => 0;
        }

        for (lfs3_size_t i = 0; i < n+m; i++) {
            if (i < FREE*(n/FREE) && i % (n/FREE) == 0) {
                continue;
            }
            char name[256];
            sprintf(name, "fly%04d", i);
            lfs3_file_t file;
            lfs3_file_open(&lfs3, &file, name, LFS3_O_RDONLY) => 0;
            uint8_t rbuf[BLOCK_SIZE];
            lfs3_file_read(&lfs3, &file, rbuf, BLOCK_SIZE) => BLOCK_SIZE;
            memset(wbuf, 'a'+(i % 26), BLOCK_SIZE);
            assert(memcmp(rbuf, wbuf, BLOCK_SIZE) == 0);
            lfs3_file_close(&lfs3, &file) => 0;
        }
        lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
    }
    lfs3_unmount(&lfs3) => 0;
'''

# test that a pre-erased block whose erased-state no longer matches, say
# because a prog was attempted before losing power, is never progged
# without an erase
[cases.test_gc_preerase_mismatch]
defines.GC_FLAGS = 'LFS3_GC_PREERASE'
defines.GC_STEPS = -1
# test with a number of different erase values
defines.ERASE_VALUE = [0xff, 0x00, -1]
defines.PROG_SIZE = [1, 16]
# check that nothing is progged twice, and count erases
defines.CKPROGONCE = true
defines.ERASE_CYCLES = 0xffffffff
# which pre-erased block to mess with
defines.NTH = [0, 1, 'BLOCK_COUNT/2']
if = 'GBMAP'
ifdef = ['LFS3_GC', 'LFS3_GBMAP', 'LFS3_REVPERTURB', 'LFS3_PREERASE']
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                // note preerasing needs revperturb
                | LFS3_F_REVPERTURB
                | LFS3_F_GBMAP,
            CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR | LFS3_M_REVPERTURB, CFG) => 0;

    // pre-erase everything we can
    lfs3_emubd_swear_t *wear = malloc(BLOCK_COUNT*sizeof(lfs3_emubd_swear_t));
    lfs3_emubd_sio_t *progs = malloc(BLOCK_COUNT*sizeof(lfs3_emubd_sio_t));
    for (lfs3_block_t b = 0; b < BLOCK_COUNT; b++) {
        wear[b] = lfs3_emubd_wear(CFG, b);
        progs[b] = lfs3_emubd_blockprogs(CFG, b);
    }
    for (lfs3_block_t i = 0;; i++) {
        // a bit hacky, but this catches infinite loops
        assert(i < 2*BLOCK_COUNT);

        lfs3_fs_gc(&lfs3) => 0;

        struct lfs3_fsinfo fsinfo;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        if (!(fsinfo.flags & LFS3_I_PREERASE)) {
            break;
        }
    }
    lfs3_unmount(&lfs3) => 0;

    // find the nth pre-erased block, erased but not progged since
    lfs3_sblock_t block = -1;
    lfs3_block_t count = 0;
    for (lfs3_block_t b = 0; b < BLOCK_COUNT; b++) {
        if (lfs3_emubd_wear(CFG, b) > wear[b]
                && lfs3_emubd_blockprogs(CFG, b) == progs[b]) {
            if (count == NTH || block == -1) {
                block = b;
            }
            count += 1;
        }
    }
    assert(block != -1);

    // flip a bit in its first prog unit, and make any prog before the
    // next erase fail the test
    lfs3_emubd_flipbit(CFG, block, (8*PROG_SIZE)/2 + 1) => 0;
    lfs3_emubd_mkprogged(CFG, block) => 0;
    lfs3_emubd_swear_t block_wear = lfs3_emubd_wear(CFG, block);
    lfs3_emubd_sio_t block_progs = lfs3_emubd_blockprogs(CFG, block);

    // rewrite a file until we've cycled through the disk a couple times
    lfs3_mount(&lfs3, LFS3_M_RDWR | LFS3_M_REVPERTURB, CFG) => 0;
    uint32_t prng = 42;
    uint8_t wbuf[BLOCK_SIZE];
    for (lfs3_block_t i = 0; i < 2*BLOCK_COUNT; i++) {
        for (lfs3_size_t j = 0; j < BLOCK_SIZE; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_t file;
        lfs3_file_open(&lfs3, &file, "spider",
                LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_TRUNC) => 0;
        lfs3_file_write(&lfs3, &file, wbuf, BLOCK_SIZE) => BLOCK_SIZE;
        lfs3_file_close(&lfs3, &file) => 0;

        // if our block was progged, it must have been erased first
        if (lfs3_emubd_blockprogs(CFG, block) > block_progs) {
            assert(lfs3_emubd_wear(CFG, block) > block_wear);
        }
    }

    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR | LFS3_M_REVPERTURB, CFG) => 0;
        }

        lfs3_file_t file;
        lfs3_file_open(&lfs3, &file, "spider", LFS3_O_RDONLY) => 0;
        uint8_t rbuf[BLOCK_SIZE];
        lfs3_file_read(&lfs3, &file, rbuf, BLOCK_SIZE) => BLOCK_SIZE;
        assert(memcmp(rbuf, wbuf, BLOCK_SIZE) == 0);
        lfs3_file_close(&lfs3, &file) => 0;

        lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
    }

    lfs3_unmount(&lfs3) => 0;
    free(wear);
    free(progs);
'''

# test that allocating a pre-erased block doesn't erase it again
[cases.test_gc_preerase_noerase]
defines.GC_FLAGS = 'LFS3_GC_PREERASE'
defines.GC_STEPS = -1
defines.ERASE_VALUE = [0xff, 0x00]
defines.PROG_SIZE = [1, 16]
# count erases
defines.ERASE_CYCLES = 0xffffffff
# block allocations to watch
defines.ALLOCS = 100
# allocations per file
defines.SIZE = ['BLOCK_SIZE', '4*BLOCK_SIZE']
if = 'GBMAP'
ifdef = ['LFS3_GC', 'LFS3_GBMAP', 'LFS3_REVPERTURB', 'LFS3_PREERASE']
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                // note preerasing needs revperturb
                | LFS3_F_REVPERTURB
                | LFS3_F_GBMAP,
            CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR | LFS3_M_REVPERTURB, CFG) => 0;

    // pre-erase everything we can
    lfs3_emubd_swear_t *wear = malloc(BLOCK_COUNT*sizeof(lfs3_emubd_swear_t));
    lfs3_emubd_sio_t *progs = malloc(BLOCK_COUNT*sizeof(lfs3_emubd_sio_t));
    bool *preerased = malloc(BLOCK_COUNT*sizeof(bool));
    for (lfs3_block_t b = 0; b < BLOCK_COUNT; b++) {
        wear[b] = lfs3_emubd_wear(CFG, b);
        progs[b] = lfs3_emubd_blockprogs(CFG, b);
    }
    for (lfs3_block_t i = 0;; i++) {
        // a bit hacky, but this catches infinite loops
        assert(i < 2*BLOCK_COUNT);

        lfs3_fs_gc(&lfs3) => 0;

        struct lfs3_fsinfo fsinfo;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        if (!(fsinfo.flags & LFS3_I_PREERASE)) {
            break;
        }
    }

    // pre-erased blocks were erased but not progged since
    lfs3_block_t count = 0;
    for (lfs3_block_t b = 0; b < BLOCK_COUNT; b++) {
        preerased[b] = lfs3_emubd_wear(CFG, b) > wear[b]
                && lfs3_emubd_blockprogs(CFG, b) == progs[b];
        wear[b] = lfs3_emubd_wear(CFG, b);
        if (preerased[b]) {
            count += 1;
        }
    }
    assert(count >= ALLOCS);

    // allocate blocks, only to new files so nothing is freed, and
    // check every pre-erased block when it's first progged
    uint32_t prng = 42;
    uint8_t wbuf[SIZE];
    lfs3_block_t used = 0;
    for (lfs3_size_t i = 0; i < ALLOCS/(SIZE/BLOCK_SIZE); i++) {
        char name[256];
        sprintf(name, "spider%03x", i);
        for (lfs3_size_t j = 0; j < SIZE; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_t file;
        lfs3_file_open(&lfs3, &file, name,
                LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
        lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
        lfs3_file_close(&lfs3, &file) => 0;

        for (lfs3_block_t b = 0; b < BLOCK_COUNT; b++) {
            if (preerased[b] && lfs3_emubd_blockprogs(CFG, b) > progs[b]) {
                if (lfs3_emubd_wear(CFG, b) != wear[b]) {
                    printf("pre-erased block 0x%"PRIx32" erased again\n", b);
                }
                assert(lfs3_emubd_wear(CFG, b) == wear[b]);
                preerased[b] = false;
                used += 1;
            }
        }
    }
    // and most allocations used pre-erased blocks
    printf("used %"PRIu32" pre-erased blocks\n", used);
    assert(used >= ALLOCS);

    // check our files
    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR | LFS3_M_REVPERTURB, CFG) => 0;
        }

        prng = 42;
        for (lfs3_size_t i = 0; i < ALLOCS/(SIZE/BLOCK_SIZE); i++) {
            char name[256];
            sprintf(name, "spider%03x", i);
            for (lfs3_size_t j = 0; j < SIZE; j++) {
                wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
            }
            lfs3_file_t file;
            uint8_t rbuf[SIZE];
            lfs3_file_open(&lfs3, &file, name, LFS3_O_RDONLY) => 0;
            lfs3_file_read(&lfs3, &file, rbuf, SIZE) => SIZE;
            assert(memcmp(rbuf, wbuf, SIZE) == 0);
            lfs3_file_close(&lfs3, &file) => 0;
        }

        lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
    }

    lfs3_unmount(&lfs3) => 0;
    free(wear);
    free(progs);
    free(preerased);
'''

# test that pre-erased blocks are never progged without an erase when
# mounted without revperturb, where the pre-erase can't be trusted
[cases.test_gc_preerase_norevperturb]
defines.GC_FLAGS = 'LFS3_GC_PREERASE'
defines.GC_STEPS = -1
# test with a number of different erase values
defines.ERASE_VALUE = [0xff, 0x00, -1]
# check that nothing is progged twice, and count erases
defines.CKPROGONCE = true
defines.ERASE_CYCLES = 0xffffffff
if = ['GBMAP', 'LFS3_IFYES_REVPERTURB(false, true, true)']
ifdef = ['LFS3_GC', 'LFS3_GBMAP', 'LFS3_REVPERTURB', 'LFS3_PREERASE']
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                // note preerasing needs revperturb
                | LFS3_F_REVPERTURB
                | LFS3_F_GBMAP,
            CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR | LFS3_M_REVPERTURB, CFG) => 0;

    // pre-erase everything we can
    lfs3_emubd_swear_t *wear = malloc(BLOCK_COUNT*sizeof(lfs3_emubd_swear_t));
    lfs3_emubd_sio_t *progs = malloc(BLOCK_COUNT*sizeof(lfs3_emubd_sio_t));
    for (lfs3_block_t b = 0; b < BLOCK_COUNT; b++) {
        wear[b] = lfs3_emubd_wear(CFG, b);
        progs[b] = lfs3_emubd_blockprogs(CFG, b);
    }
    for (lfs3_block_t i = 0;; i++) {
        // a bit hacky, but this catches infinite loops
        assert(i < 2*BLOCK_COUNT);

        lfs3_fs_gc(&lfs3) => 0;

        struct lfs3_fsinfo fsinfo;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        if (!(fsinfo.flags & LFS3_I_PREERASE)) {
            break;
        }
    }
    lfs3_unmount(&lfs3) => 0;

    // make any prog of a pre-erased block before its next erase fail
    // the test
    bool *preerased = malloc(BLOCK_COUNT*sizeof(bool));
    lfs3_block_t count = 0;
    for (lfs3_block_t b = 0; b < BLOCK_COUNT; b++) {
        preerased[b] = lfs3_emubd_wear(CFG, b) > wear[b]
                && lfs3_emubd_blockprogs(CFG, b) == progs[b];
        if (preerased[b]) {
            lfs3_emubd_mkprogged(CFG, b) => 0;
            count += 1;
        }
        wear[b] = lfs3_emubd_wear(CFG, b);
        progs[b] = lfs3_emubd_blockprogs(CFG, b);
    }
    assert(count > 0);

    // mount without revperturb, and fill the disk
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
    uint8_t wbuf[BLOCK_SIZE];
    lfs3_size_t n = 0;
    while (true) {
        assert(n < BLOCK_COUNT);
        char name[256];
        sprintf(name, "fly%04d", n);
        memset(wbuf, 'a'+(n % 26), BLOCK_SIZE);
        lfs3_file_t file;
        int err = lfs3_file_open(&lfs3, &file, name,
                LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL);
        assert(!err || err == LFS3_ERR_NOSPC);
        if (!err) {
            lfs3_ssize_t d = lfs3_file_write(&lfs3, &file,
                    wbuf, BLOCK_SIZE);
            assert(d == BLOCK_SIZE || d == LFS3_ERR_NOSPC);
            err = lfs3_file_close(&lfs3, &file);
            assert(!err || err == LFS3_ERR_NOSPC);
            if (d < 0) {
                err = d;
            }
        }
        if (err) {
            break;
        }
        n += 1;
    }

    // every pre-erased block that was progged must have been erased
    // first
    lfs3_block_t used = 0;
    for (lfs3_block_t b = 0; b < BLOCK_COUNT; b++) {
        if (preerased[b] && lfs3_emubd_blockprogs(CFG, b) > progs[b]) {
            assert(lfs3_emubd_wear(CFG, b) > wear[b]);
            used += 1;
        }
    }
    // and we should have used at least some of them
    assert(used > 0);

    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
        }

        for (lfs3_size_t i = 0; i < n; i++) {
            char name[256];
            sprintf(name, "fly%04d", i);
            lfs3_file_t file;
            lfs3_file_open(&lfs3, &file, name, LFS3_O_RDONLY) => 0;
            uint8_t rbuf[BLOCK_SIZE];
            lfs3_file_read(&lfs3, &file, rbuf, BLOCK_SIZE) => BLOCK_SIZE;
            memset(wbuf, 'a'+(i % 26), BLOCK_SIZE);
            assert(memcmp(rbuf, wbuf, BLOCK_SIZE) == 0);
            lfs3_file_close(&lfs3, &file) => 0;
        }
        lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
    }

    lfs3_unmount(&lfs3) => 0;
    free(preerased);
    free(wear);
    free(progs);
'''

# test that as we increase gc_preerase_count, late-erases generally
# decreases
[cases.test_gc_preerase_decreasing]
# this is just the starting gc_preerase_count
defines.GC_PREERASE_COUNT = 1
defines.GC_PREERASE_STEP = 10
defines.CKMETA = [false, true]
defines.CKDATA = [false, true]
defines.GC_FLAGS = '''
    // note we need lookahead for this test to be reliable
    LFS3_GC_LOOKAHEAD
        | LFS3_GC_PREERASE
        | ((CKMETA) ? LFS3_GC_CKMETA : 0)
        | ((CKDATA) ? LFS3_GC_CKDATA : 0)
'''
defines.GC_STEPS = [-1, 1, 2, 10, 100, 1000]
defines.SIZE = 'BLOCK_SIZE'
if = 'GBMAP'
ifdef = ['LFS3_GC', 'LFS3_GBMAP', 'LFS3_REVPERTURB', 'LFS3_PREERASE']
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                // note preerasing needs revperturb
                | LFS3_F_REVPERTURB
                | LFS3_F_GBMAP,
            CFG) => 0;

    uint32_t prng = 42;

    // keep track of non-preerase erase cycles
    lfs3_emubd_io_t *erased = malloc(sizeof(lfs3_emubd_io_t)*BLOCK_COUNT);
    memset(erased, 0, sizeof(lfs3_emubd_io_t)*BLOCK_COUNT);

    // step through preerase counts
    for (lfs3_size_t i = 0; i < BLOCK_COUNT/GC_PREERASE_STEP; i++) {
        // reconfigure the preerase count per run
        struct lfs3_cfg cfg = *CFG;
        cfg.gc_preerase_count = GC_PREERASE_COUNT + i*GC_PREERASE_STEP;
        lfs3_mount(&lfs3,
                LFS3_M_RDWR
                    // note preerasing needs revperturb
                    | LFS3_M_REVPERTURB,
                &cfg) => 0;

        // run GC until we make progress
        for (lfs3_block_t i = 0;; i++) {
            // a bit hacky, but this catches infinite loops
            LFS3_ASSERT(i < 2*BLOCK_COUNT);

            lfs3_fs_gc(&lfs3) => 0;

            struct lfs3_fsinfo fsinfo;
            lfs3_fs_stat(&lfs3, &fsinfo) => 0;
            if (!(fsinfo.flags & LFS3_I_PREERASE)) {
                break;
            }
        }

        // measure erased cycles before
        lfs3_emubd_io_t erased_ = lfs3_emubd_erased(&cfg);

        // rewrite file disk number of times
        lfs3_file_t file;
        uint8_t wbuf[SIZE];
        for (lfs3_block_t i = 0; i < BLOCK_COUNT; i++) {
            lfs3_file_open(&lfs3, &file, "spider",
                    LFS3_O_WRONLY
                        | LFS3_O_CREAT
                        | LFS3_O_TRUNC) => 0;
            for (lfs3_size_t j = 0; j < SIZE; j++) {
                wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
            }
            lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
            lfs3_file_close(&lfs3, &file) => 0;

            // we should always need to either preerase or lookahead after
            // any block allocation
            struct lfs3_fsinfo fsinfo;
            lfs3_fs_stat(&lfs3, &fsinfo) => 0;
            assert((fsinfo.flags & LFS3_I_PREERASE)
                    || (fsinfo.flags & LFS3_I_LOOKAHEAD));
        }

        // check the file contents
        lfs3_file_open(&lfs3, &file, "spider", LFS3_O_RDONLY) => 0;
        uint8_t rbuf[SIZE];
        lfs3_file_read(&lfs3, &file, rbuf, SIZE) => SIZE;
        assert(memcmp(rbuf, wbuf, SIZE) == 0);
        lfs3_file_close(&lfs3, &file) => 0;

        // measure erased cycles after
        lfs3_emubd_io_t erased__ = lfs3_emubd_erased(&cfg);
        erased[i] = erased__ - erased_;
        // log just in case it's useful when debugging
        printf("after %d cycles: pre-erased %d, late-erased %d\n",
                (int32_t)BLOCK_COUNT,
                cfg.gc_preerase_count,
                (int32_t)((erased__ - erased_)/BLOCK_SIZE));

        lfs3_unmount(&lfs3) => 0;
    }

    // compute deltas
    lfs3_size_t best_i = 0;
    lfs3_ssize_t best_delta = 0;
    lfs3_size_t worst_i = 0;
    lfs3_ssize_t worst_delta = 0;
    lfs3_ssize_t sum_delta = 0;
    for (lfs3_size_t i = 0; i < (BLOCK_COUNT/GC_PREERASE_STEP)-1; i++) {
        printf("delta: pre-erased %d->%d, late-erased %d->%d (%+d)\n",
                (int32_t)(GC_PREERASE_COUNT + (i+0)*GC_PREERASE_STEP),
                (int32_t)(GC_PREERASE_COUNT + (i+1)*GC_PREERASE_STEP),
                (int32_t)(erased[i+0]/BLOCK_SIZE),
                (int32_t)(erased[i+1]/BLOCK_SIZE),
                (int32_t)((erased[i+1] - erased[i])/BLOCK_SIZE));
        lfs3_ssize_t delta = (erased[i+1] - erased[i])/BLOCK_SIZE;
        if (i == 0 || delta < best_delta) {
            best_i = i;
            best_delta = delta;
        }
        if (i == 0 || delta > worst_delta) {
            worst_i = i;
            worst_delta = delta;
        }
        sum_delta += delta;
    }
    lfs3_ssize_t avg_delta = sum_delta / ((BLOCK_COUNT/GC_PREERASE_STEP)-1);

    printf("best delta: %+d (%d->%d)\n",
            best_delta,
            (int32_t)(GC_PREERASE_COUNT + (best_i+0)*GC_PREERASE_STEP),
            (int32_t)(GC_PREERASE_COUNT + (best_i+1)*GC_PREERASE_STEP));
    printf("worst delta: %+d (%d->%d)\n",
            worst_delta,
            (int32_t)(GC_PREERASE_COUNT + (worst_i+0)*GC_PREERASE_STEP),
            (int32_t)(GC_PREERASE_COUNT + (worst_i+1)*GC_PREERASE_STEP));
    printf("avg delta: %+d (%d/%d)\n",
            avg_delta,
            sum_delta,
            (int32_t)((BLOCK_COUNT/GC_PREERASE_STEP)-1));

    // we should expect deltas to average out to ~-GC_PREERASE_STEP,
    // hopefully no worse than -0.75*GC_PREERASE_STEP
    assert(avg_delta < -(GC_PREERASE_STEP-GC_PREERASE_STEP/4));

    free(erased);
'''


# test that compact can make progress in isolation
[cases.test_gc_compact_progress]
defines.LOOKAHEAD = [false, true]
defines.CKMETA = [false, true]
defines.CKDATA = [false, true]
defines.GC_FLAGS = '''
    LFS3_GC_COMPACT
        | ((LOOKAHEAD) ? LFS3_GC_LOOKAHEAD : 0)
        | ((CKMETA) ? LFS3_GC_CKMETA : 0)
        | ((CKDATA) ? LFS3_GC_CKDATA : 0)
'''
defines.GC_STEPS = [-1, 1, 2, 10, 100, 1000]
# set compact thresh to minimum
defines.GC_COMPACT_THRESH = 'BLOCK_SIZE/2'
defines.SIZE = [
    'FCACHE_SIZE/2',
    '2*FCACHE_SIZE',
    'BLOCK_SIZE/2',
    'BLOCK_SIZE',
    '2*BLOCK_SIZE',
    '8*BLOCK_SIZE',
]
ifdef = 'LFS3_GC'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    uint32_t prng = 42;

    // write to our mdir until >gc_compact_thresh full
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "jellyfish",
            LFS3_O_RDWR | LFS3_O_CREAT | LFS3_O_EXCL) => 0;

    // hack, don't use the internals like this
    uint8_t wbuf[SIZE];
    while ((file.b.h.mdir.r.eoff & 0x7fffffff) <= GC_COMPACT_THRESH) {
        lfs3_file_rewind(&lfs3, &file) => 0;
        for (lfs3_size_t j = 0; j < SIZE; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
        lfs3_file_sync(&lfs3, &file) => 0;
    }

    // expect dirty initial state or else our test doesn't work
    struct lfs3_fsinfo fsinfo;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags & LFS3_I_COMPACT);

    // run GC until we make progress
    for (lfs3_block_t i = 0;; i++) {
        // a bit hacky, but this catches infinite loops
        LFS3_ASSERT(i < 2*BLOCK_COUNT);

        lfs3_fs_gc(&lfs3) => 0;

        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        if (!(fsinfo.flags & LFS3_I_COMPACT)) {
            break;
        }
    }

    // mdir should have been compacted
    assert((file.b.h.mdir.r.eoff & 0x7fffffff) <= GC_COMPACT_THRESH);

    // check we can still read the file
    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_file_close(&lfs3, &file) => 0;
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
            lfs3_file_open(&lfs3, &file, "jellyfish", LFS3_O_RDONLY) => 0;
        }

        lfs3_file_rewind(&lfs3, &file) => 0;
        uint8_t rbuf[SIZE];
        lfs3_file_read(&lfs3, &file, rbuf, SIZE) => SIZE;
        assert(memcmp(rbuf, wbuf, SIZE) == 0);
    }

    lfs3_file_close(&lfs3, &file) => 0;
    lfs3_unmount(&lfs3) => 0;
'''

# test that compact dirtying still works with the GC API
[cases.test_gc_compact_mutation]
defines.LOOKAHEAD = [false, true]
defines.CKMETA = [false, true]
defines.CKDATA = [false, true]
defines.GC_FLAGS = '''
    LFS3_GC_COMPACT
        | ((LOOKAHEAD) ? LFS3_GC_LOOKAHEAD : 0)
        | ((CKMETA) ? LFS3_GC_CKMETA : 0)
        | ((CKDATA) ? LFS3_GC_CKDATA : 0)
'''
# set compact thresh to minimum
defines.GC_COMPACT_THRESH = 'BLOCK_SIZE/2'
defines.SIZE = [
    'FCACHE_SIZE/2',
    '2*FCACHE_SIZE',
    'BLOCK_SIZE/2',
    'BLOCK_SIZE',
    '2*BLOCK_SIZE',
    '8*BLOCK_SIZE',
]
# we need something to keep the traversal running
if = 'CKMETA || CKDATA'
ifdef = 'LFS3_GC'
in = 'lfs3.c'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    uint32_t prng = 42;

    // write to our mdir until >gc_compact_thresh full
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "jellyfish",
            LFS3_O_RDWR | LFS3_O_CREAT | LFS3_O_EXCL) => 0;

    // hack, don't use the internals like this
    uint8_t wbuf[SIZE];
    while ((file.b.h.mdir.r.eoff & 0x7fffffff) <= GC_COMPACT_THRESH) {
        lfs3_file_rewind(&lfs3, &file) => 0;
        for (lfs3_size_t j = 0; j < SIZE; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
        lfs3_file_sync(&lfs3, &file) => 0;
    }

    // expect dirty initial state or else our test doesn't work
    struct lfs3_fsinfo fsinfo;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags & LFS3_I_COMPACT);
    assert(!lfs3_handle_isopen(&lfs3, &lfs3.gc.t.h));

    // run GC one traversal + one step
    while (true) {
        lfs3_fs_gc(&lfs3) => 0;

        // internal traversal done?
        if (!lfs3_handle_isopen(&lfs3, &lfs3.gc.t.h)) {
            break;
        }
    }
    lfs3_fs_gc(&lfs3) => 0;
    assert(lfs3_handle_isopen(&lfs3, &lfs3.gc.t.h));

    // mutate the filesystem
    lfs3_file_rewind(&lfs3, &file) => 0;
    for (lfs3_size_t j = 0; j < SIZE; j++) {
        wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
    }
    lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
    lfs3_file_sync(&lfs3, &file) => 0;

    // run GC until our traversal is done (twice for compact)
    while (lfs3_handle_isopen(&lfs3, &lfs3.gc.t.h)) {
        lfs3_fs_gc(&lfs3) => 0;
    }

    // we should _not_ make progress
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags & LFS3_I_COMPACT);

    // check we can still read the file
    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_file_close(&lfs3, &file) => 0;
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
            lfs3_file_open(&lfs3, &file, "jellyfish", LFS3_O_RDONLY) => 0;
        }

        lfs3_file_rewind(&lfs3, &file) => 0;
        uint8_t rbuf[SIZE];
        lfs3_file_read(&lfs3, &file, rbuf, SIZE) => SIZE;
        assert(memcmp(rbuf, wbuf, SIZE) == 0);
    }

    lfs3_file_close(&lfs3, &file) => 0;
    lfs3_unmount(&lfs3) => 0;
'''

# test that a bad gc_compact_thresh is refused before touching the disk,
# in every build, since compaction doesn't need LFS3_GC
[cases.test_gc_compact_thresh_check]
defines.GC_COMPACT_THRESH = ['1', 'BLOCK_SIZE/2 - 1', 'BLOCK_SIZE+1']
