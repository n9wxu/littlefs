# Test GC things

# most of the GC logic is tested in test_trvs, we just test
# GC-API specific things here
after = ['test_trvs']

# Test both with and without the gbmap if available
defines.GBMAP = [false, true]
if = 'LFS3_IFYES_GBMAP(GBMAP, true, !GBMAP)'

code = '''
// count block device work, bytes read, progged, and erased, so a call
// that never returns fails instead of hanging
static lfs3_size_t test_gc_work = 0;
static lfs3_size_t test_gc_work_limit = -1;
static lfs3_size_t test_gc_erases = 0;

static void test_gc_work_add(lfs3_size_t size) {
    test_gc_work += size;
    // gc not returning?
    assert(test_gc_work <= test_gc_work_limit);
}

static int test_gc_work_read(const struct lfs3_cfg *cfg,
        lfs3_block_t block, lfs3_off_t off,
        void *buffer, lfs3_size_t size) {
    test_gc_work_add(size);
    return lfs3_emubd_read(cfg, block, off, buffer, size);
}

static int test_gc_work_prog(const struct lfs3_cfg *cfg,
        lfs3_block_t block, lfs3_off_t off,
        const void *buffer, lfs3_size_t size) {
    test_gc_work_add(size);
    return lfs3_emubd_prog(cfg, block, off, buffer, size);
}

static int test_gc_work_erase(const struct lfs3_cfg *cfg,
        lfs3_block_t block) {
    test_gc_work_add(cfg->block_size);
    test_gc_erases += 1;
    return lfs3_emubd_erase(cfg, block);
}
'''


# test that lookahead can make progress in isolation
[cases.test_gc_lookahead_progress]
defines.CKMETA = [false, true]
defines.CKDATA = [false, true]
defines.GC_FLAGS = '''
    LFS3_GC_LOOKAHEAD
        | ((CKMETA) ? LFS3_GC_CKMETA : 0)
        | ((CKDATA) ? LFS3_GC_CKDATA : 0)
'''
defines.GC_STEPS = [-1, 1, 2, 10, 100, 1000]
defines.SIZE = [
    'FCACHE_SIZE/2',
    '2*FCACHE_SIZE',
    'BLOCK_SIZE/2',
    'BLOCK_SIZE',
    '2*BLOCK_SIZE',
    '8*BLOCK_SIZE',
]
if = '!GBMAP'
ifdef = 'LFS3_GC'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR, CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    uint32_t prng = 42;

    // create a file
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "spider",
            LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
    uint8_t wbuf[SIZE];
    for (lfs3_size_t j = 0; j < SIZE; j++) {
        wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
    }
    lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
    lfs3_file_close(&lfs3, &file) => 0;

    // expect dirty initial state or else our test doesn't work
    struct lfs3_fsinfo fsinfo;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags & LFS3_I_LOOKAHEAD);

    // run GC until we make progress
    for (lfs3_block_t i = 0;; i++) {
        // a bit hacky, but this catches infinite loops
        LFS3_ASSERT(i < 2*BLOCK_COUNT);

        lfs3_fs_gc(&lfs3) => 0;

        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        if (!(fsinfo.flags & LFS3_I_LOOKAHEAD)) {
            break;
        }
    }

    // check the file contents
    lfs3_file_open(&lfs3, &file, "spider", LFS3_O_RDONLY) => 0;
    uint8_t rbuf[SIZE];
    lfs3_file_read(&lfs3, &file, rbuf, SIZE) => SIZE;
    assert(memcmp(rbuf, wbuf, SIZE) == 0);
    lfs3_file_close(&lfs3, &file) => 0;

    lfs3_unmount(&lfs3) => 0;
'''

# test that lookahead dirtying still works with the GC API
[cases.test_gc_lookahead_mutation]
defines.CKMETA = [false, true]
defines.CKDATA = [false, true]
defines.GC_FLAGS = '''
    LFS3_GC_LOOKAHEAD
        | ((CKMETA) ? LFS3_GC_CKMETA : 0)
        | ((CKDATA) ? LFS3_GC_CKDATA : 0)
'''
defines.SIZE = [
    'FCACHE_SIZE/2',
    '2*FCACHE_SIZE',
    'BLOCK_SIZE/2',
    'BLOCK_SIZE',
    '2*BLOCK_SIZE',
    '8*BLOCK_SIZE',
]
if = [
    '!GBMAP',
    # we need something to keep the traversal running
    'CKMETA || CKDATA',
]
ifdef = 'LFS3_GC'
in = 'lfs3.c'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR, CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    uint32_t prng = 42;

    // create a file
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "spider",
            LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
    uint8_t wbuf[SIZE];
    for (lfs3_size_t j = 0; j < SIZE; j++) {
        wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
    }
    lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
    lfs3_file_close(&lfs3, &file) => 0;

    // expect dirty initial state or else our test doesn't work
    struct lfs3_fsinfo fsinfo;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags & LFS3_I_LOOKAHEAD);
    assert(!lfs3_handle_isopen(&lfs3, &lfs3.gc.t.h));

    // run GC one step
    lfs3_fs_gc(&lfs3) => 0;
    assert(lfs3_handle_isopen(&lfs3, &lfs3.gc.t.h));

    // mutate the filesystem
    lfs3_file_open(&lfs3, &file, "spider",
            LFS3_O_WRONLY | LFS3_O_TRUNC) => 0;
    for (lfs3_size_t j = 0; j < SIZE; j++) {
        wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
    }
    lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
    lfs3_file_close(&lfs3, &file) => 0;

    // run GC until our traversal is done
    while (lfs3_handle_isopen(&lfs3, &lfs3.gc.t.h)) {
        lfs3_fs_gc(&lfs3) => 0;
    }

    // we should _not_ make progress
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags & LFS3_I_LOOKAHEAD);

    // check the file contents
    lfs3_file_open(&lfs3, &file, "spider", LFS3_O_RDONLY) => 0;
    uint8_t rbuf[SIZE];
    lfs3_file_read(&lfs3, &file, rbuf, SIZE) => SIZE;
    assert(memcmp(rbuf, wbuf, SIZE) == 0);
    lfs3_file_close(&lfs3, &file) => 0;

    lfs3_unmount(&lfs3) => 0;
'''

# test that we can relax lookahead scanning with
# gc_lookahead_thresh
[cases.test_gc_lookahead_relaxed]
# relax our lookahead thresh
defines.GC_LOOKAHEAD_THRESH = [
    '-1',
    '8*LOOKAHEAD_SIZE - (8*LOOKAHEAD_SIZE/4)',
    '8*LOOKAHEAD_SIZE - (8*LOOKAHEAD_SIZE/2)',
]
defines.CKMETA = [false, true]
defines.CKDATA = [false, true]
defines.GC_FLAGS = '''
    LFS3_GC_LOOKAHEAD
        | ((CKMETA) ? LFS3_GC_CKMETA : 0)
        | ((CKDATA) ? LFS3_GC_CKDATA : 0)
'''
defines.GC_STEPS = [-1, 1, 2, 10, 100, 1000]
defines.SIZE = 'BLOCK_SIZE'
if = '!GBMAP'
ifdef = 'LFS3_GC'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR, CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    uint32_t prng = 42;

    // create a file
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "spider",
            LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
    uint8_t wbuf[SIZE];
    for (lfs3_size_t j = 0; j < SIZE; j++) {
        wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
    }
    lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
    lfs3_file_close(&lfs3, &file) => 0;

    // run GC until we make progress
    for (lfs3_block_t i = 0;; i++) {
        // a bit hacky, but this catches infinite loops
        LFS3_ASSERT(i < 2*BLOCK_COUNT);

        lfs3_fs_gc(&lfs3) => 0;

        struct lfs3_fsinfo fsinfo;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        if (!(fsinfo.flags & LFS3_I_LOOKAHEAD)) {
            break;
        }
    }

    // check the file contents
    lfs3_file_open(&lfs3, &file, "spider", LFS3_O_RDONLY) => 0;
    uint8_t rbuf[SIZE];
    lfs3_file_read(&lfs3, &file, rbuf, SIZE) => SIZE;
    assert(memcmp(rbuf, wbuf, SIZE) == 0);
    lfs3_file_close(&lfs3, &file) => 0;

    // rewrite file until we need to repopulate
    for (lfs3_block_t i = 0;; i++) {
        // a bit hacky, but this catches infinite loops
        LFS3_ASSERT(i < 2*BLOCK_COUNT);

        lfs3_file_open(&lfs3, &file, "spider",
                LFS3_O_WRONLY | LFS3_O_TRUNC) => 0;
        for (lfs3_size_t j = 0; j < SIZE; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
        lfs3_file_close(&lfs3, &file) => 0;

        struct lfs3_fsinfo fsinfo;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        if (fsinfo.flags & LFS3_I_LOOKAHEAD) {
            // check that we actually relaxed repopulations
            if ((lfs3_size_t)GC_LOOKAHEAD_THRESH
                    < (lfs3_size_t)(8*LOOKAHEAD_SIZE-1)) {
                assert(i > 0);
            } else {
                assert(i == 0);
            }
            break;
        }
    }

    // run GC until we make progress
    for (lfs3_block_t i = 0;; i++) {
        // a bit hacky, but this catches infinite loops
        LFS3_ASSERT(i < 2*BLOCK_COUNT);

        lfs3_fs_gc(&lfs3) => 0;

        struct lfs3_fsinfo fsinfo;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        if (!(fsinfo.flags & LFS3_I_LOOKAHEAD)) {
            break;
        }
    }

    // check the file contents
    lfs3_file_open(&lfs3, &file, "spider", LFS3_O_RDONLY) => 0;
    lfs3_file_read(&lfs3, &file, rbuf, SIZE) => SIZE;
    assert(memcmp(rbuf, wbuf, SIZE) == 0);
    lfs3_file_close(&lfs3, &file) => 0;

    lfs3_unmount(&lfs3) => 0;
'''


