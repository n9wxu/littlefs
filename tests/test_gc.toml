# pseudo-fuzz test that dirtying still works with the GC API
[cases.test_gc_mutation]
defines.N = 100
defines.MKCONSISTENT = [false, true]
defines.LOOKAHEAD = [false, true]
defines.PREERASE = [false, true]
defines.COMPACT = [false, true]
defines.CKMETA = [false, true]
defines.CKDATA = [false, true]
defines.GC_FLAGS = '''
    ((MKCONSISTENT) ? LFS3_GC_MKCONSISTENT : 0)
        | ((LOOKAHEAD) ? LFS3_GC_LOOKAHEAD : 0)
        | ((PREERASE) ? LFS3_IFDEF_PREERASE(LFS3_GC_PREERASE, -1) : 0)
        | ((COMPACT) ? LFS3_GC_COMPACT : 0)
        | ((CKMETA) ? LFS3_GC_CKMETA : 0)
        | ((CKDATA) ? LFS3_GC_CKDATA : 0)
'''
defines.GC_STEPS = [-1, 1, 2, 10, 100, 1000]
# set compact thresh to minimum
defines.GC_COMPACT_THRESH = 'BLOCK_SIZE/2'
defines.SIZE = [
    'FCACHE_SIZE/2',
    '2*FCACHE_SIZE',
    'BLOCK_SIZE/2',
    'BLOCK_SIZE',
    '2*BLOCK_SIZE',
    '8*BLOCK_SIZE',
]
if = [
    'LFS3_IFDEF_PREERASE(true, !PREERASE)',
    'GBMAP || !PREERASE',
]
ifdef = 'LFS3_GC'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                // note preerasing needs revperturb
                | ((PREERASE)
                    ? LFS3_IFDEF_PREERASE(LFS3_F_REVPERTURB, -1)
                    : 0)
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;
    lfs3_mount(&lfs3,
            LFS3_M_RDWR
                // note preerasing needs revperturb
                | ((PREERASE)
                    ? LFS3_IFDEF_PREERASE(LFS3_M_REVPERTURB, -1)
                    : 0),
            CFG) => 0;

    uint32_t prng = 42;

    // create a file
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "spider",
            LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
    uint8_t wbuf[SIZE];
    for (lfs3_size_t j = 0; j < SIZE; j++) {
        wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
    }
    lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
    lfs3_file_close(&lfs3, &file) => 0;

    for (uint32_t i = 0; i < N; i++) {
        // rewrite the file every gc cycle
        lfs3_file_open(&lfs3, &file, "spider",
                LFS3_O_WRONLY | LFS3_O_TRUNC) => 0;
        for (lfs3_size_t j = 0; j < SIZE; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
        lfs3_file_close(&lfs3, &file) => 0;

        // gc!
        lfs3_fs_gc(&lfs3) => 0;
    }

    // check the file contents
    lfs3_file_open(&lfs3, &file, "spider", LFS3_O_RDONLY) => 0;
    uint8_t rbuf[SIZE];
    lfs3_file_read(&lfs3, &file, rbuf, SIZE) => SIZE;
    assert(memcmp(rbuf, wbuf, SIZE) == 0);
    lfs3_file_close(&lfs3, &file) => 0;

    lfs3_unmount(&lfs3) => 0;
'''

# pseudo-fuzz test that spamming lfs3_fs_unck doesn't break anything
[cases.test_gc_mutation_unck]
defines.N = 100
defines.MKCONSISTENT = [false, true]
defines.LOOKAHEAD = [false, true]
defines.PREERASE = [false, true]
defines.COMPACT = [false, true]
defines.CKMETA = [false, true]
defines.CKDATA = [false, true]
defines.GC_FLAGS = '''
    ((MKCONSISTENT) ? LFS3_GC_MKCONSISTENT : 0)
        | ((LOOKAHEAD) ? LFS3_GC_LOOKAHEAD : 0)
        | ((PREERASE) ? LFS3_IFDEF_PREERASE(LFS3_GC_PREERASE, -1) : 0)
        | ((COMPACT) ? LFS3_GC_COMPACT : 0)
        | ((CKMETA) ? LFS3_GC_CKMETA : 0)
        | ((CKDATA) ? LFS3_GC_CKDATA : 0)
'''
defines.GC_STEPS = [-1, 1, 2, 10, 100, 1000]
# set compact thresh to minimum
defines.GC_COMPACT_THRESH = 'BLOCK_SIZE/2'
defines.SIZE = [
    'FCACHE_SIZE/2',
    '2*FCACHE_SIZE',
    'BLOCK_SIZE/2',
    'BLOCK_SIZE',
    '2*BLOCK_SIZE',
    '8*BLOCK_SIZE',
]
if = [
    'LFS3_IFDEF_PREERASE(true, !PREERASE)',
    'GBMAP || !PREERASE',
]
ifdef = 'LFS3_GC'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                // note preerasing needs revperturb
                | ((PREERASE)
                    ? LFS3_IFDEF_PREERASE(LFS3_F_REVPERTURB, -1)
                    : 0)
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;
    lfs3_mount(&lfs3,
            LFS3_M_RDWR
                // note preerasing needs revperturb
                | ((PREERASE)
                    ? LFS3_IFDEF_PREERASE(LFS3_M_REVPERTURB, -1)
                    : 0),
            CFG) => 0;

    uint32_t prng = 42;

    // create a file
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "spider",
            LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
    uint8_t wbuf[SIZE];
    for (lfs3_size_t j = 0; j < SIZE; j++) {
        wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
    }
    lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
    lfs3_file_close(&lfs3, &file) => 0;

    for (uint32_t i = 0; i < N; i++) {
        // rewrite the file every gc cycle
        lfs3_file_open(&lfs3, &file, "spider",
                LFS3_O_WRONLY | LFS3_O_TRUNC) => 0;
        for (lfs3_size_t j = 0; j < SIZE; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
        lfs3_file_close(&lfs3, &file) => 0;

        // choose a random set of flags to unck every cycle
        uint32_t flags = GC_FLAGS & TEST_PRNG(&prng);
        lfs3_fs_unck(&lfs3, flags) => 0;

        // gc!
        lfs3_fs_gc(&lfs3) => 0;
    }

    // check the file contents
    lfs3_file_open(&lfs3, &file, "spider", LFS3_O_RDONLY) => 0;
    uint8_t rbuf[SIZE];
    lfs3_file_read(&lfs3, &file, rbuf, SIZE) => SIZE;
    assert(memcmp(rbuf, wbuf, SIZE) == 0);
    lfs3_file_close(&lfs3, &file) => 0;

    lfs3_unmount(&lfs3) => 0;
'''

# test that gc work doesn't break anything in low-space condiditions
[cases.test_gc_nospc]
defines.MKCONSISTENT = [false, true]
defines.LOOKAHEAD = [false, true]
defines.PREERASE = [false, true]
defines.COMPACT = [false, true]
defines.CKMETA = [false, true]
defines.CKDATA = [false, true]
defines.GC_FLAGS = '''
    ((MKCONSISTENT) ? LFS3_GC_MKCONSISTENT : 0)
        | ((LOOKAHEAD) ? LFS3_GC_LOOKAHEAD : 0)
        | ((PREERASE) ? LFS3_IFDEF_PREERASE(LFS3_GC_PREERASE, -1) : 0)
        | ((COMPACT) ? LFS3_GC_COMPACT : 0)
        | ((CKMETA) ? LFS3_GC_CKMETA : 0)
        | ((CKDATA) ? LFS3_GC_CKDATA : 0)
'''
# DON'T test with GC_STEPS=-1, it may never terminate!
defines.GC_STEPS = [1, 2, 10, 100, 1000]
# set compact thresh to minimum
defines.GC_COMPACT_THRESH = 'BLOCK_SIZE/2'
defines.SIZE = 'BLOCK_SIZE'
if = [
    'LFS3_IFDEF_PREERASE(true, !PREERASE)',
    'GBMAP || !PREERASE',
]
ifdef = 'LFS3_GC'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                // note preerasing needs revperturb
                | ((PREERASE)
                    ? LFS3_IFDEF_PREERASE(LFS3_F_REVPERTURB, -1)
                    : 0)
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;
    lfs3_mount(&lfs3,
            LFS3_M_RDWR
                // note preerasing needs revperturb
                | ((PREERASE)
                    ? LFS3_IFDEF_PREERASE(LFS3_M_REVPERTURB, -1)
                    : 0),
            CFG) => 0;

    uint32_t prng = 42;

    for (uint32_t i = 0;; i++) {
        // create a new file every gc cycle
        lfs3_file_t file;
        char name[256];
        sprintf(name, "purseweb%03x", i);
        int err = lfs3_file_open(&lfs3, &file, name,
                LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL);
        assert(!err || err == LFS3_ERR_NOSPC);
        if (err == LFS3_ERR_NOSPC) {
            break;
        }
        uint8_t wbuf[SIZE];
        for (lfs3_size_t j = 0; j < SIZE; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_ssize_t d = lfs3_file_write(&lfs3, &file, wbuf, SIZE);
        assert(d == SIZE || d == LFS3_ERR_NOSPC);
        if (d == LFS3_ERR_NOSPC) {
            lfs3_file_close(&lfs3, &file) => 0;
            break;
        }
        err = lfs3_file_close(&lfs3, &file);
        assert(!err || err == LFS3_ERR_NOSPC);
        if (err == LFS3_ERR_NOSPC) {
            break;
        }

        // gc!
        err = lfs3_fs_gc(&lfs3);
        assert(!err || err == LFS3_ERR_NOSPC);
        if (err == LFS3_ERR_NOSPC) {
            break;
        }
    }

    // check the contents of the files that were written
    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
        }

        // reset prng
        uint32_t prng = 42;

        // try to read
        for (uint32_t i = 0;; i++) {
            lfs3_file_t file;
            char name[256];
            sprintf(name, "purseweb%03x", i);
            int err = lfs3_file_open(&lfs3, &file, name, LFS3_O_RDONLY);
            assert(!err || err == LFS3_ERR_NOENT);
            if (err == LFS3_ERR_NOENT) {
                break;
            }

            uint8_t wbuf[SIZE];
            for (lfs3_size_t j = 0; j < SIZE; j++) {
                wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
            }
            uint8_t rbuf[SIZE];
            lfs3_file_read(&lfs3, &file, rbuf, SIZE) => SIZE;
            assert(memcmp(rbuf, wbuf, SIZE) == 0);
            lfs3_file_close(&lfs3, &file) => 0;
        }
    }

    lfs3_unmount(&lfs3) => 0;
'''



# test that gc with gc_steps=-1 returns, even on a full disk
#
# a call is bounded by the bytes it reads, progs, and erases, at most 10
# times the disk size
[cases.test_gc_steps_unbounded]
defines.MKCONSISTENT = [false, true]
defines.LOOKAHEAD = [false, true]
defines.PREERASE = [false, true]
defines.COMPACT = [false, true]
defines.CKMETA = [false, true]
defines.CKDATA = [false, true]
defines.GC_FLAGS = '''
    ((MKCONSISTENT) ? LFS3_GC_MKCONSISTENT : 0)
        | ((LOOKAHEAD) ? LFS3_GC_LOOKAHEAD : 0)
        | ((PREERASE) ? LFS3_IFDEF_PREERASE(LFS3_GC_PREERASE, -1) : 0)
        | ((COMPACT) ? LFS3_GC_COMPACT : 0)
        | ((CKMETA) ? LFS3_GC_CKMETA : 0)
        | ((CKDATA) ? LFS3_GC_CKDATA : 0)
'''
defines.GC_STEPS = -1
defines.GC_COMPACT_THRESH = [0, 'BLOCK_SIZE/2']
defines.SIZE = ['BLOCK_SIZE/2', '2*BLOCK_SIZE']
# operations after the first LFS3_ERR_NOSPC
defines.PAST = 100
defines.WORK_LIMIT = '10*BLOCK_COUNT*BLOCK_SIZE'
defines.SEED = 42
if = [
    'LFS3_IFDEF_PREERASE(true, !PREERASE)',
    'GBMAP || !PREERASE',
]
ifdef = 'LFS3_GC'
code = '''
    struct lfs3_cfg cfg = *CFG;
    cfg.read = test_gc_work_read;
    cfg.prog = test_gc_work_prog;
    cfg.erase = test_gc_work_erase;

    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                // note preerasing needs revperturb
                | ((PREERASE)
                    ? LFS3_IFDEF_PREERASE(LFS3_F_REVPERTURB, -1)
                    : 0)
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            &cfg) => 0;
    lfs3_mount(&lfs3,
            LFS3_M_RDWR
                // note preerasing needs revperturb
                | ((PREERASE)
                    ? LFS3_IFDEF_PREERASE(LFS3_M_REVPERTURB, -1)
                    : 0),
            &cfg) => 0;

    // gc, failing if a call does too much work, or leaves work another
    // call could do
    lfs3_size_t work_max = 0;
    #define TEST_GC_STEPS_GC() do { \
        test_gc_work = 0; \
        test_gc_work_limit = WORK_LIMIT; \
        int err_ = lfs3_fs_gc(&lfs3); \
        assert(!err_ || err_ == LFS3_ERR_NOSPC); \
        work_max = lfs3_max(work_max, test_gc_work); \
        test_gc_work_limit = -1; \
        struct lfs3_fsinfo fsinfo_; \
        assert(lfs3_fs_stat(&lfs3, &fsinfo_) == 0); \
        assert(err_ || !(fsinfo_.flags & GC_FLAGS)); \
    } while (0)

    // files map to the seed of their contents, 0 if removed
    uint32_t sim[1024];
    lfs3_size_t sim_size = 0;
    uint8_t wbuf[SIZE];
    #define TEST_GC_STEPS_WRITE(err, i, flags) do { \
        char name_[256]; \
        sprintf(name_, "file%03x", i); \
        uint32_t seed_ = TEST_PRNG(&prng); \
        uint32_t prng_ = seed_; \
        for (lfs3_size_t j_ = 0; j_ < SIZE; j_++) { \
            wbuf[j_] = 'a' + (TEST_PRNG(&prng_) % 26); \
        } \
        lfs3_file_t file_; \
        int err_ = lfs3_file_open(&lfs3, &file_, name_, \
                LFS3_O_WRONLY | (flags)); \
        assert(!err_ || err_ == LFS3_ERR_NOSPC); \
        if (!err_) { \
            lfs3_ssize_t d_ = lfs3_file_write(&lfs3, &file_, wbuf, SIZE); \
            assert(d_ == SIZE || d_ == LFS3_ERR_NOSPC); \
            err_ = lfs3_file_close(&lfs3, &file_); \
            assert(!err_ || err_ == LFS3_ERR_NOSPC); \
            if (d_ < 0) { \
                err_ = d_; \
            } \
        } \
        if (!err_) { \
            sim[i] = seed_; \
        } \
        (err) = err_; \
    } while (0)

    // fill the disk
    uint32_t prng = SEED;
    while (true) {
        assert(sim_size < 1024);
        int err;
        TEST_GC_STEPS_WRITE(err, sim_size, LFS3_O_CREAT | LFS3_O_EXCL);
        TEST_GC_STEPS_GC();
        if (err == LFS3_ERR_NOSPC) {
            break;
        }
        sim_size += 1;
    }

    // and keep going, removing, rewriting, and creating files
    lfs3_size_t created = sim_size;
    for (lfs3_size_t i = 0; i < PAST; i++) {
        uint32_t op = TEST_PRNG(&prng) % 3;
        uint32_t x = TEST_PRNG(&prng) % lfs3_max(sim_size, 1);
        if (op == 0 && sim_size > 0 && sim[x]) {
            char name[256];
            sprintf(name, "file%03x", x);
            int err = lfs3_remove(&lfs3, name);
            assert(!err || err == LFS3_ERR_NOSPC);
            if (!err) {
                sim[x] = 0;
            }
        } else if (op == 1 && sim_size > 0 && sim[x]) {
            int err;
            TEST_GC_STEPS_WRITE(err, x, LFS3_O_TRUNC);
            (void)err;
        } else if (created < 1024) {
            sim[created] = 0;
            int err;
            TEST_GC_STEPS_WRITE(err, created, LFS3_O_CREAT | LFS3_O_EXCL);
            if (!err) {
                created += 1;
                sim_size = created;
            }
        }
        TEST_GC_STEPS_GC();
    }
    printf("most work in one gc call: %"PRIu32" bytes, "
            "%"PRIu32" disks\n",
            work_max, work_max / (lfs3_size_t)(BLOCK_COUNT*BLOCK_SIZE));
    #undef TEST_GC_STEPS_GC
    #undef TEST_GC_STEPS_WRITE

    // check our files
    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;
        }

        for (lfs3_size_t i = 0; i < sim_size; i++) {
            char name[256];
            sprintf(name, "file%03x", i);
            if (!sim[i]) {
                struct lfs3_info info;
                lfs3_stat(&lfs3, name, &info) => LFS3_ERR_NOENT;
                continue;
            }

            uint32_t prng_ = sim[i];
            for (lfs3_size_t j = 0; j < SIZE; j++) {
                wbuf[j] = 'a' + (TEST_PRNG(&prng_) % 26);
            }
            lfs3_file_t file;
            uint8_t rbuf[SIZE];
            lfs3_file_open(&lfs3, &file, name, LFS3_O_RDONLY) => 0;
            lfs3_file_read(&lfs3, &file, rbuf, SIZE) => SIZE;
            assert(memcmp(rbuf, wbuf, SIZE) == 0);
            lfs3_file_close(&lfs3, &file) => 0;
        }

        lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
    }

    lfs3_unmount(&lfs3) => 0;
'''

# test that compaction stops when an mdir can't be compacted below
# gc_compact_thresh, here an mdir holding one large attribute
[cases.test_gc_compact_unshrinkable]
# METHOD=0 => lfs3_fs_ck
# METHOD=1 => lfs3_fs_gc, gc_steps=-1
# METHOD=2 => lfs3_fs_gc, gc_steps=1, until the flag clears
# METHOD=3 => lfs3_mount
defines.METHOD = [0, 1, 2, 3]
defines.GC_FLAGS = 'LFS3_GC_COMPACT'
defines.GC_STEPS = '(METHOD == 2) ? 1 : -1'
defines.GC_COMPACT_THRESH = 'BLOCK_SIZE/2'
# compacts to a bit more than gc_compact_thresh
defines.ASIZE = 'BLOCK_SIZE/2 + BLOCK_SIZE/32'
defines.WORK_LIMIT = '10*BLOCK_COUNT*BLOCK_SIZE'
if = '(METHOD != 1 && METHOD != 2) || LFS3_IFDEF_GC(true, false)'
code = '''
    struct lfs3_cfg cfg = *CFG;
    cfg.read = test_gc_work_read;
    cfg.prog = test_gc_work_prog;
    cfg.erase = test_gc_work_erase;

    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            &cfg) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;

    // one file with a large attribute, no split can get below it
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "spider",
            LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
    lfs3_file_close(&lfs3, &file) => 0;
    uint8_t abuf[ASIZE];
    memset(abuf, 'a', ASIZE);
    lfs3_setattr(&lfs3, "spider", 'a', abuf, ASIZE) => 0;

    // and some garbage, so compaction has something to reclaim
    for (lfs3_size_t i = 0; i < 64; i++) {
        uint8_t b = i;
        lfs3_setattr(&lfs3, "spider", 'b', &b, 1) => 0;
    }

    // expect dirty initial state or else our test doesn't work
    struct lfs3_fsinfo fsinfo;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags & LFS3_I_COMPACT);
    if (METHOD == 3) {
        lfs3_unmount(&lfs3) => 0;
    }

    // compact, failing if this does too much work
    test_gc_work = 0;
    test_gc_erases = 0;
    test_gc_work_limit = WORK_LIMIT;
    if (METHOD == 0) {
        lfs3_fs_ck(&lfs3, LFS3_CK_COMPACT) => 0;
    } else if (METHOD == 1 || METHOD == 2) {
        #ifdef LFS3_GC
        while (true) {
            lfs3_fs_gc(&lfs3) => 0;
            lfs3_fs_stat(&lfs3, &fsinfo) => 0;
            if (!(fsinfo.flags & LFS3_I_COMPACT)) {
                break;
            }
            assert(METHOD == 2);
        }
        #endif
    } else {
        lfs3_mount(&lfs3, LFS3_M_RDWR | LFS3_M_COMPACT, &cfg) => 0;
    }
    test_gc_work_limit = -1;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(!(fsinfo.flags & LFS3_I_COMPACT));
    // compacting at most once costs a few erases at most, splitting
    // relocates
    assert(test_gc_erases > 0);
    assert(test_gc_erases <= 6);

    // asking again should find nothing it can do
    lfs3_fs_unck(&lfs3, LFS3_GC_COMPACT) => 0;
    test_gc_erases = 0;
    test_gc_work_limit = WORK_LIMIT;
    lfs3_fs_ck(&lfs3, LFS3_CK_COMPACT) => 0;
    test_gc_work_limit = -1;
    assert(test_gc_erases == 0);
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(!(fsinfo.flags & LFS3_I_COMPACT));

    // check our attributes survived
    for (int remount = 0; remount < 2; remount++) {
        if (remount) {
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;
        }

        uint8_t rbuf[ASIZE];
        lfs3_getattr(&lfs3, "spider", 'a', rbuf, ASIZE) => ASIZE;
        assert(memcmp(rbuf, abuf, ASIZE) == 0);
        uint8_t b;
        lfs3_getattr(&lfs3, "spider", 'b', &b, 1) => 1;
        assert(b == 63);
        lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
    }

    lfs3_unmount(&lfs3) => 0;
'''



# test that lfs3_fs_ck, whose traversal lives on its stack, leaves no
# handle behind on any exit path, with other handles open
[cases.test_gc_ck_no_dangling]
defines.MKCONSISTENT = [false, true]
defines.LOOKAHEAD = [false, true]
defines.PREERASE = [false, true]
defines.COMPACT = [false, true]
# CK=0 => no checks
# CK=1 => LFS3_CK_CKMETA
# CK=2 => LFS3_CK_CKDATA
defines.CK = [0, 1, 2]
# FAULT=0 => no fault
# FAULT=1 => a flipped bit in each metadata block
# FAULT=2 => the nth read errors with LFS3_ERR_CORRUPT
# FAULT=3 => the nth prog errors with LFS3_ERR_IO
# FAULT=4 => the nth erase errors with LFS3_ERR_IO
# FAULT=5 => a full disk
defines.FAULT = [0, 1, 2, 3, 4, 5]
defines.GC_FLAGS = 'LFS3_GC_COMPACT'
defines.GC_STEPS = 1
defines.GC_COMPACT_THRESH = 'BLOCK_SIZE/2'
# faults tried per sweep
defines.SWEEP = 32
if = [
    'LFS3_IFDEF_PREERASE(true, !PREERASE)',
    'GBMAP || !PREERASE',
    'FAULT != 1 || CK != 0',
]
in = 'lfs3.c'
code = '''
    uint32_t flags
            = ((MKCONSISTENT) ? LFS3_CK_MKCONSISTENT : 0)
            | ((LOOKAHEAD) ? LFS3_CK_LOOKAHEAD : 0)
            | ((PREERASE) ? LFS3_IFDEF_PREERASE(LFS3_CK_PREERASE, -1) : 0)
            | ((COMPACT) ? LFS3_CK_COMPACT : 0)
            | ((CK == 1) ? LFS3_CK_CKMETA : 0)
            | ((CK == 2) ? LFS3_CK_CKDATA : 0);

    lfs3_emubd_op_t op = (FAULT == 2) ? LFS3_EMUBD_OP_READ
            : (FAULT == 3) ? LFS3_EMUBD_OP_PROG
            : LFS3_EMUBD_OP_ERASE;
    bool sweep = (FAULT >= 2 && FAULT <= 4);
    lfs3_emubd_sio_t ops = 0;
    for (uint32_t i = 0;; i++) {
        // start each pass from the same disk, so it does the same ops
        for (lfs3_block_t b = 0; b < BLOCK_COUNT; b++) {
            CFG->erase(CFG, b) => 0;
        }

        lfs3_t lfs3;
        lfs3_format(&lfs3,
                LFS3_F_RDWR
                    // note preerasing needs revperturb
                    | ((PREERASE)
                        ? LFS3_IFDEF_PREERASE(LFS3_F_REVPERTURB, -1)
                        : 0)
                    | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
                CFG) => 0;
        lfs3_mount(&lfs3,
                LFS3_M_RDWR
                    | ((PREERASE)
                        ? LFS3_IFDEF_PREERASE(LFS3_M_REVPERTURB, -1)
                        : 0),
                CFG) => 0;

        // make some work, files, orphans, and mutated blocks
        uint8_t wbuf[BLOCK_SIZE];
        memset(wbuf, 'a', BLOCK_SIZE);
        lfs3_size_t n = (FAULT == 5) ? BLOCK_COUNT : 8;
        for (lfs3_size_t j = 0; j < n; j++) {
            char name[256];
            sprintf(name, "file%03x", j);
            lfs3_file_t file;
            lfs3_file_open(&lfs3, &file, name,
                    LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
            lfs3_ssize_t d = lfs3_file_write(&lfs3, &file, wbuf, BLOCK_SIZE);
            assert(d == BLOCK_SIZE || d == LFS3_ERR_NOSPC);
            int err = lfs3_file_close(&lfs3, &file);
            assert(!err || err == LFS3_ERR_NOSPC);
            if (d < 0 || err) {
                break;
            }
        }
        lfs3_file_t orphans[3];
        for (lfs3_size_t j = 0; j < 3; j++) {
            char name[256];
            sprintf(name, "orphan%03x", j);
            int err = lfs3_file_open(&lfs3, &orphans[j], name,
                    LFS3_O_WRONLY
                        | LFS3_O_CREAT
                        | LFS3_O_EXCL
                        | LFS3_O_DESYNC);
            assert(!err || err == LFS3_ERR_NOSPC);
            if (err) {
                orphans[j].b.h.flags = 0;
            }
        }
        for (lfs3_size_t j = 0; j < 3; j++) {
            if (lfs3_handle_isopen(&lfs3, &orphans[j].b.h)) {
                lfs3_file_close(&lfs3, &orphans[j]) => 0;
            }
        }

        // keep a file, a dir, a traversal, and maybe gc open
        lfs3_file_t file;
        lfs3_file_open(&lfs3, &file, "file000", LFS3_O_RDWR) => 0;
        lfs3_file_write(&lfs3, &file, "hello", 5) => 5;
        lfs3_dir_t dir;
        lfs3_dir_open(&lfs3, &dir, "/") => 0;
        struct lfs3_info info;
        lfs3_dir_read(&lfs3, &dir, &info) => 0;
        lfs3_trv_t trv;
        lfs3_trv_open(&lfs3, &trv, LFS3_T_RDONLY) => 0;
        struct lfs3_tinfo tinfo;
        lfs3_trv_read(&lfs3, &trv, &tinfo) => 0;
        #ifdef LFS3_GC
        int err_ = lfs3_fs_gc(&lfs3);
        assert(!err_ || err_ == LFS3_ERR_NOSPC);
        #endif
        lfs3_handle_t *expected[4] = {
            &file.b.h,
            &dir.h,
            &trv.gc.t.h,
            LFS3_IFDEF_GC(&lfs3.gc.t.h, NULL),
        };

        // inject our fault
        if (FAULT == 1) {
            lfs3_mtrv_t mtrv;
            lfs3_mtrv_init(&mtrv, LFS3_T_RDONLY | LFS3_T_MTREEONLY);
            while (true) {
                lfs3_bptr_t bptr;
                lfs3_stag_t tag = lfs3_mtree_traverse(&lfs3, &mtrv, &bptr);
                assert(tag >= 0 || tag == LFS3_ERR_NOENT);
                if (tag == LFS3_ERR_NOENT) {
                    break;
                }
                if (tag == LFS3_TAG_MDIR) {
                    lfs3_mdir_t *mdir = (lfs3_mdir_t*)bptr.d.u.buffer;
                    lfs3_emubd_flipbit(CFG, mdir->r.blocks[0], 8*8+3) => 0;
                }
            }
        } else if (sweep) {
            // the first pass counts the ops of a fault-free lfs3_fs_ck,
            // later passes spread the sweep over them
            uint32_t nth = (i == 0)
                    ? 0x7fffffff
                    : 1 + ((i-1) * lfs3_max(ops, 1)) / SWEEP;
            lfs3_emubd_mkioerror(CFG, op, nth,
                    (FAULT == 2) ? LFS3_ERR_CORRUPT : LFS3_ERR_IO) => 0;
        }

        int err = lfs3_fs_ck(&lfs3, flags);
        assert(!err
                || err == LFS3_ERR_CORRUPT
                || err == LFS3_ERR_IO
                || err == LFS3_ERR_NOSPC);
        if (sweep && i == 0) {
            assert(!err);
            ops = 0x7fffffff - lfs3_emubd_ioerror(CFG, op);
        }
        lfs3_emubd_mkioerror(CFG, op, 0, 0) => 0;

        // only our own handles are open
        lfs3_size_t count = 0;
        for (lfs3_handle_t *h = lfs3.handles; h; h = h->next) {
            // a bit hacky, but this catches cycles
            assert(count < 4);
            bool found = false;
            for (lfs3_size_t j = 0; j < 4; j++) {
                if (h == expected[j]) {
                    found = true;
                }
            }
            assert(found);
            count += 1;
        }
        assert(lfs3_handle_isopen(&lfs3, &file.b.h));
        assert(lfs3_handle_isopen(&lfs3, &dir.h));
        assert(lfs3_handle_isopen(&lfs3, &trv.gc.t.h));

        // and they still close, our file may not be able to sync
        lfs3_file_desync(&lfs3, &file) => 0;
        lfs3_file_close(&lfs3, &file) => 0;
        lfs3_dir_close(&lfs3, &dir) => 0;
        lfs3_trv_close(&lfs3, &trv) => 0;
        lfs3_unmount(&lfs3) => 0;
        assert(test_malloc_live == 0);

        if (!sweep || i >= SWEEP || i >= (uint32_t)ops) {
            break;
        }
    }
'''


# many/fuzz tests mixed with GC
#

[cases.test_gc_spam_dir_many]
defines.MKCONSISTENT = [false, true]
defines.LOOKAHEAD = [false, true]
defines.PREERASE = [false, true]
defines.COMPACT = [false, true]
defines.CKMETA = [false, true]
defines.CKDATA = [false, true]
defines.UNCK = [false, true]
defines.GC_FLAGS = '''
    ((MKCONSISTENT) ? LFS3_GC_MKCONSISTENT : 0)
        | ((LOOKAHEAD) ? LFS3_GC_LOOKAHEAD : 0)
        | ((PREERASE) ? LFS3_IFDEF_PREERASE(LFS3_GC_PREERASE, -1) : 0)
        | ((COMPACT) ? LFS3_GC_COMPACT : 0)
        | ((CKMETA) ? LFS3_GC_CKMETA : 0)
        | ((CKDATA) ? LFS3_GC_CKDATA : 0)
'''
defines.GC_STEPS = [-1, 1, 2, 10, 100, 1000]
# set compact thresh to minimum
defines.GC_COMPACT_THRESH = 'BLOCK_SIZE/2'
defines.N = [1, 2, 4, 8, 16, 32, 64, 128, 256]
if = [
    'LFS3_IFDEF_PREERASE(true, !PREERASE)',
    'GBMAP || !PREERASE',
]
ifdef = 'LFS3_GC'
code = '''
    // test creating directories
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                // note preerasing needs revperturb
                | ((PREERASE)
                    ? LFS3_IFDEF_PREERASE(LFS3_F_REVPERTURB, -1)
                    : 0)
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;
    lfs3_mount(&lfs3,
            LFS3_M_RDWR
                // note preerasing needs revperturb
                | ((PREERASE)
                    ? LFS3_IFDEF_PREERASE(LFS3_M_REVPERTURB, -1)
                    : 0),
            CFG) => 0;

    // make this many directories
    for (lfs3_size_t i = 0; i < N; i++) {
        char name[256];
        sprintf(name, "dir%03x", i);
        int err = lfs3_mkdir(&lfs3, name);
        assert(!err || (TEST_PLS && err == LFS3_ERR_EXIST));

        // gc!
        lfs3_fs_gc(&lfs3) => 0;

        // unck to keep things interesting?
        if (UNCK) {
            lfs3_fs_unck(&lfs3, LFS3_I_CKMETA | LFS3_I_CKDATA) => 0;
        }
    }

    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDONLY, CFG) => 0;
        }

        // grm should be zero here
        assert(lfs3.grm_p[0] == 0);

        // check that our mkdir worked
        for (lfs3_size_t i = 0; i < N; i++) {
            char name[256];
            sprintf(name, "dir%03x", i);
            struct lfs3_info info;
            lfs3_stat(&lfs3, name, &info) => 0;
            assert(strcmp(info.name, name) == 0);
            assert(info.type == LFS3_TYPE_DIR);
            assert(info.size == 0);
        }

        lfs3_dir_t dir;
        lfs3_dir_open(&lfs3, &dir, "/") => 0;
        struct lfs3_info info;
        lfs3_dir_read(&lfs3, &dir, &info) => 0;
        assert(strcmp(info.name, ".") == 0);
        assert(info.type == LFS3_TYPE_DIR);
        assert(info.size == 0);
        lfs3_dir_read(&lfs3, &dir, &info) => 0;
        assert(strcmp(info.name, "..") == 0);
        assert(info.type == LFS3_TYPE_DIR);
        assert(info.size == 0);
        for (lfs3_size_t i = 0; i < N; i++) {
            char name[256];
            sprintf(name, "dir%03x", i);
            lfs3_dir_read(&lfs3, &dir, &info) => 0;
            assert(strcmp(info.name, name) == 0);
            assert(info.type == LFS3_TYPE_DIR);
            assert(info.size == 0);
        }
        lfs3_dir_read(&lfs3, &dir, &info) => LFS3_ERR_NOENT;
        lfs3_dir_close(&lfs3, &dir) => 0;

        for (lfs3_size_t i = 0; i < N; i++) {
            char name[256];
            sprintf(name, "dir%03x", i);
            lfs3_dir_open(&lfs3, &dir, name) => 0;
            lfs3_dir_read(&lfs3, &dir, &info) => 0;
            assert(strcmp(info.name, ".") == 0);
            assert(info.type == LFS3_TYPE_DIR);
            assert(info.size == 0);
            lfs3_dir_read(&lfs3, &dir, &info) => 0;
            assert(strcmp(info.name, "..") == 0);
            assert(info.type == LFS3_TYPE_DIR);
            assert(info.size == 0);
            lfs3_dir_read(&lfs3, &dir, &info) => LFS3_ERR_NOENT;
            lfs3_dir_close(&lfs3, &dir) => 0;
        }
    }

    lfs3_unmount(&lfs3) => 0;
