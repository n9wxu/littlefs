# test that gc work clears flags in lfs3_fs_stat
[cases.test_gc_iflags]
# AFTER=0 => after running lfs3_fs_gc
# AFTER=1 => after running lfs3_trv_t
# AFTER=2 => after explicit operations
# AFTER=3 => after remounting
defines.AFTER = [0, 1, 2, 3]
defines.MKCONSISTENT = [false, true]
defines.LOOKAHEAD = [false, true]
defines.PREERASE = [false, true]
defines.COMPACT = [false, true]
defines.CKMETA = [false, true]
defines.CKDATA = [false, true]
defines.GC_FLAGS = '''
    ((MKCONSISTENT) ? LFS3_GC_MKCONSISTENT : 0)
        | ((LOOKAHEAD) ? LFS3_GC_LOOKAHEAD : 0)
        | ((PREERASE) ? LFS3_IFDEF_PREERASE(LFS3_GC_PREERASE, -1) : 0)
        | ((COMPACT) ? LFS3_GC_COMPACT : 0)
        | ((CKMETA) ? LFS3_GC_CKMETA : 0)
        | ((CKDATA) ? LFS3_GC_CKDATA : 0)
'''
defines.GC_STEPS = -1
defines.N = [1, 2, 4, 8, 16, 32, 64]
defines.SIZE = [
    '0',
    'FCACHE_SIZE/2',
    '2*FCACHE_SIZE',
    'BLOCK_SIZE/2',
    'BLOCK_SIZE',
    '2*BLOCK_SIZE',
    '8*BLOCK_SIZE',
]
if = [
    '(SIZE*N)/BLOCK_SIZE <= 32',
    'LFS3_IFDEF_GC(true, AFTER != 0)',
    'LFS3_IFDEF_PREERASE(true, !PREERASE)',
    'GBMAP || !PREERASE',
    # lfs3_trv_t doesn't make progress on this
    '!PREERASE || AFTER != 1',
]
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                // note preerasing needs revperturb
                | ((PREERASE)
                    ? LFS3_IFDEF_PREERASE(LFS3_F_REVPERTURB, -1)
                    : 0)
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;
    lfs3_mount(&lfs3,
            LFS3_M_RDWR
                // note preerasing needs revperturb
                | ((PREERASE)
                    ? LFS3_IFDEF_PREERASE(LFS3_M_REVPERTURB, -1)
                    : 0),
            CFG) => 0;

    // create an interesting filesystem
    uint32_t prng = 42;
    for (lfs3_size_t i = 0; i < N; i++) {
        char name[256];
        sprintf(name, "squid%03x", i);

        uint8_t wbuf[lfs3_max(SIZE, 1)];
        for (lfs3_size_t j = 0; j < SIZE; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }

        lfs3_file_t file;
        lfs3_file_open(&lfs3, &file, name,
                LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
        lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
        lfs3_file_close(&lfs3, &file) => 0;
    }

    // remount to reset flags
    lfs3_unmount(&lfs3) => 0;
    lfs3_mount(&lfs3,
            LFS3_M_RDWR
                // note preerasing needs revperturb
                | ((PREERASE)
                    ? LFS3_IFDEF_PREERASE(LFS3_M_REVPERTURB, -1)
                    : 0),
            CFG) => 0;

    // check that flags were reset
    struct lfs3_fsinfo fsinfo;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags == (
            LFS3_IFYES_REVPERTURB(
                    LFS3_I_REVPERTURB,
                    (PREERASE) ? LFS3_I_REVPERTURB : 0,
                    0)
                | LFS3_IFYES_REVNOISE(LFS3_I_REVNOISE, 0, 0)
                | LFS3_I_MKCONSISTENT
                | ((!GBMAP || (fsinfo.flags & LFS3_I_LOOKAHEAD))
                    ? LFS3_I_LOOKAHEAD
                    : 0)
                | LFS3_IFDEF_PREERASE((GBMAP) ? LFS3_I_PREERASE : 0, 0)
                | LFS3_I_COMPACT
                | LFS3_I_CKMETA
                | LFS3_I_CKDATA
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_I_GBMAP, -1) : 0)));

    // run gc
    if (AFTER == 0) {
        #ifdef LFS3_GC
        lfs3_fs_gc(&lfs3) => 0;
        #else
        assert(false);
        #endif

    // run lfs3_trv_t
