# Many tests already test the internal machinery under powerloss, these
# tests are more interested in running the filesystem under
# difficult/weird powerloss environments
#
# Try to keep these below O(n^2), which can be tricky
after = [
    'test_mtree',
    'test_dirs',
    'test_files',
    'test_stickynotes',
    'test_trvs',
    'test_gc',
    'test_mount',
    'test_ck',
    'test_compat',
]

# helpers for test_powerloss_metastable
code = '''
#include <setjmp.h>

// power-loss cases here longjmp back into their own loops, and nothing
// they read after the jump changes between setjmp and longjmp, which
// gcc's -Wclobbered can't see
#if defined(__GNUC__) && !defined(__clang__)
#pragma GCC diagnostic ignored "-Wclobbered"
#endif

// a powerloss callback that abandons the interrupted operation, the way
// the linear runner does
__attribute__((unused))
static void test_powerloss_longjmp(void *data) {
    TEST_LOCK_POWERLOSS();
    longjmp(*(jmp_buf*)data, 1);
}

// one op of test_powerloss_metastable's workload
typedef struct test_metastable_op {
    uint8_t op;
    lfs3_off_t off;
    lfs3_size_t chunk;
    lfs3_off_t size;
    uint8_t dop;
    bool grow;
} test_metastable_op_t;

// draw the next op for a file, applying it to the file's sim if sim is
// not NULL, the prng advances the same either way
__attribute__((unused))
static void test_metastable_op(uint32_t *prng,
        lfs3_size_t size, lfs3_size_t chunk,
        uint8_t *sim, lfs3_off_t *sim_size,
        test_metastable_op_t *o) {
    o->op = TEST_PRNG(prng) % 4;
    // write?
    if (o->op <= 1) {
        o->off = TEST_PRNG(prng) % (size - chunk);
        o->chunk = 1 + (TEST_PRNG(prng) % chunk);
        for (lfs3_size_t j = 0; j < o->chunk; j++) {
            uint8_t c = 'a' + (TEST_PRNG(prng) % 26);
            if (sim) {
                if (j == 0 && o->off > *sim_size) {
                    memset(&sim[*sim_size], 0, o->off - *sim_size);
                }
                sim[o->off+j] = c;
            }
        }
        if (sim) {
            *sim_size = lfs3_max(*sim_size, o->off + o->chunk);
        }
    // truncate?
    } else if (o->op == 2) {
        o->size = TEST_PRNG(prng) % (size+1);
        if (sim) {
            if (o->size > *sim_size) {
                memset(&sim[*sim_size], 0, o->size - *sim_size);
            }
            *sim_size = o->size;
        }
    // fruncate?
    } else {
        o->size = TEST_PRNG(prng) % (size+1);
        if (sim) {
            if (o->size > *sim_size) {
                memmove(&sim[o->size - *sim_size], sim, *sim_size);
                memset(sim, 0, o->size - *sim_size);
            } else {
                memmove(sim, &sim[*sim_size - o->size], o->size);
            }
            *sim_size = o->size;
        }
    }
    // also move a directory around, and grow every so often
    o->dop = TEST_PRNG(prng) % 4;
    o->grow = (TEST_PRNG(prng) % 8 == 0);
}

// what was running when a power loss left a block metastable, a
// bitmask so callers can choose which ones they excuse
#define TEST_METASTABLE_SESSION 0x1 // write/truncate/fruncate/sync
#define TEST_METASTABLE_OP      0x2 // open, close, namespace, grow
#define TEST_METASTABLE_MOUNT   0x4 // mount and its repairs

// record what left each metastable block metastable, emubd keeps one
// metastable bit per block until the block is erased, and returns
// whether any still-metastable block was left by an op in mask
__attribute__((unused))
static bool test_metastable_exposed(const struct lfs3_cfg *cfg,
        uint8_t op, uint8_t *ops, lfs3_ssize_t *bits, uint8_t mask) {
    bool exposed = false;
    for (lfs3_block_t b = 0; b < cfg->block_count; b++) {
        if (lfs3_emubd_metastable(cfg, b)) {
            lfs3_ssize_t bit = lfs3_emubd_badbit(cfg, b);
            if (!ops[b] || bits[b] != bit) {
                ops[b] = op;
                bits[b] = bit;
            }
            exposed |= (ops[b] & mask) != 0;
        } else {
            ops[b] = 0;
        }
    }
    return exposed;
}

// rebuild every file as of its step, returns the number of ops if the
// steps are a prefix of our ops, -1 if not, and -2 if a step is not
// one of our ops at all
__attribute__((unused))
static lfs3_ssize_t test_metastable_replay(uint32_t seed,
        lfs3_size_t n, lfs3_size_t ops, lfs3_size_t size, lfs3_size_t chunk,
        const uint32_t *steps,
        uint8_t *sims, lfs3_off_t *sim_sizes, uint32_t *prng_) {
    uint32_t prng = seed;
    uint32_t counts[n];
    lfs3_size_t total = 0;
    for (lfs3_size_t x = 0; x < n; x++) {
        counts[x] = 0;
        sim_sizes[x] = 0;
        total += steps[x];
    }

    lfs3_ssize_t k_ = -1;
    bool prefix = true;
    lfs3_size_t done = 0;
    for (lfs3_size_t k = 0; k < ops && done < total; k++) {
        lfs3_size_t x = TEST_PRNG(&prng) % n;
        bool apply = counts[x] < steps[x];
        test_metastable_op_t o;
        test_metastable_op(&prng, size, chunk,
                (apply) ? &sims[x*size] : NULL, &sim_sizes[x],
                &o);
        if (apply) {
            counts[x] += 1;
            done += 1;
        } else {
            prefix = false;
        }
    }
    if (done < total) {
        return -2;
    }
    if (prefix) {
        k_ = total;
        *prng_ = prng;
    }
    return k_;
}
'''


# Create many dirs under powerloss
#
# We always make progress so this should be O(n) progs, (but maybe
# O(n^2) reads)
#
[cases.test_powerloss_spam_dir_many]
defines.POWERLOSS_BEHAVIOR = [
    'LFS3_EMUBD_POWERLOSS_ATOMIC',
    'LFS3_EMUBD_POWERLOSS_SOMEBITS',
    'LFS3_EMUBD_POWERLOSS_MOSTBITS',
    'LFS3_EMUBD_POWERLOSS_OOO',
    'LFS3_EMUBD_POWERLOSS_TORNTAIL',
]
defines.MKCONSISTENT = [false, true]
defines.N = [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]
reentrant = true
code = '''
    // format once per test
    lfs3_t lfs3;
    int err = lfs3_mount(&lfs3, LFS3_M_RDWR, CFG);
    if (err) {
        lfs3_format(&lfs3, LFS3_F_RDWR, CFG) => 0;
        lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
    }
    if (MKCONSISTENT) {
        lfs3_fs_mkconsistent(&lfs3) => 0;
    }

    // make this many directories
    for (lfs3_size_t i = 0; i < N; i++) {
        char name[256];
        sprintf(name, "dir%03x", i);
        err = lfs3_mkdir(&lfs3, name);
        assert(!err || (TEST_PLS && err == LFS3_ERR_EXIST));
    }

    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
        }

        // grm should be zero here
        assert(lfs3.grm_p[0] == 0);

        // check that our mkdir worked
        for (lfs3_size_t i = 0; i < N; i++) {
            char name[256];
            sprintf(name, "dir%03x", i);
            struct lfs3_info info;
            lfs3_stat(&lfs3, name, &info) => 0;
            assert(strcmp(info.name, name) == 0);
            assert(info.type == LFS3_TYPE_DIR);
            assert(info.size == 0);
        }

        lfs3_dir_t dir;
        lfs3_dir_open(&lfs3, &dir, "/") => 0;
        struct lfs3_info info;
        lfs3_dir_read(&lfs3, &dir, &info) => 0;
        assert(strcmp(info.name, ".") == 0);
        assert(info.type == LFS3_TYPE_DIR);
        assert(info.size == 0);
        lfs3_dir_read(&lfs3, &dir, &info) => 0;
        assert(strcmp(info.name, "..") == 0);
        assert(info.type == LFS3_TYPE_DIR);
        assert(info.size == 0);
        for (lfs3_size_t i = 0; i < N; i++) {
            char name[256];
            sprintf(name, "dir%03x", i);
            lfs3_dir_read(&lfs3, &dir, &info) => 0;
            assert(strcmp(info.name, name) == 0);
            assert(info.type == LFS3_TYPE_DIR);
            assert(info.size == 0);
        }
        lfs3_dir_read(&lfs3, &dir, &info) => LFS3_ERR_NOENT;
        lfs3_dir_close(&lfs3, &dir) => 0;

        for (lfs3_size_t i = 0; i < N; i++) {
            char name[256];
            sprintf(name, "dir%03x", i);
            lfs3_dir_open(&lfs3, &dir, name) => 0;
            lfs3_dir_read(&lfs3, &dir, &info) => 0;
            assert(strcmp(info.name, ".") == 0);
            assert(info.type == LFS3_TYPE_DIR);
            assert(info.size == 0);
            lfs3_dir_read(&lfs3, &dir, &info) => 0;
            assert(strcmp(info.name, "..") == 0);
            assert(info.type == LFS3_TYPE_DIR);
            assert(info.size == 0);
            lfs3_dir_read(&lfs3, &dir, &info) => LFS3_ERR_NOENT;
            lfs3_dir_close(&lfs3, &dir) => 0;
        }
    }

    lfs3_unmount(&lfs3) => 0;
'''

# Create many files under powerloss
#
# We always make progress so this should be O(n) progs, (but maybe
# O(n^2) reads)
#
[cases.test_powerloss_spam_file_many]
defines.POWERLOSS_BEHAVIOR = [
    'LFS3_EMUBD_POWERLOSS_ATOMIC',
    'LFS3_EMUBD_POWERLOSS_SOMEBITS',
    'LFS3_EMUBD_POWERLOSS_MOSTBITS',
    'LFS3_EMUBD_POWERLOSS_OOO',
    'LFS3_EMUBD_POWERLOSS_TORNTAIL',
]
defines.MKCONSISTENT = [false, true]
# inlining has a tendency to hide sync issues, so try without
defines.SHRUB_SIZE = ['BLOCK_SIZE/4', '0']
defines.N = [1, 2, 4, 8, 16, 32, 64]
defines.SIZE = [
    '0',
    'FCACHE_SIZE/2',
    '2*FCACHE_SIZE',
    'BLOCK_SIZE/2',
    'BLOCK_SIZE',
    '2*BLOCK_SIZE',
    '4*BLOCK_SIZE',
]
if = '(SIZE*N)/BLOCK_SIZE <= 32'
reentrant = true
code = '''
    // format once per test
    lfs3_t lfs3;
    int err = lfs3_mount(&lfs3, LFS3_M_RDWR, CFG);
    if (err) {
        lfs3_format(&lfs3, LFS3_F_RDWR, CFG) => 0;
        lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
    }
    if (MKCONSISTENT) {
        lfs3_fs_mkconsistent(&lfs3) => 0;
    }

    // create this many files
    uint32_t prng = 42;
    for (lfs3_size_t i = 0; i < N; i++) {
        char name[256];
        sprintf(name, "amethyst%03x", i);

        uint8_t wbuf[lfs3_max(SIZE, 1)];
        for (lfs3_size_t j = 0; j < SIZE; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }

        lfs3_file_t file;
        err = lfs3_file_open(&lfs3, &file, name,
                LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL);
        assert(!err || (TEST_PLS && err == LFS3_ERR_EXIST));
        if (!err) {
            lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
            lfs3_file_close(&lfs3, &file) => 0;
        }
    }

    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
        }

        // check that our writes worked
        prng = 42;
        for (lfs3_size_t i = 0; i < N; i++) {
            // check with stat
            char name[256];
            sprintf(name, "amethyst%03x", i);
            struct lfs3_info info;
            lfs3_stat(&lfs3, name, &info) => 0;
            assert(strcmp(info.name, name) == 0);
            assert(info.type == LFS3_TYPE_REG);
            assert(info.size == SIZE);

            // try reading the file, note we reset prng above
            uint8_t wbuf[lfs3_max(SIZE, 1)];
            for (lfs3_size_t j = 0; j < SIZE; j++) {
                wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
            }

            lfs3_file_t file;
            uint8_t rbuf[lfs3_max(SIZE, 1)];
            lfs3_file_open(&lfs3, &file, name, LFS3_O_RDONLY) => 0;
            lfs3_file_read(&lfs3, &file, rbuf, SIZE) => SIZE;
            assert(memcmp(rbuf, wbuf, SIZE) == 0);
            lfs3_file_close(&lfs3, &file) => 0;
        }
    }

    lfs3_unmount(&lfs3) => 0;
'''

# A general purpose powerloss fuzz test
#
# Under powerloss, we can't really keep track of a sim reliably/
# efficiently, instead just do random operations, store a counter in a
# special file so we know how much progress has been made, and hope for
# the best. Most likely an internal assert will trigger if anything goes
# wrong.
#
[cases.test_powerloss_spam_f_pl_fuzz]
defines.POWERLOSS_BEHAVIOR = [
    'LFS3_EMUBD_POWERLOSS_ATOMIC',
    'LFS3_EMUBD_POWERLOSS_SOMEBITS',
    'LFS3_EMUBD_POWERLOSS_MOSTBITS',
    'LFS3_EMUBD_POWERLOSS_OOO',
    'LFS3_EMUBD_POWERLOSS_TORNTAIL',
]
defines.MKCONSISTENT = [false, true]
# inlining has a tendency to hide sync issues, so try without
defines.SHRUB_SIZE = ['BLOCK_SIZE/4', '0']
defines.N = [1, 2, 4, 8, 16, 32, 64]
defines.OPS = 256
defines.SIZE = [
    '0',
    'FCACHE_SIZE/2',
    '2*FCACHE_SIZE',
    'BLOCK_SIZE/2',
    'BLOCK_SIZE',
    '2*BLOCK_SIZE',
    '4*BLOCK_SIZE',
]
defines.SEED = 'range(10)'
fuzz = 'SEED'
if = '(SIZE*N)/BLOCK_SIZE <= 16'
reentrant = true
code = '''
    // format once per test
    lfs3_t lfs3;
    int err = lfs3_mount(&lfs3, LFS3_M_RDWR, CFG);
    if (err) {
        lfs3_format(&lfs3, LFS3_F_RDWR, CFG) => 0;
        lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
    }
    if (MKCONSISTENT) {
        lfs3_fs_mkconsistent(&lfs3) => 0;
    }

    // keep some test state on disk to survive powerloss
    typedef struct fuzz_state {
        lfs3_size_t i;
        uint32_t prng;
    } fuzz_state_t;
    fuzz_state_t state = {.i = 0, .prng = SEED};

    lfs3_file_t state_file;
    lfs3_file_open(&lfs3, &state_file,
            "state", LFS3_O_RDWR | LFS3_O_CREAT) => 0;
    lfs3_ssize_t d = lfs3_file_read(&lfs3, &state_file, &state, sizeof(state));
    assert(d == 0 || d == sizeof(state));

    // keep test files in a separate directory
    err = lfs3_mkdir(&lfs3, "test");
    assert(!err || err == LFS3_ERR_EXIST);

    uint32_t prng = state.prng;
    for (lfs3_size_t i = state.i; i < OPS; i++) {
        // choose which operation to do
        uint8_t op = TEST_PRNG(&prng) % 3;

        // how many files do we have?
        lfs3_size_t count = 0;
        lfs3_dir_t dir;
        lfs3_dir_open(&lfs3, &dir, "test") => 0;
        struct lfs3_info info;
        lfs3_dir_read(&lfs3, &dir, &info) => 0;
        assert(strcmp(info.name, ".") == 0);
        assert(info.type == LFS3_TYPE_DIR);
        assert(info.size == 0);
        lfs3_dir_read(&lfs3, &dir, &info) => 0;
        assert(strcmp(info.name, "..") == 0);
        assert(info.type == LFS3_TYPE_DIR);
        assert(info.size == 0);
        while (true) {
            int err = lfs3_dir_read(&lfs3, &dir, &info);
            assert(!err || err == LFS3_ERR_NOENT);
            if (err == LFS3_ERR_NOENT) {
                break;
            }
            assert(strlen(info.name) == strlen("amethyst..."));
            assert(memcmp(info.name, "amethyst", strlen("amethyst")) == 0);
            assert(info.type == LFS3_TYPE_REG);
            assert(info.size == SIZE);
            count++;
        }
        lfs3_dir_close(&lfs3, &dir) => 0;

        // creating a new file?
        if (op == 0 || count == 0) {
            // choose a pseudo-random number
            lfs3_size_t x = TEST_PRNG(&prng) % N;
            uint32_t wprng = TEST_PRNG(&prng);

            // create a file here
            char name[256];
            sprintf(name, "test/amethyst%03x", x);
            uint8_t wbuf[lfs3_max(SIZE, 1)];
            uint8_t ck = 0;
            for (lfs3_size_t j = 0; j < SIZE-1; j++) {
                wbuf[j] = 'a' + (TEST_PRNG(&wprng) % 26);
                ck = (ck + (wbuf[j] - 'a')) % 26;
            }
            // make the sum equal to 'a' mod 26
            if (SIZE > 0) {
                wbuf[SIZE-1] = 'a' + ((26 - ck) % 26);
            }

            lfs3_file_t file;
            lfs3_file_open(&lfs3, &file, name,
                    LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_TRUNC) => 0;
            lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
            lfs3_file_close(&lfs3, &file) => 0;

        // deleting a file?
        } else if (op == 1) {
            // choose a random file to delete
            lfs3_size_t j = TEST_PRNG(&prng) % count;
            // find the file
            lfs3_dir_open(&lfs3, &dir, "test") => 0;
            lfs3_dir_read(&lfs3, &dir, &info) => 0;
            lfs3_dir_read(&lfs3, &dir, &info) => 0;
            for (lfs3_size_t k = 0; k <= j; k++) {
                lfs3_dir_read(&lfs3, &dir, &info) => 0;
            }
            lfs3_dir_close(&lfs3, &dir) => 0;

            // delete this file
            char name[256];
            assert(strlen(info.name) == strlen("amethyst..."));
            sprintf(name, "test/%s", info.name);
            lfs3_remove(&lfs3, name) => 0;

        // renaming a file?
        } else {
            // choose a random file to rename, and a random number to
            // rename to
            lfs3_size_t j = TEST_PRNG(&prng) % count;
            lfs3_size_t y = TEST_PRNG(&prng) % N;
            // find the file
            lfs3_dir_open(&lfs3, &dir, "test") => 0;
            lfs3_dir_read(&lfs3, &dir, &info) => 0;
            lfs3_dir_read(&lfs3, &dir, &info) => 0;
            for (lfs3_size_t k = 0; k <= j; k++) {
                lfs3_dir_read(&lfs3, &dir, &info) => 0;
            }
            lfs3_dir_close(&lfs3, &dir) => 0;

            // rename this file
            char old_name[256];
            assert(strlen(info.name) == strlen("amethyst..."));
            sprintf(old_name, "test/%s", info.name);
            char new_name[256];
            sprintf(new_name, "test/amethyst%03x", y);
            lfs3_rename(&lfs3, old_name, new_name) => 0;
        }

        // update our state file
        state.i = i;
        state.prng = prng;
        lfs3_file_rewind(&lfs3, &state_file) => 0;
        lfs3_file_write(&lfs3, &state_file, &state, sizeof(state))
                => sizeof(state);
        lfs3_file_sync(&lfs3, &state_file) => 0;
    }

    // go ahead and close our state file in case we remount
    lfs3_file_close(&lfs3, &state_file) => 0;

    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
        }

        // check that things look more-or-less ok
        lfs3_dir_t dir;
        lfs3_dir_open(&lfs3, &dir, "test") => 0;
        struct lfs3_info info;
        lfs3_dir_read(&lfs3, &dir, &info) => 0;
        assert(strcmp(info.name, ".") == 0);
        assert(info.type == LFS3_TYPE_DIR);
        assert(info.size == 0);
        lfs3_dir_read(&lfs3, &dir, &info) => 0;
        assert(strcmp(info.name, "..") == 0);
        assert(info.type == LFS3_TYPE_DIR);
        assert(info.size == 0);
        while (true) {
            int err = lfs3_dir_read(&lfs3, &dir, &info);
            assert(!err || err == LFS3_ERR_NOENT);
            if (err == LFS3_ERR_NOENT) {
                break;
            }
            assert(strlen(info.name) == strlen("amethyst..."));
            assert(memcmp(info.name, "amethyst", strlen("amethyst")) == 0);
            assert(info.type == LFS3_TYPE_REG);
            assert(info.size == SIZE);

            // at least try to read the files
            char name[256];
            sprintf(name, "test/%s", info.name);
            lfs3_file_t file;
            lfs3_file_open(&lfs3, &file, name, LFS3_O_RDONLY) => 0;

            uint8_t rbuf[lfs3_max(SIZE, 1)];
            lfs3_file_read(&lfs3, &file, rbuf, SIZE) => SIZE;
            // all data should be lowercase ascii
            for (lfs3_size_t j = 0; j < SIZE; j++) {
                assert(rbuf[j] >= 'a' && rbuf[j] <= 'z');
            }
            // sum should be equal to 'a' mod 26
            uint8_t ck = 0;
            for (lfs3_size_t j = 0; j < SIZE; j++) {
                ck = (ck + (rbuf[j] - 'a')) % 26;
            }
            assert(ck == 0);
            lfs3_file_close(&lfs3, &file) => 0;
        }
        lfs3_dir_close(&lfs3, &dir) => 0;
    }

    lfs3_unmount(&lfs3) => 0;
'''

# A general purpose powerloss fuzz test, with directories!
#
# Under powerloss, we can't really keep track of a sim reliably/
# efficiently, instead just do random operations, store a counter in a
# special file so we know how much progress has been made, and hope for
# the best. Most likely an internal assert will trigger if anything goes
# wrong.
#
[cases.test_powerloss_spam_fd_pl_fuzz]
defines.POWERLOSS_BEHAVIOR = [
    'LFS3_EMUBD_POWERLOSS_ATOMIC',
    'LFS3_EMUBD_POWERLOSS_SOMEBITS',
    'LFS3_EMUBD_POWERLOSS_MOSTBITS',
    'LFS3_EMUBD_POWERLOSS_OOO',
    'LFS3_EMUBD_POWERLOSS_TORNTAIL',
]
defines.MKCONSISTENT = [false, true]
# inlining has a tendency to hide sync issues, so try without
defines.SHRUB_SIZE = ['BLOCK_SIZE/4', '0']
# note dirs x files grows O(n^2)
defines.N = [1, 2, 4, 8]
defines.M = 'N'
defines.OPS = 256
defines.SIZE = [
    '0',
    'FCACHE_SIZE/2',
    '2*FCACHE_SIZE',
    'BLOCK_SIZE/2',
    'BLOCK_SIZE',
    '2*BLOCK_SIZE',
    '4*BLOCK_SIZE',
]
defines.SEED = 'range(10)'
fuzz = 'SEED'
if = '(SIZE*N)/BLOCK_SIZE <= 16'
reentrant = true
code = '''
    // format once per test
    lfs3_t lfs3;
    int err = lfs3_mount(&lfs3, LFS3_M_RDWR, CFG);
    if (err) {
        lfs3_format(&lfs3, LFS3_F_RDWR, CFG) => 0;
        lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
    }
    if (MKCONSISTENT) {
        lfs3_fs_mkconsistent(&lfs3) => 0;
    }

    // keep some test state on disk to survive powerloss
    typedef struct fuzz_state {
        lfs3_size_t i;
        uint32_t prng;
    } fuzz_state_t;
    fuzz_state_t state = {.i = 0, .prng = SEED};

    lfs3_file_t state_file;
    lfs3_file_open(&lfs3, &state_file,
            "state", LFS3_O_RDWR | LFS3_O_CREAT) => 0;
    lfs3_ssize_t d = lfs3_file_read(&lfs3, &state_file, &state, sizeof(state));
    assert(d == 0 || d == sizeof(state));

    // keep test files in a separate directory
    err = lfs3_mkdir(&lfs3, "test");
    assert(!err || err == LFS3_ERR_EXIST);

    uint32_t prng = state.prng;
    for (lfs3_size_t i = state.i; i < OPS; i++) {
        // choose which operation to do
        uint8_t op = TEST_PRNG(&prng) % 6;

        // how many dirs do we have?
        lfs3_size_t dir_count = 0;
        lfs3_dir_t dir;
        lfs3_dir_open(&lfs3, &dir, "test") => 0;
        struct lfs3_info info;
        lfs3_dir_read(&lfs3, &dir, &info) => 0;
        assert(strcmp(info.name, ".") == 0);
        assert(info.type == LFS3_TYPE_DIR);
        assert(info.size == 0);
        lfs3_dir_read(&lfs3, &dir, &info) => 0;
        assert(strcmp(info.name, "..") == 0);
        assert(info.type == LFS3_TYPE_DIR);
        assert(info.size == 0);
        while (true) {
            int err = lfs3_dir_read(&lfs3, &dir, &info);
            assert(!err || err == LFS3_ERR_NOENT);
            if (err == LFS3_ERR_NOENT) {
                break;
            }
            assert(strlen(info.name) == strlen("quartz..."));
            assert(memcmp(info.name, "quartz", strlen("quartz")) == 0);
            assert(info.type == LFS3_TYPE_DIR);
            assert(info.size == 0);
            dir_count++;
        }
        lfs3_dir_close(&lfs3, &dir) => 0;

        // dir op?
        if (op < 3 || dir_count == 0) {
            // creating a new dir?
            if (op == 0 || dir_count == 0) {
                // choose a pseudo-random number
                lfs3_size_t x = TEST_PRNG(&prng) % N;

                // create a dir here
                char name[256];
                sprintf(name, "test/quartz%03x", x);
                int err = lfs3_mkdir(&lfs3, name);
                assert(!err || err == LFS3_ERR_EXIST);

            // deleting a dir?
            } else if (op == 1) {
                // choose a random dir to delete
                lfs3_size_t j = TEST_PRNG(&prng) % dir_count;
                // find the dir
                lfs3_dir_open(&lfs3, &dir, "test") => 0;
                lfs3_dir_read(&lfs3, &dir, &info) => 0;
                lfs3_dir_read(&lfs3, &dir, &info) => 0;
                for (lfs3_size_t k = 0; k <= j; k++) {
                    lfs3_dir_read(&lfs3, &dir, &info) => 0;
                }
                lfs3_dir_close(&lfs3, &dir) => 0;

                // try to delete this dir, ignore non-empty dirs!
                char name[256];
                assert(strlen(info.name) == strlen("quartz..."));
                sprintf(name, "test/%s", info.name);
                int err = lfs3_remove(&lfs3, name);
                assert(!err || err == LFS3_ERR_NOTEMPTY);

            // renaming a dir?
            } else {
                // choose a random dir to rename, and a random number to
                // rename to
                lfs3_size_t j = TEST_PRNG(&prng) % dir_count;
                lfs3_size_t y = TEST_PRNG(&prng) % N;
                // find the dir
                lfs3_dir_open(&lfs3, &dir, "test") => 0;
                lfs3_dir_read(&lfs3, &dir, &info) => 0;
                lfs3_dir_read(&lfs3, &dir, &info) => 0;
                for (lfs3_size_t k = 0; k <= j; k++) {
                    lfs3_dir_read(&lfs3, &dir, &info) => 0;
                }
                lfs3_dir_close(&lfs3, &dir) => 0;

                // rename this dir, ignore conflicts!
                char old_name[256];
                assert(strlen(info.name) == strlen("quartz..."));
                sprintf(old_name, "test/%s", info.name);
                char new_name[256];
                sprintf(new_name, "test/quartz%03x", y);
                int err = lfs3_rename(&lfs3, old_name, new_name);
                assert(!err || err == LFS3_ERR_NOTEMPTY);
            }

        // file op?
        } else {
            // choose a pseudo-random dir
            lfs3_size_t dir_i = TEST_PRNG(&prng) % dir_count;
            // find the dir
            lfs3_dir_open(&lfs3, &dir, "test") => 0;
            lfs3_dir_read(&lfs3, &dir, &info) => 0;
            lfs3_dir_read(&lfs3, &dir, &info) => 0;
            for (lfs3_size_t k = 0; k <= dir_i; k++) {
                lfs3_dir_read(&lfs3, &dir, &info) => 0;
            }
            lfs3_dir_close(&lfs3, &dir) => 0;
            char dir_path[256];
            sprintf(dir_path, "test/%s", info.name);

            // how many files do we have?
            lfs3_size_t count = 0;
            lfs3_dir_open(&lfs3, &dir, dir_path) => 0;
            lfs3_dir_read(&lfs3, &dir, &info) => 0;
            assert(strcmp(info.name, ".") == 0);
            assert(info.type == LFS3_TYPE_DIR);
            assert(info.size == 0);
            lfs3_dir_read(&lfs3, &dir, &info) => 0;
            assert(strcmp(info.name, "..") == 0);
            assert(info.type == LFS3_TYPE_DIR);
            assert(info.size == 0);
            while (true) {
                int err = lfs3_dir_read(&lfs3, &dir, &info);
                assert(!err || err == LFS3_ERR_NOENT);
                if (err == LFS3_ERR_NOENT) {
                    break;
                }
                assert(strlen(info.name) == strlen("amethyst..."));
                assert(memcmp(
                        info.name,
                        "amethyst", strlen("amethyst")) == 0);
                assert(info.type == LFS3_TYPE_REG);
                assert(info.size == SIZE);
                count++;
            }
            lfs3_dir_close(&lfs3, &dir) => 0;

            // creating a new file?
            if (op == 3 || count == 0) {
                // choose a pseudo-random number
                lfs3_size_t x = TEST_PRNG(&prng) % M;
                uint32_t wprng = TEST_PRNG(&prng);

                // create a file here
                char name[256];
                sprintf(name, "%s/amethyst%03x", dir_path, x);
                uint8_t wbuf[lfs3_max(SIZE, 1)];
                uint8_t ck = 0;
                for (lfs3_size_t j = 0; j < SIZE-1; j++) {
                    wbuf[j] = 'a' + (TEST_PRNG(&wprng) % 26);
                    ck = (ck + (wbuf[j] - 'a')) % 26;
                }
                // make the sum equal to 'a' mod 26
                if (SIZE > 0) {
                    wbuf[SIZE-1] = 'a' + ((26 - ck) % 26);
                }

                lfs3_file_t file;
                lfs3_file_open(&lfs3, &file, name,
                        LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_TRUNC) => 0;
                lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
                lfs3_file_close(&lfs3, &file) => 0;

            // deleting a file?
            } else if (op == 4) {
                // choose a random file to delete
                lfs3_size_t j = TEST_PRNG(&prng) % count;
                // find the file
                lfs3_dir_open(&lfs3, &dir, dir_path) => 0;
                lfs3_dir_read(&lfs3, &dir, &info) => 0;
                lfs3_dir_read(&lfs3, &dir, &info) => 0;
                for (lfs3_size_t k = 0; k <= j; k++) {
                    lfs3_dir_read(&lfs3, &dir, &info) => 0;
                }
                lfs3_dir_close(&lfs3, &dir) => 0;

                // delete this file
                char name[256];
                assert(strlen(info.name) == strlen("amethyst..."));
                sprintf(name, "%s/%s", dir_path, info.name);
                lfs3_remove(&lfs3, name) => 0;

            // renaming a file?
            } else {
                // choose a random file to rename
                lfs3_size_t j = TEST_PRNG(&prng) % count;
                // find the file
                lfs3_dir_open(&lfs3, &dir, dir_path) => 0;
                lfs3_dir_read(&lfs3, &dir, &info) => 0;
                lfs3_dir_read(&lfs3, &dir, &info) => 0;
                for (lfs3_size_t k = 0; k <= j; k++) {
                    lfs3_dir_read(&lfs3, &dir, &info) => 0;
                }
                lfs3_dir_close(&lfs3, &dir) => 0;

                // choose a random dir to rename to
                lfs3_size_t dir_j = TEST_PRNG(&prng) % dir_count;
                // find the dir
                struct lfs3_info info_;
                lfs3_dir_open(&lfs3, &dir, "test") => 0;
                lfs3_dir_read(&lfs3, &dir, &info_) => 0;
                lfs3_dir_read(&lfs3, &dir, &info_) => 0;
                for (lfs3_size_t k = 0; k <= dir_j; k++) {
                    lfs3_dir_read(&lfs3, &dir, &info_) => 0;
                }
                lfs3_dir_close(&lfs3, &dir) => 0;

                // choose a random file to rename to
                lfs3_size_t y = TEST_PRNG(&prng) % M;

                // rename this file
                char old_name[256];
                assert(strlen(info.name) == strlen("amethyst..."));
                sprintf(old_name, "%s/%s", dir_path, info.name);
                char new_name[256];
                sprintf(new_name, "test/%s/amethyst%03x", info_.name, y);
                lfs3_rename(&lfs3, old_name, new_name) => 0;
            }
        }

        // update our state file
        state.i = i;
        state.prng = prng;
        lfs3_file_rewind(&lfs3, &state_file) => 0;
        lfs3_file_write(&lfs3, &state_file, &state, sizeof(state))
                => sizeof(state);
        lfs3_file_sync(&lfs3, &state_file) => 0;
    }

    // go ahead and close our state file in case we remount
    lfs3_file_close(&lfs3, &state_file) => 0;

    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
        }

        // check that things look more-or-less ok
        lfs3_dir_t dir;
        lfs3_dir_open(&lfs3, &dir, "test") => 0;
        struct lfs3_info info;
        lfs3_dir_read(&lfs3, &dir, &info) => 0;
        assert(strcmp(info.name, ".") == 0);
        assert(info.type == LFS3_TYPE_DIR);
        assert(info.size == 0);
        lfs3_dir_read(&lfs3, &dir, &info) => 0;
        assert(strcmp(info.name, "..") == 0);
        assert(info.type == LFS3_TYPE_DIR);
        assert(info.size == 0);
        while (true) {
            int err = lfs3_dir_read(&lfs3, &dir, &info);
            assert(!err || err == LFS3_ERR_NOENT);
            if (err == LFS3_ERR_NOENT) {
                break;
            }
            assert(strlen(info.name) == strlen("quartz..."));
            assert(memcmp(info.name, "quartz", strlen("quartz")) == 0);
            assert(info.type == LFS3_TYPE_DIR);
            assert(info.size == 0);

            // check that our dirs look more-or-less ok
            char name[256];
            sprintf(name, "test/%s", info.name);
            lfs3_dir_t dir_;
            lfs3_dir_open(&lfs3, &dir_, name) => 0;
            struct lfs3_info info_;
            lfs3_dir_read(&lfs3, &dir_, &info_) => 0;
            assert(strcmp(info_.name, ".") == 0);
            assert(info_.type == LFS3_TYPE_DIR);
            assert(info_.size == 0);
            lfs3_dir_read(&lfs3, &dir_, &info_) => 0;
            assert(strcmp(info_.name, "..") == 0);
            assert(info_.type == LFS3_TYPE_DIR);
            assert(info_.size == 0);

            while (true) {
                err = lfs3_dir_read(&lfs3, &dir_, &info_);
                assert(!err || err == LFS3_ERR_NOENT);
                if (err == LFS3_ERR_NOENT) {
                    break;
                }
                assert(strlen(info_.name) == strlen("amethyst..."));
                assert(memcmp(
                        info_.name,
                        "amethyst", strlen("amethyst")) == 0);
                assert(info_.type == LFS3_TYPE_REG);
                assert(info_.size == SIZE);

                // at least try to read the files
                sprintf(name, "test/%s/%s", info.name, info_.name);
                lfs3_file_t file;
                lfs3_file_open(&lfs3, &file, name, LFS3_O_RDONLY) => 0;

                uint8_t rbuf[lfs3_max(SIZE, 1)];
                lfs3_file_read(&lfs3, &file, rbuf, SIZE) => SIZE;
                // all data should be lowercase ascii
                for (lfs3_size_t j = 0; j < SIZE; j++) {
                    assert(rbuf[j] >= 'a' && rbuf[j] <= 'z');
                }
                // sum should be equal to 'a' mod 26
                uint8_t ck = 0;
                for (lfs3_size_t j = 0; j < SIZE; j++) {
                    ck = (ck + (rbuf[j] - 'a')) % 26;
                }
                assert(ck == 0);
                lfs3_file_close(&lfs3, &file) => 0;
            }
            lfs3_dir_close(&lfs3, &dir_) => 0;
        }
        lfs3_dir_close(&lfs3, &dir) => 0;
    }

    lfs3_unmount(&lfs3) => 0;
'''



# Format under powerloss
#
# A format interrupted by powerloss leaves a mix of the old and new
# filesystem on disk, which must not stop the next format and mount
#
[cases.test_powerloss_format_pl]
defines.POWERLOSS_BEHAVIOR = [
    'LFS3_EMUBD_POWERLOSS_ATOMIC',
    'LFS3_EMUBD_POWERLOSS_SOMEBITS',
    'LFS3_EMUBD_POWERLOSS_MOSTBITS',
    'LFS3_EMUBD_POWERLOSS_OOO',
    'LFS3_EMUBD_POWERLOSS_METASTABLE',
    'LFS3_EMUBD_POWERLOSS_TORNTAIL',
]
defines.GBMAP = [false, true]
# metastable bits need mount to settle what a powerloss left
defines.SETTLE_FLAGS = '(POWERLOSS_BEHAVIOR == LFS3_EMUBD_POWERLOSS_METASTABLE) ? LFS3_M_SETTLE : 0'
defines.N = 8
defines.SIZE = ['8', 'BLOCK_SIZE/2']
if = 'LFS3_IFYES_GBMAP(GBMAP, true, !GBMAP)'
reentrant = true
code = '''
    // format unless we find a complete filesystem
    lfs3_t lfs3;
    int err = lfs3_mount(&lfs3, LFS3_M_RDWR | SETTLE_FLAGS, CFG);
    assert(!err || err == LFS3_ERR_CORRUPT);
    if (!err) {
        struct lfs3_info info;
        err = lfs3_stat(&lfs3, "done", &info);
        assert(!err || err == LFS3_ERR_NOENT || err == LFS3_ERR_CORRUPT);
        if (err) {
            lfs3_unmount(&lfs3) => 0;
        }
    }
    if (err) {
        lfs3_format(&lfs3,
                LFS3_F_RDWR
                    | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
                CFG) => 0;
        lfs3_mount(&lfs3, LFS3_M_RDWR | SETTLE_FLAGS, CFG) => 0;
    }

    // create some files
    uint32_t prng = 42;
    for (lfs3_size_t i = 0; i < N; i++) {
        char name[256];
        sprintf(name, "amethyst%03x", i);
        uint8_t wbuf[SIZE];
        for (lfs3_size_t j = 0; j < SIZE; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_set(&lfs3, name, wbuf, SIZE) => 0;
    }
    lfs3_set(&lfs3, "done", "done", 4) => 0;
    lfs3_unmount(&lfs3) => 0;

    for (int remount = 0; remount < 2; remount++) {
        lfs3_mount(&lfs3, LFS3_M_RDWR | SETTLE_FLAGS, CFG) => 0;

        // check our files
        prng = 42;
        for (lfs3_size_t i = 0; i < N; i++) {
            char name[256];
            sprintf(name, "amethyst%03x", i);
            uint8_t wbuf[SIZE];
            for (lfs3_size_t j = 0; j < SIZE; j++) {
                wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
            }
            uint8_t rbuf[SIZE+1];
            lfs3_get(&lfs3, name, rbuf, SIZE+1) => SIZE;
            assert(memcmp(rbuf, wbuf, SIZE) == 0);
        }
        uint8_t rbuf[5];
        lfs3_get(&lfs3, "done", rbuf, 5) => 4;
        assert(memcmp(rbuf, "done", 4) == 0);

        // and check the filesystem
        lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
        lfs3_unmount(&lfs3) => 0;
    }
'''

# Small appends under powerloss
#
# Each append resumes programming the partially programmed data block
# left by the previous sync, the synced prefix of that block must
# survive a powerloss while the rest of the block is programmed
#
[cases.test_powerloss_append_pl]
defines.POWERLOSS_BEHAVIOR = [
    'LFS3_EMUBD_POWERLOSS_ATOMIC',
    'LFS3_EMUBD_POWERLOSS_SOMEBITS',
    'LFS3_EMUBD_POWERLOSS_MOSTBITS',
    'LFS3_EMUBD_POWERLOSS_OOO',
    'LFS3_EMUBD_POWERLOSS_TORNTAIL',
]
defines.PROG_SIZE = [1, 16, 256]
# a pcache wider than prog_size tears more than prog_size bytes
defines.PCACHE_SIZE = ['LFS3_MAX(16, PROG_SIZE)', '4*PROG_SIZE']
defines.CHUNK = [16, 64]
defines.FILES = [1, 2]
defines.SIZE = '2*BLOCK_SIZE + BLOCK_SIZE/2'
# no byte may be programmed twice without an erase
defines.CKPROGONCE = true
reentrant = true
code = '''
    // format once per test
    lfs3_t lfs3;
    int err = lfs3_mount(&lfs3, LFS3_M_RDWR, CFG);
    if (err) {
        lfs3_format(&lfs3, LFS3_F_RDWR, CFG) => 0;
        lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
    }

    // the number of synced appends is committed with each file's data
    // as a file-attached attribute
    lfs3_file_t files[FILES];
    uint32_t steps[FILES];
    lfs3_ssize_t step_sizes[FILES];
    struct lfs3_attr attrs[FILES];
    struct lfs3_file_cfg filecfgs[FILES];
    uint32_t prngs[FILES];
    for (lfs3_size_t f = 0; f < FILES; f++) {
        char name[256];
        sprintf(name, "file%d", f);
        steps[f] = 0;
        attrs[f] = (struct lfs3_attr){
            .type = 1,
            .flags = LFS3_A_RDWR,
            .buffer = &steps[f],
            .buffer_size = sizeof(uint32_t),
            .size = &step_sizes[f],
        };
        filecfgs[f] = (struct lfs3_file_cfg){
            .attrs = &attrs[f],
            .attr_count = 1,
        };
        lfs3_file_opencfg(&lfs3, &files[f], name,
                LFS3_O_RDWR | LFS3_O_CREAT | LFS3_O_APPEND,
                &filecfgs[f]) => 0;
        if (step_sizes[f] == LFS3_ERR_NOATTR) {
            steps[f] = 0;
        } else {
            assert(step_sizes[f] == sizeof(uint32_t));
        }

        // each file is exactly its synced appends
        lfs3_file_size(&lfs3, &files[f]) => steps[f]*CHUNK;
        prngs[f] = 1+f;
        uint8_t rbuf[CHUNK];
        for (uint32_t i = 0; i < steps[f]; i++) {
            lfs3_file_read(&lfs3, &files[f], rbuf, CHUNK) => CHUNK;
            for (lfs3_size_t j = 0; j < CHUNK; j++) {
                assert(rbuf[j] == 'a' + (TEST_PRNG(&prngs[f]) % 26));
            }
        }
        lfs3_file_read(&lfs3, &files[f], rbuf, CHUNK) => 0;
    }
    // files are appended in turn
    for (lfs3_size_t f = 1; f < FILES; f++) {
        assert(steps[f] == steps[0] || steps[f]+1 == steps[0]);
    }
    lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;

    // append, sync, repeat
    while (true) {
        lfs3_size_t f = 0;
        for (lfs3_size_t f_ = 1; f_ < FILES; f_++) {
            if (steps[f_] < steps[f]) {
                f = f_;
            }
        }
        if ((steps[f]+1)*CHUNK > SIZE) {
            break;
        }

        uint8_t wbuf[CHUNK];
        for (lfs3_size_t j = 0; j < CHUNK; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prngs[f]) % 26);
        }
        lfs3_file_write(&lfs3, &files[f], wbuf, CHUNK) => CHUNK;
        steps[f] += 1;
        step_sizes[f] = sizeof(uint32_t);
        lfs3_file_sync(&lfs3, &files[f]) => 0;
    }

    for (lfs3_size_t f = 0; f < FILES; f++) {
        lfs3_file_close(&lfs3, &files[f]) => 0;
    }

    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
        }

        // check our files
        for (lfs3_size_t f = 0; f < FILES; f++) {
            char name[256];
            sprintf(name, "file%d", f);
            uint32_t step;
            lfs3_getattr(&lfs3, name, 1, &step, sizeof(uint32_t))
                    => sizeof(uint32_t);
            assert(step == SIZE/CHUNK);

            lfs3_file_t file;
            lfs3_file_open(&lfs3, &file, name, LFS3_O_RDONLY) => 0;
            lfs3_file_size(&lfs3, &file) => step*CHUNK;
            uint32_t prng = 1+f;
            uint8_t rbuf[CHUNK];
            for (uint32_t i = 0; i < step; i++) {
                lfs3_file_read(&lfs3, &file, rbuf, CHUNK) => CHUNK;
                for (lfs3_size_t j = 0; j < CHUNK; j++) {
                    assert(rbuf[j] == 'a' + (TEST_PRNG(&prng) % 26));
                }
            }
            lfs3_file_close(&lfs3, &file) => 0;
        }

        lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
    }

    lfs3_unmount(&lfs3) => 0;
'''

# Appends with several writes between syncs under powerloss
#
# Writes that flush a full file cache may leave part of a prog unit
# cached, and appends that coalesce with the last fragment replace it in
# one commit, after any powerloss the file must be exactly what its last
# sync wrote
#
[cases.test_powerloss_append_unsynced_pl]
defines.POWERLOSS_BEHAVIOR = [
    'LFS3_EMUBD_POWERLOSS_ATOMIC',
    'LFS3_EMUBD_POWERLOSS_SOMEBITS',
    'LFS3_EMUBD_POWERLOSS_MOSTBITS',
    'LFS3_EMUBD_POWERLOSS_OOO',
    'LFS3_EMUBD_POWERLOSS_TORNTAIL',
]
defines.PROG_SIZE = [1, 16, 256]
defines.FCACHE_SIZE = [16, 64]
defines.CHUNK = [7, 22]
defines.SYNC_EVERY = [1, 4]
defines.SIZE = 'BLOCK_SIZE + BLOCK_SIZE/2'
# no byte may be programmed twice without an erase
defines.CKPROGONCE = true
reentrant = true
code = '''
    // format once per test
    lfs3_t lfs3;
    int err = lfs3_mount(&lfs3, LFS3_M_RDWR, CFG);
    if (err) {
        lfs3_format(&lfs3, LFS3_F_RDWR, CFG) => 0;
        lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
    }

    // the number of synced writes is committed with the file's data as
    // a file-attached attribute
    uint32_t step = 0;
    lfs3_ssize_t step_size;
    struct lfs3_attr attr = {
        .type = 1,
        .flags = LFS3_A_RDWR,
        .buffer = &step,
        .buffer_size = sizeof(uint32_t),
        .size = &step_size,
    };
    struct lfs3_file_cfg filecfg = {
        .attrs = &attr,
        .attr_count = 1,
    };
    lfs3_file_t file;
    lfs3_file_opencfg(&lfs3, &file, "log",
            LFS3_O_RDWR | LFS3_O_CREAT | LFS3_O_APPEND,
            &filecfg) => 0;
    if (step_size == LFS3_ERR_NOATTR) {
        step = 0;
    } else {
        assert(step_size == sizeof(uint32_t));
    }

    // the file is exactly its synced writes
    lfs3_file_size(&lfs3, &file) => step*CHUNK;
    uint32_t prng = 42;
    uint8_t rbuf[CHUNK];
    for (uint32_t i = 0; i < step; i++) {
        lfs3_file_read(&lfs3, &file, rbuf, CHUNK) => CHUNK;
        for (lfs3_size_t j = 0; j < CHUNK; j++) {
            assert(rbuf[j] == 'a' + (TEST_PRNG(&prng) % 26));
        }
    }
    lfs3_file_read(&lfs3, &file, rbuf, CHUNK) => 0;
    lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;

    // append, sync every few writes, repeat
    uint32_t written = step;
    while ((written+1)*CHUNK <= SIZE) {
        uint8_t wbuf[CHUNK];
        for (lfs3_size_t j = 0; j < CHUNK; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file, wbuf, CHUNK) => CHUNK;
        written += 1;

        if (written % SYNC_EVERY == 0 || (written+1)*CHUNK > SIZE) {
            step = written;
            step_size = sizeof(uint32_t);
            lfs3_file_sync(&lfs3, &file) => 0;
        }
    }
    lfs3_file_close(&lfs3, &file) => 0;

    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
        }

        // check our file
        uint32_t step_;
        lfs3_getattr(&lfs3, "log", 1, &step_, sizeof(uint32_t))
                => sizeof(uint32_t);
        assert(step_ == SIZE/CHUNK);

        lfs3_file_open(&lfs3, &file, "log", LFS3_O_RDONLY) => 0;
        lfs3_file_size(&lfs3, &file) => step_*CHUNK;
        prng = 42;
        for (uint32_t i = 0; i < step_; i++) {
            lfs3_file_read(&lfs3, &file, rbuf, CHUNK) => CHUNK;
            for (lfs3_size_t j = 0; j < CHUNK; j++) {
                assert(rbuf[j] == 'a' + (TEST_PRNG(&prng) % 26));
            }
        }
        lfs3_file_close(&lfs3, &file) => 0;

        lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
    }

    lfs3_unmount(&lfs3) => 0;
'''

# Truncate and fruncate under powerloss
#
# Each file's step is committed with its data as a file-attached
# attribute, and the file's content at each step is a pure function of
# the seed, so we can rebuild what each file should look like after any
# powerloss
#
[cases.test_powerloss_truncate_pl_fuzz]
defines.POWERLOSS_BEHAVIOR = [
    'LFS3_EMUBD_POWERLOSS_ATOMIC',
    'LFS3_EMUBD_POWERLOSS_SOMEBITS',
    'LFS3_EMUBD_POWERLOSS_MOSTBITS',
    'LFS3_EMUBD_POWERLOSS_OOO',
    'LFS3_EMUBD_POWERLOSS_TORNTAIL',
]
defines.N = [1, 4]
defines.SIZE = ['BLOCK_SIZE/2', '4*BLOCK_SIZE']
defines.CHUNK = 'SIZE/4'
defines.LIMIT = 'SIZE/2'
defines.PROG_SIZE = [1, 16]
# a pcache wider than prog_size tears more than prog_size bytes
defines.PCACHE_SIZE = ['LFS3_MAX(16, PROG_SIZE)', '4*PROG_SIZE']
defines.OPS = 32
defines.SEED = 'range(10)'
fuzz = 'SEED'
reentrant = true
code = '''
    // format once per test
    lfs3_t lfs3;
    int err = lfs3_mount(&lfs3, LFS3_M_RDWR, CFG);
    if (err) {
        lfs3_format(&lfs3, LFS3_F_RDWR, CFG) => 0;
        lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
    }

    // how far did we get?
    uint32_t steps[N];
    lfs3_size_t k_ = 0;
    for (lfs3_size_t x = 0; x < N; x++) {
        char name[256];
        sprintf(name, "file%03x", x);
        lfs3_ssize_t d = lfs3_getattr(&lfs3, name, 1,
                &steps[x], sizeof(uint32_t));
        assert(d == sizeof(uint32_t) || d == LFS3_ERR_NOENT);
        if (d == LFS3_ERR_NOENT) {
            steps[x] = 0;
        }
        k_ += steps[x];
    }
    assert(k_ <= OPS);

    // replay our ops in our sim, then continue on disk
    uint8_t sims[N][SIZE+CHUNK];
    lfs3_off_t sim_sizes[N];
    uint32_t counts[N];
    for (lfs3_size_t x = 0; x < N; x++) {
        sim_sizes[x] = 0;
        counts[x] = 0;
    }
    uint32_t prng = SEED;
    for (lfs3_size_t k = 0;; k++) {
        // caught up with disk? check that every file matches our sim
        if (k == k_) {
            for (lfs3_size_t x = 0; x < N; x++) {
                assert(counts[x] == steps[x]);
                if (counts[x] == 0) {
                    continue;
                }

                char name[256];
                sprintf(name, "file%03x", x);
                lfs3_file_t file;
                lfs3_file_open(&lfs3, &file, name, LFS3_O_RDONLY) => 0;
                lfs3_file_size(&lfs3, &file) => sim_sizes[x];
                uint8_t rbuf[SIZE+1];
                lfs3_file_read(&lfs3, &file, rbuf, SIZE+1) => sim_sizes[x];
                assert(memcmp(rbuf, sims[x], sim_sizes[x]) == 0);
                lfs3_file_close(&lfs3, &file) => 0;
            }

            lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
        }

        if (k == OPS) {
            break;
        }

        // choose a file and an op
        lfs3_size_t x = TEST_PRNG(&prng) % N;
        uint8_t op = TEST_PRNG(&prng) % 5;
        uint8_t *sim = sims[x];
        lfs3_off_t size = sim_sizes[x];

        bool live = (k >= k_);
        char name[256];
        sprintf(name, "file%03x", x);
        uint32_t step = counts[x]+1;
        struct lfs3_attr attr = {
            .type = 1,
            .flags = LFS3_A_WRONLY,
            .buffer = &step,
            .buffer_size = sizeof(uint32_t),
        };
        struct lfs3_file_cfg filecfg = {
            .attrs = &attr,
            .attr_count = 1,
        };
        lfs3_file_t file;
        if (live) {
            lfs3_file_opencfg(&lfs3, &file, name,
                    LFS3_O_RDWR | LFS3_O_CREAT,
                    &filecfg) => 0;
        }

        // append?
        if (op <= 1) {
            lfs3_size_t chunk = lfs3_min(
                    1 + (TEST_PRNG(&prng) % CHUNK),
                    SIZE - size);
            for (lfs3_size_t j = 0; j < chunk; j++) {
                sim[size+j] = 'a' + (TEST_PRNG(&prng) % 26);
            }
            if (live) {
                lfs3_file_seek(&lfs3, &file, 0, LFS3_SEEK_END) => size;
                lfs3_file_write(&lfs3, &file, &sim[size], chunk) => chunk;
            }
            size += chunk;

        // truncate, shrinking or growing?
        } else if (op == 2) {
            lfs3_off_t size_ = TEST_PRNG(&prng) % (SIZE+1);
            if (size_ > size) {
                memset(&sim[size], 0, size_-size);
            }
            if (live) {
                lfs3_file_truncate(&lfs3, &file, size_) => 0;
            }
            size = size_;

        // fruncate, shrinking or growing?
        } else if (op == 3) {
            lfs3_off_t size_ = TEST_PRNG(&prng) % (SIZE+1);
            if (size_ > size) {
                memmove(&sim[size_-size], sim, size);
                memset(sim, 0, size_-size);
            } else {
                memmove(sim, &sim[size-size_], size_);
            }
            if (live) {
                lfs3_file_fruncate(&lfs3, &file, size_) => 0;
            }
            size = size_;

        // append and fruncate to a limit, like a log
        } else {
            lfs3_size_t chunk = 1 + (TEST_PRNG(&prng) % CHUNK);
            for (lfs3_size_t j = 0; j < chunk; j++) {
                sim[size+j] = 'a' + (TEST_PRNG(&prng) % 26);
            }
            if (live) {
                lfs3_file_seek(&lfs3, &file, 0, LFS3_SEEK_END) => size;
                lfs3_file_write(&lfs3, &file, &sim[size], chunk) => chunk;
            }
            size += chunk;

            if (size > LIMIT) {
                memmove(sim, &sim[size-LIMIT], LIMIT);
                if (live) {
                    lfs3_file_fruncate(&lfs3, &file, LIMIT) => 0;
                }
                size = LIMIT;
            }
        }

        if (live) {
            lfs3_file_sync(&lfs3, &file) => 0;
            lfs3_file_close(&lfs3, &file) => 0;
        }
        sim_sizes[x] = size;
        counts[x] += 1;
    }

    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
        }

        // check our files
        for (lfs3_size_t x = 0; x < N; x++) {
            char name[256];
            sprintf(name, "file%03x", x);
            uint32_t step;
            if (counts[x] == 0) {
                lfs3_getattr(&lfs3, name, 1, &step, sizeof(uint32_t))
                        => LFS3_ERR_NOENT;
                continue;
            }
            lfs3_getattr(&lfs3, name, 1, &step, sizeof(uint32_t))
                    => sizeof(uint32_t);
            assert(step == counts[x]);

            lfs3_file_t file;
            lfs3_file_open(&lfs3, &file, name, LFS3_O_RDONLY) => 0;
            lfs3_file_size(&lfs3, &file) => sim_sizes[x];
            uint8_t rbuf[SIZE+1];
            lfs3_file_read(&lfs3, &file, rbuf, SIZE+1) => sim_sizes[x];
            assert(memcmp(rbuf, sims[x], sim_sizes[x]) == 0);
            lfs3_file_close(&lfs3, &file) => 0;
        }

        lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
    }

    lfs3_unmount(&lfs3) => 0;
'''

# Random writes under powerloss
#
# Random overwrites, holes, and appends, syncing every few writes. The
# number of syncs is committed with the file's data as a file-attached
# attribute, so we can rebuild what the file should look like after any
# powerloss
#
[cases.test_powerloss_fwrite_pl_fuzz]
defines.POWERLOSS_BEHAVIOR = [
    'LFS3_EMUBD_POWERLOSS_ATOMIC',
    'LFS3_EMUBD_POWERLOSS_SOMEBITS',
    'LFS3_EMUBD_POWERLOSS_MOSTBITS',
    'LFS3_EMUBD_POWERLOSS_OOO',
    'LFS3_EMUBD_POWERLOSS_TORNTAIL',
]
# inlining has a tendency to hide sync issues, so try without
defines.SHRUB_SIZE = ['BLOCK_SIZE/4', '0']
defines.FRAGMENT_SIZE = ['LFS3_MIN(BLOCK_SIZE/16, 512)', '16']
defines.PROG_SIZE = [1, 16]
defines.SIZE = ['BLOCK_SIZE/2', '4*BLOCK_SIZE']
defines.SYNC_EVERY = [1, 8]
defines.WRITES = 32
defines.SEED = 'range(5)'
fuzz = 'SEED'
reentrant = true
code = '''
    // format once per test
    lfs3_t lfs3;
    int err = lfs3_mount(&lfs3, LFS3_M_RDWR, CFG);
    if (err) {
        lfs3_format(&lfs3, LFS3_F_RDWR, CFG) => 0;
        lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
    }

    // the number of syncs is committed with the file's data as a
    // file-attached attribute
    uint32_t step = 0;
    lfs3_ssize_t step_size;
    struct lfs3_attr attr = {
        .type = 1,
        .flags = LFS3_A_RDWR,
        .buffer = &step,
        .buffer_size = sizeof(uint32_t),
        .size = &step_size,
    };
    struct lfs3_file_cfg filecfg = {
        .attrs = &attr,
        .attr_count = 1,
    };
    lfs3_file_t file;
    lfs3_file_opencfg(&lfs3, &file, "file",
            LFS3_O_RDWR | LFS3_O_CREAT,
            &filecfg) => 0;
    if (step_size == LFS3_ERR_NOATTR) {
        step = 0;
    } else {
        assert(step_size == sizeof(uint32_t));
    }
    assert(step*SYNC_EVERY <= WRITES);
    lfs3_size_t i_ = step*SYNC_EVERY;

    // replay our writes in our sim, then continue on disk
    uint8_t sim[SIZE];
    lfs3_off_t size = 0;
    uint32_t prng = SEED;
    for (lfs3_size_t i = 0; i < WRITES; i++) {
        // caught up with disk? check that our file matches our sim
        if (i == i_) {
            lfs3_file_size(&lfs3, &file) => size;
            lfs3_file_rewind(&lfs3, &file) => 0;
            uint8_t rbuf[SIZE+1];
            lfs3_file_read(&lfs3, &file, rbuf, SIZE+1) => size;
            assert(memcmp(rbuf, sim, size) == 0);

            lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
        }

        // choose a random offset, possibly past the end of the file,
        // and a random size, mostly small but sometimes a block
        lfs3_off_t off = TEST_PRNG(&prng) % SIZE;
        lfs3_size_t chunk = (TEST_PRNG(&prng) % 4 == 0)
                ? 1 + (TEST_PRNG(&prng) % BLOCK_SIZE)
                : 1 + (TEST_PRNG(&prng) % 64);
        chunk = lfs3_min(chunk, SIZE - off);

        // update our sim
        if (off > size) {
            memset(&sim[size], 0, off-size);
        }
        for (lfs3_size_t j = 0; j < chunk; j++) {
            sim[off+j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        size = lfs3_max(size, off+chunk);

        // update our file
        if (i >= i_) {
            lfs3_file_seek(&lfs3, &file, off, LFS3_SEEK_SET) => off;
            lfs3_file_write(&lfs3, &file, &sim[off], chunk) => chunk;

            // sync?
            if ((i+1) % SYNC_EVERY == 0) {
                step = (i+1) / SYNC_EVERY;
                step_size = sizeof(uint32_t);
                lfs3_file_sync(&lfs3, &file) => 0;
            }
        }
    }

    lfs3_file_close(&lfs3, &file) => 0;

    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
        }

        // check our file
        lfs3_getattr(&lfs3, "file", 1, &step, sizeof(uint32_t))
                => sizeof(uint32_t);
        assert(step == WRITES/SYNC_EVERY);

        lfs3_file_open(&lfs3, &file, "file", LFS3_O_RDONLY) => 0;
        lfs3_file_size(&lfs3, &file) => size;
        uint8_t rbuf[SIZE+1];
        lfs3_file_read(&lfs3, &file, rbuf, SIZE+1) => size;
        assert(memcmp(rbuf, sim, size) == 0);
        lfs3_file_close(&lfs3, &file) => 0;

        lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
    }

    lfs3_unmount(&lfs3) => 0;
'''

# Janitorial work under powerloss
#
# Interleave writes with gc, mkconsistent, checks with work flags,
# read-write traversals, and remounts with work flags, while holding an
# uncreated file open so there are stickynotes to keep or clean up.
# Each file's step is committed with its data as a file-attached
# attribute, and the janitorial work between steps is redone after a
# powerloss
#
[cases.test_powerloss_gc_pl_fuzz]
defines.POWERLOSS_BEHAVIOR = [
    'LFS3_EMUBD_POWERLOSS_ATOMIC',
    'LFS3_EMUBD_POWERLOSS_SOMEBITS',
    'LFS3_EMUBD_POWERLOSS_MOSTBITS',
    'LFS3_EMUBD_POWERLOSS_OOO',
    'LFS3_EMUBD_POWERLOSS_METASTABLE',
    'LFS3_EMUBD_POWERLOSS_TORNTAIL',
]
defines.GBMAP = [false, true]
# pre-erasing needs the gbmap, and revperturb on every mount to use the
# pre-erased blocks
defines.PREERASE = 'LFS3_IFDEF_PREERASE(GBMAP, false)'
defines.F_FLAGS = '''
    ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0)
        | ((PREERASE) ? LFS3_IFDEF_PREERASE(LFS3_F_REVPERTURB, -1) : 0)
'''
# metastable bits need mount to settle what a powerloss left
defines.M_FLAGS = '''
    ((PREERASE) ? LFS3_IFDEF_PREERASE(LFS3_M_REVPERTURB, -1) : 0)
        | ((POWERLOSS_BEHAVIOR == LFS3_EMUBD_POWERLOSS_METASTABLE)
            ? LFS3_M_SETTLE
            : 0)
'''
defines.GC_FLAGS = '''
    LFS3_GC_GC
        & ~((PREERASE) ? 0 : LFS3_IFDEF_PREERASE(LFS3_GC_PREERASE, 0))
'''
# pre-erasing every free block is slow under powerloss
defines.GC_PREERASE_COUNT = 4
defines.GC_STEPS = [1, -1]
defines.GC_COMPACT_THRESH = ['0', 'BLOCK_SIZE/2']
defines.N = 4
defines.SIZE = ['BLOCK_SIZE/8', '2*BLOCK_SIZE']
defines.OPS = 32
defines.SEED = 'range(10)'
fuzz = 'SEED'
if = [
    'LFS3_IFYES_GBMAP(GBMAP, true, !GBMAP)',
    'LFS3_IFDEF_GC(true, GC_STEPS == 1)',
]
reentrant = true
code = '''
    // format once per test
    lfs3_t lfs3;
    int err = lfs3_mount(&lfs3, LFS3_M_RDWR | M_FLAGS, CFG);
    if (err) {
        lfs3_format(&lfs3, LFS3_F_RDWR | F_FLAGS, CFG) => 0;
        lfs3_mount(&lfs3, LFS3_M_RDWR | M_FLAGS, CFG) => 0;
    }

    // stickynotes should never be visible
    struct lfs3_info info;
    lfs3_stat(&lfs3, "sticky", &info) => LFS3_ERR_NOENT;

    // how far did we get?
    uint32_t steps[N];
    lfs3_size_t k_ = 0;
    for (lfs3_size_t x = 0; x < N; x++) {
        char name[256];
        sprintf(name, "file%03x", x);
        lfs3_ssize_t d = lfs3_getattr(&lfs3, name, 1,
                &steps[x], sizeof(uint32_t));
        assert(d == sizeof(uint32_t) || d == LFS3_ERR_NOENT);
        if (d == LFS3_ERR_NOENT) {
            steps[x] = 0;
        }
        k_ += steps[x];
    }
    assert(k_ <= OPS);

    // mount-time work we can choose from
    const uint32_t mflags[] = {
        LFS3_M_MKCONSISTENT,
        LFS3_M_LOOKAHEAD,
        LFS3_M_COMPACT,
        LFS3_M_CKMETA,
        LFS3_M_CKDATA,
        LFS3_M_MKCONSISTENT | LFS3_M_LOOKAHEAD | LFS3_M_COMPACT
            | LFS3_M_CKMETA | LFS3_M_CKDATA,
        (PREERASE) ? LFS3_IFDEF_PREERASE(LFS3_M_PREERASE, 0) : 0,
    };
    const lfs3_size_t mflag_count = sizeof(mflags)/sizeof(uint32_t);

    // replay our ops in our sim, then continue on disk
    uint8_t sims[N][SIZE];
    lfs3_off_t sim_sizes[N];
    uint32_t counts[N];
    for (lfs3_size_t x = 0; x < N; x++) {
        sim_sizes[x] = 0;
        counts[x] = 0;
    }
    uint32_t prng = SEED;
    for (lfs3_size_t k = 0;; k++) {
        // caught up with disk? check that every file matches our sim
        if (k == k_) {
            for (lfs3_size_t x = 0; x < N; x++) {
                assert(counts[x] == steps[x]);
                if (counts[x] == 0) {
                    continue;
                }

                char name[256];
                sprintf(name, "file%03x", x);
                lfs3_file_t file;
                lfs3_file_open(&lfs3, &file, name, LFS3_O_RDONLY) => 0;
                lfs3_file_size(&lfs3, &file) => sim_sizes[x];
                uint8_t rbuf[SIZE+1];
                lfs3_file_read(&lfs3, &file, rbuf, SIZE+1) => sim_sizes[x];
                assert(memcmp(rbuf, sims[x], sim_sizes[x]) == 0);
                lfs3_file_close(&lfs3, &file) => 0;
            }

            lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
        }

        if (k == OPS) {
            break;
        }

        // choose a file and an op
        lfs3_size_t x = TEST_PRNG(&prng) % N;
        uint8_t op = TEST_PRNG(&prng) % 3;
        uint8_t *sim = sims[x];
        lfs3_off_t size = sim_sizes[x];
        lfs3_off_t off;
        lfs3_size_t chunk;
        // rewrite?
        if (op == 0) {
            off = 0;
            chunk = 1 + (TEST_PRNG(&prng) % SIZE);
            size = 0;
        // append?
        } else if (op == 1) {
            off = size;
            chunk = lfs3_min(1 + (TEST_PRNG(&prng) % SIZE), SIZE - size);
        // overwrite?
        } else {
            off = TEST_PRNG(&prng) % (size+1);
            chunk = lfs3_min(1 + (TEST_PRNG(&prng) % SIZE), SIZE - off);
        }
        for (lfs3_size_t j = 0; j < chunk; j++) {
            sim[off+j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        size = lfs3_max(size, off+chunk);

        // choose some janitorial work, and whether to hold a
        // stickynote open while we do it
        uint8_t work = TEST_PRNG(&prng) % 9;
        bool sticky = TEST_PRNG(&prng) % 2;
        uint32_t mflags_ = mflags[TEST_PRNG(&prng) % mflag_count];

        if (k >= k_) {
            lfs3_file_t u;
            if (sticky) {
                lfs3_file_open(&lfs3, &u, "sticky",
                        LFS3_O_WRONLY | LFS3_O_CREAT) => 0;
                lfs3_file_write(&lfs3, &u, "sticky", 6) => 6;
            }

            // gc?
            if (work == 0) {
                #ifdef LFS3_GC
                lfs3_fs_gc(&lfs3) => 0;
                #else
                lfs3_fs_mkconsistent(&lfs3) => 0;
                #endif

            // mkconsistent?
            } else if (work == 1) {
                lfs3_fs_mkconsistent(&lfs3) => 0;

            // ck with work flags?
            } else if (work == 2) {
                lfs3_fs_ck(&lfs3, LFS3_CK_MKCONSISTENT) => 0;
            } else if (work == 3) {
                lfs3_fs_ck(&lfs3, LFS3_CK_LOOKAHEAD) => 0;
            } else if (work == 4) {
                lfs3_fs_ck(&lfs3, LFS3_CK_COMPACT) => 0;
            } else if (work == 5) {
                lfs3_fs_ck(&lfs3,
                        LFS3_CK_MKCONSISTENT
                            | LFS3_CK_LOOKAHEAD
                            | LFS3_CK_COMPACT
                            | LFS3_CK_CKMETA
                            | LFS3_CK_CKDATA
                            | ((PREERASE)
                                ? LFS3_IFDEF_PREERASE(LFS3_CK_PREERASE, 0)
                                : 0)) => 0;

            // read-write traversal?
            } else if (work == 6) {
                lfs3_trv_t trv;
                lfs3_trv_open(&lfs3, &trv,
                        LFS3_T_RDWR
                            | LFS3_T_COMPACT
                            | LFS3_T_MKCONSISTENT
                            | LFS3_T_LOOKAHEAD) => 0;
                while (true) {
                    struct lfs3_tinfo tinfo;
                    int err = lfs3_trv_read(&lfs3, &trv, &tinfo);
                    assert(!err || err == LFS3_ERR_NOENT);
                    if (err == LFS3_ERR_NOENT) {
                        break;
                    }
                }
                lfs3_trv_close(&lfs3, &trv) => 0;

            // remount with mount-time work?
            } else if (work == 7) {
                if (sticky) {
                    lfs3_file_desync(&lfs3, &u) => 0;
                    lfs3_file_close(&lfs3, &u) => 0;
                    sticky = false;
                }
                lfs3_unmount(&lfs3) => 0;
                lfs3_mount(&lfs3, LFS3_M_RDWR | M_FLAGS | mflags_, CFG) => 0;
            }

            // write our file
            char name[256];
            sprintf(name, "file%03x", x);
            uint32_t step = counts[x]+1;
            struct lfs3_attr attr = {
                .type = 1,
                .flags = LFS3_A_WRONLY,
                .buffer = &step,
                .buffer_size = sizeof(uint32_t),
            };
            struct lfs3_file_cfg filecfg = {
                .attrs = &attr,
                .attr_count = 1,
            };
            lfs3_file_t file;
            lfs3_file_opencfg(&lfs3, &file, name,
                    LFS3_O_WRONLY | LFS3_O_CREAT
                        | ((op == 0) ? LFS3_O_TRUNC : 0),
                    &filecfg) => 0;
            lfs3_file_seek(&lfs3, &file, off, LFS3_SEEK_SET) => off;
            lfs3_file_write(&lfs3, &file, &sim[off], chunk) => chunk;
            lfs3_file_sync(&lfs3, &file) => 0;
            lfs3_file_close(&lfs3, &file) => 0;

            // drop our stickynote
            if (sticky) {
                lfs3_file_desync(&lfs3, &u) => 0;
                lfs3_file_close(&lfs3, &u) => 0;
            }
        }
        sim_sizes[x] = size;
        counts[x] += 1;
    }

    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR | M_FLAGS, CFG) => 0;
        }

        // check our files
        lfs3_stat(&lfs3, "sticky", &info) => LFS3_ERR_NOENT;
        for (lfs3_size_t x = 0; x < N; x++) {
            char name[256];
            sprintf(name, "file%03x", x);
            uint32_t step;
            if (counts[x] == 0) {
                lfs3_getattr(&lfs3, name, 1, &step, sizeof(uint32_t))
                        => LFS3_ERR_NOENT;
                continue;
            }
            lfs3_getattr(&lfs3, name, 1, &step, sizeof(uint32_t))
                    => sizeof(uint32_t);
            assert(step == counts[x]);

            lfs3_file_t file;
            lfs3_file_open(&lfs3, &file, name, LFS3_O_RDONLY) => 0;
            lfs3_file_size(&lfs3, &file) => sim_sizes[x];
            uint8_t rbuf[SIZE+1];
            lfs3_file_read(&lfs3, &file, rbuf, SIZE+1) => sim_sizes[x];
            assert(memcmp(rbuf, sims[x], sim_sizes[x]) == 0);
            lfs3_file_close(&lfs3, &file) => 0;
        }

        lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
    }

    lfs3_unmount(&lfs3) => 0;
'''

# mkgbmap and rmgbmap under powerloss
#
# Alternate enabling and disabling the gbmap with file writes and
# removes. Our progress is a root attribute committed after each op, and
# every op is idempotent, so the op in progress is either complete or
# absent and can always be redone. No block we reference may ever be
# free or erased in the gbmap's known window
#
[cases.test_powerloss_gbmap_pl]
defines.POWERLOSS_BEHAVIOR = [
    'LFS3_EMUBD_POWERLOSS_ATOMIC',
    'LFS3_EMUBD_POWERLOSS_SOMEBITS',
    'LFS3_EMUBD_POWERLOSS_MOSTBITS',
    'LFS3_EMUBD_POWERLOSS_OOO',
    'LFS3_EMUBD_POWERLOSS_METASTABLE',
    'LFS3_EMUBD_POWERLOSS_TORNTAIL',
]
# metastable bits need mount to settle what a powerloss left
defines.SETTLE_FLAGS = '(POWERLOSS_BEHAVIOR == LFS3_EMUBD_POWERLOSS_METASTABLE) ? LFS3_M_SETTLE : 0'
# repopulate the gbmap rarely or often
defines.LOOKGBMAP_THRESH = ['BLOCK_COUNT/4', '7*BLOCK_COUNT/8']
defines.N = 4
defines.SIZE = ['BLOCK_SIZE/8', '2*BLOCK_SIZE']
defines.OPS = 64
defines.SEED = 'range(10)'
fuzz = 'SEED'
reentrant = true
ifdef = 'LFS3_GBMAP'
ifndef = 'LFS3_YES_GBMAP'
in = 'lfs3.c'
code = '''
    // format once per test, note the lack of gbmap flag
    lfs3_t lfs3;
    int err = lfs3_mount(&lfs3, LFS3_M_RDWR | SETTLE_FLAGS, CFG);
    if (err) {
        lfs3_format(&lfs3, LFS3_F_RDWR, CFG) => 0;
        lfs3_mount(&lfs3, LFS3_M_RDWR | SETTLE_FLAGS, CFG) => 0;
    }

    // how far did we get?
    uint32_t i_ = 0;
    lfs3_ssize_t d = lfs3_getattr(&lfs3, "/", 1, &i_, sizeof(uint32_t));
    assert(d == sizeof(uint32_t) || d == LFS3_ERR_NOATTR);
    assert(i_ <= OPS);

    // replay our ops in our sim, then continue on disk
    //
    // sim_ks tracks the op that last wrote each file, -1 => no file
    lfs3_ssize_t sim_ks[N];
    for (lfs3_size_t x = 0; x < N; x++) {
        sim_ks[x] = -1;
    }
    bool sim_gbmap = false;
    uint32_t prng = SEED;
    for (lfs3_size_t i = 0;; i++) {
        // are we checking our sim?
        if (i >= i_) {
            // every 4th op toggles the gbmap
            uint32_t prng_ = prng;
            bool toggle = (i < OPS && i % 4 == 0);
            lfs3_size_t x_ = (i < OPS && !toggle)
                    ? TEST_PRNG(&prng_) % N
                    : N;

            // the gbmap is either as our sim, or toggled if the op in
            // progress was a toggle
            struct lfs3_fsinfo fsinfo;
            lfs3_fs_stat(&lfs3, &fsinfo) => 0;
            bool gbmap = fsinfo.flags & LFS3_I_GBMAP;
            assert(gbmap == sim_gbmap || (i == i_ && toggle));

            // and every file is as our sim, except maybe the file of
            // the op in progress
            for (lfs3_size_t x = 0; x < N; x++) {
                char name[256];
                sprintf(name, "file%03x", x);
                lfs3_file_t file;
                int err = lfs3_file_open(&lfs3, &file, name, LFS3_O_RDONLY);
                assert(!err || err == LFS3_ERR_NOENT);
                if (i != i_ || x != x_) {
                    assert((err == LFS3_ERR_NOENT) == (sim_ks[x] == -1));
                }
                if (err) {
                    continue;
                }

                uint8_t rbuf[SIZE+1];
                lfs3_file_read(&lfs3, &file, rbuf, SIZE+1) => SIZE;
                lfs3_file_close(&lfs3, &file) => 0;
                bool match = (sim_ks[x] != -1);
                uint32_t wprng = SEED + sim_ks[x];
                for (lfs3_size_t j = 0; j < SIZE; j++) {
                    match = match
                            && rbuf[j] == 'a' + (TEST_PRNG(&wprng) % 26);
                }
                if (!match) {
                    // the op in progress may have written this file
                    assert(i == i_ && x == x_);
                    wprng = SEED + i;
                    for (lfs3_size_t j = 0; j < SIZE; j++) {
                        assert(rbuf[j] == 'a' + (TEST_PRNG(&wprng) % 26));
                    }
                }
            }

            // no block we reference may be free or erased in the gbmap's
            // known window
            if (gbmap) {
                bool used[BLOCK_COUNT];
                memset(used, 0, sizeof(used));
                lfs3_trv_t trv;
                lfs3_trv_open(&lfs3, &trv, LFS3_T_RDONLY) => 0;
                while (true) {
                    struct lfs3_tinfo tinfo;
                    int err = lfs3_trv_read(&lfs3, &trv, &tinfo);
                    assert(!err || err == LFS3_ERR_NOENT);
                    if (err == LFS3_ERR_NOENT) {
                        break;
                    }
                    used[tinfo.block] = true;
                }
                lfs3_trv_close(&lfs3, &trv) => 0;

                for (lfs3_block_t b = 0; b < BLOCK_COUNT; b++) {
                    lfs3_block_t off = (b + BLOCK_COUNT - lfs3.gbmap.window)
                            % BLOCK_COUNT;
                    if (used[b] && off < lfs3.gbmap.known) {
                        lfs3_bid_t bid;
                        lfs3_stag_t tag = lfs3_gbmap_lookupnext(&lfs3,
                                &lfs3.gbmap.b, b,
                                &bid, NULL, NULL);
                        assert(tag >= 0);
                        assert(tag != LFS3_TAG_BMFREE
                                && tag != LFS3_TAG_BMERASED);
                    }
                }
            }

            lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
        }

        if (i == OPS) {
            break;
        }

        // toggle the gbmap?
        if (i % 4 == 0) {
            sim_gbmap = !sim_gbmap;
            if (i >= i_) {
                struct lfs3_fsinfo fsinfo;
                lfs3_fs_stat(&lfs3, &fsinfo) => 0;
                if (sim_gbmap && !(fsinfo.flags & LFS3_I_GBMAP)) {
                    lfs3_fs_mkgbmap(&lfs3) => 0;
                } else if (!sim_gbmap && (fsinfo.flags & LFS3_I_GBMAP)) {
                    lfs3_fs_rmgbmap(&lfs3) => 0;
                }
            }

        // write or remove a file?
        } else {
            lfs3_size_t x = TEST_PRNG(&prng) % N;
            uint8_t op = TEST_PRNG(&prng) % 3;
            char name[256];
            sprintf(name, "file%03x", x);
            // write?
            if (op < 2) {
                sim_ks[x] = i;
                if (i >= i_) {
                    uint8_t wbuf[SIZE];
                    uint32_t wprng = SEED + i;
                    for (lfs3_size_t j = 0; j < SIZE; j++) {
                        wbuf[j] = 'a' + (TEST_PRNG(&wprng) % 26);
                    }
                    lfs3_file_t file;
                    lfs3_file_open(&lfs3, &file, name,
                            LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_TRUNC) => 0;
                    lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
                    lfs3_file_close(&lfs3, &file) => 0;
                }
            // remove?
            } else {
                sim_ks[x] = -1;
                if (i >= i_) {
                    int err = lfs3_remove(&lfs3, name);
                    assert(!err || err == LFS3_ERR_NOENT);
                }
            }
        }

        // record our progress
        if (i >= i_) {
            uint32_t i__ = i+1;
            lfs3_setattr(&lfs3, "/", 1, &i__, sizeof(uint32_t)) => 0;
        }
    }

    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR | SETTLE_FLAGS, CFG) => 0;
        }

        // check the gbmap and our files
        struct lfs3_fsinfo fsinfo;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert(!!(fsinfo.flags & LFS3_I_GBMAP) == sim_gbmap);
        for (lfs3_size_t x = 0; x < N; x++) {
            char name[256];
            sprintf(name, "file%03x", x);
            if (sim_ks[x] == -1) {
                struct lfs3_info info;
                lfs3_stat(&lfs3, name, &info) => LFS3_ERR_NOENT;
                continue;
            }

            lfs3_file_t file;
            lfs3_file_open(&lfs3, &file, name, LFS3_O_RDONLY) => 0;
            uint8_t rbuf[SIZE+1];
            lfs3_file_read(&lfs3, &file, rbuf, SIZE+1) => SIZE;
            uint32_t wprng = SEED + sim_ks[x];
            for (lfs3_size_t j = 0; j < SIZE; j++) {
                assert(rbuf[j] == 'a' + (TEST_PRNG(&wprng) % 26));
            }
            lfs3_file_close(&lfs3, &file) => 0;
        }

        lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
    }

    lfs3_unmount(&lfs3) => 0;
'''

# Pre-erasing under powerloss
#
# gc pre-erases free blocks between writes, and whole-block writes and
# small appends claim them for data and metadata. Each file's step is
# committed with its data as a file-attached attribute. No block may be
# programmed twice without an erase, unless its erased-state checksum
# matched, and no block we reference may be free or erased in the
# gbmap's known window
#
[cases.test_powerloss_preerase_pl_fuzz]
defines.POWERLOSS_BEHAVIOR = [
    'LFS3_EMUBD_POWERLOSS_ATOMIC',
    'LFS3_EMUBD_POWERLOSS_SOMEBITS',
    'LFS3_EMUBD_POWERLOSS_MOSTBITS',
    'LFS3_EMUBD_POWERLOSS_OOO',
    'LFS3_EMUBD_POWERLOSS_METASTABLE',
    'LFS3_EMUBD_POWERLOSS_TORNTAIL',
]
# metastable bits need mount to settle what a powerloss left
defines.SETTLE_FLAGS = '(POWERLOSS_BEHAVIOR == LFS3_EMUBD_POWERLOSS_METASTABLE) ? LFS3_M_SETTLE : 0'
defines.GC_FLAGS = 'LFS3_GC_PREERASE'
defines.GC_STEPS = 1
defines.GC_PREERASE_COUNT = ['4', '-1']
# test with a number of different erase values
defines.ERASE_VALUE = [0xff, 0x00, -1]
# no byte may be programmed twice without an erase
defines.CKPROGONCE = true
defines.N = 2
defines.SIZE = '2*BLOCK_SIZE'
defines.CHUNK = 64
defines.OPS = 32
defines.SEED = 'range(10)'
fuzz = 'SEED'
reentrant = true
ifdef = ['LFS3_GC', 'LFS3_GBMAP', 'LFS3_REVPERTURB', 'LFS3_PREERASE']
in = 'lfs3.c'
code = '''
    // format once per test, note preerasing needs revperturb
    lfs3_t lfs3;
    int err = lfs3_mount(&lfs3,
            LFS3_M_RDWR | LFS3_M_REVPERTURB | SETTLE_FLAGS,
            CFG);
    if (err) {
        lfs3_format(&lfs3,
                LFS3_F_RDWR | LFS3_F_REVPERTURB | LFS3_F_GBMAP,
                CFG) => 0;
        lfs3_mount(&lfs3,
                LFS3_M_RDWR | LFS3_M_REVPERTURB | SETTLE_FLAGS,
                CFG) => 0;
    }

    // how far did we get?
    uint32_t steps[N];
    lfs3_size_t k_ = 0;
    for (lfs3_size_t x = 0; x < N; x++) {
        char name[256];
        sprintf(name, "file%03x", x);
        lfs3_ssize_t d = lfs3_getattr(&lfs3, name, 1,
                &steps[x], sizeof(uint32_t));
        assert(d == sizeof(uint32_t) || d == LFS3_ERR_NOENT);
        if (d == LFS3_ERR_NOENT) {
            steps[x] = 0;
        }
        k_ += steps[x];
    }
    assert(k_ <= OPS);

    // replay our ops in our sim, then continue on disk
    uint8_t sims[N][SIZE];
    lfs3_off_t sim_sizes[N];
    uint32_t counts[N];
    for (lfs3_size_t x = 0; x < N; x++) {
        sim_sizes[x] = 0;
        counts[x] = 0;
    }
    uint32_t prng = SEED;
    for (lfs3_size_t k = 0;; k++) {
        // caught up with disk? check that every file matches our sim
        if (k == k_) {
            for (lfs3_size_t x = 0; x < N; x++) {
                assert(counts[x] == steps[x]);
                if (counts[x] == 0) {
                    continue;
                }

                char name[256];
                sprintf(name, "file%03x", x);
                lfs3_file_t file;
                lfs3_file_open(&lfs3, &file, name, LFS3_O_RDONLY) => 0;
                lfs3_file_size(&lfs3, &file) => sim_sizes[x];
                uint8_t rbuf[SIZE+1];
                lfs3_file_read(&lfs3, &file, rbuf, SIZE+1) => sim_sizes[x];
                assert(memcmp(rbuf, sims[x], sim_sizes[x]) == 0);
                lfs3_file_close(&lfs3, &file) => 0;
            }

            // no block we reference may be free or erased in the
            // gbmap's known window
            bool used[BLOCK_COUNT];
            memset(used, 0, sizeof(used));
            lfs3_trv_t trv;
            lfs3_trv_open(&lfs3, &trv, LFS3_T_RDONLY) => 0;
            while (true) {
                struct lfs3_tinfo tinfo;
                int err = lfs3_trv_read(&lfs3, &trv, &tinfo);
                assert(!err || err == LFS3_ERR_NOENT);
                if (err == LFS3_ERR_NOENT) {
                    break;
                }
                used[tinfo.block] = true;
            }
            lfs3_trv_close(&lfs3, &trv) => 0;

            for (lfs3_block_t b = 0; b < BLOCK_COUNT; b++) {
                lfs3_block_t off = (b + BLOCK_COUNT - lfs3.gbmap.window)
                        % BLOCK_COUNT;
                if (used[b] && off < lfs3.gbmap.known) {
                    lfs3_bid_t bid;
                    lfs3_stag_t tag = lfs3_gbmap_lookupnext(&lfs3,
                            &lfs3.gbmap.b, b,
                            &bid, NULL, NULL);
                    assert(tag >= 0);
                    assert(tag != LFS3_TAG_BMFREE
                            && tag != LFS3_TAG_BMERASED);
                }
            }

            lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
        }

        if (k == OPS) {
            break;
        }

        // choose a file and an op
        lfs3_size_t x = TEST_PRNG(&prng) % N;
        uint8_t op = TEST_PRNG(&prng) % 2;
        uint8_t *sim = sims[x];
        lfs3_off_t size = sim_sizes[x];
        lfs3_off_t off;
        lfs3_size_t chunk;
        // rewrite with whole blocks?
        if (op == 0 || size + CHUNK > SIZE) {
            off = 0;
            chunk = BLOCK_SIZE * (1 + (TEST_PRNG(&prng) % (SIZE/BLOCK_SIZE)));
            size = 0;
        // small append?
        } else {
            off = size;
            chunk = 1 + (TEST_PRNG(&prng) % CHUNK);
        }
        for (lfs3_size_t j = 0; j < chunk; j++) {
            sim[off+j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        size = off+chunk;

        if (k >= k_) {
            // pre-erase a step
            lfs3_fs_gc(&lfs3) => 0;

            // write our file
            char name[256];
            sprintf(name, "file%03x", x);
            uint32_t step = counts[x]+1;
            struct lfs3_attr attr = {
                .type = 1,
                .flags = LFS3_A_WRONLY,
                .buffer = &step,
                .buffer_size = sizeof(uint32_t),
            };
            struct lfs3_file_cfg filecfg = {
                .attrs = &attr,
                .attr_count = 1,
            };
            lfs3_file_t file;
            lfs3_file_opencfg(&lfs3, &file, name,
                    LFS3_O_WRONLY | LFS3_O_CREAT
                        | ((off == 0) ? LFS3_O_TRUNC : LFS3_O_APPEND),
                    &filecfg) => 0;
            lfs3_file_write(&lfs3, &file, &sim[off], chunk) => chunk;
            lfs3_file_sync(&lfs3, &file) => 0;
            lfs3_file_close(&lfs3, &file) => 0;
        }
        sim_sizes[x] = size;
        counts[x] += 1;
    }

    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3,
                LFS3_M_RDWR | LFS3_M_REVPERTURB | SETTLE_FLAGS,
                CFG) => 0;
        }

        // check our files
        for (lfs3_size_t x = 0; x < N; x++) {
            char name[256];
            sprintf(name, "file%03x", x);
            uint32_t step;
            if (counts[x] == 0) {
                lfs3_getattr(&lfs3, name, 1, &step, sizeof(uint32_t))
                        => LFS3_ERR_NOENT;
                continue;
            }
            lfs3_getattr(&lfs3, name, 1, &step, sizeof(uint32_t))
                    => sizeof(uint32_t);
            assert(step == counts[x]);

            lfs3_file_t file;
            lfs3_file_open(&lfs3, &file, name, LFS3_O_RDONLY) => 0;
            lfs3_file_size(&lfs3, &file) => sim_sizes[x];
            uint8_t rbuf[SIZE+1];
            lfs3_file_read(&lfs3, &file, rbuf, SIZE+1) => sim_sizes[x];
            assert(memcmp(rbuf, sims[x], sim_sizes[x]) == 0);
            lfs3_file_close(&lfs3, &file) => 0;
        }

        lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
    }

    lfs3_unmount(&lfs3) => 0;
'''

# Janitorial work under powerloss, mounting with LFS3_M_REVPERTURB only
# when pre-erasing
#
# Mounts without LFS3_M_REVPERTURB can't trust blocks pre-erased by
# another mount, but must still use them, erasing them again, instead of
# failing writes with LFS3_ERR_NOSPC on a nearly empty disk
#
# Interleave writes with gc, mkconsistent, checks with work flags,
# read-write traversals, and remounts with work flags, while holding an
# uncreated file open so there are stickynotes to keep or clean up.
# Each file's step is committed with its data as a file-attached
# attribute, and the janitorial work between steps is redone after a
# powerloss
#
[cases.test_powerloss_gc_crossmode_pl_fuzz]
defines.POWERLOSS_BEHAVIOR = [
    'LFS3_EMUBD_POWERLOSS_ATOMIC',
    'LFS3_EMUBD_POWERLOSS_SOMEBITS',
    'LFS3_EMUBD_POWERLOSS_MOSTBITS',
    'LFS3_EMUBD_POWERLOSS_OOO',
]
defines.GBMAP = [false, true]
# pre-erasing needs the gbmap, and revperturb on every mount to use the
# pre-erased blocks
defines.PREERASE = 'LFS3_IFDEF_PREERASE(GBMAP, false)'
defines.F_FLAGS = '''
    ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0)
        | ((PREERASE) ? LFS3_IFDEF_PREERASE(LFS3_F_REVPERTURB, -1) : 0)
'''
defines.M_FLAGS = 0
defines.GC_FLAGS = 'LFS3_GC_GC & ~LFS3_IFDEF_PREERASE(LFS3_GC_PREERASE, 0)'
defines.GC_PREERASE_COUNT = -1
defines.GC_STEPS = [1, -1]
defines.GC_COMPACT_THRESH = ['0', 'BLOCK_SIZE/2']
defines.N = 4
defines.SIZE = ['BLOCK_SIZE/8', '2*BLOCK_SIZE']
defines.OPS = 32
defines.SEED = 'range(10)'
fuzz = 'SEED'
if = [
    'LFS3_IFYES_GBMAP(GBMAP, true, !GBMAP)',
    'LFS3_IFDEF_GC(true, GC_STEPS == 1)',
]
reentrant = true
code = '''
    // format once per test
    lfs3_t lfs3;
    int err = lfs3_mount(&lfs3, LFS3_M_RDWR | M_FLAGS, CFG);
    if (err) {
        lfs3_format(&lfs3, LFS3_F_RDWR | F_FLAGS, CFG) => 0;
        lfs3_mount(&lfs3, LFS3_M_RDWR | M_FLAGS, CFG) => 0;
    }

    // stickynotes should never be visible
    struct lfs3_info info;
    lfs3_stat(&lfs3, "sticky", &info) => LFS3_ERR_NOENT;

    // how far did we get?
    uint32_t steps[N];
    lfs3_size_t k_ = 0;
    for (lfs3_size_t x = 0; x < N; x++) {
        char name[256];
        sprintf(name, "file%03x", x);
        lfs3_ssize_t d = lfs3_getattr(&lfs3, name, 1,
                &steps[x], sizeof(uint32_t));
        assert(d == sizeof(uint32_t) || d == LFS3_ERR_NOENT);
        if (d == LFS3_ERR_NOENT) {
            steps[x] = 0;
        }
        k_ += steps[x];
    }
    assert(k_ <= OPS);

    // mount-time work we can choose from
    const uint32_t mflags[] = {
        LFS3_M_MKCONSISTENT,
        LFS3_M_LOOKAHEAD,
        LFS3_M_COMPACT,
        LFS3_M_CKMETA,
        LFS3_M_CKDATA,
        LFS3_M_MKCONSISTENT | LFS3_M_LOOKAHEAD | LFS3_M_COMPACT
            | LFS3_M_CKMETA | LFS3_M_CKDATA,
        (PREERASE)
            ? LFS3_IFDEF_PREERASE(LFS3_M_REVPERTURB | LFS3_M_PREERASE, 0)
            : 0,
    };
    const lfs3_size_t mflag_count = sizeof(mflags)/sizeof(uint32_t);

    // replay our ops in our sim, then continue on disk
    uint8_t sims[N][SIZE];
    lfs3_off_t sim_sizes[N];
    uint32_t counts[N];
    for (lfs3_size_t x = 0; x < N; x++) {
        sim_sizes[x] = 0;
        counts[x] = 0;
    }
    uint32_t prng = SEED;
    for (lfs3_size_t k = 0;; k++) {
        // caught up with disk? check that every file matches our sim
        if (k == k_) {
            for (lfs3_size_t x = 0; x < N; x++) {
                assert(counts[x] == steps[x]);
                if (counts[x] == 0) {
                    continue;
                }

                char name[256];
                sprintf(name, "file%03x", x);
                lfs3_file_t file;
                lfs3_file_open(&lfs3, &file, name, LFS3_O_RDONLY) => 0;
                lfs3_file_size(&lfs3, &file) => sim_sizes[x];
                uint8_t rbuf[SIZE+1];
                lfs3_file_read(&lfs3, &file, rbuf, SIZE+1) => sim_sizes[x];
                assert(memcmp(rbuf, sims[x], sim_sizes[x]) == 0);
                lfs3_file_close(&lfs3, &file) => 0;
            }

            lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
        }

        if (k == OPS) {
            break;
        }

        // choose a file and an op
        lfs3_size_t x = TEST_PRNG(&prng) % N;
        uint8_t op = TEST_PRNG(&prng) % 3;
        uint8_t *sim = sims[x];
        lfs3_off_t size = sim_sizes[x];
        lfs3_off_t off;
        lfs3_size_t chunk;
        // rewrite?
        if (op == 0) {
            off = 0;
            chunk = 1 + (TEST_PRNG(&prng) % SIZE);
            size = 0;
        // append?
        } else if (op == 1) {
            off = size;
            chunk = lfs3_min(1 + (TEST_PRNG(&prng) % SIZE), SIZE - size);
        // overwrite?
        } else {
            off = TEST_PRNG(&prng) % (size+1);
            chunk = lfs3_min(1 + (TEST_PRNG(&prng) % SIZE), SIZE - off);
        }
        for (lfs3_size_t j = 0; j < chunk; j++) {
            sim[off+j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        size = lfs3_max(size, off+chunk);

        // choose some janitorial work, and whether to hold a
        // stickynote open while we do it
        uint8_t work = TEST_PRNG(&prng) % 9;
        bool sticky = TEST_PRNG(&prng) % 2;
        uint32_t mflags_ = mflags[TEST_PRNG(&prng) % mflag_count];

        if (k >= k_) {
            lfs3_file_t u;
            if (sticky) {
                lfs3_file_open(&lfs3, &u, "sticky",
                        LFS3_O_WRONLY | LFS3_O_CREAT) => 0;
                lfs3_file_write(&lfs3, &u, "sticky", 6) => 6;
            }

            // gc?
            if (work == 0) {
                #ifdef LFS3_GC
                lfs3_fs_gc(&lfs3) => 0;
                #else
                lfs3_fs_mkconsistent(&lfs3) => 0;
                #endif

            // mkconsistent?
            } else if (work == 1) {
                lfs3_fs_mkconsistent(&lfs3) => 0;

            // ck with work flags?
            } else if (work == 2) {
                lfs3_fs_ck(&lfs3, LFS3_CK_MKCONSISTENT) => 0;
            } else if (work == 3) {
                lfs3_fs_ck(&lfs3, LFS3_CK_LOOKAHEAD) => 0;
            } else if (work == 4) {
                lfs3_fs_ck(&lfs3, LFS3_CK_COMPACT) => 0;
            } else if (work == 5) {
                lfs3_fs_ck(&lfs3,
                        LFS3_CK_MKCONSISTENT
                            | LFS3_CK_LOOKAHEAD
                            | LFS3_CK_COMPACT
                            | LFS3_CK_CKMETA
                            | LFS3_CK_CKDATA) => 0;

            // read-write traversal?
            } else if (work == 6) {
                lfs3_trv_t trv;
                lfs3_trv_open(&lfs3, &trv,
                        LFS3_T_RDWR
                            | LFS3_T_COMPACT
                            | LFS3_T_MKCONSISTENT
                            | LFS3_T_LOOKAHEAD) => 0;
                while (true) {
                    struct lfs3_tinfo tinfo;
                    int err = lfs3_trv_read(&lfs3, &trv, &tinfo);
                    assert(!err || err == LFS3_ERR_NOENT);
                    if (err == LFS3_ERR_NOENT) {
                        break;
                    }
                }
                lfs3_trv_close(&lfs3, &trv) => 0;

            // remount with mount-time work?
            } else if (work == 7) {
                if (sticky) {
                    lfs3_file_desync(&lfs3, &u) => 0;
                    lfs3_file_close(&lfs3, &u) => 0;
                    sticky = false;
                }
                lfs3_unmount(&lfs3) => 0;
                lfs3_mount(&lfs3, LFS3_M_RDWR | M_FLAGS | mflags_, CFG) => 0;
            }

            // write our file
            char name[256];
            sprintf(name, "file%03x", x);
            uint32_t step = counts[x]+1;
            struct lfs3_attr attr = {
                .type = 1,
                .flags = LFS3_A_WRONLY,
                .buffer = &step,
                .buffer_size = sizeof(uint32_t),
            };
            struct lfs3_file_cfg filecfg = {
                .attrs = &attr,
                .attr_count = 1,
            };
            lfs3_file_t file;
            lfs3_file_opencfg(&lfs3, &file, name,
                    LFS3_O_WRONLY | LFS3_O_CREAT
                        | ((op == 0) ? LFS3_O_TRUNC : 0),
                    &filecfg) => 0;
            lfs3_file_seek(&lfs3, &file, off, LFS3_SEEK_SET) => off;
            lfs3_file_write(&lfs3, &file, &sim[off], chunk) => chunk;
            lfs3_file_sync(&lfs3, &file) => 0;
            lfs3_file_close(&lfs3, &file) => 0;

            // drop our stickynote
            if (sticky) {
                lfs3_file_desync(&lfs3, &u) => 0;
                lfs3_file_close(&lfs3, &u) => 0;
            }
        }
        sim_sizes[x] = size;
        counts[x] += 1;
    }

    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR | M_FLAGS, CFG) => 0;
        }

        // check our files
        lfs3_stat(&lfs3, "sticky", &info) => LFS3_ERR_NOENT;
        for (lfs3_size_t x = 0; x < N; x++) {
            char name[256];
            sprintf(name, "file%03x", x);
            uint32_t step;
            if (counts[x] == 0) {
                lfs3_getattr(&lfs3, name, 1, &step, sizeof(uint32_t))
                        => LFS3_ERR_NOENT;
                continue;
            }
            lfs3_getattr(&lfs3, name, 1, &step, sizeof(uint32_t))
                    => sizeof(uint32_t);
            assert(step == counts[x]);

            lfs3_file_t file;
            lfs3_file_open(&lfs3, &file, name, LFS3_O_RDONLY) => 0;
            lfs3_file_size(&lfs3, &file) => sim_sizes[x];
            uint8_t rbuf[SIZE+1];
            lfs3_file_read(&lfs3, &file, rbuf, SIZE+1) => sim_sizes[x];
            assert(memcmp(rbuf, sims[x], sim_sizes[x]) == 0);
            lfs3_file_close(&lfs3, &file) => 0;
        }

        lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
    }

    lfs3_unmount(&lfs3) => 0;
'''

# A commit left metastable by a powerloss, then built on
#
# The powerloss interrupts the last prog of a commit, so the commit is
# whole, but one bit of that prog reads randomly until its block is
# erased. A mount that reads the commit as whole may build a synced
# commit on it, which a later mount that reads it as torn would lose,
# unless mount settled the commit first: by default when the commit is
# a sync inside an open write session (KIND=1), with LFS3_M_SETTLE
# (MODE=1) always. lfs3_set's single commit (KIND=0) is a residual case
# of the default mode, there we count and print
#
[cases.test_powerloss_metastable_builton]
defines.MODE = [0, 1]
defines.KIND = [0, 1]
defines.MOUNTS = 64
defines.BD_SEED = 'range(8)'
code = '''
    const uint32_t mflags = LFS3_M_RDWR | ((MODE) ? LFS3_M_SETTLE : 0);

    // our own emubd, so we choose where power is lost
    struct lfs3_cfg cfg = *CFG;
    lfs3_emubd_t bd;
    cfg.context = &bd;
    jmp_buf powerloss_jmp;
    struct lfs3_emubd_cfg bdcfg = {
        .erase_value = ERASE_VALUE,
        .powerloss_behavior = LFS3_EMUBD_POWERLOSS_METASTABLE,
        .powerloss_cb = test_powerloss_longjmp,
        .powerloss_data = &powerloss_jmp,
        .seed = BD_SEED,
    };

    // count the progs and erases of our commit, then do it all again,
    // losing power at its last prog
    volatile lfs3_emubd_powercycles_t cycles = 0;
    for (int i = 0; i < 2; i++) {
        lfs3_emubd_createcfg(&cfg, NULL, &bdcfg) => 0;
        lfs3_t lfs3;
        lfs3_format(&lfs3, LFS3_F_RDWR, &cfg) => 0;
        lfs3_mount(&lfs3, mflags, &cfg) => 0;
        lfs3_set(&lfs3, "x", "0", 1) => 0;

        // a write session that hasn't ended?
        lfs3_file_t file;
        if (KIND == 1) {
            lfs3_file_open(&lfs3, &file, "a",
                    LFS3_O_WRONLY | LFS3_O_CREAT) => 0;
            lfs3_file_write(&lfs3, &file, "0", 1) => 1;
            lfs3_file_sync(&lfs3, &file) => 0;
            lfs3_file_rewind(&lfs3, &file) => 0;
            lfs3_file_write(&lfs3, &file, "1", 1) => 1;
        }

        lfs3_emubd_setpowercycles(&cfg,
                (i == 0) ? (lfs3_emubd_powercycles_t)-1 : cycles) => 0;
        if (!setjmp(powerloss_jmp)) {
            if (KIND == 0) {
                lfs3_set(&lfs3, "a", "1", 1) => 0;
            } else {
                lfs3_file_sync(&lfs3, &file) => 0;
            }

            // first time? count, and clean up
            assert(i == 0);
            cycles = (lfs3_emubd_powercycles_t)-1
                    - lfs3_emubd_powercycles(&cfg);
            lfs3_emubd_setpowercycles(&cfg, 0) => 0;
            if (KIND == 1) {
                lfs3_file_close(&lfs3, &file) => 0;
            }
            lfs3_unmount(&lfs3) => 0;
            lfs3_emubd_destroy(&cfg) => 0;
            continue;
        }

        // power lost at our commit's last prog
        assert(i == 1);
        lfs3_emubd_setpowercycles(&cfg, 0) => 0;
    }

    // mount until our commit reads as whole, and build on it
    lfs3_t lfs3;
    for (int i = 0;; i++) {
        assert(i < 1000);
        int err = lfs3_mount(&lfs3, mflags, &cfg);
        assert(!err || err == LFS3_ERR_CORRUPT);
        if (err) {
            continue;
        }

        uint8_t buf[1];
        lfs3_ssize_t d = lfs3_get(&lfs3, "a", buf, 1);
        assert(d == 1 || d == LFS3_ERR_NOENT || d == LFS3_ERR_CORRUPT);
        // settled away? build on what we have
        if ((d == 1 && buf[0] == '1') || i >= 16) {
            // a sync that returns 0
            lfs3_set(&lfs3, "b", "2", 1) => 0;
            lfs3_unmount(&lfs3) => 0;
            break;
        }
        lfs3_unmount(&lfs3) => 0;
    }

    // b was synced, every mount must see it or fail
    lfs3_size_t lost = 0;
    for (lfs3_size_t i = 0; i < MOUNTS; i++) {
        int err = lfs3_mount(&lfs3, mflags, &cfg);
        assert(!err || err == LFS3_ERR_CORRUPT);
        if (err) {
            lost += 1;
            continue;
        }

        uint8_t buf[1];
        lfs3_ssize_t d = lfs3_get(&lfs3, "b", buf, 1);
        assert(d == 1 || d == LFS3_ERR_NOENT || d == LFS3_ERR_CORRUPT);
        if (d != 1) {
            lost += 1;
        } else {
            assert(buf[0] == '2');
        }
        lfs3_unmount(&lfs3) => 0;
    }
    printf("builton: synced b lost in %d of %d mounts\n",
            (int)lost, (int)MOUNTS);
    if (MODE == 1 || KIND == 1) {
        assert(lost == 0);
    }

    lfs3_emubd_destroy(&cfg) => 0;
'''

# Metastable bits under powerloss
#
# With METASTABLE, the interrupted write lands, but one bit of it reads
# randomly until its block is erased. Mounted with parity and data
# checksums, any operation may fail with LFS3_ERR_CORRUPT, and no
# operation may assert or return another error
#
# No completed sync may be lost, and no read may return data that
# neither a completed sync nor the sync in progress wrote: with
# LFS3_M_SETTLE (MODE=1) ever, by default (MODE=0) unless a block still
# metastable was left by an operation the default mode doesn't protect
# (LFS3-DEG-12), these we count and print
#
# Each file's step is committed with its data as a file-attached
# attribute, and each file is rebuilt as of its own step. We reformat
# when our steps no longer follow our ops, or a disk keeps failing
#
[cases.test_powerloss_metastable]
defines.POWERLOSS_BEHAVIOR = 'LFS3_EMUBD_POWERLOSS_METASTABLE'
defines.MODE = [0, 1]
defines.BLOCK_RECYCLES = [-1, 1]
defines.FORMAT_BLOCK_COUNT = 'BLOCK_COUNT/2'
defines.N = 4
defines.SIZE = '2*BLOCK_SIZE'
defines.CHUNK = 'BLOCK_SIZE/4'
defines.OPS = 32
# consecutive failures before we give up on a disk
defines.STUCK = 64
defines.SEED = 'range(20)'
fuzz = 'SEED'
reentrant = true
ifdef = ['LFS3_CKMETAPARITY', 'LFS3_CKDATACKSUMS']
code = '''
    const uint32_t mflags = LFS3_M_RDWR
            | LFS3_M_CKMETAPARITY
            | LFS3_M_CKDATACKSUMS
            | ((MODE) ? LFS3_M_SETTLE : 0);
    // which metastable blocks excuse a loss
    const uint8_t excuse = (MODE)
            ? 0
            : TEST_METASTABLE_OP | TEST_METASTABLE_MOUNT;

    // the step each file last read or synced, the step of its last
    // sync that returned 0, and the newest step we tried to sync, these
    // survive powerloss, but not a reformat
    static uint32_t synced[16];
    static uint32_t acked[16];
    static uint32_t tried[16];
    // set while formatting, after a powerloss here we can't know what
    // the disk holds
    static bool formatting = true;
    // what we're doing, and what left each block metastable
    static uint8_t op = TEST_METASTABLE_MOUNT;
    static uint8_t ops[1024];
    static lfs3_ssize_t bits[1024];
    // residual losses, excused, and everything we count, an excuse
    // lasts until a mount finds every completed sync and nothing left
    // metastable by an unprotected op, damage built on a metastable
    // commit can show up after its block is erased
    static bool excused = false;
    static lfs3_size_t residual = 0;
    static lfs3_size_t flickers = 0;
    assert(N <= 16);
    assert(BLOCK_COUNT <= 1024);

    // a fresh disk? the runner may reuse our statics across permutations
    if (lfs3_emubd_blockprogs(CFG, 0) == 0
            && lfs3_emubd_blockprogs(CFG, 1) == 0) {
        for (lfs3_size_t x = 0; x < N; x++) {
            synced[x] = 0;
            acked[x] = 0;
            tried[x] = 0;
        }
        formatting = true;
        op = TEST_METASTABLE_MOUNT;
        memset(ops, 0, sizeof(ops));
        memset(bits, 0, sizeof(bits));
        excused = false;
        residual = 0;
        flickers = 0;
    }

    lfs3_t lfs3;
    uint32_t steps[N];
    uint8_t sims[N][SIZE];
    lfs3_off_t sim_sizes[N];
    lfs3_size_t fails = 0;
    lfs3_size_t verified = 0;
    while (true) {
        assert(fails < 16*STUCK);

        // did our last powerloss leave anything metastable?
        bool exposed = test_metastable_exposed(CFG, op, ops, bits, excuse);
        excused |= exposed;
        bool lost = false;

        // mount, or reformat if a metastable bit stops our mount
        op = TEST_METASTABLE_MOUNT;
        int err = lfs3_mount(&lfs3, mflags, CFG);
        assert(!err || err == LFS3_ERR_CORRUPT);
        lfs3_ssize_t k_ = -1;
        uint32_t prng = SEED;
        if (!err) {
            // how far did we get? we can't trust a step we can't read
            for (lfs3_size_t x = 0; x < N; x++) {
                char name[256];
                sprintf(name, "file%03x", x);
                lfs3_ssize_t d = lfs3_getattr(&lfs3, name, 1,
                        &steps[x], sizeof(uint32_t));
                assert(d == sizeof(uint32_t)
                        || d == LFS3_ERR_NOENT
                        || d == LFS3_ERR_NOATTR
                        || d == LFS3_ERR_CORRUPT);
                if (d == LFS3_ERR_NOENT) {
                    steps[x] = 0;
                } else if (d != sizeof(uint32_t)) {
                    err = LFS3_ERR_CORRUPT;
                    break;
                }
            }
        }

        // lost power while formatting? whatever we find is our baseline
        if (!err && formatting) {
            for (lfs3_size_t x = 0; x < N; x++) {
                synced[x] = steps[x];
                acked[x] = steps[x];
                tried[x] = steps[x];
            }
            formatting = false;
        }

        // a step none of our ops wrote is data no sync wrote
        if (!err) {
            for (lfs3_size_t x = 0; x < N; x++) {
                if (steps[x] > tried[x]) {
                    printf("metastable: file%03x misread step %d (> %d)\n",
                            x, steps[x], tried[x]);
                    lost = true;
                    err = LFS3_ERR_CORRUPT;
                }
            }
            if (err) {
                lfs3_unmount(&lfs3) => 0;
            }
        }

        if (!err) {
            // rebuild each file as of its step
            k_ = test_metastable_replay(SEED, N, OPS, SIZE, CHUNK,
                    steps, (uint8_t*)sims, sim_sizes, &prng);
            if (k_ == -2) {
                printf("metastable: misread steps\n");
                lost = true;
            }

            // every file should read as of its step, or fail
            for (lfs3_size_t x = 0; x < N && k_ != -2; x++) {
                if (steps[x] < acked[x]) {
                    printf("metastable: file%03x lost a completed sync "
                                "%d -> %d\n",
                            x, acked[x], steps[x]);
                    lost = true;
                } else if (steps[x] < synced[x]) {
                    // the sync in progress may come and go
                    flickers += 1;
                }
                if (steps[x] == 0) {
                    continue;
                }

                char name[256];
                sprintf(name, "file%03x", x);
                lfs3_file_t file;
                int err_ = lfs3_file_open(&lfs3, &file, name, LFS3_O_RDONLY);
                assert(!err_
                        || err_ == LFS3_ERR_NOENT
                        || err_ == LFS3_ERR_CORRUPT);
                if (err_ == LFS3_ERR_NOENT) {
                    printf("metastable: file%03x misread as missing\n", x);
                    lost = true;
                }
                if (err_) {
                    continue;
                }
                uint8_t rbuf[SIZE+1];
                lfs3_ssize_t d = lfs3_file_read(&lfs3, &file, rbuf, SIZE+1);
                assert(d >= 0 || d == LFS3_ERR_CORRUPT);
                if (d >= 0 && (d != (lfs3_ssize_t)sim_sizes[x]
                        || memcmp(rbuf, sims[x], sim_sizes[x]) != 0)) {
                    printf("metastable: file%03x misread data at step %d\n",
                            x, steps[x]);
                    lost = true;
                }
                lfs3_file_close(&lfs3, &file) => 0;
            }

            int err_ = lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA);
            assert(!err_ || err_ == LFS3_ERR_CORRUPT);
        }

        // can't read our steps, our steps don't follow our ops, or stuck?
        // start over, losing every completed sync
        if (err || k_ < 0 || fails >= STUCK) {
            if (!err) {
                lfs3_unmount(&lfs3) => 0;
            }
            for (lfs3_size_t x = 0; x < N; x++) {
                if (acked[x] > 0 && !formatting) {
                    printf("metastable: file%03x lost to a reformat\n", x);
                    lost = true;
                }
            }

            printf("metastable: reformatting\n");
            formatting = true;
            struct lfs3_cfg cfg = *CFG;
            cfg.block_count = FORMAT_BLOCK_COUNT;
            lfs3_format(&lfs3, LFS3_F_RDWR, &cfg) => 0;
            lfs3_mount(&lfs3, mflags, CFG) => 0;
            for (lfs3_size_t x = 0; x < N; x++) {
                steps[x] = 0;
                sim_sizes[x] = 0;
                acked[x] = 0;
                tried[x] = 0;
            }
            formatting = false;
            k_ = 0;
            prng = SEED;
            fails = 0;
            verified = 0;
        }

        // lost something? only a block left metastable by an op our mode
        // doesn't protect excuses this
        if (lost) {
            if (!excused) {
                printf("metastable: lost data, no excuse\n");
                assert(false);
            }
            residual += 1;
            printf("metastable: residual loss %d\n", (int)residual);
        } else if (!err && !exposed) {
            excused = false;
        }

        for (lfs3_size_t x = 0; x < N; x++) {
            synced[x] = steps[x];
            acked[x] = lfs3_min(acked[x], steps[x]);
            tried[x] = lfs3_max(tried[x], steps[x]);
        }

        // done? check twice more after our last op
        if ((lfs3_size_t)k_ >= OPS) {
            lfs3_unmount(&lfs3) => 0;
            verified += 1;
            if (verified > 2) {
                printf("metastable: residual losses %d, flickers %d\n",
                        (int)residual, (int)flickers);
                break;
            }
            continue;
        }

        // continue our ops on disk
        for (lfs3_size_t k = k_; k < OPS; k++) {
            lfs3_size_t x = TEST_PRNG(&prng) % N;
            test_metastable_op_t o;
            test_metastable_op(&prng, SIZE, CHUNK,
                    sims[x], &sim_sizes[x],
                    &o);

            // namespace ops are idempotent, so they can be redone
            op = TEST_METASTABLE_OP;
            char dname[256];
            sprintf(dname, "dir%03x", (unsigned)(k % 4));
            char dname_[256];
            sprintf(dname_, "dir%03x", (unsigned)((k+1) % 4));
            if (o.dop == 0) {
                err = lfs3_mkdir(&lfs3, dname);
                assert(!err
                        || err == LFS3_ERR_EXIST
                        || err == LFS3_ERR_CORRUPT);
            } else if (o.dop == 1) {
                err = lfs3_rename(&lfs3, dname, dname_);
                assert(!err
                        || err == LFS3_ERR_NOENT
                        || err == LFS3_ERR_CORRUPT);
            } else if (o.dop == 2) {
                err = lfs3_remove(&lfs3, dname);
                assert(!err
                        || err == LFS3_ERR_NOENT
                        || err == LFS3_ERR_CORRUPT);
            }

            if (o.grow) {
                struct lfs3_fsinfo fsinfo;
                err = lfs3_fs_stat(&lfs3, &fsinfo);
                assert(!err || err == LFS3_ERR_CORRUPT);
                if (!err && fsinfo.block_count < BLOCK_COUNT) {
                    err = lfs3_fs_grow(&lfs3, fsinfo.block_count+1);
                    assert(!err || err == LFS3_ERR_CORRUPT);
                }
            }

            // write our file, the step is committed with our data
            char name[256];
            sprintf(name, "file%03x", x);
            uint32_t step = steps[x]+1;
            tried[x] = lfs3_max(tried[x], step);
            struct lfs3_attr attr = {
                .type = 1,
                .flags = LFS3_A_WRONLY,
                .buffer = &step,
                .buffer_size = sizeof(uint32_t),
            };
            struct lfs3_file_cfg filecfg = {
                .attrs = &attr,
                .attr_count = 1,
            };
            lfs3_file_t file;
            err = lfs3_file_opencfg(&lfs3, &file, name,
                    LFS3_O_RDWR | LFS3_O_CREAT,
                    &filecfg);
            assert(!err || err == LFS3_ERR_CORRUPT);
            if (!err) {
                op = TEST_METASTABLE_SESSION;
                if (o.op <= 1) {
                    lfs3_soff_t off_ = lfs3_file_seek(&lfs3, &file,
                            o.off, LFS3_SEEK_SET);
                    assert(off_ == (lfs3_soff_t)o.off);
                    lfs3_ssize_t d = lfs3_file_write(&lfs3, &file,
                            &sims[x][o.off], o.chunk);
                    assert(d == (lfs3_ssize_t)o.chunk
                            || d == LFS3_ERR_CORRUPT);
                    err = (d < 0) ? d : 0;
                } else if (o.op == 2) {
                    err = lfs3_file_truncate(&lfs3, &file, o.size);
                    assert(!err || err == LFS3_ERR_CORRUPT);
                } else {
                    err = lfs3_file_fruncate(&lfs3, &file, o.size);
                    assert(!err || err == LFS3_ERR_CORRUPT);
                }
                if (!err) {
                    err = lfs3_file_sync(&lfs3, &file);
                    assert(!err || err == LFS3_ERR_CORRUPT);
                }
                if (!err) {
                    steps[x] = step;
                    synced[x] = step;
                    acked[x] = step;
                }

                // close ends our session, clearing our dirty mark
                op = TEST_METASTABLE_OP;
                int err_ = lfs3_file_close(&lfs3, &file);
                assert(!err_ || err_ == LFS3_ERR_CORRUPT);
                err = (err) ? err : err_;
            }

            // a metastable bit got in the way? remount and try again
            if (err) {
                fails += 1;
                break;
            }
            fails = 0;
        }

        op = TEST_METASTABLE_OP;
        lfs3_unmount(&lfs3) => 0;
    }
'''

# Dirty marks
#
# A write session's first commit marks its file dirty on disk, a new
# file's stickynote standing as its mark until its first sync, its syncs
# keep the mark, and close clears it with at most one extra small commit
# and no erase. After a session a power loss ends, mount settles
# the file's mdir and its path, the first mkconsistent removes the
# stale mark, and compacting the settled mroot sets the SETTLED wcompat
# flag. A mount with nothing dirty writes nothing
#
[cases.test_powerloss_dirty_mark]
defines.SIZE = ['8', 'BLOCK_SIZE/8', '2*BLOCK_SIZE']
defines.SYNCS = [0, 1, 3]
in = 'lfs3.c'
code = '''
    // is a file's dirty mark on disk?
    #define TEST_ISDIRTY(_lfs3, _path, _dirty) do { \
            const char *path_ = _path; \
            lfs3_mdir_t mdir_; \
            lfs3_stag_t tag_ = lfs3_mtree_pathlookup(_lfs3, &path_, \
                    &mdir_, NULL); \
            assert(tag_ == LFS3_TAG_REG); \
            tag_ = lfs3_rbyd_lookup(_lfs3, &mdir_.r, \
                    lfs3_mrid(_lfs3, mdir_.mid), LFS3_TAG_DIRTY, \
                    NULL); \
            assert(tag_ == LFS3_TAG_DIRTY || tag_ == LFS3_ERR_NOENT); \
            _dirty = (tag_ == LFS3_TAG_DIRTY); \
        } while (0)
    bool dirty;

    // the wcompat flags on disk
    #define TEST_WCOMPAT(_lfs3, _wcompat) do { \
            lfs3_data_t data_; \
            lfs3_stag_t tag_ = lfs3_mdir_lookup(_lfs3, &(_lfs3)->mroot, \
                    LFS3_TAG_WCOMPAT, &data_); \
            assert(tag_ == LFS3_TAG_WCOMPAT); \
            int err_ = lfs3_data_readwcompat(_lfs3, &data_, &_wcompat); \
            assert(!err_); \
        } while (0)
    lfs3_wcompat_t wcompat;

    uint8_t wbuf[SIZE];
    for (lfs3_size_t i = 0; i < SIZE; i++) {
        wbuf[i] = 'a' + (i % 26);
    }

    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR, CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
    TEST_WCOMPAT(&lfs3, wcompat);
    assert(!(wcompat & LFS3_WCOMPAT_SETTLED));

    // a write session, creating a file commits a stickynote, which is
    // our first commit and our mark
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "f", LFS3_O_WRONLY | LFS3_O_CREAT) => 0;
    lfs3_stag_t tag = lfs3_rbyd_lookup(&lfs3, &file.b.h.mdir.r,
            lfs3_mrid(&lfs3, file.b.h.mdir.mid), LFS3_TAG_STICKYNOTE,
            NULL);
    assert(tag == LFS3_TAG_STICKYNOTE);
    tag = lfs3_rbyd_lookup(&lfs3, &file.b.h.mdir.r,
            lfs3_mrid(&lfs3, file.b.h.mdir.mid), LFS3_TAG_DIRTY,
            NULL);
    assert(tag == LFS3_ERR_NOENT);
    lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
    for (lfs3_size_t i = 0; i < SYNCS; i++) {
        lfs3_file_sync(&lfs3, &file) => 0;
        TEST_ISDIRTY(&lfs3, "f", dirty);
        assert(dirty);
    }

    // close clears our mark, with one commit if we were already synced,
    // and no erase
    lfs3_emubd_sio_t erased = lfs3_emubd_erased(CFG);
    lfs3_emubd_sio_t progged = lfs3_emubd_progged(CFG);
    lfs3_file_close(&lfs3, &file) => 0;
    TEST_ISDIRTY(&lfs3, "f", dirty);
    assert(!dirty);
    assert(lfs3_emubd_erased(CFG) == erased);
    if (SYNCS > 0) {
        // one small commit, a few tags and a cksum
        assert(lfs3_emubd_progged(CFG) - progged
                <= 2*lfs3_alignup(64, PROG_SIZE));
    }

    // an existing file's session marks with its first commit too
    lfs3_file_open(&lfs3, &file, "f", LFS3_O_WRONLY) => 0;
    TEST_ISDIRTY(&lfs3, "f", dirty);
    assert(!dirty);
    lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
    lfs3_file_sync(&lfs3, &file) => 0;
    TEST_ISDIRTY(&lfs3, "f", dirty);
    assert(dirty);
    lfs3_file_close(&lfs3, &file) => 0;
    TEST_ISDIRTY(&lfs3, "f", dirty);
    assert(!dirty);

    // lfs3_set's single commit never marks
    lfs3_set(&lfs3, "g", "g", 1) => 0;
    TEST_ISDIRTY(&lfs3, "g", dirty);
    assert(!dirty);

    // a session a power loss ends, desync so close doesn't write
    lfs3_file_open(&lfs3, &file, "h", LFS3_O_WRONLY | LFS3_O_CREAT) => 0;
    lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
    lfs3_file_sync(&lfs3, &file) => 0;
    TEST_ISDIRTY(&lfs3, "h", dirty);
    assert(dirty);
    lfs3_file_desync(&lfs3, &file) => 0;
    lfs3_file_close(&lfs3, &file) => 0;
    lfs3_unmount(&lfs3) => 0;

    // mount settles the dirty file's mdir, which is our mroot
    erased = lfs3_emubd_erased(CFG);
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
    assert(lfs3_emubd_erased(CFG) > erased);
    TEST_WCOMPAT(&lfs3, wcompat);
    assert(!(wcompat & LFS3_WCOMPAT_SETTLED));
    // the stale mark stays until our first mkconsistent
    TEST_ISDIRTY(&lfs3, "h", dirty);
    assert(dirty);
    // removing it compacts our settled mroot, which flags the
    // filesystem as holding settled copies
    lfs3_fs_mkconsistent(&lfs3) => 0;
    TEST_ISDIRTY(&lfs3, "h", dirty);
    assert(!dirty);
    TEST_WCOMPAT(&lfs3, wcompat);
    assert(wcompat & LFS3_WCOMPAT_SETTLED);
    lfs3_unmount(&lfs3) => 0;

    // nothing dirty? mount writes nothing
    erased = lfs3_emubd_erased(CFG);
    progged = lfs3_emubd_progged(CFG);
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
    assert(lfs3_emubd_erased(CFG) == erased);
    assert(lfs3_emubd_progged(CFG) == progged);

    // and everything reads back
    uint8_t rbuf[SIZE];
    lfs3_get(&lfs3, "f", rbuf, SIZE) => SIZE;
    assert(memcmp(rbuf, wbuf, SIZE) == 0);
    lfs3_get(&lfs3, "h", rbuf, SIZE) => SIZE;
    assert(memcmp(rbuf, wbuf, SIZE) == 0);
    lfs3_unmount(&lfs3) => 0;
'''

# A newer block that fails reads when mount settles its pair
#
# A failed read doesn't prove the newer block is gone, so the fetch reads
# it again, up to ck_retries times, and fails rather than take the older
# block; settling never copies the older block over the newer one
#
# MODE=0 => default mode, a dirty file in the pair
# MODE=1 => LFS3_M_SETTLE
# FAILS  => reads of the newer block that fail, 64 keeps failing past the
#           mount
[cases.test_powerloss_settle_newer]
defines.MODE = [0, 1]
defines.FAILS = [1, 3, 64]
defines.CK_RETRIES = [0, 3]
in = 'lfs3.c'
code = '''
    const uint32_t mflags = LFS3_M_RDWR | ((MODE) ? LFS3_M_SETTLE : 0);

    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR, CFG) => 0;
    lfs3_mount(&lfs3, mflags, CFG) => 0;

    // sync a first version, compact so the older block keeps it, then
    // sync a second version into the newer block
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "a", LFS3_O_WRONLY | LFS3_O_CREAT) => 0;
    lfs3_file_write(&lfs3, &file, "first", 5) => 5;
    lfs3_file_sync(&lfs3, &file) => 0;
    lfs3_mdir_compact(&lfs3, &lfs3.mroot) => 0;
    lfs3_block_t newer = lfs3.mroot.r.blocks[0];
    lfs3_file_rewind(&lfs3, &file) => 0;
    lfs3_file_write(&lfs3, &file, "second", 6) => 6;
    lfs3_file_sync(&lfs3, &file) => 0;
    assert(lfs3.mroot.r.blocks[0] == newer);
    if (MODE == 0) {
        // a power loss ends our session, leaving our file dirty
        lfs3_file_desync(&lfs3, &file) => 0;
    }
    lfs3_file_close(&lfs3, &file) => 0;
    lfs3_unmount(&lfs3) => 0;

    // the newer block fails some reads as we mount, the mount reads it
    // again up to ck_retries times, and fails rather than take the
    // older block
    lfs3_emubd_mktransient(CFG, newer, FAILS) => 0;
    int err = lfs3_mount(&lfs3, mflags, CFG);
    assert(err == ((FAILS <= CK_RETRIES) ? 0 : LFS3_ERR_CORRUPT));
    uint8_t buf[8];
    if (!err) {
        lfs3_get(&lfs3, "a", buf, sizeof(buf)) => 6;
        assert(memcmp(buf, "second", 6) == 0);
        lfs3_unmount(&lfs3) => 0;
    }

    // once it reads again, the newer block is still there
    lfs3_emubd_mktransient(CFG, newer, 0) => 0;
    lfs3_mount(&lfs3, mflags, CFG) => 0;
    lfs3_get(&lfs3, "a", buf, sizeof(buf)) => 6;
    assert(memcmp(buf, "second", 6) == 0);
    lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
    lfs3_unmount(&lfs3) => 0;
'''

# A block that fails reads while we settle its pair
#
# A failed read says nothing about what was written, so it never makes a
# commit look like it comes and goes, and never makes the active block look
# like an interrupted compaction. FAILS 16 keeps failing through the settle.
[cases.test_powerloss_settle_rderr]
defines.FAILS = [1, 2, 3, 4, 8, 16]
in = 'lfs3.c'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR, CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    // sync a first version, compact so the other block keeps it, then
    // sync a second version, and leave our file dirty, as a power loss
    // would
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "a", LFS3_O_WRONLY | LFS3_O_CREAT) => 0;
    lfs3_file_write(&lfs3, &file, "first", 5) => 5;
    lfs3_file_sync(&lfs3, &file) => 0;
    lfs3_mdir_compact(&lfs3, &lfs3.mroot) => 0;
    lfs3_block_t active = lfs3.mroot.r.blocks[0];
    lfs3_file_rewind(&lfs3, &file) => 0;
    lfs3_file_write(&lfs3, &file, "second", 6) => 6;
    lfs3_file_sync(&lfs3, &file) => 0;
    lfs3_file_write(&lfs3, &file, "!", 1) => 1;
    lfs3_file_sync(&lfs3, &file) => 0;
    assert(lfs3.mroot.r.blocks[0] == active);
    lfs3_file_desync(&lfs3, &file) => 0;
    lfs3_file_close(&lfs3, &file) => 0;

    // the active block fails reads as we settle
    lfs3_emubd_mktransient(CFG, active, FAILS) => 0;
    lfs3_mdir_settle(&lfs3, &lfs3.mroot) => 0;
    lfs3_emubd_mktransient(CFG, active, 0) => 0;
    lfs3_unmount(&lfs3) => 0;

    // whatever got settled, nothing is lost
    for (int i = 0; i < 2; i++) {
        lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
        uint8_t buf[8];
        lfs3_get(&lfs3, "a", buf, sizeof(buf)) => 7;
        assert(memcmp(buf, "second!", 7) == 0);
        lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_CKDATA) => 0;
        lfs3_unmount(&lfs3) => 0;
    }
'''
