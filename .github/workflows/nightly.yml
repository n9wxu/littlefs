name: nightly
on:
  # run every night, note GitHub only runs schedules from the default
  # branch's copy of this file
  schedule:
    - cron: '0 4 * * *'
  # or run by hand on any branch
  workflow_dispatch:

defaults:
  run:
    shell: bash -euv -o pipefail {0}

env:
  CFLAGS: -Werror
  MAKEFLAGS: -j
  TESTFLAGS: -k
  BENCHFLAGS:

jobs:
  # run the rest of the tests on the big-endian archs, test.yml only
  # runs -Pnone --no-fuzz under qemu
  #
  # split by powerloss scenario to fit in GitHub's time limits
  test-arch:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [mips, powerpc]
        pls: [none, linear]

    steps:
      - uses: actions/checkout@v4
      - name: install
        run: |
          # need a few things
          sudo apt-get update -qq
          sudo apt-get install -qq gcc python3
          gcc --version
          python3 --version

      # cross-compile with MIPS (32-bit, big-endian)
      - name: install-mips
        if: ${{matrix.arch == 'mips'}}
        run: |
          sudo apt-get install -qq \
            gcc-mips-linux-gnu \
            libc6-dev-mips-cross \
            qemu-user
          echo "CC=mips-linux-gnu-gcc --static" >> $GITHUB_ENV
          echo "EXEC=qemu-mips" >> $GITHUB_ENV
          mips-linux-gnu-gcc --version
          qemu-mips -version
      # cross-compile with PowerPC (32-bit, big-endian)
      - name: install-powerpc
        if: ${{matrix.arch == 'powerpc'}}
        run: |
          sudo apt-get install -qq \
            gcc-powerpc-linux-gnu \
            libc6-dev-powerpc-cross \
            qemu-user
          echo "CC=powerpc-linux-gnu-gcc --static" >> $GITHUB_ENV
          echo "EXEC=qemu-ppc" >> $GITHUB_ENV
          powerpc-linux-gnu-gcc --version
          qemu-ppc -version

      - name: test-arch
        run: |
          TESTFLAGS="$TESTFLAGS -P${{matrix.pls}}" make test

  # test other geometries
  #
  # v3 has no -G, so geometries are just define overrides. Note we
  # override READ/PROG/ERASE_SIZE and not BLOCK_SIZE, since some suites
  # need specific block sizes and -D overrides those too.
  test-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        geometry: [eeprom, prog16, emmc, nand, bignand]
        build: [default, biggest]
        include:
          - geometry: eeprom
            defines: -DREAD_SIZE=1 -DPROG_SIZE=1 -DERASE_SIZE=512
          - geometry: prog16
            defines: -DREAD_SIZE=16 -DPROG_SIZE=16 -DERASE_SIZE=512
          - geometry: emmc
            defines: -DREAD_SIZE=512 -DPROG_SIZE=512 -DERASE_SIZE=512
          - geometry: nand
            defines: -DREAD_SIZE=4096 -DPROG_SIZE=4096 -DERASE_SIZE=32768
          - geometry: bignand
            defines: >-
              -DREAD_SIZE=2048 -DPROG_SIZE=2048 -DERASE_SIZE=131072
              -DDISK_SIZE=16777216
          - build: biggest
            cflags: -DLFS3_BIGGEST

    steps:
      - uses: actions/checkout@v4
      - name: install
        run: |
          # need a few things
          sudo apt-get update -qq
          sudo apt-get install -qq gcc python3
          gcc --version
          python3 --version
      - name: test-geometry
        run: |
          CFLAGS="$CFLAGS ${{matrix.cflags}}" \
          TESTFLAGS="$TESTFLAGS ${{matrix.defines}}" \
            make test

  # test other erase values, -1 simulates erase as a noop
  test-erase-value:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        value: ['0x00', '-1']

    steps:
      - uses: actions/checkout@v4
      - name: install
        run: |
          # need a few things
          sudo apt-get update -qq
          sudo apt-get install -qq gcc python3
          gcc --version
          python3 --version
      - name: test-erase-value
        run: |
          TESTFLAGS="$TESTFLAGS -DERASE_VALUE=${{matrix.value}}" make test

  # run as many exhaustive tests as fits in GitHub's time limits
  #
  # this grows exponentially, so it doesn't turn out to be that many
  #
  # permute(1) only runs reentrant tests, split by suite since even one
  # powerloss at every write takes 10-100x as long as -Plinear. Locally
  # test_relocations and test_powerloss took hours on 4 cores, so may not
  # fit in GitHub's 6 hour limit
  test-pls:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    continue-on-error: ${{matrix.slow == true}}
    strategy:
      fail-fast: false
      matrix:
        tests:
          - test_dirs test_dread test_files test_stickynotes
          - test_attrs
          - test_grow
          - test_relocations
          - test_powerloss
        include:
          - tests: test_relocations
            slow: true
          - tests: test_powerloss
            slow: true

    steps:
      - uses: actions/checkout@v4
      - name: install
        run: |
          # need a few things
          sudo apt-get update -qq
          sudo apt-get install -qq gcc python3
          gcc --version
          python3 --version
      - name: test-pls
        run: |
          TESTFLAGS="$TESTFLAGS -P'permute(1)' ${{matrix.tests}}" make test

  # >=2pls takes multiple days to run fully, so we can only
  # run a subset of tests, these are the most important
  #
  # even test_dirs didn't finish in 16 minutes on 4 cores locally, so
  # this may not fit in GitHub's 6 hour limit either
  test-limited-pls:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: |
          # need a few things
          sudo apt-get update -qq
          sudo apt-get install -qq gcc python3
          gcc --version
          python3 --version
      - name: test-limited-pls
        run: |
          TESTFLAGS="$TESTFLAGS -P'permute(2)' test_dirs" make test

  # run the reentrant tests with the other powerloss behaviors, by
  # default only test_powerloss tests these
  #
  # note the existing reentrant tests expect exact success after every
  # powerloss, which METASTABLE (4) doesn't promise, so 4 is expected to
  # fail until tests accept LFS3_ERR_CORRUPT there
  test-powerloss-behavior:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: ${{matrix.behavior == 4}}
    strategy:
      fail-fast: false
      matrix:
        behavior: [0, 1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4
      - name: install
        run: |
          # need a few things
          sudo apt-get update -qq
          sudo apt-get install -qq gcc python3
          gcc --version
          python3 --version
      # non-reentrant tests only run without powerloss, so -Plinear
      # selects the reentrant tests
      - name: test-powerloss-behavior
        run: |
          TESTFLAGS="$TESTFLAGS -Plinear \
              -DPOWERLOSS_BEHAVIOR=${{matrix.behavior}}" \
            make test

  # run the expensive variants some cases leave to -DNIGHTLY=1
  test-nightly-defines:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: |
          # need a few things
          sudo apt-get update -qq
          sudo apt-get install -qq gcc python3
          gcc --version
          python3 --version
      - name: test-nightly-defines
        run: |
          TESTFLAGS="$TESTFLAGS -DNIGHTLY=1 \
              test_powerloss_p1_flush_pl test_badblocks_ioerror" \
            make test

  # run the rbyd, btree and mtree tests with the rbyd balance check,
  # LFS3_DBGRBYDBALANCE asserts every fetched rbyd is balanced
  test-balance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: |
          # need a few things
          sudo apt-get update -qq
          sudo apt-get install -qq gcc python3
          gcc --version
          python3 --version
      - name: test-balance
        run: |
          make test-balance

  # run with each LFS3_YES_* option, which force the relevant feature on
  #
  # LFS3_YES_GBMAP runs on every push, and LFS3_YES_RDONLY can't run the
  # tests
  test-yes:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        yes:
          - FLUSH
          - SYNC
          - REVPERTURB
          - REVNOISE
          - CKPROGS
          - CKFETCHES
          - CKMETAPARITY
          - CKDATACKSUMS
          - GC
          - BLEAFCACHE
          - TRACE

    steps:
      - uses: actions/checkout@v4
      - name: install
        run: |
          # need a few things
          sudo apt-get update -qq
          sudo apt-get install -qq gcc python3
          gcc --version
          python3 --version
      - name: test-yes
        run: |
          CFLAGS="$CFLAGS -DLFS3_YES_${{matrix.yes}}" make test

  # run benchmarks
  #
  # note there's no real benefit to running these on multiple archs
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        disk: [nor, nand]

    steps:
      - uses: actions/checkout@v4
      - name: install
        run: |
          # need a few things
          sudo apt-get update -qq
          sudo apt-get install -qq gcc python3
          gcc --version
          python3 --version
      - name: bench
        run: |
          # disk geometry
          export BENCH_${{matrix.disk == 'nand' && 'NAND' || 'NOR'}}=1

          PERFBDGEN=1 make bench

          # find bench results
          make lfs3.bench.csv
          ./scripts/csv.py lfs3.bench.csv \
            -Uprobe=stack,heap,usage \
            -bsuite \
            -freaded=bench_readed \
            -fprogged=bench_progged \
            -ferased=bench_erased
          mkdir -p bench
          cp lfs3.bench.csv bench/${{matrix.disk}}.bench.csv

          # find perfbd results
          make lfs3.perfbd.csv
          ./scripts/perfbd.py -u lfs3.perfbd.csv
          mkdir -p bench
          cp lfs3.perfbd.csv bench/${{matrix.disk}}.perfbd.csv

      # create bench statuses
      - name: upload-bench
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{matrix.disk}}
          path: bench
      - name: status-bench
        run: |
          mkdir -p status
          f=bench/${{matrix.disk}}.bench.csv
          for s in readed progged erased
          do
            export STEP="bench"
            export CONTEXT="bench (${{matrix.disk}}) / $s"
            export PREV="$(curl -sS \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/status/master`
                `?per_page=100" \
              | jq -re 'select(.sha != env.GITHUB_SHA) | .statuses[]
                | select(.context == env.CONTEXT).description
                | capture("(?<prev>[0-9]+)").prev' \
              || echo 0)"
            export DESCRIPTION="$(./scripts/csv.py $f \
                -Uprobe=stack,heap,usage \
                -f$s=bench_$s -Y \
              | awk '
                NR==2 {$1=0; printf "%s B",$NF}
                NR==2 && ENVIRON["PREV"]+0 != 0 {
                  printf " (%+.1f%%)",100*($NF-ENVIRON["PREV"])/ENVIRON["PREV"]
                }')"
            jq -n '{
              state: "success",
              context: env.CONTEXT,
              description: env.DESCRIPTION,
              target_job: "${{github.job}} (${{matrix.disk}})",
              target_step: env.STEP,
            }' | tee status/$(basename $f .csv)-$s.json
          done
      - name: upload-status-bench
        uses: actions/upload-artifact@v4
        with:
          name: status-bench-${{matrix.disk}}
          path: status
          retention-days: 1
