name: test
on: [push, pull_request]

defaults:
  run:
    shell: bash -euv -o pipefail {0}

env:
  CFLAGS: -Werror
  MAKEFLAGS: -j
  TESTFLAGS: -k
  BENCHFLAGS:

jobs:
  # run tests
  test:
    runs-on: ubuntu-24.04
    # qemu is 10-20x slower than native, thumb the slowest
    timeout-minutes: >-
      ${{matrix.arch == 'x86_64' && 60 || matrix.arch == 'thumb' && 360 || 240}}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, thumb, mips, powerpc]

    steps:
      - uses: actions/checkout@v5
      - name: install
        run: |
          # need a few things
          sudo apt-get update -qq
          sudo apt-get install -qq gcc python3
          gcc --version
          python3 --version

      # cross-compile with ARM Thumb (32-bit, little-endian)
      - name: install-thumb
        if: ${{matrix.arch == 'thumb'}}
        run: |
          sudo apt-get install -qq \
            gcc-arm-linux-gnueabi \
            libc6-dev-armel-cross \
            qemu-user
          echo "CC=arm-linux-gnueabi-gcc -mthumb --static" >> $GITHUB_ENV
          echo "EXEC=qemu-arm" >> $GITHUB_ENV
          echo "OBJDUMP=arm-linux-gnueabi-objdump" >> $GITHUB_ENV
          arm-linux-gnueabi-gcc --version
          qemu-arm -version
      # cross-compile with MIPS (32-bit, big-endian)
      - name: install-mips
        if: ${{matrix.arch == 'mips'}}
        run: |
          sudo apt-get install -qq \
            gcc-mips-linux-gnu \
            libc6-dev-mips-cross \
            qemu-user
          echo "CC=mips-linux-gnu-gcc --static" >> $GITHUB_ENV
          echo "EXEC=qemu-mips" >> $GITHUB_ENV
          echo "OBJDUMP=mips-linux-gnu-objdump" >> $GITHUB_ENV
          mips-linux-gnu-gcc --version
          qemu-mips -version
      # cross-compile with PowerPC (32-bit, big-endian)
      - name: install-powerpc
        if: ${{matrix.arch == 'powerpc'}}
        run: |
          sudo apt-get install -qq \
            gcc-powerpc-linux-gnu \
            libc6-dev-powerpc-cross \
            qemu-user
          echo "CC=powerpc-linux-gnu-gcc --static" >> $GITHUB_ENV
          echo "EXEC=qemu-ppc" >> $GITHUB_ENV
          echo "OBJDUMP=powerpc-linux-gnu-objdump" >> $GITHUB_ENV
          powerpc-linux-gnu-gcc --version
          qemu-ppc -version

      # does littlefs compile?
      - name: test-build
        run: |
          make clean
          make build

      # make sure example can at least compile
      - name: test-example
        run: |
          make clean
          sed -n '/``` c/,/```/{/```/d; p}' README.md > test.c
          CFLAGS="$CFLAGS \
            -Duser_provided_block_device_read=NULL \
            -Duser_provided_block_device_prog=NULL \
            -Duser_provided_block_device_erase=NULL \
            -Duser_provided_block_device_sync=NULL \
            -include stdio.h" \
            make all
          rm test.c

      # run the tests!
      #
      # under qemu the full suite takes hours, so the cross archs only run
      # the non-fuzz tests without powerloss here, the nightly runs the
      # rest on the big-endian archs
      - name: test
        run: |
          make clean
          if [[ ${{matrix.arch}} != x86_64 ]]
          then
            TESTFLAGS="$TESTFLAGS -Pnone --no-fuzz"
          fi
          make test

      # find compile-time measurements
      - name: sizes
        run: |
          make clean
          CFLAGS="$CFLAGS \
            -DLFS3_NO_LOG \
            -DLFS3_NO_ASSERT" \
            make lfs3.code.csv lfs3.data.csv lfs3.stack.csv lfs3.ctx.csv \
              lfs3.structs.csv
          ./scripts/structs.py -u lfs3.structs.csv
          ./scripts/csv.py lfs3.code.csv lfs3.data.csv lfs3.stack.csv \
              lfs3.ctx.csv \
            -bfunction \
            -fcode=code_size \
            -fdata=data_size \
            -fstack='max(stack_limit)' \
            -fctx='max(ctx_size)'
          mkdir -p sizes
          cp lfs3.code.csv sizes/${{matrix.arch}}.code.csv
          cp lfs3.data.csv sizes/${{matrix.arch}}.data.csv
          cp lfs3.stack.csv sizes/${{matrix.arch}}.stack.csv
          cp lfs3.ctx.csv sizes/${{matrix.arch}}.ctx.csv
          cp lfs3.structs.csv sizes/${{matrix.arch}}.structs.csv
      - name: sizes-rdonly
        run: |
          make clean
          CFLAGS="$CFLAGS \
            -DLFS3_NO_LOG \
            -DLFS3_NO_ASSERT \
            -DLFS3_RDONLY" \
            make lfs3.code.csv lfs3.data.csv lfs3.stack.csv lfs3.ctx.csv \
              lfs3.structs.csv
          ./scripts/structs.py -u lfs3.structs.csv
          ./scripts/csv.py lfs3.code.csv lfs3.data.csv lfs3.stack.csv \
              lfs3.ctx.csv \
            -bfunction \
            -fcode=code_size \
            -fdata=data_size \
            -fstack='max(stack_limit)' \
            -fctx='max(ctx_size)'
          mkdir -p sizes
          cp lfs3.code.csv sizes/${{matrix.arch}}-rdonly.code.csv
          cp lfs3.data.csv sizes/${{matrix.arch}}-rdonly.data.csv
          cp lfs3.stack.csv sizes/${{matrix.arch}}-rdonly.stack.csv
          cp lfs3.ctx.csv sizes/${{matrix.arch}}-rdonly.ctx.csv
          cp lfs3.structs.csv sizes/${{matrix.arch}}-rdonly.structs.csv
      - name: sizes-gbmap
        run: |
          make clean
          CFLAGS="$CFLAGS \
            -DLFS3_NO_LOG \
            -DLFS3_NO_ASSERT \
            -DLFS3_GBMAP" \
            make lfs3.code.csv lfs3.data.csv lfs3.stack.csv lfs3.ctx.csv \
              lfs3.structs.csv
          ./scripts/structs.py -u lfs3.structs.csv
          ./scripts/csv.py lfs3.code.csv lfs3.data.csv lfs3.stack.csv \
              lfs3.ctx.csv \
            -bfunction \
            -fcode=code_size \
            -fdata=data_size \
            -fstack='max(stack_limit)' \
            -fctx='max(ctx_size)'
          mkdir -p sizes
          cp lfs3.code.csv sizes/${{matrix.arch}}-gbmap.code.csv
          cp lfs3.data.csv sizes/${{matrix.arch}}-gbmap.data.csv
          cp lfs3.stack.csv sizes/${{matrix.arch}}-gbmap.stack.csv
          cp lfs3.ctx.csv sizes/${{matrix.arch}}-gbmap.ctx.csv
          cp lfs3.structs.csv sizes/${{matrix.arch}}-gbmap.structs.csv
      - name: sizes-biggest
        run: |
          make clean
          CFLAGS="$CFLAGS \
            -DLFS3_NO_LOG \
            -DLFS3_NO_ASSERT \
            -DLFS3_BIGGEST" \
            make lfs3.code.csv lfs3.data.csv lfs3.stack.csv lfs3.ctx.csv \
              lfs3.structs.csv
          ./scripts/structs.py -u lfs3.structs.csv
          ./scripts/csv.py lfs3.code.csv lfs3.data.csv lfs3.stack.csv \
              lfs3.ctx.csv \
            -bfunction \
            -fcode=code_size \
            -fdata=data_size \
            -fstack='max(stack_limit)' \
            -fctx='max(ctx_size)'
          mkdir -p sizes
          cp lfs3.code.csv sizes/${{matrix.arch}}-biggest.code.csv
          cp lfs3.data.csv sizes/${{matrix.arch}}-biggest.data.csv
          cp lfs3.stack.csv sizes/${{matrix.arch}}-biggest.stack.csv
          cp lfs3.ctx.csv sizes/${{matrix.arch}}-biggest.ctx.csv
          cp lfs3.structs.csv sizes/${{matrix.arch}}-biggest.structs.csv

      # create size statuses
      - name: upload-sizes
        uses: actions/upload-artifact@v6
        with:
          name: sizes-${{matrix.arch}}
          path: sizes
      - name: status-sizes
        run: |
          # how csv.py should fold each measurement, only code is a sum
          declare -A fields=(
            [code]='code_size'
            [stack]='max(stack_limit)'
            [ctx]='max(ctx_size)'
            [structs]='max(struct_size)')

          mkdir -p status
          for f in $(shopt -s nullglob ; echo sizes/*.csv)
          do
            # skip .data.csv as it should always be zero
            [[ $f == *.data.csv ]] && continue
            s=$(echo $f | sed -n 's/[^.]*\.\(.*\)\.csv/\1/p')
            export STEP="sizes$(echo $f \
              | sed -n 's/[^-.]*-\([^.]*\)\..*csv/-\1/p')"
            export CONTEXT="sizes (${{matrix.arch}}$(echo $f \
              | sed -n 's/[^-.]*-\([^.]*\)\..*csv/, \1/p')) / $s"
            export PREV="$(curl -sS \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/status/`
                `${{github.event.pull_request.base.ref || 'master'}}`
                `?per_page=100" \
              | jq -re 'select(.sha != env.GITHUB_SHA) | .statuses[]
                | select(.context == env.CONTEXT).description
                | capture("(?<prev>[0-9∞]+)").prev' \
              || echo 0)"
            export DESCRIPTION="$(./scripts/csv.py $f -f$s="${fields[$s]}" -Y \
              | awk '
                NR==2 {$1=0; printf "%s B",$NF}
                NR==2 && ENVIRON["PREV"]+0 != 0 {
                  printf " (%+.1f%%)",100*($NF-ENVIRON["PREV"])/ENVIRON["PREV"]
                }')"
            jq -n '{
              state: "success",
              context: env.CONTEXT,
              description: env.DESCRIPTION,
              target_job: "${{github.job}} (${{matrix.arch}})",
              target_step: env.STEP,
            }' | tee status/$(basename $f .csv).json
          done
      - name: upload-status-sizes
        uses: actions/upload-artifact@v6
        with:
          name: status-sizes-${{matrix.arch}}
          path: status
          retention-days: 1

  # run with all opt-in features, the default build compiles out a good
  # number of tests
  test-biggest:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{matrix.arch == 'x86_64' && 120 || 360}}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, mips]

    steps:
      - uses: actions/checkout@v5
      - name: install
        run: |
          # need a few things
          sudo apt-get update -qq
          sudo apt-get install -qq gcc python3
          gcc --version
          python3 --version

      # cross-compile with MIPS (32-bit, big-endian)
      - name: install-mips
        if: ${{matrix.arch == 'mips'}}
        run: |
          sudo apt-get install -qq \
            gcc-mips-linux-gnu \
            libc6-dev-mips-cross \
            qemu-user
          echo "CC=mips-linux-gnu-gcc --static" >> $GITHUB_ENV
          echo "EXEC=qemu-mips" >> $GITHUB_ENV
          echo "OBJDUMP=mips-linux-gnu-objdump" >> $GITHUB_ENV
          mips-linux-gnu-gcc --version
          qemu-mips -version

      # see test, qemu is slow
      - name: test-biggest
        run: |
          if [[ ${{matrix.arch}} != x86_64 ]]
          then
            TESTFLAGS="$TESTFLAGS -Pnone --no-fuzz"
          fi
          CFLAGS="$CFLAGS -DLFS3_BIGGEST" make test

  # run with LFS3_YES_GBMAP, some tests only run with the gbmap enabled
  test-yes-gbmap:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: install
        run: |
          # need a few things
          sudo apt-get update -qq
          sudo apt-get install -qq gcc python3
          gcc --version
          python3 --version
      - name: test-yes-gbmap
        run: |
          CFLAGS="$CFLAGS -DLFS3_YES_GBMAP" make test

  # run with LFS3_NO_BUILTINS to make sure that works
  test-no-builtins:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: install
        run: |
          # need a few things
          sudo apt-get update -qq
          sudo apt-get install -qq gcc python3
          gcc --version
          python3 --version
      - name: test-no-builtins
        run: |
          CFLAGS="$CFLAGS -DLFS3_NO_BUILTINS" make test

  # check that LFS3_RDONLY builds read what read-write builds write
  #
  # the test runner can't be built with LFS3_RDONLY, so rdonly_runner
  # mounts images written with test.py -d instead, see
  # runners/rdonly_runner.c
  test-rdonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: install
        run: |
          # need a few things
          sudo apt-get update -qq
          sudo apt-get install -qq gcc python3
          gcc --version
          python3 --version
      # the default and LFS3_YES_GBMAP builds write images, the
      # LFS3_RDONLY and LFS3_YES_RDONLY builds check them
      - name: test-rdonly
        run: |
          make test-rdonly

  # run under Valgrind to check for memory errors
  test-valgrind:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: install
        run: |
          # need a few things
          sudo apt-get update -qq
          sudo apt-get install -qq gcc python3 valgrind
          gcc --version
          python3 --version
          valgrind --version
      # Valgrind takes a while with diminishing value, so skip powerloss
      # testing, powerlosses also leak on purpose
      #
      # --valgrind runs each permutation in its own process, so we also
      # only test the non-fuzz cases of the user-facing suites, every
      # permutation would take days
      - name: test-valgrind
        run: |
          TESTFLAGS="$TESTFLAGS --valgrind --context=1024 -Pnone --no-fuzz \
              test_dirs test_files test_paths test_alloc test_attrs test_kv \
              test_compat test_grow test_relocations" \
            make test

  # compile/run with Clang, mostly to check for Clang-specific warnings
  test-clang:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: install
        run: |
          # need a few things
          sudo apt-get update -qq
          sudo apt-get install -qq clang python3
          clang --version
          python3 --version
      - name: test-clang
        run: |
          CC=clang make test

  # collect coverage info
  #
  # Note the goal is to maximize coverage in the small, easy-to-run
  # tests, so we intentionally exclude more aggressive powerloss testing
  # from coverage results
  cov:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: install
        run: |
          # need a few things
          sudo apt-get update -qq
          sudo apt-get install -qq gcc python3
          gcc --version
          python3 --version
      - name: cov
        run: |
          COVGEN=1 make test
          make lfs3.cov.csv
          ./scripts/cov.py -u lfs3.cov.csv
          mkdir -p cov
          cp lfs3.cov.csv cov/cov.csv

      # create cov statuses
      - name: upload-cov
        uses: actions/upload-artifact@v6
        with:
          name: cov
          path: cov
      - name: status-cov
        run: |
          mkdir -p status
          f=cov/cov.csv
          for s in lines branches
          do
            export STEP="cov"
            export CONTEXT="cov / $s"
            export PREV="$(curl -sS \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/status/`
                `${{github.event.pull_request.base.ref || 'master'}}`
                `?per_page=100" \
              | jq -re 'select(.sha != env.GITHUB_SHA) | .statuses[]
                | select(.context == env.CONTEXT).description
                | capture("(?<prev_a>[0-9]+)/(?<prev_b>[0-9]+)")
                | 100*((.prev_a|tonumber) / (.prev_b|tonumber))' \
              || echo 0)"
            export DESCRIPTION="$(./scripts/cov.py -u $f -f$s -Y \
              | awk -F '[ /%()]+' -v s=$s '
                NR==2 {$1=0; printf "%d/%d %s",$2,$3,s}
                NR==2 && ENVIRON["PREV"]+0 != 0 {
                  printf " (%+.1f%%)",$4-ENVIRON["PREV"]
                }')"
            jq -n '{
              state: "success",
              context: env.CONTEXT,
              description: env.DESCRIPTION,
              target_job: "${{github.job}}",
              target_step: env.STEP,
            }' | tee status/$(basename $f .csv)-$s.json
          done
      - name: upload-status-cov
        uses: actions/upload-artifact@v6
        with:
          name: status-cov
          path: status
          retention-days: 1

  # exhaustive powerloss tests, other geometries, LFS3_YES_* builds, and
  # benchmarks run on a schedule, see nightly.yml

  # no fuse/migrate self-host tests, littlefs-fuse has no v3 yet

  # status related tasks that run after tests
  status:
    runs-on: ubuntu-24.04
    needs: [test, cov]
    steps:
      - uses: actions/checkout@v5
        if: ${{github.event_name == 'pull_request'}}
      - name: install
        if: ${{github.event_name == 'pull_request'}}
        run: |
          # need a few things
          sudo apt-get install -qq gcc python3
          gcc --version
          python3 --version
      - uses: actions/download-artifact@v7
        if: ${{github.event_name == 'pull_request'}}
        continue-on-error: true
        with:
          pattern: '{sizes,sizes-*}'
          merge-multiple: true
          path: sizes
      - uses: actions/download-artifact@v7
        if: ${{github.event_name == 'pull_request'}}
        continue-on-error: true
        with:
          pattern: '{cov,cov-*}'
          merge-multiple: true
          path: cov

      # try to find results from tests
      - name: create-table
        if: ${{github.event_name == 'pull_request'}}
        run: |
          # compare against pull-request target
          curl -sS \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/status/`
              `${{github.event.pull_request.base.ref}}`
              `?per_page=100" \
            | jq -re 'select(.sha != env.GITHUB_SHA) | .statuses[]' \
            >> prev-status.json \
            || true

          # how csv.py should fold each measurement, only code is a sum
          declare -A fields=(
            [code]='code_size'
            [stack]='max(stack_limit)'
            [ctx]='max(ctx_size)'
            [structs]='max(struct_size)')

          # build table for GitHub
          declare -A table

          # sizes table
          i=0
          j=0
          for c in "" rdonly gbmap biggest
          do
            # per-config results
            c_or_default=${c:-default}
            c_camel=${c_or_default^}
            table[$i,$j]=$c_camel
            ((j+=1))

            for s in code stack ctx structs
            do
              f=sizes/thumb${c:+-$c}.$s.csv
              [ -e $f ] && table[$i,$j]=$( \
                export PREV="$(jq -re '
                    select(.context == "'"sizes (thumb${c:+, $c}) / $s"'").description
                    | capture("(?<prev>[0-9∞]+)").prev' \
                  prev-status.json || echo 0)"
                ./scripts/csv.py $f -f$s="${fields[$s]}" -Y \
                  | awk '
                    NR==2 {$1=0; printf "%s B",$NF}
                    NR==2 && ENVIRON["PREV"]+0 != 0 {
                      printf " (%+.1f%%)",100*($NF-ENVIRON["PREV"])/ENVIRON["PREV"]
                    }' \
                  | sed -e 's/ /\&nbsp;/g')
              ((j+=1))
            done
            ((j=0, i+=1))
          done

          # coverage table
          i=0
          j=5
          for s in lines branches
          do
            table[$i,$j]=${s^}
            ((j+=1))

            f=cov/cov.csv
            [ -e $f ] && table[$i,$j]=$( \
              export PREV="$(jq -re '
                  select(.context == "'"cov / $s"'").description
                  | capture("(?<prev_a>[0-9]+)/(?<prev_b>[0-9]+)")
                  | 100*((.prev_a|tonumber) / (.prev_b|tonumber))' \
                prev-status.json || echo 0)"
              ./scripts/cov.py -u $f -f$s -Y \
                | awk -F '[ /%()]+' -v s=$s '
                  NR==2 {$1=0; printf "%d/%d %s",$2,$3,s}
                  NR==2 && ENVIRON["PREV"]+0 != 0 {
                    printf " (%+.1f%%)",$4-ENVIRON["PREV"]
                  }' \
                | sed -e 's/ /\&nbsp;/g')
            ((j=5, i+=1))
          done

          # build the actual table
          echo "|   | Code | Stack | Ctx | Structs |   | Coverage |" >> table.txt
          echo "|:--|-----:|------:|----:|--------:|:--|---------:|" >> table.txt
          for ((i=0; i<4; i++))
          do
            echo -n "|" >> table.txt
            for ((j=0; j<7; j++))
            do
              echo -n " " >> table.txt
              echo -n "${table[$i,$j]:-}" >> table.txt
              echo -n " |" >> table.txt
            done
            echo >> table.txt
          done

          cat table.txt

      # create a bot comment for successful runs on pull requests
      - name: create-comment
        if: ${{github.event_name == 'pull_request'}}
        run: |
          touch comment.txt
          echo "<details>" >> comment.txt
          echo "<summary>" >> comment.txt
          echo "Tests passed ✓, `
            `Code: $(awk 'NR==3 {print $4}' table.txt || true), `
            `Stack: $(awk 'NR==3 {print $6}' table.txt || true), `
            `Ctx: $(awk 'NR==3 {print $8}' table.txt || true), `
            `Structs: $(awk 'NR==3 {print $10}' table.txt || true)" \
            >> comment.txt
          echo "</summary>" >> comment.txt
          echo >> comment.txt
          [ -e table.txt ] && cat table.txt >> comment.txt
          echo >> comment.txt
          echo "</details>" >> comment.txt
          cat comment.txt

          mkdir -p comment
          jq -n --rawfile comment comment.txt '{
            number: ${{github.event.number}},
            body: $comment,
          }' | tee comment/comment.json
      - name: upload-comment
        uses: actions/upload-artifact@v6
        with:
          name: comment
          path: comment
          retention-days: 1
